<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 航空登機系統</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; color: #fff; }
        header { padding: 1.2rem 0; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .state-hidden { display: none !important; }

        .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 3rem; margin-top: 2rem; }
        .home-card { padding: 5rem 2rem; text-align: center; cursor: pointer; border-radius: 1.5rem; min-height: 400px; display: flex; flex-direction: column; justify-content: center; }
        
        .verify-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; margin-top: 2rem; }
        .verify-card { padding: 3rem 2rem; text-align: center; cursor: pointer; border-radius: 1rem; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; gap: 1rem; }
        
        .form-card { max-width: 600px; margin: 0 auto; padding: 3rem; text-align: center; border-radius: 1.5rem; }
        .btn-back-nav { background: rgba(10,20,35,0.85); border: 1px solid var(--text-dark); color: var(--text-dark); padding: 0.6rem 1.5rem; border-radius: 0.5rem; cursor: pointer; font-weight: bold; margin-bottom: 2rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        .cyber-input { width: 100%; margin-bottom: 1.5rem; padding: 1.2rem; font-size: 1.2rem; }
        .cyber-button { width: 100%; margin-top: 0.5rem; padding: 1.5rem; font-size: 1.3rem; }
        .group-item { padding: 1.5rem; border-bottom: 1px solid rgba(0,229,255,0.2); cursor: pointer; display: flex; justify-content: space-between; align-items: center;}
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>
    <header class="panel-border" style="background: rgba(10,20,35,0.85); padding: 1.2rem;">
        <div class="header-container">
            <div onclick="resetToHome()" style="cursor:pointer; color:var(--text-dark); font-weight: bold;">✈️ 航班大廳</div>
            <div class="neon-text" style="font-size: 1.4rem;">BOARDING SYSTEM</div>
            <div style="font-size: 0.85rem; color: var(--text-dark);">衛星同步正常</div>
        </div>
    </header>

    <main>
        <div id="homeState">
            <h1 class="neon-text" style="text-align:center; margin-bottom: 2rem; font-size: 3rem;">請選擇服務項目</h1>
            <div class="home-grid">
                <div class="home-card cyber-card cyber-hover" onclick="setAppState('methodSelection')">
                    <div style="font-size:6rem;">🎫</div><h2 class="neon-text">辦理登機報到</h2><p style="color:#aaa;">CHECK-IN SERVICE</p>
                </div>
                <div class="home-card cyber-card cyber-hover" onclick="showProducts()">
                    <div style="font-size:6rem;">🛍️</div><h2 class="neon-text">活動商品專區</h2><p style="color:#aaa;">ACTIVITY PRODUCTS</p>
                </div>
            </div>
        </div>

        <div id="methodSelectionState" class="state-hidden">
            <button class="btn-back-nav" onclick="resetToHome()">← 返回大廳</button>
            <div class="verify-grid">
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('name', '姓名')">📝 <span class="neon-text">姓名報到</span></div>
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('phone', '手機')">📱 <span class="neon-text">手機報到</span></div>
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('email', 'Email')">✉️ <span class="neon-text">Email 報到</span></div>
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('company', '公司')">🏢 <span class="neon-text">公司報到</span></div>
            </div>
        </div>

        <div id="actionState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('methodSelection')">← 返回</button>
            <div class="form-card cyber-card">
                <h2 id="actionTitle" class="neon-text" style="margin-bottom: 2rem;">登機驗證</h2>
                <input type="text" id="actionInput" class="cyber-input">
                <button class="cyber-button" onclick="handleAction()"><span>啟動搜尋</span></button>
            </div>
        </div>

        <div id="groupListState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('action')">← 重新搜尋</button>
            <div class="form-card cyber-card" style="max-width: 700px;">
                <h2 id="groupName" class="neon-text" style="margin-bottom: 1.5rem;">請選擇旅客</h2>
                <div id="groupList" class="panel-border" style="background: rgba(0,0,0,0.3); max-height:450px; overflow-y:auto;"></div>
            </div>
        </div>

        <div id="mealState" class="state-hidden">
            <button class="btn-back-nav" onclick="resetToHome()">← 取消</button>
            <div class="form-card cyber-card">
                <h2 class="neon-text" style="margin-bottom:2rem;">🍽️ 機上餐飲偏好</h2>
                <div id="mealOptions"></div>
                <button id="finalBtn" class="cyber-button" disabled onclick="submitCheckin()"><span>確認並核發登機證</span></button>
            </div>
        </div>

        <div id="successState" class="state-hidden">
            <div class="form-card cyber-card">
                <div id="successIcon" style="font-size:6rem;">🎫</div><h2 id="successTitle" class="neon-text">手續完成！</h2>
                <div id="successInfo" style="text-align:left; padding:1.5rem; background:rgba(0,0,0,0.5); border:1px solid var(--text-dark); border-radius:1rem; margin:1.5rem 0;"></div>
                <button class="cyber-button" onclick="resetToHome()"><span>🏠 回到航班大廳</span></button>
            </div>
        </div>

        <div id="productState" class="state-hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem;">
                <h1 class="neon-text" style="font-size: 2.5rem;">🛍️ 活動商品專區</h1>
                <button class="cyber-button" style="width:auto;" onclick="resetToHome()"><span>← 回大廳</span></button>
            </div>
            <div id="productsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:2.5rem;"></div>
        </div>
    </main>

    <script>
        const API_BASE = '/api';
        let searchMethod = '', selectedUser = null, systemConfig = null;

        function setAppState(s) {
            ['home', 'methodSelection', 'action', 'groupList', 'meal', 'success', 'product'].forEach(x => document.getElementById(x+'State').classList.add('state-hidden'));
            document.getElementById(s+'State').classList.remove('state-hidden');
        }
        function resetToHome() { setAppState('home'); }
        function prepareSearch(m, l) { searchMethod = m; document.getElementById('actionTitle').textContent = `輸入旅客${l}`; setAppState('action'); }

        async function handleAction() {
            const val = document.getElementById('actionInput').value.trim();
            if(!val) return;
            const res = await fetch(`${API_BASE}/search/${searchMethod}?${searchMethod}=${encodeURIComponent(val)}`);
            const json = await res.json();
            if (json.data && json.data.length > 0) {
                if (json.data.length === 1) { selectedUser = json.data[0]; renderMealOptions(); }
                else { window.tempData = json.data; renderUserList(json.data); }
            } else alert('查無資料');
        }

        function renderUserList(u) {
            document.getElementById('groupList').innerHTML = u.map(x => `<div class="group-item" onclick="selectSingleUser('${x.id}')"><b>${x.name}</b><span>${x.status==='checked_in'||x.status==='已報到'||x.status==='替代'?'🟢':'⚪'}</span></div>`).join('');
            setAppState('groupList');
        }
        function selectSingleUser(id) { selectedUser = window.tempData.find(x => x.id === id); renderMealOptions(); }

        function renderMealOptions() {
            const options = (systemConfig && systemConfig.meal_types) ? systemConfig.meal_types : ['葷食', '素食', '不須用餐'];
            const mealHtml = options.map(m => `<div class="cyber-card panel-border" id="m-${m}" onclick="selectMeal('${m}')" style="padding:1.5rem; margin-bottom:1rem; cursor:pointer;">${m}</div>`).join('');
            const proxyHtml = `<div style="margin-top:2rem; border-top:1px solid #333; padding-top:1rem; text-align:left;">
                <label style="font-weight:bold; color:var(--text-dark);">👤 是否為本人報到？</label>
                <div style="display:flex; gap:1rem; margin:1rem 0;">
                    <div id="isYes" class="cyber-card" style="flex:1; padding:1rem; cursor:pointer; border-color:var(--text-dark);" onclick="setIsOriginal(true)">是</div>
                    <div id="isNo" class="cyber-card" style="flex:1; padding:1rem; cursor:pointer;" onclick="setIsOriginal(false)">否</div>
                </div>
                <div id="proxyForm" style="display:none;">
                    <input id="pName" placeholder="替代姓名" class="cyber-input">
                    <input id="pPhone" placeholder="替代電話" class="cyber-input">
                    <input id="pEmail" placeholder="替代 Email" class="cyber-input">
                </div>
            </div>`;
            document.getElementById('mealOptions').innerHTML = mealHtml + proxyHtml;
            window.isOriginal = true; setAppState('meal');
        }

        function selectMeal(m) { 
            window.selectedMeal = m; 
            document.querySelectorAll('[id^="m-"]').forEach(el => el.style.borderColor = 'rgba(0,229,255,0.3)');
            document.getElementById('m-'+m).style.borderColor = 'var(--text-dark)';
            document.getElementById('finalBtn').disabled = false; 
        }

        function setIsOriginal(v) { 
            window.isOriginal = v; 
            document.getElementById('proxyForm').style.display = v ? 'none' : 'block';
            document.getElementById('isYes').style.borderColor = v ? 'var(--text-dark)' : 'rgba(0,229,255,0.3)';
            document.getElementById('isNo').style.borderColor = !v ? '#ffa500' : 'rgba(0,229,255,0.3)';
        }

        async function submitCheckin() {
            // ★ 精準抓取：如果不是本人，抓取輸入框數值
            const proxy_info = window.isOriginal ? {} : { 
                name: document.getElementById('pName').value.trim(), 
                phone: document.getElementById('pPhone').value.trim(),
                email: document.getElementById('pEmail').value.trim()
            };
            
            const res = await fetch(`${API_BASE}/checkin/${selectedUser.id}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meal: window.selectedMeal, is_original: window.isOriginal, proxy_info })
            });
            const json = await res.json();
            const info = document.getElementById('successInfo');
            if(json.success) {
                info.innerHTML = `<p>旅客：${json.data.name}</p><p>座位：${json.data.seat || "未分配"}</p><p>餐飲：${json.data.meal}</p><p>📸 請截圖保存</p>`;
            } else {
                info.innerHTML = `<p style="color:#ff4d4d;">此旅客已完成手續</p><p>姓名：${json.data.name}</p>`;
            }
            setAppState('success');
        }

        async function showProducts() {
            setAppState('product');
            const res = await fetch(`${API_BASE}/config`);
            const config = await res.json();
            document.getElementById('productsGrid').innerHTML = (config.products || []).map(p => `<div class="cyber-card"><img src="${p.image}" style="width:100%; height:180px; object-fit:contain;"><h3>${p.name}</h3></div>`).join('');
        }

        window.onload = async () => { 
            const res = await fetch(`${API_BASE}/config`); 
            if(res.ok) systemConfig = await res.json(); 
            setAppState('home');
        };
    </script>
</body>
</html>
