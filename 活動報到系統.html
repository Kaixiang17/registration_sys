<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 航空登機系統</title>
    <link rel="stylesheet" href="smart-ark-theme.css?v=8">
    <style>
        /* ============================================================
           電腦版原始樣式
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; color: #fff; }
        header { padding: 1.2rem 0; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .state-hidden { display: none !important; }
        
        .verify-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 2rem; }
        .verify-card { padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; border-radius: 1rem; position: relative; }
        .form-card { max-width: 600px; margin: 0 auto; padding: 3rem; text-align: center; border-radius: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2.5rem; }
        .product-img { width: 100%; height: 220px; object-fit: contain; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--accent-gray); }
        .btn-back-nav { background: none; border: 1px solid var(--accent-gray); color: var(--text-dark); padding: 0.5rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: bold; transition: 0.3s; margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-back-nav:hover { border-color: var(--text-dark); background: rgba(0, 229, 255, 0.1); }
        .cyber-input { width: 100%; margin-bottom: 1.5rem; padding: 1.2rem; font-size: 1.2rem; }
        .group-item { padding: 1.5rem; border-bottom: 1px solid rgba(0,229,255,0.2); cursor: pointer; transition: 0.3s; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .group-item:hover { background: rgba(0,229,255,0.1); }
        
        .meal-selected, .is-original-selected { 
            border-color: #00e5ff !important; 
            background: rgba(0, 229, 255, 0.3) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6), inset 0 0 10px rgba(0, 229, 255, 0.3) !important;
            font-weight: bold !important;
            transform: translateY(-2px);
            transition: all 0.2s ease;
        }
        .proxy-selected { 
            border-color: #ffa500 !important; 
            background: rgba(255, 165, 0, 0.25) !important;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.5) !important;
        }
        .info-box { text-align: left; padding: 1.5rem; border-radius: 1rem; margin: 1.5rem 0; background: rgba(0,0,0,0.3); }

        /* 成功頁面詳細資訊樣式 */
        .success-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(0,229,255,0.1);
            font-size: 1rem;
        }
        .success-detail-row:last-child { border-bottom: none; }
        .success-detail-label { color: #aaa; font-weight: 600; }
        .success-detail-value { color: var(--text-dark); font-weight: bold; text-align: right; }
        .success-detail-value.highlight { color: #4ade80; font-size: 1.1rem; }
        .success-instruction { margin-top: 1.5rem; padding: 1rem; background: rgba(74,222,128,0.1); border-left: 3px solid #4ade80; border-radius: 0.5rem; }
        .success-instruction-title { color: #4ade80; font-weight: bold; margin-bottom: 0.5rem; }
        .success-instruction-item { color: #ccc; margin: 0.3rem 0; padding-left: 1rem; }

        /* ============================================================
           手機端專屬修復
           ============================================================ */
        @media(max-width: 768px) {
            main { padding: 1.5rem 0.6rem !important; }
            .form-card { padding: 1.5rem 1rem !important; width: 100% !important; }
            h1.neon-text { font-size: 1.6rem !important; white-space: normal !important; letter-spacing: 1px !important; text-align: center !important; margin-bottom: 1.5rem !important; }
            h2.neon-text { font-size: 1.45rem !important; margin-bottom: 1.5rem !important; }
            header { padding: 0.8rem 0 !important; }
            .verify-grid { grid-template-columns: 1fr !important; gap: 1.2rem !important; padding: 0 !important; }
            .verify-card { padding: 1.5rem 1rem !important; font-size: 1.1rem !important; }
            .verify-card div { font-size: 2.2rem !important; }
            #mealOptions > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; gap: 0.8rem !important; margin-bottom: 1.2rem !important; }
            .meal-opt, #btnOrig, #btnProxy { padding: 1.1rem 1rem !important; font-size: 1.1rem !important; }
            .cyber-input { padding: 0.9rem 1rem !important; font-size: 1.1rem !important; margin-bottom: 1rem !important; }
            .ck-btn { padding: 0.88rem 1rem !important; font-size: 1rem !important; }
            #proxyForm { padding: 1rem !important; margin-bottom: 1.2rem !important; }
            #productState > div:first-child { flex-direction: column !important; align-items: center !important; gap: 1rem !important; }
            .products-grid { grid-template-columns: 1fr !important; gap: 1.5rem !important; }
            #tempMealRadioGroup { grid-template-columns: 1fr !important; gap: 0.8rem !important; }
            .success-detail-row { font-size: 0.95rem !important; }
        }

        /* ── 前台報到按鈕系統 ── */
        .ck-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; padding: 0.95rem 1.5rem;
            font-family: inherit; font-size: 1.05rem; font-weight: 700;
            letter-spacing: 2px; border-radius: 0.75rem;
            border: 1px solid rgba(0,229,255,0.5); color: #00e5ff;
            background: rgba(0,229,255,0.08);
            cursor: pointer; transition: all 0.2s ease;
            white-space: nowrap; text-decoration: none;
        }
        .ck-btn:hover:not(:disabled) { background: rgba(0,229,255,0.18); border-color: #00e5ff; box-shadow: 0 0 16px rgba(0,229,255,0.25); }
        .ck-btn:active:not(:disabled) { transform: scale(0.98); }
        .ck-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .ck-btn-confirm { border-color: rgba(74,222,128,0.6); color: #4ade80; background: rgba(74,222,128,0.1); font-size: 1.1rem; letter-spacing: 3px; }
        .ck-btn-confirm:hover:not(:disabled) { background: rgba(74,222,128,0.22); border-color: #4ade80; box-shadow: 0 0 20px rgba(74,222,128,0.3); }

        .ck-btn-warn { border-color: rgba(255,165,0,0.55); color: #ffa500; background: rgba(255,165,0,0.08); }
        .ck-btn-warn:hover:not(:disabled) { background: rgba(255,165,0,0.18); border-color: #ffa500; }

        .ck-btn-ghost { border-color: rgba(255,255,255,0.15); color: #888; background: transparent; }
        .ck-btn-ghost:hover:not(:disabled) { border-color: rgba(255,255,255,0.3); color: #bbb; background: rgba(255,255,255,0.05); }

        .ck-btn-pill {
            width: auto; padding: 0.4rem 1rem; font-size: 0.82rem; letter-spacing: 1px;
            border-radius: 20px; border: 1px solid rgba(0,229,255,0.3);
            color: #00e5ff; background: rgba(0,229,255,0.06); cursor: pointer; transition: all 0.18s;
            display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600;
        }
        .ck-btn-pill:hover { background: rgba(0,229,255,0.15); border-color: #00e5ff; }

        .ck-tag {
            padding: 0.35rem 1rem; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            border: 1px solid rgba(0,229,255,0.25); color: #aaa; background: transparent;
            cursor: pointer; transition: all 0.18s; letter-spacing: 0.5px;
        }
        .ck-tag:hover, .ck-tag.active { border-color: #00e5ff; color: #00e5ff; background: rgba(0,229,255,0.1); }

        @media(max-width: 768px) {
            .ck-btn { font-size: 1rem !important; padding: 0.9rem 1rem !important; letter-spacing: 1.5px !important; }
            .ck-btn-confirm { font-size: 1rem !important; }
            .ck-btn-pill { font-size: 0.78rem !important; padding: 0.35rem 0.8rem !important; }
        }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>

    <div id="splash-screen" onclick="startRegistration()">
        <div class="click-hint">點 擊 畫 面 開 始 報 名</div>
    </div>

    <div id="banner-container" style="width: 100%; max-width: 1200px; margin: 0 auto; display: none;">
        <img id="event-banner" src="" style="width: 100%; border-radius: 0 0 15px 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
    </div>

    <header class="panel-border" style="border-top:none; border-left:none; border-right:none; background: rgba(10,20,35,0.8);">
        <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div onclick="resetToHome()" style="cursor:pointer; color:var(--text-dark); font-weight: bold; display: flex; align-items: center; gap: 6px;">
                    <span style="font-size: 1.3rem;">✈️</span>
                    <span id="header-title" class="header-title-text" style="font-size: 1.15rem; letter-spacing: 2px; white-space: nowrap;">航 班 大 廳</span>
                </div>
                <button id="mapBtn" class="ck-btn-pill" onclick="toggleMapModal(true)">🗺️ 地圖導覽</button>
            </div>
            
            <!-- 👑 這裡加入了大會看板按鈕，點擊會直接跳轉到專屬投影頁面 -->
            <div style="display: flex; gap: 10px;">
                <button id="dashboardBtn" class="ck-btn-pill" onclick="goToDashboard()" style="border-color:rgba(74,222,128,0.5); color:#4ade80;">📊 大會看板</button>
                <button id="shopBtn" class="ck-btn-pill" onclick="goToShop()" style="border-color:rgba(0,229,255,0.5);">🛒 商品專區</button>
            </div>
        </div>
    </header>

    <main>
        <div id="methodSelectionState" class="state-hidden">
            <div style="text-align:center; max-width:1000px; margin: 0 auto;">
                <h2 class="neon-text" style="font-size: 2.2rem; margin-bottom:1rem;">請 選 擇 登 機 方 式</h2>
                <div class="verify-grid">
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('name', '姓名')">
                        <div style="font-size:3.5rem;">📝</div><h3 class="neon-text">姓 名 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('phone', '手機')">
                        <div style="font-size:3.5rem;">📱</div><h3 class="neon-text">手 機 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('email', 'Email')">
                        <div style="font-size:3.5rem;">✉️</div><h3 class="neon-text">Email 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('company', '公司')">
                        <div style="position: absolute; top: -12px; right: -12px; background: #ffa500; color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; box-shadow: 0 0 10px rgba(255,165,0,0.5); z-index: 10;">替代主管點此</div>
                        <div style="font-size:3.5rem;">🏢</div><h3 class="neon-text">公 司 報 到</h3>
                    </div>
                </div>
            </div>
        </div>

        <div id="actionState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('methodSelection')">← 重新選擇方式</button>
            <div class="form-card cyber-card">
                <h2 id="actionTitle" class="neon-text" style="margin-bottom: 2.5rem; font-size: 2.5rem;">登 機 驗 證</h2>
                <input type="text" id="actionInput" class="cyber-input" placeholder="請輸入資訊" style="font-size: 1.4rem;">
                <button class="ck-btn" onclick="handleAction()" style="font-size:1.15rem; letter-spacing:3px; padding:1.1rem;">🔍 開 始 驗 證</button>
            </div>

            <div id="tempRegistrationSection" class="form-card cyber-card state-hidden" style="margin-top: 2rem; border: 2px solid #ffa500 !important; box-shadow: 0 0 25px rgba(255, 165, 0, 0.35); background: rgba(10, 20, 35, 0.95); text-align: left;">
                <h3 style="color: #ffa500; font-size: 1.4rem; margin-bottom: 1.5rem; text-shadow: 0 0 10px rgba(255,165,0,0.4); font-weight: bold; text-align: center;">⚠️ 查無此旅客登機紀錄！是否開啟現場補位功能？</h3>
                
                <div style="margin-bottom: 1.2rem;">
                    <label style="color: #ffa500; display: block; margin-bottom: 0.4rem; font-size: 0.95rem;">旅客姓名 *</label>
                    <input type="text" id="addName" class="cyber-input" placeholder="請輸入姓名" style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 1.2rem;">
                    <label style="color: #ffa500; display: block; margin-bottom: 0.4rem; font-size: 0.95rem;">行動電話 *</label>
                    <input type="text" id="addPhone" class="cyber-input" placeholder="請輸入手機" style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 1.2rem;">
                    <label style="color: var(--accent-gray); display: block; margin-bottom: 0.4rem; font-size: 0.95rem;">服務單位 / 公司名稱</label>
                    <input type="text" id="addCompany" class="cyber-input" placeholder="請輸入公司名稱" style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="color: var(--accent-gray); display: block; margin-bottom: 0.4rem; font-size: 0.95rem;">桌號 / 座位安排</label>
                    <input type="text" id="addSeat" class="cyber-input" placeholder="例如: 08桌 (留空則現場安排)" style="margin-bottom: 0;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="color: var(--accent-gray); display: block; margin-bottom: 0.4rem; font-size: 0.95rem;">當日餐飲偏好</label>
                    <div id="tempMealRadioGroup" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;">
                        <button type="button" class="verify-card cyber-card meal-opt-temp temp-meal-selected" data-meal="葷食" onclick="selectTempMeal(this, '葷食')" style="padding: 1rem 0.5rem; font-size: 1rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">🥩 葷食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" data-meal="素食" onclick="selectTempMeal(this, '素食')" style="padding: 1rem 0.5rem; font-size: 1rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">🥬 素食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" data-meal="不需餐食" onclick="selectTempMeal(this, '不需餐食')" style="padding: 1rem 0.5rem; font-size: 1rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">❌ 不需餐食</button>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button class="ck-btn ck-btn-warn" onclick="submitAddRegistration()" style="margin-top:0;">✓ 確認外加報到</button>
                    <button class="ck-btn ck-btn-ghost" onclick="hideTempSection()" style="margin-top:0;">取消</button>
                </div>
            </div>
        </div>

        <div id="groupListState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('action')">← 重新搜尋</button>
            <div class="form-card cyber-card" style="max-width: 700px;">
                <h2 id="groupName" class="neon-text" style="margin-bottom: 1.5rem;">請 選 擇 旅 客</h2>
                <div id="groupList" class="panel-border" style="background: rgba(0,0,0,0.3); border-radius: 1rem; overflow: hidden;"></div>
            </div>
        </div>

        <div id="mealState" class="state-hidden">
            <button class="btn-back-nav" onclick="resetToHome()">← 取消</button>
            <div class="form-card cyber-card">
                <h2 class="neon-text" style="margin-bottom:2rem;">🍽️ 機 上 餐 飲 偏 好</h2>
                <div id="mealOptions"></div>
                <button id="finalBtn" class="ck-btn ck-btn-confirm" disabled onclick="submitCheckin()">✈️ 確 認 並 核 發 登 機 證</button>
            </div>
        </div>

        <div id="successState" class="state-hidden">
            <div class="form-card cyber-card">
                <div id="successIcon" style="color:var(--text-dark); font-size:6rem;">✅</div>
                <h2 id="successTitle" class="neon-text" style="margin-bottom: 2rem;">報 到 成 功 ！</h2>
                <div id="successInfo" class="info-box panel-border"></div>
                <button class="ck-btn ck-btn-ghost" onclick="resetToHome()" style="max-width:260px; margin:0 auto;">← 回 到 大 廳</button>
            </div>
        </div>

        <div id="productState" class="state-hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem;">
                <h1 class="neon-text" style="font-size: 2.5rem;">🛍️ 活 動 商 品 專 區</h1>
                <button class="ck-btn-pill ck-btn-ghost" onclick="resetToHome()" style="border-color:rgba(255,255,255,0.2); color:#888;">← 返 回</button>
            </div>
            <div id="giftsSection" class="state-hidden">
                <h2 class="neon-text" style="margin-bottom: 1.5rem;">🎁 精 選 伴 手 禮</h2>
                <div id="giftsGrid" class="products-grid"></div>
            </div>
            <div id="normalProductsSection" style="margin-top: 3rem;">
                <h2 class="neon-text" style="margin-bottom: 1.5rem;">📚 補 給 品 清 單</h2>
                <div id="categoryFilters" style="margin-bottom: 2.5rem; display: flex; flex-wrap: wrap; gap: 0.8rem;"></div>
                <div id="productsGrid" class="products-grid"></div>
            </div>
        </div>
    </main>

    <div id="mapModal" class="state-hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center;">
        <div style="position: relative; width: 90%; height: 85vh; max-width: 1200px; display: flex; flex-direction: column;">
            <button onclick="toggleMapModal(false)" style="align-self: flex-end; margin-bottom: 10px; background: var(--text-dark); color: #000; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">✕ 關 閉 地 圖</button>
            <div style="flex-grow: 1; background: #0a1423; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent-gray); display: flex; justify-content: center; align-items: center;">
                <img id="mapDisplayImage" src="" style="width: 100%; height: 100%; object-fit: contain; display: none;">
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentSheet = urlParams.get('sheet') || '';
        const currentAdmin = urlParams.get('admin') || 'admin';
        const API_BASE = '/api';
        let searchMethod = '', selectedUser = null, systemConfig = null;
        window.allProducts = [];
        window.currentCategory = '全部';
        window.selectedTempMealChoice = '葷食';

        window.onload = function() {
            loadSystemConfig();
            setAppState('methodSelection');
        };

        // 👑 點擊大會看板跳轉至獨立投影畫面（帶上當前場次的參數，避免跑錯資料庫）
        function goToDashboard() {
            window.open(`/dashboard?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`, '_blank');
        }

        function setAppState(state) {
            document.querySelectorAll('[id$="State"]').forEach(el => el.classList.add('state-hidden'));
            const stateEl = document.getElementById(state + 'State');
            if (stateEl) stateEl.classList.remove('state-hidden');
        }

        function startRegistration() {
            document.getElementById('splash-screen').style.opacity = '0';
            document.getElementById('splash-screen').style.visibility = 'hidden';
            setAppState('methodSelection');
        }

        function resetToHome() {
            document.getElementById('splash-screen').style.opacity = '1';
            document.getElementById('splash-screen').style.visibility = 'visible';
            setAppState('methodSelection');
        }

        function prepareSearch(method, title) {
            searchMethod = method;
            document.getElementById('actionTitle').textContent = title + ' 驗 證';
            document.getElementById('actionInput').value = '';
            document.getElementById('actionInput').placeholder = `請輸入${title}`;
            setAppState('action');
            setTimeout(() => document.getElementById('actionInput').focus(), 100);
        }

        async function handleAction() {
            const q = document.getElementById('actionInput').value.trim();
            if (!q) { alert('請輸入搜尋資訊'); return; }
            try {
                const res = await fetch(`${API_BASE}/search/${searchMethod}?${searchMethod}=${encodeURIComponent(q)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const json = await res.json();
                if (!json.success || !json.data || json.data.length === 0) {
                    if (confirm('查無此人，是否開啟現場補位？')) {
                        document.getElementById('tempRegistrationSection').classList.remove('state-hidden');
                    }
                    return;
                }
                if (json.data.length === 1) {
                    selectedUser = json.data[0];
                    if (selectedUser.status_display === '已報到') { renderAlreadyCheckedIn(selectedUser); return; }
                    renderMealOptions();
                } else {
                    renderGroupList(json.data, searchMethod === 'company' ? '公司' : '姓名');
                }
            } catch(e) { alert('搜尋失敗：' + e.message); }
        }

        function renderAlreadyCheckedIn(user) {
            document.getElementById('successInfo').innerHTML = `
                <div class="success-detail-row"><span class="success-detail-label">姓 名</span><span class="success-detail-value">${user.name}</span></div>
                <div class="success-detail-row"><span class="success-detail-label">公 司</span><span class="success-detail-value">${user.company || '無'}</span></div>
                <div class="success-detail-row"><span class="success-detail-label">桌 次</span><span class="success-detail-value highlight">${user.seat || '現場安排'}</span></div>
                <div class="success-detail-row"><span class="success-detail-label">原報名餐食</span><span class="success-detail-value">${user.original_meal || user.meal}</span></div>
                <div class="success-detail-row"><span class="success-detail-label">目前餐食</span><span class="success-detail-value">${user.meal}</span></div>
                <div class="success-instruction"><div class="success-instruction-title">請持此畫面至：</div><div class="success-instruction-item">① 領識別證</div><div class="success-instruction-item">② 領禮品</div></div>
            `;
            setAppState('success');
        }

        function renderGroupList(users, title) {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'group-item';
                const isRegistered = (u.status_display === '已報到');
                const statusTag = isRegistered ? '<span style="color:#f87171; font-weight:bold;">[已報到]</span>' : '<span>➔</span>';
                div.innerHTML = `<div><div style="font-weight:bold; font-size:1.2rem;">${u.name}</div><div style="font-size:0.9rem; color:#aaa;">${u.company}</div></div>${statusTag}`;
                div.onclick = () => {
                    if (isRegistered) renderAlreadyCheckedIn(u);
                    else { selectedUser = u; renderMealOptions(); }
                };
                list.appendChild(div);
            });
            document.getElementById('groupName').textContent = title;
            setAppState('groupList');
        }

        async function renderMealOptions() {
            const container = document.getElementById('mealOptions');
            container.innerHTML = `
                <div style="margin-bottom:2rem; text-align:left; padding:1rem; background:rgba(0,229,255,0.1); border-radius:0.5rem;">
                    <div style="font-size:0.9rem; color:#00e5ff;">旅 客 姓 名</div><div style="font-size:1.4rem; font-weight:bold;">${selectedUser.name}</div>
                </div>
                <div class="two-col-grid" style="margin-bottom:2rem;">
                    <div id="btnOrig" class="verify-card cyber-card is-original-selected" onclick="toggleIdentity(true)">本 人 報 到</div>
                    <div id="btnProxy" class="verify-card cyber-card" onclick="toggleIdentity(false)">替 代 報 到</div>
                </div>
                <div id="proxyForm" class="state-hidden" style="margin-bottom:2rem; text-align:left; border:1px solid #ffa500; padding:1.5rem; border-radius:1rem;">
                    <p style="color:#ffa500; margin-bottom:1rem; font-weight:bold;">請 輸 入 替 代 人 資 訊 ：</p>
                    <input type="text" id="proxyName" class="cyber-input" placeholder="替代人姓名" style="margin-bottom:0.8rem;">
                    <input type="text" id="proxyPhone" class="cyber-input" placeholder="替代人手機">
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;">
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '葷食')" style="padding:1.2rem 0.5rem; font-weight:bold;">🥩 葷食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '素食')" style="padding:1.2rem 0.5rem; font-weight:bold;">🥬 素食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '不需餐食')" style="padding:1.2rem 0.5rem; font-weight:bold;">❌ 不需餐食</div>
                </div>
            `;
            window.selectedMeal = null; window.isOriginal = true; document.getElementById('finalBtn').disabled = true;
            setAppState('meal');
        }

        function toggleIdentity(isOrig) {
            window.isOriginal = isOrig;
            document.getElementById('btnOrig').classList.toggle('is-original-selected', isOrig);
            document.getElementById('btnProxy').classList.toggle('proxy-selected', !isOrig);
            document.getElementById('proxyForm').classList.toggle('state-hidden', isOrig);
            checkMealReady();
        }

        function selectMeal(el, m) {
            document.querySelectorAll('.meal-opt').forEach(x => x.classList.remove('meal-selected'));
            el.classList.add('meal-selected'); window.selectedMeal = m; checkMealReady();
        }
        function checkMealReady() { document.getElementById('finalBtn').disabled = !window.selectedMeal; }

        async function submitCheckin() {
            const meal = window.selectedMeal;
            const proxyInfo = window.isOriginal ? {} : { name: document.getElementById('proxyName').value.trim(), phone: document.getElementById('proxyPhone').value.trim() };
            if (!window.isOriginal && !proxyInfo.name) { alert('請輸入替代人姓名'); return; }
            const btn = document.getElementById('finalBtn');
            btn.disabled = true; btn.innerHTML = '<span>登 機 核 對 中 ...</span>';
            try {
                const res = await fetch(`${API_BASE}/checkin/${selectedUser.id}?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ meal, is_original: window.isOriginal, proxy_info: proxyInfo })
                });
                const json = await res.json();
                if (json.success) renderAlreadyCheckedIn(json.data);
                else { if (json.error === 'already_done') renderAlreadyCheckedIn(json.data); else alert('報 到 失 敗'); btn.disabled = false; btn.innerHTML = '<span>確 認 並 核 發 登 機 證</span>'; }
            } catch(e) { alert('網 路 異 常'); btn.disabled = false; btn.innerHTML = '<span>確 認 並 核 發 登 機 證</span>'; }
        }

        async function showProducts() {
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const config = await res.json();
                window.allProducts = config.products || [];
                const gifts = window.allProducts.filter(p => p.isGift);
                const normals = window.allProducts.filter(p => !p.isGift);
                const giftsSection = document.getElementById('giftsSection');
                if (gifts.length > 0) { giftsSection.classList.remove('state-hidden'); renderGrid('giftsGrid', gifts); } 
                else giftsSection.classList.add('state-hidden');
                
                const categories = ['全 部', ...new Set(normals.map(p => p.category).filter(c => c))];
                document.getElementById('categoryFilters').innerHTML = categories.map(c => `<button class="ck-tag ${window.currentCategory === c ? 'active' : ''}" onclick="filterCategory('${c}')">${c}</button>`).join('');
                filterCategory(window.currentCategory); setAppState('product');
            } catch(e) { alert('無 法 載 入 商品'); }
        }

        function filterCategory(cat) {
            window.currentCategory = cat;
            document.querySelectorAll('#categoryFilters .ck-tag').forEach(btn => {
                btn.style.background = btn.textContent === cat ? 'var(--text-dark)' : 'rgba(0,229,255,0.1)';
                btn.style.color = btn.textContent === cat ? '#000' : 'var(--text-dark)';
            });
            renderGrid('productsGrid', window.currentCategory === '全 部' ? window.allProducts.filter(p => !p.isGift) : window.allProducts.filter(p => !p.isGift && p.category === cat));
        }

        function renderGrid(id, items) {
            document.getElementById(id).innerHTML = items.map(p => `
                <div class="cyber-card" style="padding:0; overflow:hidden; display:flex; flex-direction:column;">
                    ${p.image ? `<img src="${p.image}" class="product-img">` : '<div class="product-img" style="display:flex; align-items:center; justify-content:center; font-size:3rem;">📦</div>'}
                    <div style="padding:1.5rem; flex-grow:1; display:flex; flex-direction:column;">
                        <div style="color:var(--text-dark); font-size:0.8rem; margin-bottom:0.5rem;"># ${p.category || '一 般'}</div>
                        <h3 style="margin-bottom:0.8rem; font-size:1.3rem;">${p.name}</h3>
                        <p style="font-size:0.9rem; color:#ccc; margin-bottom:1.5rem; flex-grow:1;">${p.description || ''}</p>
                        ${p.link ? `<a href="${p.link}" target="_blank" class="ck-btn" style="text-decoration:none; padding:0.7rem 1rem; font-size:0.9rem; letter-spacing:1px;">立 即 查 看 →</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function loadSystemConfig() {
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                systemConfig = await res.json();
                if(systemConfig && systemConfig.google_sheet_name) document.getElementById('header-title').textContent = systemConfig.google_sheet_name.split('').join(' ');
                const banner = document.getElementById('event-banner');
                if(systemConfig && systemConfig.banner_image_url) { banner.src = systemConfig.banner_image_url; document.getElementById('banner-container').style.display = 'block'; } 
                else { document.getElementById('banner-container').style.display = 'none'; }
            } catch(e) {}
        }

        function toggleMapModal(show) {
            const modal = document.getElementById('mapModal');
            if (show) {
                if (systemConfig && systemConfig.map_image_url) { document.getElementById('mapDisplayImage').src = systemConfig.map_image_url; document.getElementById('mapDisplayImage').style.display = 'block'; }
                modal.classList.remove('state-hidden');
            } else { modal.classList.add('state-hidden'); }
        }

        function goToShop() { showProducts(); }
        function selectTempMeal(el, meal) { document.querySelectorAll('.meal-opt-temp').forEach(x => x.classList.remove('temp-meal-selected')); el.classList.add('temp-meal-selected'); window.selectedTempMealChoice = meal; }
        function hideTempSection() { document.getElementById('tempRegistrationSection').classList.add('state-hidden'); }

        async function submitAddRegistration() {
            const name = document.getElementById('addName').value.trim(); const phone = document.getElementById('addPhone').value.trim();
            if (!name || !phone) { alert('請填寫姓名與手機'); return; }
            try {
                const res = await fetch(`${API_BASE}/registrations/add?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, phone, company: document.getElementById('addCompany').value.trim(), seat: document.getElementById('addSeat').value.trim(), meal: window.selectedTempMealChoice })
                });
                if ((await res.json()).success) { alert('現場報到成功！'); resetToHome(); }
            } catch(e) { alert('報到失敗'); }
        }
    </script>
</body>
</html>
