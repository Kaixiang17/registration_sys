<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 航空登機系統</title>
    <link rel="stylesheet" href="smart-ark-theme.css?v=9">
    <style>
        /* ============================================================
           電腦版基礎與框架優化
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; color: #fff; overflow-x: hidden; }
        
        header { 
            padding: 1rem 0; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid var(--accent-gray); 
            background: rgba(8, 16, 28, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 5rem; min-height: calc(100vh - 80px); }
        .state-hidden { display: none !important; }
        
        .verify-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; margin-top: 2.5rem; }
        .verify-card { 
            padding: 2.5rem 2rem; 
            text-align: center; 
            cursor: pointer; 
            border-radius: 1rem; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .form-card { max-width: 600px; margin: 0 auto; padding: 3.5rem 3rem; text-align: center; border-radius: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2.5rem; }
        .product-img { width: 100%; height: 220px; object-fit: contain; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--accent-gray); }
        
        .btn-back-nav { 
            background: transparent; 
            border: 1px solid var(--accent-gray); 
            color: var(--text-dark); 
            padding: 0.6rem 1.4rem; 
            border-radius: 0.5rem; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
            margin-bottom: 2rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .btn-back-nav:hover { border-color: var(--text-dark); background: rgba(0, 229, 255, 0.08); transform: translateX(-2px); }
        .cyber-input { width: 100%; margin-bottom: 1.5rem; padding: 1.2rem; font-size: 1.1rem; border-radius: 0.6rem; }
        
        .group-item { padding: 1.5rem; border-bottom: 1px solid rgba(0,229,255,0.15); cursor: pointer; transition: 0.2s; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .group-item:hover { background: rgba(0,229,255,0.08); }
        
        .meal-selected, .is-original-selected { 
            border-color: #00e5ff !important; 
            background: rgba(0, 229, 255, 0.25) !important;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.2) !important;
            font-weight: bold !important;
            transform: translateY(-2px);
        }
        .proxy-selected { 
            border-color: #ffa500 !important; 
            background: rgba(255, 165, 0, 0.2) !important;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.3) !important;
            transform: translateY(-2px);
        }

        /* ============================================================
           方舟終端機 ARK TERMINAL
           ============================================================ */
        .ark-terminal-shell {
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 1rem 6rem;
            min-height: calc(100vh - 140px);
            position: relative;
        }
        .ark-terminal-panel {
            position: relative;
            overflow: hidden;
            border-radius: 1.8rem;
            padding: 1.75rem;
            background: linear-gradient(180deg, rgba(6, 22, 46, 0.94), rgba(3, 10, 26, 0.98));
            border: 1px solid rgba(0,229,255,.3);
            box-shadow: 0 15px 35px rgba(0,0,0,.4), 0 0 30px rgba(0,229,255,.15);
        }
        .ark-terminal-panel::before {
            content: '';
            position: absolute;
            inset: -40%;
            background:
                radial-gradient(circle at 25% 20%, rgba(0,229,255,.18), transparent 30%),
                radial-gradient(circle at 85% 8%, rgba(81,169,255,.15), transparent 26%);
            pointer-events: none;
        }
        .ark-terminal-content { position: relative; z-index: 1; }
        .ark-brand-kicker {
            display: flex;
            justify-content: space-between;
            gap: .75rem;
            align-items: center;
            color: rgba(203,246,255,.7);
            font-size: .75rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid rgba(0,229,255,0.15);
            padding-bottom: 0.75rem;
        }
        .ark-logo-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid rgba(0,229,255,.3);
            background: rgba(0,229,255,.05);
            display: grid;
            place-items: center;
            font-size: 1.2rem;
        }
        .ark-terminal-title {
            font-size: clamp(2rem, 6vw, 2.8rem);
            line-height: 1.1;
            letter-spacing: .06em;
            color: #f4ffff;
            text-shadow: 0 0 12px rgba(0,229,255,.6);
            font-weight: 900;
            margin-bottom: .25rem;
        }
        .ark-terminal-subtitle {
            color: rgba(0, 229, 255, 0.8);
            font-size: .88rem;
            letter-spacing: .1em;
            margin-bottom: 1.5rem;
        }
        .ark-user-greeting {
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            background: rgba(0,229,255,.06);
            border: 1px solid rgba(0,229,255,.2);
            color: #eaffff;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: .05em;
            margin-bottom: 1.25rem;
        }
        .ark-mission-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .8rem;
            margin-bottom: 1.5rem;
        }
        .ark-meta-chip {
            border-radius: .75rem;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.03);
            padding: .8rem 1rem;
        }
        .ark-meta-label { color: rgba(255,255,255,0.45); font-size: .7rem; letter-spacing: .05em; margin-bottom: 0.15rem; }
        .ark-meta-value { color: #00e5ff; font-weight: bold; font-size: .95rem; word-break: break-word; }
        
        .ark-terminal-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .ark-nav-card {
            border-radius: 1rem;
            padding: 1.1rem;
            border: 1px solid rgba(0,229,255,.25);
            background: linear-gradient(135deg, rgba(0,229,255,.06), rgba(5,15,35,.5));
            display: grid;
            grid-template-columns: 44px 1fr auto;
            gap: 1rem;
            align-items: center;
            cursor: pointer;
            transition: all .2s ease;
            text-align: left;
            color: inherit;
            width: 100%;
        }
        .ark-nav-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0,229,255,.7);
            box-shadow: 0 5px 15px rgba(0,229,255,.1);
        }
        .ark-card-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: grid; place-items: center;
            background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.25);
            color: #00e5ff; font-size: 1.3rem;
        }
        .ark-card-title { color: #f4ffff; font-weight: bold; font-size: 1rem; }
        .ark-card-sub { color: #00e5ff; font-weight: 600; font-size: .85rem; margin-top: .1rem; }
        .ark-card-desc { color: rgba(255,255,255,0.5); font-size: .75rem; margin-top: .2rem; line-height: 1.4; }
        .ark-card-arrow { color: rgba(0,229,255,.6); font-size: 1.2rem; transition: 0.2s; }
        .ark-nav-card:hover .ark-card-arrow { color: #00e5ff; transform: translateX(2px); }
        
        .ark-terminal-footer {
            position: sticky; bottom: 1rem; margin: 1.5rem auto 0; max-width: 560px;
            display: grid; grid-template-columns: repeat(5,1fr); gap: .4rem; padding: .5rem;
            border-radius: 1.25rem; background: rgba(4, 12, 24, 0.9);
            border: 1px solid rgba(0,229,255,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }
        .ark-bottom-item {
            border: 0; background: transparent; color: rgba(255,255,255,0.6);
            display: grid; place-items: center; gap: .2rem; padding: .5rem .2rem;
            border-radius: .75rem; cursor: pointer; font-size: .7rem; transition: 0.2s;
        }
        .ark-bottom-item.active, .ark-bottom-item:hover { color: #00e5ff; background: rgba(0,229,255,.08); }
        .ark-bottom-icon { font-size: 1.1rem; line-height: 1; }

        @media(min-width: 760px) {
            .ark-terminal-shell { max-width: 720px; }
            .ark-terminal-grid { grid-template-columns: 1fr 1fr; }
            .ark-terminal-footer { max-width: 720px; }
        }

        /* 肖像授權同意 */
        .portrait-consent-box { margin: 1.5rem 0 1.2rem; padding: 1rem; border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 0.75rem; background: rgba(0, 229, 255, 0.03); text-align: left; }
        .portrait-consent-check { display: flex; align-items: flex-start; gap: 0.6rem; color: #dffaff; font-size: 0.9rem; line-height: 1.5; cursor: pointer; }
        .portrait-consent-check input { margin-top: 0.2rem; width: 16px; height: 16px; flex: 0 0 auto; accent-color: #00e5ff; }
        .portrait-consent-link { border: none; background: transparent; color: #00e5ff; font-size: 0.85rem; font-weight: bold; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 0.4rem; display: inline-block; }
        
        .portrait-consent-modal { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; padding: 1.5rem; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .portrait-consent-modal.active { display: flex; }
        .portrait-consent-card { width: min(92vw, 540px); max-height: 75vh; overflow-y: auto; padding: 2rem; border-radius: 1.25rem; border: 1px solid rgba(0, 229, 255, 0.3); background: rgba(6, 15, 30, 0.98); color: #eaffff; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: left; }
        .portrait-consent-card h3 { color: #00e5ff; margin-bottom: 1rem; font-size: 1.3rem; }
        .portrait-consent-card p { color: rgba(255,255,255,0.7); line-height: 1.6; font-size: 0.9rem; margin-bottom: 0.8rem; }
        .portrait-consent-close { float: right; border: 1px solid rgba(255,255,255,0.2); background: rgba(255, 255, 255, 0.05); color: #fff; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }

        /* ── 前台報到按鈕系統 ── */
        .ck-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; padding: 1rem 1.5rem; font-family: inherit; font-size: 1.05rem; font-weight: bold;
            letter-spacing: 2px; border-radius: 0.6rem; border: 1px solid rgba(0,229,255,0.4); color: #00e5ff;
            background: rgba(0,229,255,0.06); cursor: pointer; transition: all 0.2s ease; text-decoration: none;
        }
        .ck-btn:hover:not(:disabled) { background: rgba(0,229,255,0.15); border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.2); }
        .ck-btn:active:not(:disabled) { transform: scale(0.99); }
        .ck-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .ck-btn-confirm { border-color: rgba(74,222,128,0.5); color: #4ade80; background: rgba(74,222,128,0.08); font-size: 1.1rem; }
        .ck-btn-confirm:hover:not(:disabled) { background: rgba(74,222,128,0.18); border-color: #4ade80; box-shadow: 0 0 15px rgba(74,222,128,0.25); }
        .ck-btn-warn { border-color: rgba(255,165,0,0.5); color: #ffa500; background: rgba(255,165,0,0.06); }
        .ck-btn-warn:hover:not(:disabled) { background: rgba(255,165,0,0.15); border-color: #ffa500; }
        .ck-btn-ghost { border-color: rgba(255,255,255,0.15); color: #aaa; background: transparent; }
        .ck-btn-ghost:hover:not(:disabled) { border-color: rgba(255,255,255,0.3); color: #fff; background: rgba(255,255,255,0.05); }

        .ck-btn-pill {
            width: auto; padding: 0.45rem 1.1rem; font-size: 0.85rem; letter-spacing: 1px;
            border-radius: 30px; border: 1px solid rgba(0,229,255,0.3); color: #00e5ff; background: rgba(0,229,255,0.05);
            cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; font-family: inherit; font-weight: 600; text-decoration: none;
        }
        .ck-btn-pill:hover { background: rgba(0,229,255,0.15); border-color: #00e5ff; }
        .ck-tag { padding: 0.4rem 1.2rem; border-radius: 30px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(0,229,255,0.2); color: #aaa; background: transparent; cursor: pointer; transition: all 0.18s; font-family: inherit; }
        .ck-tag:hover, .ck-tag.active { border-color: #00e5ff; color: #00e5ff; background: rgba(0,229,255,0.08); }

        .header-action-buttons { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-shrink: 0; }

        @media(max-width: 768px) {
            .header-container { padding: 0 1rem; gap: 8px; }
            .header-action-buttons { gap: 6px; }
            .header-action-buttons .ck-btn-pill { padding: 0.4rem 0.75rem !important; font-size: 0.75rem !important; white-space: nowrap; }
            .header-title-text { font-size: 1rem !important; letter-spacing: 1px !important; }
            
            main { padding: 1.5rem 1rem 4rem !important; }
            .form-card { padding: 2.5rem 1.5rem !important; border-radius: 1rem; }
            h2.neon-text { font-size: 1.6rem !important; text-align: center; line-height: 1.3; }
            #actionState h2.neon-text { font-size: 1.8rem !important; margin-bottom: 2rem !important; }
            
            .verify-grid { grid-template-columns: 1fr !important; gap: 1rem !important; margin-top: 1.5rem; }
            .verify-card { padding: 1.75rem 1.25rem !important; }
            
            #mealOptions > div[style*="grid-template-columns"], 
            #tempMealRadioGroup { grid-template-columns: 1fr !important; gap: 0.75rem !important; }
            
            #productState > div:first-child { flex-direction: column !important; align-items: stretch !important; gap: 1rem !important; margin-bottom: 2rem !important; }
            #productState h1.neon-text { font-size: 1.8rem !important; text-align: left; }
            .products-grid { grid-template-columns: 1fr !important; gap: 1.5rem !important; }
            
            .ark-terminal-panel { padding: 1.25rem; border-radius: 1.25rem; }
            .ark-nav-card { grid-template-columns: 40px 1fr auto; gap: .75rem; padding: .9rem; }
            .ark-card-icon { width: 40px; height: 40px; font-size: 1.15rem; }
            .ark-mission-meta { grid-template-columns: 1fr; gap: 0.5rem; }
        }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>

    <div id="splash-screen" onclick="startRegistration()">
        <div class="click-hint">點 擊 畫 面 開 始 報 名</div>
    </div>

    <div id="banner-container" style="width: 100%; max-width: 1200px; margin: 0 auto; display: none;">
        <img id="event-banner" src="" style="width: 100%; border-radius: 0 0 15px 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
    </div>

    <header>
        <div class="header-container">
            <div onclick="resetToHome()" style="cursor:pointer; display: flex; align-items: center; gap: 8px; min-width: 0;">
                <span style="font-size: 1.3rem;">✈️</span>
                <span id="header-title" class="header-title-text" style="font-size: 1.2rem; letter-spacing: 2px; white-space: nowrap; font-weight: bold; color: var(--text-dark);">航 班 大 廳</span>
            </div>
            <div class="header-action-buttons">
                <a id="projectionBtn" class="ck-btn-pill" href="/dashboard" target="_blank" rel="noopener" style="border-color:rgba(74,222,128,0.4); color:#4ade80; background:rgba(74,222,128,0.05);">📺 大會投影</a>
                <button id="shopBtn" class="ck-btn-pill" onclick="goToShop()" style="display:none;">🛒 商品專區</button>
                <button id="mapBtn" class="ck-btn-pill" onclick="toggleMapModal(true)">🗺️ 地圖導覽</button>
            </div>
        </div>
    </header>

    <main>
        <div id="methodSelectionState" class="state-hidden">
            <div style="max-width:800px; margin: 0 auto;">
                <div style="text-align: center;"><h2 class="neon-text" style="font-size: 2.2rem;">請 選 擇 登 機 方 式</h2></div>
                <div class="verify-grid">
                    <div class="verify-card cyber-card" onclick="prepareSearch('name', '姓名')">
                        <div style="font-size:3rem; margin-bottom: 0.5rem;">📝</div><h3 class="neon-text">姓 名 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card" onclick="prepareSearch('phone', '手機')">
                        <div style="font-size:3rem; margin-bottom: 0.5rem;">📱</div><h3 class="neon-text">手 機 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card" onclick="prepareSearch('email', 'Email')">
                        <div style="font-size:3rem; margin-bottom: 0.5rem;">✉️</div><h3 class="neon-text">Email 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card" onclick="prepareSearch('company', '公司')">
                        <div style="font-size:3rem; margin-bottom: 0.5rem;">🏢</div><h3 class="neon-text">公 司 報 到</h3>
                    </div>
                </div>
            </div>
        </div>

        <div id="actionState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('methodSelection')">← 重新選擇方式</button>
            <div class="form-card cyber-card">
                <h2 id="actionTitle" class="neon-text" style="margin-bottom: 2.5rem; font-size: 2.2rem;">登 機 驗 證</h2>
                <input type="text" id="actionInput" class="cyber-input" placeholder="請輸入資訊">
                <button class="ck-btn" onclick="handleAction()" style="letter-spacing:3px;">🔍 開 始 驗 證</button>
            </div>

            <div id="tempRegistrationSection" class="form-card cyber-card state-hidden" style="margin-top: 2.5rem; border: 1px solid #ffa500 !important; box-shadow: 0 0 25px rgba(255, 165, 0, 0.2); background: rgba(12, 22, 38, 0.95); text-align: left;">
                <h3 style="color: #ffa500; font-size: 1.25rem; margin-bottom: 1.5rem; text-shadow: 0 0 10px rgba(255,165,0,0.3); font-weight: bold; text-align: center; line-height: 1.4;">⚠️ 查無此旅客登機紀錄！<br>是否開啟現場補位功能？</h3>
                
                <div style="margin-bottom: 1.2rem;">
                    <label style="color: #ffa500; display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: bold;">旅客姓名 *</label>
                    <input type="text" id="addName" class="cyber-input" placeholder="請輸入姓名" style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 1.2rem;">
                    <label style="color: #ffa500; display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: bold;">行動電話 *</label>
                    <input type="text" id="addPhone" class="cyber-input" placeholder="請輸入手機" style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 1.2rem;">
                    <label style="color: #8fa0b0; display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">服務單位 / 公司名稱</label>
                    <input type="text" id="addCompany" class="cyber-input" placeholder="請輸入公司名稱" style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="color: #8fa0b0; display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">桌號 / 座位安排</label>
                    <input type="text" id="addSeat" class="cyber-input" placeholder="例如: 08桌 (留空則現場安排)" style="margin-bottom: 0;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="color: #8fa0b0; display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">當日餐飲偏好</label>
                    <div id="tempMealRadioGroup" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;">
                        <button type="button" class="verify-card cyber-card meal-opt-temp temp-meal-selected" data-meal="葷食" onclick="selectTempMeal(this, '葷食')" style="padding: 1rem 0.5rem; font-size: 0.95rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">🥩 葷食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" data-meal="素食" onclick="selectTempMeal(this, '素食')" style="padding: 1rem 0.5rem; font-size: 0.95rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">🥬 素食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" data-meal="不需餐食" onclick="selectTempMeal(this, '不需餐食')" style="padding: 1rem 0.5rem; font-size: 0.95rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">❌ 不需餐食</button>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button class="ck-btn ck-btn-warn" onclick="submitAddRegistration()" style="margin-top:0;">✓ 確認外加報到</button>
                    <button class="ck-btn ck-btn-ghost" onclick="hideTempSection()" style="margin-top:0;">取消</button>
                </div>
            </div>
        </div>

        <div id="groupListState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('action')">← 重新搜尋</button>
            <div class="form-card cyber-card" style="max-width: 700px;">

                        <div class="ark-terminal-title">智慧方舟</div>

                        <div id="arkGreeting" class="ark-user-greeting">您好，領航員</div>
                        <div id="arkTerminalInfo" class="ark-mission-meta"></div>
                        <div class="ark-terminal-grid">
                            <button type="button" class="ark-nav-card" onclick="openArkMap()">

                                <div>
                                    <div class="ark-card-title">【2026 產業星圖】</div>
                                    <div class="ark-card-sub">領航員名冊與每攤機會</div>
                                    <div class="ark-card-desc">A-MALL.png / Navigator Directory</div>

                                <div class="ark-card-arrow">›</div>
                            </button>
                            <button type="button" class="ark-nav-card" onclick="openArkGift()">
                                <div class="ark-card-icon">🎁</div>
                                <div>
                                    <div class="ark-card-title">【方舟物資艙】</div>
                                    <div class="ark-card-sub">傳承伴手禮核心內涵</div>

                                </div>
                                <div class="ark-card-arrow">›</div>
                            </button>
                            <button type="button" class="ark-nav-card" onclick="openArkVideo()">
                                <div class="ark-card-icon">▶</div>
                                <div>
                                    <div class="ark-card-title">【核心引擎啟動】</div>
                                    <div class="ark-card-sub">智能全新數位中控系統</div>
                                    <div class="ark-card-desc">三年經營現況影片</div>
                                </div>

                                <div class="ark-card-icon">🕘</div>

                                    <div class="ark-card-title">【大會時空座標】</div>
                                    <div class="ark-card-sub">實體進化航線預載</div>

                        </div>
                    </div>
                </div>
                <nav class="ark-terminal-footer" aria-label="方舟終端機導覽">
                    <button type="button" class="ark-bottom-item active" onclick="setAppState('success')"><span class="ark-bottom-icon">⌂</span><span>首頁</span></button>
                    <button type="button" class="ark-bottom-item" onclick="openArkMap()"><span class="ark-bottom-icon">◇</span><span>星圖</span></button>
                    <button type="button" class="ark-bottom-item" onclick="openArkGift()"><span class="ark-bottom-icon">▣</span><span>物資</span></button>
                    <button type="button" class="ark-bottom-item" onclick="openArkVideo()"><span class="ark-bottom-icon">▶</span><span>引擎</span></button>
                    <button type="button" class="ark-bottom-item" onclick="openArkFlow()"><span class="ark-bottom-icon">☷</span><span>會議</span></button>
                </nav>
                <button class="ck-btn ck-btn-ghost" onclick="resetToHome()" style="max-width:280px; margin:2rem auto 0; font-size: 0.95rem;">← 回 到 報 到 首 頁</button>
            </section>

        <div id="productState" class="state-hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem;">
                <h1 class="neon-text" style="font-size: 2.2rem;">🛍️ 活 動 商 品 專 區</h1>
                <button class="ck-btn-pill ck-btn-ghost" onclick="resetToHome()">← 返 回</button>
            </div>
            <div id="giftsSection" class="state-hidden">
                <h2 class="neon-text" style="margin-bottom: 1.5rem; font-size: 1.5rem;">🎁 精 選 伴 手 禮</h2>
                <div id="giftsGrid" class="products-grid"></div>
            </div>
            <div id="normalProductsSection" style="margin-top: 4rem;">
                <h2 class="neon-text" style="margin-bottom: 1.5rem; font-size: 1.5rem;">📚 補 給 品 清 單</h2>
                <div id="categoryFilters" style="margin-bottom: 2.5rem; display: flex; flex-wrap: wrap; gap: 0.8rem;"></div>
                <div id="productsGrid" class="products-grid"></div>
            </div>
        </div>
    </main>

    <div id="mapModal" class="state-hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
        <div style="position: relative; width: 90%; height: 85vh; max-width: 1200px; display: flex; flex-direction: column;">
            <button onclick="toggleMapModal(false)" style="align-self: flex-end; margin-bottom: 12px; background: #00e5ff; color: #000; border: none; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,229,255,0.3); transition: 0.2s;">✕ 關 閉 地 圖</button>
            <div style="flex-grow: 1; background: #060f1e; border-radius: 12px; overflow: hidden; border: 1px solid rgba(0,229,255,0.25); display: flex; justify-content: center; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
                <img id="mapDisplayImage" src="" style="width: 100%; height: 100%; object-fit: contain; display: none;">
                <iframe id="mapDisplayFrame" src="" style="width: 100%; height: 100%; border: none; display: none;"></iframe>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentSheet = urlParams.get('sheet') || '';
        const currentAdmin = urlParams.get('admin') || 'admin';
        const API_BASE = '/api';
        let searchMethod = '', selectedUser = null, systemConfig = null;
        window.allProducts = [];
        window.currentCategory = '全部';
        window.selectedTempMealChoice = '葷食';

        window.onload = function() {
            if (!currentSheet) { fetchCurrentSheet(); } else { initSystem(); }
            setInterval(fetchCurrentSheet, 30000);
        };

        function fetchCurrentSheet() {
            fetch(`${API_BASE}/current_sheet?admin=${encodeURIComponent(currentAdmin)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const newSheet = data.current_sheet;
                        if (newSheet !== currentSheet) {
                            currentSheet = newSheet;
                            initSystem();
                        }
                    }
                })
                .catch(err => console.error("同步數據異常中斷", err));
        }

        function initSystem() {
            loadSystemConfig();
            document.title = `${currentSheet || '活動'} - 活動報到系統`;
        }

        function startRegistration() {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => {
                splash.style.display = 'none';
                setAppState('methodSelection'); 
                document.getElementById('shopBtn').style.display = 'block'; 
            }, 800);
        }

        function goToShop() {
            const splash = document.getElementById('splash-screen');
            if (splash && splash.style.display !== 'none') { splash.style.display = 'none'; }
            showProducts();
        }

        function setAppState(s) {
            ['methodSelection', 'action', 'groupList', 'meal', 'success', 'product'].forEach(x => {
                const el = document.getElementById(x+'State');
                if(el) el.classList.add('state-hidden');
            });
            document.getElementById(s+'State').classList.remove('state-hidden');
            hideTempSection();
            window.scrollTo(0, 0);
        }

        function resetToHome() { setAppState('methodSelection'); }
        
        function hideTempSection() {
            const tempSec = document.getElementById('tempRegistrationSection');
            if(tempSec) tempSec.classList.add('state-hidden');
        }

        function selectTempMeal(el, meal) {
            window.selectedTempMealChoice = meal;
            document.querySelectorAll('#tempMealRadioGroup .meal-opt-temp').forEach(btn => {
                btn.style.borderColor = 'var(--accent-gray)';
                btn.style.background = 'rgba(0,0,0,0.3)';
                btn.style.boxShadow = 'none';
                btn.style.color = '#fff';
            });
            el.style.borderColor = '#ffa500';
            el.style.background = 'rgba(255, 165, 0, 0.15)';
            el.style.boxShadow = '0 0 12px rgba(255, 165, 0, 0.3)';
            el.style.color = '#ffa500';
        }

        async function submitAddRegistration() {
            const data = {
                name: document.getElementById('addName').value.trim(),
                phone: document.getElementById('addPhone').value.trim(),
                company: document.getElementById('addCompany').value.trim(),
                seat: document.getElementById('addSeat').value.trim() || '現場安排',
                meal: window.selectedTempMealChoice,
                admin: currentAdmin,
                sheet: currentSheet
            };
            if(!data.name || !data.phone) return alert('❌ 請完整填寫學員姓名與手機核心欄位！');
            
            try {
                const res = await fetch('/api/registrations/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if(result.success) {
                    hideTempSection();
                    alert(`🎉 臨時補單報到成功！歡迎登機。`);
                    resetToHome();
                } else {
                    alert('報到未完成：' + result.message);
                }
            } catch(e) { alert('通訊矩陣回應異常，無法外加名單'); }
        }

        async function toggleMapModal(show) {
            const modal = document.getElementById('mapModal');
            const img = document.getElementById('mapDisplayImage');
            const frame = document.getElementById('mapDisplayFrame');
            if (show) {
                modal.classList.remove('state-hidden');
                try {
                    const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}&t=` + new Date().getTime());
                    const config = await res.json();
                    let url = config.map_image_url ? config.map_image_url.trim() : '';
                    if (url) {
                        const lowerUrl = url.toLowerCase();
                        const isImage = lowerUrl.endsWith('.png') || lowerUrl.endsWith('.jpg') || lowerUrl.endsWith('.jpeg') || lowerUrl.endsWith('.gif') || lowerUrl.endsWith('.webp') || url.startsWith('data:image/');
                        if (isImage) {
                            frame.style.display = 'none'; frame.removeAttribute('src');
                            img.src = url; img.style.display = 'block';
                        } else {
                            img.style.display = 'none'; img.removeAttribute('src');
                            frame.src = url; frame.style.display = 'block';
                        }
                    } else {
                        /* 👑 修正直接暴露後台的提示 */
                        alert('✨ 產業星圖正由方舟中樞更新載入中，稍後將開放導覽。');
                        modal.classList.add('state-hidden');
                    }
                } catch(e) { modal.classList.add('state-hidden'); }
            } else {
                modal.classList.add('state-hidden'); img.removeAttribute('src'); frame.removeAttribute('src');
            }
        }

        function prepareSearch(method, label) {
            searchMethod = method;
            document.getElementById('actionTitle').textContent = `請 輸 入 旅 客 ${label}`;
            document.getElementById('actionInput').value = '';
            setAppState('action');
        }

        async function handleAction() {
            const val = document.getElementById('actionInput').value.trim();
            if(!val) return;
            hideTempSection();
            
            try {
                const res = await fetch(`${API_BASE}/search/${searchMethod}?${searchMethod}=${encodeURIComponent(val)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const json = await res.json();
                if (json.data && json.data.length > 0) {
                    if (searchMethod === 'company') renderCompanyList(json.data);
                    else if (json.data.length === 1) { 
                        const u = json.data[0];
                        if (u.status === 'checked_in' || u.status === '已報到' || u.status === '替代') {
                            alert('🛬 旅客已完成登機報到手續！'); return;
                        }
                        selectedUser = u; 
                        renderMealOptions(); 
                    }
                    else { window.tempData = json.data; renderUserList(json.data, '搜尋結果'); }
                } else {
                    document.getElementById('addName').value = '';
                    document.getElementById('addPhone').value = '';
                    document.getElementById('addCompany').value = '';
                    document.getElementById('addSeat').value = '';
                    
                    const defaultMealBtn = document.querySelector('#tempMealRadioGroup [data-meal="葷食"]');
                    if(defaultMealBtn) selectTempMeal(defaultMealBtn, '葷食');

                    document.getElementById('tempRegistrationSection').classList.remove('state-hidden');
                    
                    if (searchMethod === 'company') { document.getElementById('addCompany').value = val; } 
                    else if (searchMethod === 'phone') { document.getElementById('addPhone').value = val; } 
                    else if (searchMethod === 'name') { document.getElementById('addName').value = val; }
                }
            } catch(e) { alert('通訊矩陣連線中斷'); }
        }   

        function renderCompanyList(companies) {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            companies.forEach(c => {
                const div = document.createElement('div'); div.className = 'group-item';
                div.innerHTML = `<span>🏢 ${c}</span><span style="color: var(--text-dark)">➔</span>`;
                div.onclick = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/search/company_members?name=${encodeURIComponent(c)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                        const json = await res.json(); renderUserList(json.data, c);
                    } catch(e) { alert('無法讀取數據結構'); }
                };
                list.appendChild(div);
            });
            document.getElementById('groupName').textContent = '請 選 擇 所 屬 公 司';
            setAppState('groupList');
        }

        function renderUserList(users, title) {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div'); div.className = 'group-item';
                const isRegistered = (u.status === 'checked_in' || u.status === '已報到' || u.status === '替代');
                const statusTag = isRegistered ? '<span style="color:#f87171; font-weight:bold;">[已報到]</span>' : '<span style="color: var(--text-dark)">➔</span>';
                div.innerHTML = `<div><div style="font-weight:bold; font-size:1.15rem; color:#fff;">${u.name}</div><div style="font-size:0.85rem; color:#8fa0b0; margin-top:0.2rem;">${u.company}</div></div>${statusTag}`;
                div.onclick = () => {
                    if (isRegistered) { alert('🛬 旅客已完成登機報到手續！'); } 
                    else { selectedUser = u; renderMealOptions(); }
                };
                list.appendChild(div);
            });
            document.getElementById('groupName').textContent = title;
            setAppState('groupList');
        }

        async function renderMealOptions() {
            const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
            systemConfig = await res.json();
            if (!systemConfig.show_meal_options) { submitCheckin('不需要'); return; }
            
            const container = document.getElementById('mealOptions');
            container.innerHTML = `
                <div style="margin-bottom:2rem; text-align:left; padding:1.2rem; background:rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.2); border-radius:0.6rem;">
                    <div style="font-size:0.85rem; color:rgba(0,229,255,0.7); letter-spacing:1px; margin-bottom:0.2rem;">旅 客 姓 名</div>
                    <div style="font-size:1.4rem; font-weight:bold; color:#fff;">${selectedUser.name}</div>
                </div>
                <div class="two-col-grid" style="margin-bottom:2rem;">
                    <div id="btnOrig" class="verify-card cyber-card is-original-selected" onclick="toggleIdentity(true)" style="padding:1.2rem; font-weight:bold;">本 人 報 到</div>
                    <div id="btnProxy" class="verify-card cyber-card" onclick="toggleIdentity(false)" style="padding:1.2rem; font-weight:bold;">替 代 報 到</div>
                </div>
                <div id="proxyForm" class="state-hidden" style="margin-bottom:2rem; text-align:left; border:1px solid rgba(255,165,0,0.4); background:rgba(255,165,0,0.03); padding:1.5rem; border-radius:0.75rem;">
                    <p style="color:#ffa500; margin-bottom:1rem; font-size:0.95rem; font-weight:bold;">請 輸 入 替 代 人 資 訊 ：</p>
                    <input type="text" id="proxyName" class="cyber-input" placeholder="替代人姓名" style="margin-bottom:0.8rem; padding:0.9rem;">
                    <input type="text" id="proxyPhone" class="cyber-input" placeholder="替代人手機" style="margin-bottom:0; padding:0.9rem;">
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom:1.5rem;">
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '葷食')" style="padding:1.2rem 0.5rem; font-weight:bold;">🥩 葷食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '素食')" style="padding:1.2rem 0.5rem; font-weight:bold;">🥬 素食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '不需餐食')" style="padding:1.2rem 0.5rem; font-weight:bold;">❌ 不需餐食</div>
                </div>
                <div class="portrait-consent-box">
                    <label class="portrait-consent-check">
                        <input type="checkbox" id="portraitConsent" onchange="checkMealReady()">
                        <span>我已閱讀並同意活動拍攝與肖像使用授權條款</span>
                    </label>
                    <button type="button" class="portrait-consent-link" onclick="openPortraitConsentModal()">查看完整條款</button>
                </div>
            `;
            window.selectedMeal = null; window.isOriginal = true;
            document.getElementById('finalBtn').disabled = true;
            setAppState('meal');
        }

        function toggleIdentity(isOrig) {
            window.isOriginal = isOrig;
            document.getElementById('btnOrig').classList.toggle('is-original-selected', isOrig);
            document.getElementById('btnProxy').classList.toggle('proxy-selected', !isOrig);
            document.getElementById('proxyForm').classList.toggle('state-hidden', isOrig);
            checkMealReady();
        }

        function selectMeal(el, m) {
            document.querySelectorAll('.meal-opt').forEach(x => x.classList.remove('meal-selected'));
            el.classList.add('meal-selected');
            window.selectedMeal = m; checkMealReady();
        }

        function checkMealReady() {
            const finalBtn = document.getElementById('finalBtn');
            const consent = document.getElementById('portraitConsent');
            const hasConsent = consent ? consent.checked : false;
            finalBtn.disabled = !(window.selectedMeal && hasConsent);
        }

        function openPortraitConsentModal() { document.getElementById('portraitConsentModal')?.classList.add('active'); }
        function closePortraitConsentModal() { document.getElementById('portraitConsentModal')?.classList.remove('active'); }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(ch) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
            });
        }

        function renderArkTerminal(user, meal) {
            const name = escapeHtml(user?.name || selectedUser?.name || 'Jeremy');
            const company = escapeHtml(user?.company || selectedUser?.company || '智慧方舟');
            const seat = escapeHtml(user?.seat || selectedUser?.seat || '現場安排');
            const mealText = escapeHtml(meal || user?.meal || selectedUser?.meal || '未選擇');
            const eventName = escapeHtml((systemConfig && (systemConfig.event_title || systemConfig.google_sheet_name)) || currentSheet || '2026 全球面對面');
            const startDate = escapeHtml((systemConfig && (systemConfig.event_start_date || systemConfig.date_start)) || '2026/06/01');
            const endDate = escapeHtml((systemConfig && (systemConfig.event_end_date || systemConfig.date_end)) || '2026/08/XX');
            document.getElementById('arkGreeting').innerHTML = `您好，領航員 ${name}`;
            document.getElementById('arkTerminalInfo').innerHTML = `
                <div class="ark-meta-chip">
                    <div class="ark-meta-label">MISSION</div>
                    <div class="ark-meta-value">${eventName}</div>
                </div>
                <div class="ark-meta-chip">
                    <div class="ark-meta-label">DATE</div>
                    <div class="ark-meta-value">${startDate} ~ ${endDate}</div>
                </div>
                <div class="ark-meta-chip">
                    <div class="ark-meta-label">COMPANY</div>
                    <div class="ark-meta-value">${company}</div>
                </div>
                <div class="ark-meta-chip">
                    <div class="ark-meta-label">SEAT / MEAL</div>
                    <div class="ark-meta-value">${seat}｜${mealText}</div>
                </div>
            `;
        }

        function openArkMap() { if (typeof toggleMapModal === 'function') return toggleMapModal(true); alert('✨ 產業星圖正由方舟中樞更新載入中。'); }
        function openArkGift() { if (typeof showProducts === 'function') return showProducts(); alert('物資明細資料庫同步中。'); }
        function openArkVideo() {
            const url = systemConfig?.video_url || systemConfig?.event_video_url || systemConfig?.gift_video_url || '';
            /* 👑 包裝提示 */
            if (url) return window.open(url, '_blank', 'noopener');
            alert('⚡ 核心引擎影像傳輸鏈結建立中，請稍後再試。');
        }

        function openArkFlow() {
            const flowUrl = systemConfig?.flow_image_url || systemConfig?.schedule_image_url || systemConfig?.agenda_image_url || '';
            if (flowUrl) {
                const modal = document.getElementById('mapModal');
                const img = document.getElementById('mapDisplayImage');
                const frame = document.getElementById('mapDisplayFrame');
                frame.style.display = 'none'; frame.removeAttribute('src');
                img.src = flowUrl; img.style.display = 'block';
                modal.classList.remove('state-hidden');
                return;
            }
            /* 👑 包裝提示 */
            alert('⏳ 大會時空座標與實體進化航線正在預載中。');
        }

        async function submitCheckin(autoMeal) {
            const meal = autoMeal || window.selectedMeal;
            const consentEl = document.getElementById('portraitConsent');
            const portraitConsent = consentEl ? consentEl.checked : true;
            if (!portraitConsent) { alert('請先閱讀並同意活動拍攝與肖像使用授權條款'); return; }
            const proxyInfo = window.isOriginal ? {} : {
                name: document.getElementById('proxyName').value.trim(),
                phone: document.getElementById('proxyPhone').value.trim()
            };
            if (!window.isOriginal && !proxyInfo.name) { alert('請輸入替代人姓名'); return; }
            
            const btn = document.getElementById('finalBtn');
            btn.disabled = true; btn.innerHTML = '<span>登 機 核 對 中 ...</span>';
            
            try {
                const res = await fetch(`${API_BASE}/checkin/${selectedUser.id}?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ meal, is_original: window.isOriginal, proxy_info: proxyInfo, portrait_consent: portraitConsent })
                });
                const json = await res.json();
                if (json.success) {
                    const u = json.data;
                    renderArkTerminal(u, meal);
                    setAppState('success');
                } else {
                    if (json.error === 'already_done') { alert('🛬 旅客已完成登機報到手續！'); } 
                    else { alert('登機確認手續未完成'); }
                    btn.disabled = false; btn.innerHTML = '<span>確 認 並 核 發 登 機 證</span>';
                }
            } catch(e) { 
                alert('網路序列傳輸異常'); btn.disabled = false; btn.innerHTML = '<span>確 認 並 核 發 登 機 證</span>';
            }
        }

        async function showProducts() {
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const config = await res.json();
                window.allProducts = config.products || [];
                const gifts = window.allProducts.filter(p => p.isGift);
                const normals = window.allProducts.filter(p => !p.isGift);
                const giftsSection = document.getElementById('giftsSection');
                if (gifts.length > 0) {
                    giftsSection.classList.remove('state-hidden'); renderGrid('giftsGrid', gifts);
                } else giftsSection.classList.add('state-hidden');
                const categories = ['全 部', ...new Set(normals.map(p => p.category).filter(c => c))];
                const filterContainer = document.getElementById('categoryFilters');
                filterContainer.innerHTML = categories.map(c => `
                    <button class="ck-tag ${window.currentCategory === c ? 'active' : ''}" 
                         onclick="filterCategory('${c}')">${c}</button>
                `).join('');
                filterCategory(window.currentCategory); setAppState('product');
            } catch(e) { alert('物資艙清單載入中'); }
        }

        function filterCategory(cat) {
            window.currentCategory = cat;
            document.querySelectorAll('#categoryFilters .ck-tag').forEach(btn => {
                const isActive = btn.textContent === cat;
                btn.style.background = isActive ? 'var(--text-dark)' : 'transparent';
                btn.style.color = isActive ? '#000' : '#aaa';
                btn.style.borderColor = isActive ? 'var(--text-dark)' : 'rgba(0,229,255,0.2)';
            });
            const filtered = window.currentCategory === '全 部' ? window.allProducts.filter(p => !p.isGift) : window.allProducts.filter(p => !p.isGift && p.category === cat);
            renderGrid('productsGrid', filtered);
        }

        function renderGrid(id, items) {
            const grid = document.getElementById(id);
            grid.innerHTML = items.map(p => `
                <div class="cyber-card" style="padding:0; overflow:hidden; display:flex; flex-direction:column; border-radius: 0.75rem !important;">
                    ${p.image ? `<img src="${p.image}" class="product-img">` : '<div class="product-img" style="display:flex; align-items:center; justify-content:center; font-size:3rem;">📦</div>'}
                    <div style="padding:1.5rem; flex-grow:1; display:flex; flex-direction:column;">
                        <div style="color:var(--text-dark); font-size:0.8rem; margin-bottom:0.5rem; font-weight: bold;"># ${p.category || '一 般'}</div>
                        <h3 style="margin-bottom:0.8rem; font-size:1.25rem; color:#fff;">${p.name}</h3>
                        <p style="font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:1.5rem; flex-grow:1; line-height:1.5;">${p.description || ''}</p>
                        ${p.link ? `<a href="${p.link}" target="_blank" class="ck-btn" style="text-decoration:none; padding:0.6rem 1rem; font-size:0.9rem; letter-spacing:1px;">立 即 查 看 →</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function loadSystemConfig() {
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                systemConfig = await res.json();
                if(systemConfig && systemConfig.google_sheet_name) {
                    document.getElementById('header-title').textContent = systemConfig.google_sheet_name.split('').join(' ');
                }
                const banner = document.getElementById('event-banner');
                if(systemConfig && systemConfig.banner_image_url) {
                    banner.src = systemConfig.banner_image_url;
                    document.getElementById('banner-container').style.display = 'block';
                } else {
                    document.getElementById('banner-container').style.display = 'none';
                }
            } catch(e) { console.error("系統初始化同步中"); }
        }
    </script>
</body>
</html>
