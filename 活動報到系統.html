<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 航空登機系統</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; color: #fff; }
        main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .state-hidden { display: none !important; }
        .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 3rem; margin-top: 2rem; }
        .home-card { padding: 5rem 2rem; text-align: center; cursor: pointer; border-radius: 1.5rem; min-height: 400px; display: flex; flex-direction: column; justify-content: center; }
        .verify-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 2rem; }
        .verify-card { padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; border-radius: 1rem; }
        .form-card { max-width: 600px; margin: 0 auto; padding: 3rem; text-align: center; border-radius: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2.5rem; }
        .product-img { width: 100%; height: 220px; object-fit: contain; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--accent-gray); }
        .btn-back-nav { background: none; border: 1px solid var(--accent-gray); color: var(--text-dark); padding: 0.5rem 1.2rem; border-radius: 0.5rem; cursor: pointer; margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        .cyber-input { width: 100%; margin-bottom: 1.5rem; padding: 1.2rem; font-size: 1.2rem; }
        .cyber-button { width: 100%; margin-top: 0.5rem; padding: 1.2rem; font-size: 1.1rem; }
        .group-item { padding: 1.5rem; border-bottom: 1px solid rgba(0,229,255,0.2); cursor: pointer; transition: 0.3s; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .info-box { text-align: left; padding: 1.5rem; border-radius: 1rem; margin: 1.5rem 0; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-gray); }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>
    <header class="panel-border" style="background: rgba(10,20,35,0.85); padding: 1.2rem;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <div onclick="resetToHome()" style="cursor:pointer; color:var(--text-dark); font-weight: bold;">✈️ 航班大廳</div>
            <div class="neon-text" style="font-size: 1.4rem;">BOARDING SYSTEM</div>
            <div onclick="toggleMapModal(true)" style="font-size: 0.9rem; color: var(--text-dark); cursor: pointer; border: 1px solid var(--text-dark); padding: 4px 12px; border-radius: 20px;">🗺️ 地圖導覽</div>
        </div>
    </header>

    <main>
        <div id="homeState">
            <h1 class="neon-text" style="text-align:center; margin-bottom: 2rem; font-size: 3rem; display: block;">服務項目</h1>
            <div class="home-grid">
                <div class="home-card cyber-card cyber-hover" onclick="setAppState('methodSelection')">
                    <div style="font-size:6rem;">🎫</div><h2 class="neon-text">辦理登機報到</h2><p style="color:#aaa;">CHECK-IN SERVICE</p>
                </div>
                <div class="home-card cyber-card cyber-hover" onclick="showProducts()">
                    <div style="font-size:6rem;">🛍️</div><h2 class="neon-text">活動商品專區</h2><p style="color:#aaa;">ACTIVITY PRODUCTS</p>
                </div>
            </div>
        </div>

        <div id="methodSelectionState" class="state-hidden">
            <button class="btn-back-nav" onclick="resetToHome()">← 返回大廳</button>
            <div class="verify-grid">
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('name', '姓名')">📝<h3 class="neon-text">姓名報到</h3></div>
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('phone', '手機')">📱<h3 class="neon-text">手機報到</h3></div>
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('email', 'Email')">✉️<h3 class="neon-text">Email 報到</h3></div>
                <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('company', '公司')">🏢<h3 class="neon-text">公司報到</h3></div>
            </div>
        </div>

        <div id="actionState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('methodSelection')">← 重新選擇方式</button>
            <div class="form-card cyber-card">
                <h2 id="actionTitle" class="neon-text" style="margin-bottom: 2rem;">登機驗證</h2>
                <input type="text" id="actionInput" class="cyber-input">
                <button class="cyber-button" onclick="handleAction()"><span>啟動搜尋</span></button>
            </div>
        </div>

        <div id="groupListState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('action')">← 重新搜尋</button>
            <div class="form-card cyber-card" style="max-width: 700px;">
                <h2 id="groupName" class="neon-text" style="margin-bottom: 1.5rem;">請選擇旅客</h2>
                <div id="groupList" class="panel-border" style="background: rgba(0,0,0,0.3); max-height:450px; overflow-y:auto;"></div>
            </div>
        </div>

        <div id="mealState" class="state-hidden">
            <button class="btn-back-nav" onclick="resetToHome()">← 取消</button>
            <div class="form-card cyber-card">
                <h2 class="neon-text" style="margin-bottom:2rem;">🍽️ 機上餐飲偏好</h2>
                <div id="mealOptions"></div>
                <button id="finalBtn" class="cyber-button" disabled onclick="submitCheckin()"><span>確認並核發登機證</span></button>
            </div>
        </div>

        <div id="successState" class="state-hidden">
            <div class="form-card cyber-card">
                <div id="successIcon" style="font-size:6rem;">🎫</div><h2 id="successTitle" class="neon-text">手續完成！</h2>
                <div id="successInfo" class="info-box panel-border"></div>
                <button class="cyber-button" onclick="resetToHome()"><span>🏠 回大廳</span></button>
            </div>
        </div>

        <div id="productState" class="state-hidden">
            <div style="display:flex; justify-content:space-between; margin-bottom:3rem;">
                <h1 class="neon-text" style="font-size: 2.5rem;">🛍️ 活動商品專區</h1>
                <button class="cyber-button" style="width:auto;" onclick="resetToHome()"><span>← 回大廳</span></button>
            </div>
            <div id="giftsSection" class="state-hidden"><h2 class="neon-text">🎁 精選伴手禮</h2><div id="giftsGrid" class="products-grid"></div></div>
            <div id="normalProductsSection"><h2 class="neon-text">📦 補給品清單</h2><div id="categoryFilters" style="margin: 1rem 0;"></div><div id="productsGrid" class="products-grid"></div></div>
        </div>
    </main>

    <script>
        const API_BASE = '/api';
        let searchMethod = '', selectedUser = null, systemConfig = null;

        function setAppState(s) {
            ['home', 'methodSelection', 'action', 'groupList', 'meal', 'success', 'product'].forEach(x => document.getElementById(x+'State').classList.add('state-hidden'));
            document.getElementById(s+'State').classList.remove('state-hidden');
        }
        function resetToHome() { setAppState('home'); }
        function prepareSearch(m, l) { searchMethod = m; document.getElementById('actionTitle').textContent = `輸入旅客${l}`; setAppState('action'); }

        async function handleAction() {
            const val = document.getElementById('actionInput').value.trim();
            if(!val) return;
            try {
                const res = await fetch(`${API_BASE}/search/${searchMethod}?${searchMethod}=${encodeURIComponent(val)}`);
                const json = await res.json();
                if (json.data && json.data.length > 0) {
                    if (searchMethod === 'company') { renderCompanyList(json.data); }
                    else if (json.data.length === 1) { selectedUser = json.data[0]; renderMealOptions(); }
                    else { window.tempData = json.data; renderUserList(json.data, '找到多位旅客'); }
                } else alert('查無資料');
            } catch(e) { alert('通訊異常'); }
        }

        function renderCompanyList(companies) {
            document.getElementById('groupList').innerHTML = companies.map(c => `<div class="group-item" onclick="fetchMembers('${c}')"><b>${c}</b></div>`).join('');
            setAppState('groupList');
        }
        async function fetchMembers(n) {
            const res = await fetch(`${API_BASE}/search/company_members?name=${encodeURIComponent(n)}`);
            const json = await res.json();
            window.tempData = json.data; renderUserList(json.data, n);
        }
        function renderUserList(u, t) {
            document.getElementById('groupName').textContent = t;
            document.getElementById('groupList').innerHTML = u.map(x => `<div class="group-item" onclick="selectSingleUser('${x.id}')"><b>${x.name}</b><span>${x.status==='checked_in'?'🟢':'⚪'}</span></div>`).join('');
            setAppState('groupList');
        }
        function selectSingleUser(id) { selectedUser = window.tempData.find(x => x.id === id); renderMealOptions(); }

        function renderMealOptions() {
            const options = (systemConfig && systemConfig.meal_types) ? systemConfig.meal_types : ['葷食', '素食', '不須用餐'];
            const mealHtml = options.map(m => {
                let icon = m.includes('葷')?'🍱':(m.includes('素')?'🥗':'❌');
                return `<div class="cyber-card panel-border" id="m-${m}" onclick="selectMeal('${m}')" style="padding:1.5rem; margin-bottom:1rem; cursor:pointer;">${icon} ${m}</div>`;
            }).join('');
            const proxyHtml = `<div style="margin-top:2rem; border-top:1px solid #333; padding-top:1rem;">
                <label>👤 是否為本人？</label>
                <div style="display:flex; gap:1rem; margin:1rem 0;">
                    <div id="isYes" class="cyber-card" style="flex:1; padding:1rem; cursor:pointer;" onclick="setIsOriginal(true)">是</div>
                    <div id="isNo" class="cyber-card" style="flex:1; padding:1rem; cursor:pointer;" onclick="setIsOriginal(false)">否</div>
                </div>
                <div id="proxyForm" style="display:none; text-align:left;">
                    <input id="pName" placeholder="替代姓名" class="cyber-input"><input id="pPhone" placeholder="替代電話" class="cyber-input">
                </div>
            </div>`;
            document.getElementById('mealOptions').innerHTML = mealHtml + proxyHtml;
            window.isOriginal = true; setAppState('meal');
        }
        function selectMeal(m) { window.selectedMeal = m; document.getElementById('finalBtn').disabled = false; }
        function setIsOriginal(v) { 
            window.isOriginal = v; 
            document.getElementById('proxyForm').style.display = v ? 'none' : 'block'; 
        }

        async function submitCheckin() {
            const proxy_info = window.isOriginal ? {} : { name: document.getElementById('pName').value, phone: document.getElementById('pPhone').value };
            if(!window.isOriginal && !proxy_info.name) return alert("請填寫替代者姓名");
            
            try {
                const res = await fetch(`${API_BASE}/checkin/${selectedUser.id}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ meal: window.selectedMeal, is_original: window.isOriginal, proxy_info })
                });
                const json = await res.json();
                document.getElementById('successInfo').innerHTML = `<p>旅客：${json.data.name}</p><p>座位：${json.data.seat || "未分配"}</p><p>餐飲：${json.data.meal}</p><p>📸 請截圖保存</p>`;
                setAppState('success');
            } catch(e) { alert('連線中斷'); }
        }

        async function showProducts() {
            setAppState('product');
            const res = await fetch(`${API_BASE}/config`);
            const config = await res.json();
            const gifts = (config.products || []).filter(p => p.isGift);
            const items = (config.products || []).filter(p => !p.isGift);
            document.getElementById('giftsSection').classList.toggle('state-hidden', gifts.length===0);
            document.getElementById('giftsGrid').innerHTML = gifts.map(p => `<div class="cyber-card"><img src="${p.image}" class="product-img"><h3>${p.name}</h3></div>`).join('');
            document.getElementById('productsGrid').innerHTML = items.map(p => `<div class="cyber-card"><img src="${p.image}" class="product-img"><h3>${p.name}</h3><small>${p.category}</small></div>`).join('');
        }

        window.onload = async () => { 
            const res = await fetch(`${API_BASE}/config`); 
            if(res.ok) systemConfig = await res.json(); 
            setAppState('home');
        };
    </script>
</body>
</html>
