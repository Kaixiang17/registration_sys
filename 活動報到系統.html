<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智匯方舟 - 航空登機系統</title>
    <link rel="stylesheet" href="smart-ark-theme.css?v=9">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; color: #ECFEFF; overflow-x: hidden; }
        header { padding: 1rem 0; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--accent-gray); background: rgba(6, 26, 24, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 5rem; min-height: calc(100vh - 80px); }
        .state-hidden { display: none !important; }
        .verify-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; margin-top: 2.5rem; }
        .verify-card { padding: 2.5rem 2rem; text-align: center; cursor: pointer; border-radius: 1rem; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .form-card { max-width: 600px; margin: 0 auto; padding: 3.5rem 3rem; text-align: center; border-radius: 1.5rem; }
        
        .btn-back-nav { background: transparent; border: 1px solid var(--accent-gray); color: var(--text-dark); padding: 0.6rem 1.4rem; border-radius: 0.5rem; cursor: pointer; font-weight: bold; transition: 0.2s; margin-bottom: 2rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-back-nav:hover { border-color: var(--text-dark); background: rgba(20, 184, 166, 0.08); transform: translateX(-2px); }
        
        .meal-selected, .is-original-selected { border-color: #14B8A6 !important; background: rgba(20, 184, 166, 0.25) !important; box-shadow: 0 0 20px rgba(20, 184, 166, 0.4), inset 0 0 10px rgba(20, 184, 166, 0.2) !important; font-weight: bold !important; transform: translateY(-2px); }
        .proxy-selected { border-color: #5EEAD4 !important; background: rgba(94, 234, 212, 0.2) !important; box-shadow: 0 0 20px rgba(94, 234, 212, 0.3) !important; transform: translateY(-2px); color: #5EEAD4; }

        /* ── ARK TERMINAL ── */
        .ark-terminal-shell { max-width: 560px; margin: 0 auto; padding: 1rem 1rem 6rem; min-height: calc(100vh - 140px); position: relative; }
        .ark-terminal-panel { position: relative; overflow: hidden; border-radius: 1.8rem; padding: 1.75rem; background: linear-gradient(180deg, rgba(6, 26, 24, 0.94), rgba(3, 10, 10, 0.98)); border: 1px solid rgba(20,184,166,.3); box-shadow: 0 15px 35px rgba(0,0,0,.4), 0 0 30px rgba(20,184,166,.15); }
        .ark-terminal-panel::before { content: ''; position: absolute; inset: -40%; background: radial-gradient(circle at 25% 20%, rgba(20,184,166,.18), transparent 30%), radial-gradient(circle at 85% 8%, rgba(94,234,212,.15), transparent 26%); pointer-events: none; }
        .ark-terminal-content { position: relative; z-index: 1; }
        .ark-brand-kicker { display: flex; justify-content: space-between; gap: .75rem; align-items: center; color: rgba(236,254,255,.7); font-size: .75rem; letter-spacing: .1em; margin-bottom: 1.2rem; border-bottom: 1px solid rgba(20,184,166,0.15); padding-bottom: 0.75rem; }
        .ark-logo-mark { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(20,184,166,.3); background: rgba(20,184,166,.05); display: grid; place-items: center; font-size: 1.2rem; }
        .ark-terminal-title { font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; letter-spacing: .06em; color: #ECFEFF; text-shadow: 0 0 12px rgba(20,184,166,.6); font-weight: 900; margin-bottom: .25rem; }
        .ark-terminal-subtitle { color: rgba(20, 184, 166, 0.8); font-size: .88rem; letter-spacing: .1em; margin-bottom: 1.5rem; }
        .ark-user-greeting { padding: 1rem 1.25rem; border-radius: 0.75rem; background: rgba(20,184,166,.06); border: 1px solid rgba(20,184,166,.2); color: #ECFEFF; font-weight: bold; font-size: 1.1rem; letter-spacing: .05em; margin-bottom: 1.25rem; }
        .ark-mission-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .8rem; margin-bottom: 1.5rem; }
        .ark-meta-chip { border-radius: .75rem; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); padding: .8rem 1rem; }
        .ark-meta-label { color: rgba(255,255,255,0.45); font-size: .7rem; letter-spacing: .05em; margin-bottom: 0.15rem; }
        .ark-meta-value { color: #14B8A6; font-weight: bold; font-size: .95rem; word-break: break-word; }

        .ark-terminal-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; align-items: stretch; }
        .ark-nav-card { border-radius: 1rem; padding: 1.1rem; border: 1px solid rgba(20,184,166,.25); background: linear-gradient(135deg, rgba(20,184,166,.06), rgba(6,26,24,.5)); display: grid; grid-template-columns: 44px minmax(0, 1fr) 18px; gap: 1rem; align-items: center; cursor: pointer; transition: all .2s ease; text-align: left; color: inherit; width: 100%; height: 100%; min-height: 118px; }
        .ark-nav-card:hover { transform: translateY(-2px); border-color: rgba(20,184,166,.7); box-shadow: 0 5px 15px rgba(20,184,166,.1); }
        .ark-card-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(20,184,166,.1); border: 1px solid rgba(20,184,166,.25); color: #14B8A6; font-size: 1.3rem; }
        .ark-card-title { color: #ECFEFF; font-weight: bold; font-size: 1rem; line-height: 1.35; overflow-wrap: anywhere; }
        .ark-card-sub { color: #14B8A6; font-weight: 600; font-size: .85rem; margin-top: .1rem; line-height: 1.4; overflow-wrap: anywhere; }
        .ark-card-desc { color: rgba(255,255,255,0.5); font-size: .75rem; margin-top: .2rem; line-height: 1.45; overflow-wrap: anywhere; }

        .ck-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 1rem 1.5rem; font-family: inherit; font-size: 1.05rem; font-weight: bold; letter-spacing: 2px; border-radius: 0.6rem; border: 1px solid rgba(20,184,166,0.4); color: #14B8A6; background: rgba(20,184,166,0.06); cursor: pointer; transition: all 0.2s ease; text-decoration: none; }
        .ck-btn:hover:not(:disabled) { background: rgba(20,184,166,0.15); border-color: #14B8A6; box-shadow: 0 0 15px rgba(20,184,166,0.2); }
        .ck-btn-confirm { border-color: rgba(94,234,212,0.5); color: #5EEAD4; background: rgba(94,234,212,0.08); }
        .ck-btn-confirm:hover:not(:disabled) { background: rgba(94,234,212,0.18); border-color: #5EEAD4; box-shadow: 0 0 15px rgba(94,234,212,0.25); }
        
        .proxy-badge { position: absolute; top: -10px; right: -10px; width: 34px; height: 34px; background: #5EEAD4; color: #061A18; font-weight: 900; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px 10px rgba(94,234,212,0.3); border: 2px solid #061A18; }
        
        @media(max-width: 768px) {
            .ark-terminal-grid { grid-template-columns: 1fr; }
            .verify-grid { grid-template-columns: 1fr; }
        }
        @media(min-width: 768px) {
            .ark-terminal-grid { grid-template-columns: repeat(2, 1fr); }
            .ark-terminal-shell { max-width: 860px; }
        }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>

    <div id="splash-screen" onclick="startRegistration()">
        <div class="click-hint">點 擊 畫 面 開 始 報 名</div>
    </div>

    <header>
        <div class="header-container">
            <div onclick="resetToHome()" style="cursor:pointer; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 1.3rem;">🏠</span><span class="header-title-text" style="font-size: 1.15rem; font-weight: bold; color: #14B8A6;">首 頁</span>
            </div>
            <div class="header-action-buttons">
                <a id="projectionBtn" class="ck-btn ck-btn-ghost" style="padding:0.4rem 1rem; width:auto;" href="/dashboard" target="_blank">📺 投影</a>
            </div>
        </div>
    </header>

    <main>
        <div id="methodSelectionState" class="state-hidden">
            <div style="max-width:800px; margin: 0 auto;">
                <div style="text-align: center;"><h2 class="neon-text" style="font-size: 2.2rem;">請 選 擇 登 機 方 式</h2></div>
                <div class="verify-grid">
                    <div class="verify-card cyber-card" onclick="prepareSearch('name', '姓名')">
                        <div style="font-size:3rem; margin-bottom: 0.5rem;">📝</div><h3 class="neon-text">姓 名 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card" onclick="prepareSearch('phone', '手機')">
                        <div style="font-size:3rem; margin-bottom: 0.5rem;">📱</div><h3 class="neon-text">手 機 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card" onclick="prepareSearch('company', '公司')" style="position: relative;">
                        <div class="proxy-badge">代</div>
                        <div style="font-size:3rem; margin-bottom: 0.5rem;">🏢</div><h3 class="neon-text">公 司 報 到</h3>
                    </div>
                </div>
            </div>
        </div>

        <div id="actionState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('methodSelection')">← 重新選擇</button>
            <div class="form-card cyber-card">
                <h2 id="actionTitle" class="neon-text" style="margin-bottom: 2.5rem;">登 機 驗 證</h2>
                <input type="text" id="actionInput" class="cyber-input" placeholder="請輸入資訊">
                <button class="ck-btn" onclick="handleAction()">🔍 開 始 驗 證</button>
            </div>
        </div>

        <div id="groupListState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('action')">← 重新搜尋</button>
            <div class="form-card cyber-card" style="max-width: 700px;">
                <h2 id="groupName" class="neon-text" style="margin-bottom: 2rem;">請 選 擇 旅 客</h2>
                <div id="groupList" style="border-radius: 1rem; overflow: hidden;"></div>
            </div>
        </div>

        <div id="mealState" class="state-hidden">
            <button class="btn-back-nav" onclick="resetToHome()">← 取消</button>
            <div class="form-card cyber-card">
                <h2 class="neon-text" style="margin-bottom:2rem;">🍽️ 機 上 餐 飲 偏 好</h2>
                <div id="mealOptions"></div>
                <button id="finalBtn" class="ck-btn ck-btn-confirm" disabled onclick="submitCheckin()">✈️ 確 認 並 核 發 登 機 證</button>
            </div>
        </div>

        <div id="successState" class="state-hidden">
            <section class="ark-terminal-shell">
                <div id="arkTerminalPanel" class="ark-terminal-panel">
                    <div class="ark-terminal-content">
                        <div class="ark-brand-kicker">
                            <div><div>方舟終端機</div><div>ARK TERMINAL</div></div>
                            <div class="ark-logo-mark">⚓</div>
                        </div>
                        <div class="ark-terminal-title">智匯方舟</div>
                        <div class="ark-terminal-subtitle">世代共榮的數位聚合</div>
                        <div id="arkGreeting" class="ark-user-greeting">您好</div>
                        <div id="arkTerminalInfo" class="ark-mission-meta"></div>
                        <div class="ark-terminal-grid">
                            <button class="ark-nav-card" id="arkCard1Btn"><div class="ark-card-icon"></div><div><div class="ark-card-title" id="arkCard1Title"></div><div class="ark-card-sub" id="arkCard1Sub"></div><div class="ark-card-desc" id="arkCard1Desc"></div></div></button>
                            <button class="ark-nav-card" id="arkCard2Btn"><div class="ark-card-icon"></div><div><div class="ark-card-title" id="arkCard2Title"></div><div class="ark-card-sub" id="arkCard2Sub"></div><div class="ark-card-desc" id="arkCard2Desc"></div></div></button>
                            <button class="ark-nav-card" id="arkCard3Btn"><div class="ark-card-icon"></div><div><div class="ark-card-title" id="arkCard3Title"></div><div class="ark-card-sub" id="arkCard3Sub"></div><div class="ark-card-desc" id="arkCard3Desc"></div></div></button>
                            <button class="ark-nav-card" id="arkCard4Btn"><div class="ark-card-icon"></div><div><div class="ark-card-title" id="arkCard4Title"></div><div class="ark-card-sub" id="arkCard4Sub"></div><div class="ark-card-desc" id="arkCard4Desc"></div></div></button>
                        </div>
                    </div>
                </div>
                <button class="ck-btn" id="successBtnAction" onclick="resetToHome()" style="max-width:280px; margin:2rem auto 0;">回到首頁</button>
            </section>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentSheet = urlParams.get('sheet') || '活動報到名單';
        const currentAdmin = urlParams.get('admin') || 'admin';
        const API_BASE = '/api';
        let searchMethod = '', selectedUser = null, systemConfig = null;
        window.isOriginal = true;
        window.selectedMeal = null;

        window.onload = async function() {
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                systemConfig = await res.json();
                try {
                    const cfgRes = await fetch(`${API_BASE}/event-config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                    const cfgData = await cfgRes.json();
                    if(cfgData.success) systemConfig = Object.assign({}, systemConfig, cfgData.config);
                } catch(e) {}
            } catch(e) {}
            document.getElementById('projectionBtn').href = `/dashboard.html?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`;
        };

        function startRegistration() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; setAppState('methodSelection'); }, 800);
        }

        function setAppState(s) {
            ['methodSelection', 'action', 'groupList', 'meal', 'success'].forEach(x => {
                document.getElementById(x+'State').classList.add('state-hidden');
            });
            document.getElementById(s+'State').classList.remove('state-hidden');
        }

        function resetToHome() { setAppState('methodSelection'); }

        function prepareSearch(method, label) {
            searchMethod = method;
            document.getElementById('actionTitle').textContent = `請 輸 入 旅 客 ${label}`;
            document.getElementById('actionInput').value = '';
            setAppState('action');
        }

        async function handleAction() {
            const val = document.getElementById('actionInput').value.trim();
            if(!val) return;
            const res = await fetch(`${API_BASE}/search/${searchMethod}?${searchMethod}=${encodeURIComponent(val)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
            const json = await res.json();
            if (json.data && json.data.length > 0) {
                if(json.data.length === 1 && searchMethod !== 'company') {
                    selectedUser = json.data[0];
                    if (selectedUser.status === 'checked_in' || selectedUser.status === '已報到' || selectedUser.status === '替代') { renderArkTerminalFromUser(selectedUser); setAppState('success'); }
                    else { renderMealOptions(); }
                } else {
                    renderUserList(json.data);
                }
            } else { alert('查無資料'); }
        }

        function renderUserList(users) {
            const list = document.getElementById('groupList');
            list.innerHTML = users.map(u => {
                const name = u.name || u.company || u.company_name;
                return `<div class="group-item" style="padding:1.5rem; border-bottom:1px solid rgba(20,184,166,0.15); cursor:pointer;" onclick="selectUserFromList('${u.id || name}', '${name}')">
                    <span style="font-size:1.2rem;">${escapeHtml(name)}</span><span style="color:#14B8A6">➔</span>
                </div>`;
            }).join('');
            setAppState('groupList');
            window.tempUsers = users;
        }

        async function selectUserFromList(id, name) {
            if (searchMethod === 'company') {
                const res = await fetch(`${API_BASE}/search/company?company=${encodeURIComponent(name)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const json = await res.json();
                renderUserList(json.data);
                searchMethod = 'name';
            } else {
                selectedUser = window.tempUsers.find(u => str(u.id) === str(id));
                if (selectedUser.status === 'checked_in' || selectedUser.status === '已報到' || selectedUser.status === '替代') { renderArkTerminalFromUser(selectedUser); setAppState('success'); }
                else renderMealOptions();
            }
        }
        function str(s) { return String(s); }

        function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]); }

        function renderMealOptions() {
            document.getElementById('mealOptions').innerHTML = `
                <div style="margin-bottom:2rem; text-align:left; padding:1.2rem; background:rgba(20,184,166,0.08); border: 1px solid rgba(20,184,166,0.2); border-radius:0.6rem;">
                    <div style="font-size:0.85rem; color:rgba(20,184,166,0.7); letter-spacing:1px;">旅 客 姓 名</div>
                    <div style="font-size:1.4rem; font-weight:bold; color:#ECFEFF;">${escapeHtml(selectedUser.name)}</div>
                </div>
                <div class="two-col-grid" style="margin-bottom:2rem;">
                    <div id="btnOrig" class="verify-card cyber-card is-original-selected" onclick="toggleIdentity(true)">本 人 報 到</div>
                    <div id="btnProxy" class="verify-card cyber-card" onclick="toggleIdentity(false)">👤 替 代 報 到</div>
                </div>
                <div id="proxyForm" class="state-hidden" style="margin-bottom:2rem;"><input type="text" id="proxyName" class="cyber-input" placeholder="替代人姓名"></div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom:1.5rem;">
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '葷食')">🥩 葷食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '素食')">🥬 素食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '不需餐食')">❌ 不需餐食</div>
                </div>
                <div style="text-align:left; padding:1rem; border:1px solid rgba(20,184,166,0.2); border-radius:0.5rem;"><label><input type="checkbox" id="portraitConsent" onchange="checkMealReady()"> 我已閱讀並同意肖像授權</label></div>
            `;
            window.isOriginal = true; window.selectedMeal = null; document.getElementById('finalBtn').disabled = true;
            setAppState('meal');
        }

        function toggleIdentity(isOrig) {
            window.isOriginal = isOrig;
            document.getElementById('btnOrig').classList.toggle('is-original-selected', isOrig);
            document.getElementById('btnProxy').classList.toggle('proxy-selected', !isOrig);
            document.getElementById('proxyForm').classList.toggle('state-hidden', isOrig);
        }
        function selectMeal(el, m) {
            document.querySelectorAll('.meal-opt').forEach(x => x.classList.remove('meal-selected'));
            el.classList.add('meal-selected'); window.selectedMeal = m; checkMealReady();
        }
        function checkMealReady() { document.getElementById('finalBtn').disabled = !window.selectedMeal; }

        async function submitCheckin() {
            if(!window.selectedMeal) return;
            document.getElementById('finalBtn').disabled = true;
            const res = await fetch(`${API_BASE}/checkin/${selectedUser.id}?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ meal: window.selectedMeal, is_original: window.isOriginal, proxy_info: {name: document.getElementById('proxyName')?.value}, portrait_consent: document.getElementById('portraitConsent')?.checked })
            });
            const json = await res.json();
            if(json.success || json.error === 'already_done') {
                renderArkTerminalFromUser(json.data || selectedUser); setAppState('success');
            } else alert('報到失敗');
        }

        function renderArkTerminalFromUser(user) {
            const c = systemConfig || {};
            const name = user.name || selectedUser.name;
            const jobTitle = user.job_title || user.title || '';
            const company = user.company || user.company_name || '';
            const seat = user.seat || user.seating_chart || '現場安排';
            
            let greetingStr = `您好，${escapeHtml(name)}`;
            if (jobTitle) greetingStr += `｜${escapeHtml(jobTitle)}`;
            document.getElementById('arkGreeting').innerHTML = greetingStr;

            document.querySelector('.ark-terminal-title').textContent = c.success_title || '智匯方舟';
            document.querySelector('.ark-terminal-subtitle').textContent = c.success_subtitle || '世代共榮的數位聚合';
            document.getElementById('arkTerminalInfo').innerHTML = `<div class="ark-meta-chip"><div class="ark-meta-label">COMPANY</div><div class="ark-meta-value">${escapeHtml(company)}</div></div><div class="ark-meta-chip"><div class="ark-meta-label">SEAT / MEAL</div><div class="ark-meta-value">${escapeHtml(seat)}｜${escapeHtml(user.meal || window.selectedMeal || '未選擇')}</div></div>`;
            
            const btn = document.getElementById('successBtnAction');
            btn.textContent = c.success_btn_text || '回到首頁';
            btn.onclick = () => { if(c.success_btn_url) window.location.href=c.success_btn_url; else resetToHome(); };

            const setupCard = (id, icon, title, sub, desc, url, enabled) => {
                const card = document.getElementById(`arkCard${id}Btn`);
                if(!card) return;
                card.style.display = enabled === false ? 'none' : 'grid';
                card.querySelector('.ark-card-icon').textContent = icon;
                document.getElementById(`arkCard${id}Title`).textContent = `【${title}】`;
                document.getElementById(`arkCard${id}Sub`).textContent = sub;
                document.getElementById(`arkCard${id}Desc`).textContent = desc;
                card.onclick = () => { if(url) window.open(url, '_blank'); };
            };
            
            setupCard(1, c.map_icon||'🧭', c.map_title||'2026 產業星圖', c.map_subtitle||'領航員名冊與每攤機會', c.map_description||'A-MALL.png / Navigator Directory', c.map_url, c.map_enabled);
            setupCard(2, c.gift_icon||'🎁', c.gift_title||'活動商品專區', c.gift_subtitle||'精選伴手禮與補給品', c.gift_description||'點擊進入物資艙查看', c.gift_url, c.gift_enabled);
            setupCard(3, c.video_icon||'▶', c.video_title||'核心引擎啟動', c.video_subtitle||'智能全新數位中控系統', c.video_description||'三年經營現況影片', c.video_url, c.video_enabled);
            setupCard(4, c.flow_icon||'🕘', c.flow_title||'大會時空座標', c.flow_subtitle||'實體進化航線預載', c.flow_description||'09:30 - 17:00 航程時間軸', c.flow_url, c.flow_enabled);
        }
    </script>
</body>
