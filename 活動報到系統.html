<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧方舟 - 航空登機系統</title>

<link rel="stylesheet" href="smart-ark-theme.css">

<style>
.neon-text { color:#00e5ff; font-weight:bold; }
.panel-border { border:1px solid rgba(0,229,255,0.3); }
.cyber-card { background:rgba(10,20,35,0.8); border-radius:1rem; }
.cyber-hover:hover { transform:translateY(-3px); transition:0.3s; }
.state-hidden { display:none !important; }
</style>
</head>

<body class="circuit-background">

<div class="ark-background"></div>

<!-- HEADER -->
<header class="panel-border" style="background:rgba(10,20,35,0.85);backdrop-filter:blur(15px);">
    <div class="header-container">

        <div onclick="resetToHome()" style="cursor:pointer;color:var(--text-dark);font-weight:bold;">
            ✈️ 航班大廳
        </div>

        <div class="neon-text">BOARDING SYSTEM</div>

        <div onclick="toggleMapModal(true)"
             style="cursor:pointer;padding:4px 12px;border:1px solid var(--text-dark);border-radius:20px;">
            🗺️ 地圖導覽
        </div>

    </div>
</header>

<main>

<!-- HOME -->
<div id="homeState">

    <h1 class="neon-text title-xl" style="text-align:center;margin-bottom:2rem;">
        請選擇服務項目
    </h1>

    <div class="home-grid">

        <div class="home-card cyber-card cyber-hover"
             onclick="setAppState('methodSelection')">
            <div style="font-size:6rem;">🎫</div>
            <h2 class="title-md neon-text">辦理登機報到</h2>
            <p style="color:#aaa;">CHECK-IN</p>
        </div>

        <div class="home-card cyber-card cyber-hover"
             onclick="showProducts()">
            <div style="font-size:6rem;">🛍️</div>
            <h2 class="title-md neon-text">商品專區</h2>
            <p style="color:#aaa;">PRODUCTS</p>
        </div>

    </div>
</div>

<!-- METHOD -->
<div id="methodSelectionState" class="state-hidden">

    <button onclick="resetToHome()">← 返回</button>

    <h2 class="title-lg neon-text" style="text-align:center;">選擇驗證方式</h2>

    <div class="verify-grid">

        <div onclick="prepareSearch('name','姓名')" class="cyber-card">
            📝 姓名
        </div>

        <div onclick="prepareSearch('phone','手機')" class="cyber-card">
            📱 手機
        </div>

        <div onclick="prepareSearch('email','Email')" class="cyber-card">
            ✉️ Email
        </div>

        <div onclick="prepareSearch('company','公司')" class="cyber-card">
            🏢 公司
        </div>

    </div>
</div>

<!-- ACTION -->
<div id="actionState" class="state-hidden">

    <button onclick="setAppState('methodSelection')">← 返回</button>

    <div class="form-card p-xl cyber-card">

        <h2 id="actionTitle" class="neon-text title-lg">輸入資料</h2>

        <input id="actionInput" class="cyber-input text-xl" placeholder="輸入">

        <button onclick="handleAction()" class="cyber-button text-xl">
            搜尋
        </button>

    </div>
</div>

<!-- GROUP -->
<div id="groupListState" class="state-hidden">

    <button onclick="setAppState('action')">← 返回</button>

    <h2 id="groupName" class="neon-text title-md"></h2>

    <div id="groupList"></div>

</div>

<!-- MEAL -->
<div id="mealState" class="state-hidden">

    <button onclick="resetToHome()">← 取消</button>

    <h2 class="neon-text title-md">餐飲選擇</h2>

    <div id="mealOptions"></div>

    <button id="finalBtn" onclick="submitCheckin()" disabled class="cyber-button">
        確認
    </button>

</div>

<!-- SUCCESS -->
<div id="successState" class="state-hidden">

    <h2 class="neon-text">完成</h2>

    <div id="successInfo"></div>

    <button onclick="resetToHome()">回首頁</button>

</div>

<!-- PRODUCTS -->
<div id="productState" class="state-hidden">

    <h1 class="neon-text">商品專區</h1>

    <div id="productsGrid" class="products-grid"></div>

</div>

</main>

<script>
const API_BASE = '/api';

/* =========================
   APP STATE
========================= */

const App = {
    state:'home',
    searchMethod:'',
    selectedUser:null,
    selectedMeal:null,
    isOriginal:true,
    tempUsers:[],
    allProducts:[],
    currentCategory:'全部',
    systemConfig:null
};

/* =========================
   STATE CONTROL
========================= */

function setAppState(state){
    App.state = state;

    ['home','methodSelection','action','groupList','meal','success','product']
    .forEach(id=>{
        const el=document.getElementById(id+'State');
        if(el) el.classList.add('state-hidden');
    });

    const target=document.getElementById(state+'State');
    if(target) target.classList.remove('state-hidden');

    window.scrollTo(0,0);
}

function resetToHome(){
    setAppState('home');
}

/* =========================
   SEARCH
========================= */

function prepareSearch(m,l){
    App.searchMethod=m;
    document.getElementById('actionTitle').textContent=`輸入${l}`;
    setAppState('action');
}

async function handleAction(){
    const val=document.getElementById('actionInput').value.trim();
    if(!val) return;

    const res=await fetch(`${API_BASE}/search/${App.searchMethod}?${App.searchMethod}=${val}`);
    const json=await res.json();

    if(!json.data||json.data.length===0){
        alert('查無');
        return;
    }

    if(json.data.length===1){
        App.selectedUser=json.data[0];
        renderMealOptions();
    }else{
        App.tempUsers=json.data;
        renderUserList(json.data);
    }
}

/* =========================
   USER LIST
========================= */

function renderUserList(users){
    document.getElementById('groupList').innerHTML =
    users.map(u=>`
        <div onclick="selectUser('${u.id}')">
            ${u.name}
        </div>
    `).join('');

    setAppState('groupList');
}

function selectUser(id){
    App.selectedUser=App.tempUsers.find(u=>u.id===id);
    renderMealOptions();
}

/* =========================
   MEAL
========================= */

function renderMealOptions(){
    const opts=['葷','素','無'];

    document.getElementById('mealOptions').innerHTML=
    opts.map(m=>`
        <div onclick="selectMeal('${m}')">${m}</div>
    `).join('');

    setAppState('meal');
}

function selectMeal(m){
    App.selectedMeal=m;
    document.getElementById('finalBtn').disabled=false;
}

/* =========================
   CHECKIN
========================= */

async function submitCheckin(){
    const res=await fetch(`${API_BASE}/checkin/${App.selectedUser.id}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            meal:App.selectedMeal
        })
    });

    const json=await res.json();

    document.getElementById('successInfo').innerText =
        json.success ? '完成' : '失敗';

    setAppState('success');
}

/* =========================
   PRODUCTS
========================= */

async function showProducts(){
    setAppState('product');

    const res=await fetch(`${API_BASE}/config`);
    const config=await res.json();

    App.allProducts=config.products||[];

    document.getElementById('productsGrid').innerHTML=
    App.allProducts.map(p=>`
        <div>
            ${p.name}
        </div>
    `).join('');
}

window.onload=()=>{
    setAppState('home');
};
</script>

</body>
</html>
