<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 航空登機系統</title>
    <link rel="stylesheet" href="smart-ark-theme.css?v=9">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        /* ============================================================
           電腦版原始樣式
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; color: #fff; }
        header { padding: 1.2rem 0; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .state-hidden { display: none !important; }
        
        .verify-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 2rem; }
        .verify-card { padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; border-radius: 1rem; position: relative; }
        .verify-card.company-card { position: relative; }
        .company-card-hint { position: absolute; top: 8px; right: 12px; background: rgba(255,165,0,0.9); color: #000; padding: 0.35rem 0.7rem; border-radius: 0.35rem; font-size: 0.75rem; font-weight: bold; letter-spacing: 0.5px; }
        .form-card { max-width: 600px; margin: 0 auto; padding: 3rem; text-align: center; border-radius: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2.5rem; }
        .product-img { width: 100%; height: 220px; object-fit: contain; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--accent-gray); }
        .btn-back-nav { background: none; border: 1px solid var(--accent-gray); color: var(--text-dark); padding: 0.5rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: bold; transition: 0.3s; margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-back-nav:hover { border-color: var(--text-dark); background: rgba(0, 229, 255, 0.1); }
        .cyber-input { width: 100%; margin-bottom: 1.5rem; padding: 1.2rem; font-size: 1.2rem; }
        
        /* 議程與圓餅圖區域 */
        .agenda-section { display: grid; grid-template-columns: 1fr 1.5fr; gap: 2rem; margin: 3rem 0; }
        .pie-chart-container { background: rgba(0,0,0,0.3); border: 1px solid rgba(0,229,255,0.2); border-radius: 1rem; padding: 2rem; text-align: center; }
        .pie-chart-title { color: var(--text-dark); font-size: 1.2rem; margin-bottom: 1.5rem; font-weight: bold; }
        .pie-chart-canvas { max-width: 100%; height: 300px; }
        .agenda-container { background: rgba(0,0,0,0.3); border: 1px solid rgba(0,229,255,0.2); border-radius: 1rem; padding: 2rem; }
        .agenda-title { color: var(--text-dark); font-size: 1.2rem; margin-bottom: 1.5rem; font-weight: bold; }
        .agenda-item { display: flex; gap: 1rem; margin-bottom: 1.2rem; padding: 1rem; background: rgba(0,229,255,0.05); border-left: 3px solid var(--text-dark); border-radius: 0.5rem; }
        .agenda-time { color: var(--text-dark); font-weight: bold; min-width: 70px; }
        .agenda-event { color: #ccc; flex-grow: 1; }
        
        /* 企業展示專區 */
        .exhibitor-section { margin: 3rem 0; }
        .exhibitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .exhibitor-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(0,229,255,0.2); border-radius: 1rem; padding: 1.5rem; cursor: pointer; transition: all 0.3s; }
        .exhibitor-card:hover { border-color: var(--text-dark); background: rgba(0,229,255,0.1); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
        .exhibitor-logo { width: 100%; height: 100px; background: rgba(255,255,255,0.05); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 1rem; }
        .exhibitor-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 0.5rem; color: var(--text-dark); }
        .exhibitor-industry { font-size: 0.85rem; color: #aaa; margin-bottom: 1rem; }
        .exhibitor-desc { font-size: 0.9rem; color: #ccc; margin-bottom: 1.5rem; line-height: 1.4; }
        .exhibitor-btn { display: inline-block; background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.5); color: var(--text-dark); padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .exhibitor-btn:hover { background: rgba(0,229,255,0.2); border-color: var(--text-dark); }
        /* .cyber-button overridden by .ck-btn system above */
        .group-item { padding: 1.5rem; border-bottom: 1px solid rgba(0,229,255,0.2); cursor: pointer; transition: 0.3s; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .group-item:hover { background: rgba(0,229,255,0.1); }
        
        .meal-selected, .is-original-selected { 
            border-color: #00e5ff !important; 
            background: rgba(0, 229, 255, 0.3) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6), inset 0 0 10px rgba(0, 229, 255, 0.3) !important;
            font-weight: bold !important;
            transform: translateY(-2px);
            transition: all 0.2s ease;
        }
        .proxy-selected { 
            border-color: #ffa500 !important; 
            background: rgba(255, 165, 0, 0.25) !important;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.5) !important;
        }
        .info-box { text-align: left; padding: 1.5rem; border-radius: 1rem; margin: 1.5rem 0; background: rgba(0,0,0,0.3); }

        .success-detail-row { display: flex; justify-content: space-between; padding: 0.8rem 0; border-bottom: 1px solid rgba(0,229,255,0.1); font-size: 1rem; }
        .success-detail-row:last-child { border-bottom: none; }
        .success-detail-label { color: #aaa; font-weight: 600; }
        .success-detail-value { color: var(--text-dark); font-weight: bold; text-align: right; }
        .success-detail-value.highlight { color: #4ade80; font-size: 1.1rem; }
        .success-instruction { margin-top: 1.5rem; padding: 1rem; background: rgba(74,222,128,0.1); border-left: 3px solid #4ade80; border-radius: 0.5rem; }
        .success-instruction-title { color: #4ade80; font-weight: bold; margin-bottom: 0.5rem; }
        .success-instruction-item { color: #ccc; margin: 0.3rem 0; padding-left: 1rem; }

        /* ============================================================
           手機端專屬修復
           ============================================================ */
        @media(max-width: 768px) {
            main { padding: 1.5rem 0.6rem !important; }
            .form-card { padding: 1.5rem 1rem !important; width: 100% !important; }
            h1.neon-text { font-size: 1.6rem !important; white-space: normal !important; letter-spacing: 1px !important; text-align: center !important; margin-bottom: 1.5rem !important; }
            h2.neon-text { font-size: 1.45rem !important; margin-bottom: 1.5rem !important; }
            header { padding: 0.8rem 0 !important; }
            .verify-grid { grid-template-columns: 1fr !important; gap: 1.2rem !important; padding: 0 !important; }
            .verify-card { padding: 1.5rem 1rem !important; font-size: 1.1rem !important; }
            .verify-card > div:not(.company-card-hint) { font-size: 2.2rem !important; }
            #mealOptions > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; gap: 0.8rem !important; margin-bottom: 1.2rem !important; }
            .meal-opt, #btnOrig, #btnProxy { padding: 1.1rem 1rem !important; font-size: 1.1rem !important; }
            .cyber-input { padding: 0.9rem 1rem !important; font-size: 1.1rem !important; margin-bottom: 1rem !important; }
            .ck-btn { padding: 0.88rem 1rem !important; font-size: 1rem !important; }
            #proxyForm { padding: 1rem !important; margin-bottom: 1.2rem !important; }
            #productState > div:first-child { flex-direction: column !important; align-items: center !important; gap: 1rem !important; }
            .products-grid { grid-template-columns: 1fr !important; gap: 1.5rem !important; }
            .agenda-section { grid-template-columns: 1fr !important; gap: 1rem !important; }
            .exhibitor-grid { grid-template-columns: 1fr !important; }
            #tempMealRadioGroup { grid-template-columns: 1fr !important; gap: 0.8rem !important; }
        }

        /* ── 前台報到按鈕系統 ── */
        /* 主行動按鈕：確認驗證、確認報到 */
        .ck-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; padding: 0.95rem 1.5rem;
            font-family: inherit; font-size: 1.05rem; font-weight: 700;
            letter-spacing: 2px; border-radius: 0.75rem;
            border: 1px solid rgba(0,229,255,0.5); color: #00e5ff;
            background: rgba(0,229,255,0.08);
            cursor: pointer; transition: all 0.2s ease;
            white-space: nowrap; text-decoration: none;
        }
        .ck-btn:hover:not(:disabled) { background: rgba(0,229,255,0.18); border-color: #00e5ff; box-shadow: 0 0 16px rgba(0,229,255,0.25); }
        .ck-btn:active:not(:disabled) { transform: scale(0.98); }
        .ck-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* 強調色（最終確認登機） */
        .ck-btn-confirm {
            border-color: rgba(74,222,128,0.6); color: #4ade80;
            background: rgba(74,222,128,0.1);
            font-size: 1.1rem; letter-spacing: 3px;
        }
        .ck-btn-confirm:hover:not(:disabled) { background: rgba(74,222,128,0.22); border-color: #4ade80; box-shadow: 0 0 20px rgba(74,222,128,0.3); }

        /* 橙色（外加報到） */
        .ck-btn-warn { border-color: rgba(255,165,0,0.55); color: #ffa500; background: rgba(255,165,0,0.08); }
        .ck-btn-warn:hover:not(:disabled) { background: rgba(255,165,0,0.18); border-color: #ffa500; }

        /* 次要 / 返回 */
        .ck-btn-ghost { border-color: rgba(255,255,255,0.15); color: #888; background: transparent; }
        .ck-btn-ghost:hover:not(:disabled) { border-color: rgba(255,255,255,0.3); color: #bbb; background: rgba(255,255,255,0.05); }

        /* Header 小圓角按鈕 */
        .ck-btn-pill {
            width: auto; padding: 0.4rem 1rem;
            font-size: 0.82rem; letter-spacing: 1px;
            border-radius: 20px; border: 1px solid rgba(0,229,255,0.3);
            color: #00e5ff; background: rgba(0,229,255,0.06);
            cursor: pointer; transition: all 0.18s;
            display: inline-flex; align-items: center; gap: 0.35rem;
            font-family: inherit; font-weight: 600; text-decoration: none;
        }
        .ck-btn-pill:hover { background: rgba(0,229,255,0.15); border-color: #00e5ff; }

        /* 分類篩選標籤按鈕 */
        .ck-tag {
            padding: 0.35rem 1rem; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            border: 1px solid rgba(0,229,255,0.25); color: #aaa; background: transparent;
            cursor: pointer; transition: all 0.18s; letter-spacing: 0.5px;
            font-family: inherit;
        }
        .ck-tag:hover, .ck-tag.active { border-color: #00e5ff; color: #00e5ff; background: rgba(0,229,255,0.1); }

        @media(max-width: 768px) {
            .ck-btn { font-size: 1rem !important; padding: 0.9rem 1rem !important; letter-spacing: 1.5px !important; }
            .ck-btn-confirm { font-size: 1rem !important; }
            .ck-btn-pill { font-size: 0.78rem !important; padding: 0.35rem 0.8rem !important; }
        }


        /* 商品 / 地圖導覽 header 按鈕排列：只調整位置，不改 goToShop / toggleMapModal 功能 */
        .header-action-buttons {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            flex-shrink: 0;
        }

        @media(max-width: 768px) {
            .header-container {
                gap: 8px !important;
                padding: 0 0.75rem !important;
            }
            .header-action-buttons {
                gap: 6px !important;
            }
            .header-title-text {
                font-size: 0.95rem !important;
                letter-spacing: 1px !important;
            }
        }


        /* 儀錶板按鈕與手機 header：保持首頁一開始就能進 Dashboard，避免手機擠壓 */
        @media(max-width: 768px) {
            .header-container {
                flex-wrap: wrap !important;
                align-items: center !important;
            }
            .header-action-buttons {
                width: 100% !important;
                display: grid !important;
                grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)) !important;
                gap: 0.55rem !important;
            }
            .header-action-buttons .ck-btn-pill {
                justify-content: center !important;
                width: 100% !important;
                min-height: 38px !important;
                padding: 0.42rem 0.55rem !important;
                font-size: 0.76rem !important;
                letter-spacing: 0.5px !important;
            }
            .company-card-hint {
                top: 8px !important;
                right: 8px !important;
                padding: 0.22rem 0.48rem !important;
                font-size: 0.62rem !important;
                line-height: 1.1 !important;
                letter-spacing: 0 !important;
                border-radius: 999px !important;
                max-width: 42% !important;
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
            }
        }
    

        /* ============================================================
           最小 RWD 修正：保留原背景，只修手機溢出、儀錶板按鈕、代理人標籤
           ============================================================ */
        html, body { max-width: 100%; overflow-x: hidden; }
        body, header, main, .header-container, .verify-grid, .form-card { min-width: 0; }
        #splash-screen { max-width: 100vw; overflow: hidden; }
        .proxy-mobile { display: none; }

        @media (max-width: 768px) {
            header { padding: 0.72rem 0 !important; }
            .header-container {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 0.85rem !important;
                flex-direction: column !important;
                align-items: center !important;
                gap: 0.72rem !important;
            }
            .header-container > div:first-child {
                width: 100% !important;
                justify-content: center !important;
            }
            .header-action-buttons {
                width: 100% !important;
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                align-items: center !important;
                gap: 0.45rem !important;
                overflow: visible !important;
            }
            #dashboardBtn, #mapBtn {
                display: inline-flex !important;
            }
            .header-action-buttons .ck-btn-pill {
                width: auto !important;
                min-width: 96px !important;
                max-width: 122px !important;
                flex: 0 1 auto !important;
                justify-content: center !important;
                padding: 0.45rem 0.52rem !important;
                font-size: 0.72rem !important;
                line-height: 1.15 !important;
                letter-spacing: 0.2px !important;
                white-space: nowrap !important;
            }
            .verify-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 0.75rem !important;
            }
            .verify-card {
                min-height: 126px !important;
                padding: 0.95rem 0.5rem !important;
                overflow: hidden !important;
            }
            .verify-card > div:not(.company-card-hint) {
                font-size: 1.85rem !important;
            }
            .verify-card h3 {
                font-size: 0.92rem !important;
                letter-spacing: 0.4px !important;
                line-height: 1.25 !important;
            }
            .company-card-hint {
                top: 7px !important;
                right: 7px !important;
                width: auto !important;
                min-width: 0 !important;
                max-width: 56px !important;
                padding: 0.16rem 0.34rem !important;
                font-size: 0.52rem !important;
                line-height: 1.05 !important;
                letter-spacing: 0 !important;
                border-radius: 999px !important;
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: clip !important;
                transform: none !important;
                box-shadow: none !important;
                z-index: 2 !important;
            }
            .company-card-hint .proxy-full { display: none !important; }
            .company-card-hint .proxy-mobile { display: inline !important; }
            #methodSelectionState h2 {
                font-size: clamp(1.35rem, 5vw, 1.75rem) !important;
                letter-spacing: 0.18em !important;
                padding: 0 0.5rem !important;
            }
        }

        @media (max-width: 380px) {
            .header-action-buttons .ck-btn-pill {
                min-width: 88px !important;
                max-width: 106px !important;
                font-size: 0.66rem !important;
                padding: 0.42rem 0.32rem !important;
            }
            .verify-grid { gap: 0.55rem !important; }
            .verify-card { min-height: 112px !important; padding: 0.82rem 0.35rem !important; }
            .verify-card > div:not(.company-card-hint) { font-size: 1.55rem !important; }
            .verify-card h3 { font-size: 0.8rem !important; }
            .company-card-hint { max-width: 50px !important; font-size: 0.48rem !important; }
        }



        /* 客戶展示版訊息視窗 */
        .cx-dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 8, 20, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        .cx-dialog-box {
            width: min(92vw, 520px);
            background: linear-gradient(180deg, rgba(8,20,42,0.96), rgba(6,16,33,0.97));
            border: 1px solid rgba(0,229,255,0.28);
            border-radius: 1.2rem;
            box-shadow: 0 18px 45px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,229,255,0.08) inset;
            overflow: hidden;
        }
        .cx-dialog-header {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 1rem 1.2rem 0.5rem;
        }
        .cx-dialog-icon {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            flex-shrink: 0;
            background: rgba(0,229,255,0.14);
            color: #00e5ff;
            box-shadow: 0 0 14px rgba(0,229,255,0.18);
        }
        .cx-dialog-title-wrap { min-width: 0; }
        .cx-dialog-title {
            color: #ecfeff;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0;
        }
        .cx-dialog-subtitle {
            color: #8ddff0;
            font-size: 0.88rem;
            margin-top: 0.15rem;
        }
        .cx-dialog-body {
            padding: 0.6rem 1.2rem 1.4rem;
            color: #e6f7ff;
            line-height: 1.75;
            font-size: 1rem;
            white-space: pre-wrap;
        }
        .cx-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding: 0 1.2rem 1.2rem;
        }
        .cx-dialog-btn {
            min-width: 112px;
            border: 1px solid rgba(0,229,255,0.42);
            background: rgba(0,229,255,0.14);
            color: #dffcff;
            border-radius: 999px;
            padding: 0.78rem 1.15rem;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.18s ease;
        }
        .cx-dialog-btn:hover {
            background: rgba(0,229,255,0.24);
            box-shadow: 0 0 12px rgba(0,229,255,0.18);
        }
        .cx-dialog-box[data-type="success"] .cx-dialog-icon {
            background: rgba(74,222,128,0.16);
            color: #4ade80;
            box-shadow: 0 0 14px rgba(74,222,128,0.18);
        }
        .cx-dialog-box[data-type="success"] .cx-dialog-btn {
            background: rgba(74,222,128,0.14);
            border-color: rgba(74,222,128,0.4);
        }
        .cx-dialog-box[data-type="warning"] .cx-dialog-icon,
        .cx-dialog-box[data-type="error"] .cx-dialog-icon {
            background: rgba(255,165,0,0.16);
            color: #ffb020;
            box-shadow: 0 0 14px rgba(255,165,0,0.18);
        }
        .cx-dialog-box[data-type="warning"] .cx-dialog-btn,
        .cx-dialog-box[data-type="error"] .cx-dialog-btn {
            background: rgba(255,165,0,0.14);
            border-color: rgba(255,165,0,0.38);
        }
        @media(max-width: 640px) {
            .cx-dialog-overlay { padding: 1rem; }
            .cx-dialog-box { width: 100%; border-radius: 1rem; }
            .cx-dialog-header { padding: 0.95rem 1rem 0.45rem; }
            .cx-dialog-body { padding: 0.55rem 1rem 1.05rem; font-size: 0.95rem; }
            .cx-dialog-actions { padding: 0 1rem 1rem; }
            .cx-dialog-btn { min-width: 96px; width: 100%; }
        }



        /* 手機版專屬背景：桌機沿用原本背景，手機 / 平板改用直式圖 */
        :root {
            --ark-mobile-bg: url('smart-ark-mobile-bg.png');
        }

        @media (max-width: 768px), (orientation: portrait) and (max-width: 1024px) {
            body.circuit-background {
                background-image: var(--ark-mobile-bg) !important;
                background-size: cover !important;
                background-position: center top !important;
                background-repeat: no-repeat !important;
                background-attachment: scroll !important;
            }

            .ark-background {
                background-image: var(--ark-mobile-bg) !important;
                background-size: cover !important;
                background-position: center top !important;
                background-repeat: no-repeat !important;
                background-attachment: scroll !important;
            }

            #splash-screen {
                background-image: var(--ark-mobile-bg) !important;
                background-size: cover !important;
                background-position: center top !important;
                background-repeat: no-repeat !important;
            }
        }

        @media (max-width: 480px) {
            body.circuit-background,
            .ark-background,
            #splash-screen {
                background-position: center top !important;
            }
        }



        /* iPhone 開場頁：未開始報到時完全蓋住 header，避免上方按鈕露出 */
        #splash-screen {
            z-index: 5000 !important;
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important;
        }

        body.splash-active header,
        body.splash-active main,
        body.splash-active #banner-container {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        @media (max-width: 768px), (orientation: portrait) and (max-width: 1024px) {
            body.splash-active {
                overflow: hidden !important;
                height: 100vh !important;
                height: 100dvh !important;
            }

            body.splash-active #splash-screen {
                background-size: cover !important;
                background-position: center top !important;
            }
        }

    </style>
</head>

            </div>

    </header>

    <main>
        <div id="methodSelectionState" class="state-hidden">
            <div style="text-align:center; max-width:800px; margin: 0 auto;">
                <h2 class="neon-text" style="font-size: 2.2rem; margin-bottom:1rem;">請 選 擇 登 機 方 式</h2>
                <div class="verify-grid">
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('name', '姓名')">
                        <div style="font-size:3.5rem;">📝</div><h3 class="neon-text">姓 名 報 到</h3>
                    </div>
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('phone', '手機')">
                        <div style="font-size:3.5rem;">📱</div><h3 class="neon-text">手 機 報 到</h3>

                        <div style="font-size:3.5rem;">🏢</div><h3 class="neon-text">公 司 報 到</h3>

        <div id="actionState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('methodSelection')">← 重新選擇方式</button>
            <div class="form-card cyber-card">
                <h2 id="actionTitle" class="neon-text" style="margin-bottom: 2.5rem; font-size: 2.5rem;">登 機 驗 證</h2>
                <input type="text" id="actionInput" class="cyber-input" placeholder="請輸入資訊" style="font-size: 1.4rem;">

            <div id="tempRegistrationSection" class="form-card cyber-card state-hidden" style="margin-top: 2rem; border: 2px solid #ffa500 !important; box-shadow: 0 0 25px rgba(255, 165, 0, 0.35); background: rgba(10, 20, 35, 0.95); text-align: left;">
                <h3 style="color: #ffa500; font-size: 1.4rem; margin-bottom: 1.5rem; text-shadow: 0 0 10px rgba(255,165,0,0.4); font-weight: bold; text-align: center;">⚠️ 查無此旅客登機紀錄！是否開啟現場補位功能？</h3>
                
                <div style="margin-bottom: 1.2rem;">
                    <label style="color: #ffa500; display: block; margin-bottom: 0.4rem; font-size: 0.95rem;">旅客姓名 *</label>
                    <input type="text" id="addName" class="cyber-input" placeholder="請輸入姓名" style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 1.2rem;">

                    <input type="text" id="addPhone" class="cyber-input" placeholder="請輸入手機" style="margin-bottom: 0;">

                <div style="margin-bottom: 1.5rem;">

                        <button type="button" class="verify-card cyber-card meal-opt-temp temp-meal-selected" data-meal="葷食" onclick="selectTempMeal(this, '葷食')" style="padding: 1rem 0.5rem; font-size: 1rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">🥩 葷食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" data-meal="素食" onclick="selectTempMeal(this, '素食')" style="padding: 1rem 0.5rem; font-size: 1rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">🥬 素食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" data-meal="不需餐食" onclick="selectTempMeal(this, '不需餐食')" style="padding: 1rem 0.5rem; font-size: 1rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid var(--accent-gray); color: #fff;">❌ 不需餐食</button>

        <div id="groupListState" class="state-hidden">

            <div class="form-card cyber-card" style="max-width: 700px;">

                <div class="agenda-section">

        <div id="productState" class="state-hidden">

                <button class="ck-btn-pill ck-btn-ghost" onclick="resetToHome()" style="border-color:rgba(255,255,255,0.2); color:#888;">← 返 回</button>

    <div id="mapModal" class="state-hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center;">
        <div style="position: relative; width: 90%; height: 85vh; max-width: 1200px; display: flex; flex-direction: column;">
            <button onclick="toggleMapModal(false)" style="align-self: flex-end; margin-bottom: 10px; background: var(--text-dark); color: #000; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">✕ 關 閉 地 圖</button>
            <div style="flex-grow: 1; background: #0a1423; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent-gray); display: flex; justify-content: center; align-items: center;">
                <img id="mapDisplayImage" src="" style="width: 100%; height: 100%; object-fit: contain; display: none;">
                <iframe id="mapDisplayFrame" src="" style="width: 100%; height: 100%; border: none; display: none;"></iframe>
            </div>
        </div>
    </div>



    <div id="customerDialog" class="cx-dialog-overlay state-hidden" onclick="handleDialogOverlay(event)">
        <div id="customerDialogBox" class="cx-dialog-box" data-type="info" role="dialog" aria-modal="true" aria-labelledby="customerDialogTitle" aria-describedby="customerDialogMessage">
            <div class="cx-dialog-header">
                <div id="customerDialogIcon" class="cx-dialog-icon">ℹ️</div>
                <div class="cx-dialog-title-wrap">
                    <h3 id="customerDialogTitle" class="cx-dialog-title">系統提醒</h3>
                    <div id="customerDialogSubtitle" class="cx-dialog-subtitle">智慧方舟活動服務中心</div>
                </div>
            </div>
            <div id="customerDialogMessage" class="cx-dialog-body"></div>
            <div class="cx-dialog-actions">
                <button type="button" class="cx-dialog-btn" onclick="closeCustomerDialog()">我知道了</button>
            </div>
        </div>
    </div>


    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentSheet = urlParams.get('sheet') || '';
        const currentAdmin = urlParams.get('admin') || 'admin';
        const API_BASE = '/api';
        let searchMethod = '', selectedUser = null, systemConfig = null;
        window.allProducts = [];
        window.currentCategory = '全部';
        window.selectedTempMealChoice = '葷食'; // 臨時餐飲預設值
        let industryPieChart = null;

        const CUSTOMER_DIALOG_ICONS = {
            info: 'ℹ️',
            success: '✅',
            warning: '⚠️',
            error: '⚠️'
        };

        function showCustomerDialog(message, options = {}) {
            const dialog = document.getElementById('customerDialog');
            const box = document.getElementById('customerDialogBox');
            const titleEl = document.getElementById('customerDialogTitle');
            const subtitleEl = document.getElementById('customerDialogSubtitle');
            const messageEl = document.getElementById('customerDialogMessage');
            const iconEl = document.getElementById('customerDialogIcon');
            const type = options.type || 'info';
            titleEl.textContent = options.title || '系統提醒';
            subtitleEl.textContent = options.subtitle || '智慧方舟活動服務中心';
            messageEl.textContent = String(message || '');
            iconEl.textContent = options.icon || CUSTOMER_DIALOG_ICONS[type] || 'ℹ️';
            box.setAttribute('data-type', type);
            dialog.classList.remove('state-hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeCustomerDialog() {
            const dialog = document.getElementById('customerDialog');
            dialog.classList.add('state-hidden');
            document.body.style.overflow = '';
        }

        function handleDialogOverlay(event) {
            if (event.target && event.target.id === 'customerDialog') closeCustomerDialog();
        }


        window.onload = function() {
            if (!currentSheet) {
                fetchCurrentSheet();
            } else {
                initSystem();
            }
            setInterval(fetchCurrentSheet, 30000);
        };

        function fetchCurrentSheet() {
            fetch(`${API_BASE}/current_sheet?admin=${encodeURIComponent(currentAdmin)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const newSheet = data.current_sheet;
                        if (newSheet !== currentSheet) {
                            currentSheet = newSheet;
                            console.log("檢測到場次切換:", currentSheet);
                            initSystem();
                        }
                    }
                })
                .catch(err => console.error("輪詢場次失敗:", err));
        }

        function initSystem() {
            loadSystemConfig();
            document.title = `${currentSheet || '活動'} - 活動報到系統`;
        }

        function startRegistration() {
            const splash = document.getElementById('splash-screen');
            document.body.classList.remove('splash-active');
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => {
                splash.style.display = 'none';
                setAppState('methodSelection');
                document.getElementById('shopBtn').style.display = 'block';
            }, 800);
        }

        function goToDashboard() {
            const sheet = currentSheet || (systemConfig && systemConfig.google_sheet_name) || '活動報到名單';
            location.href = `/dashboard.html?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(sheet)}`;
        }

        function goToShop() {
            const splash = document.getElementById('splash-screen');
            if (splash && splash.style.display !== 'none') {
                splash.style.display = 'none';
            }
            showProducts();
        }

        function setAppState(s) {
            ['methodSelection', 'action', 'groupList', 'meal', 'success', 'product'].forEach(x => {
                const el = document.getElementById(x+'State');
                if(el) el.classList.add('state-hidden');
            });
            document.getElementById(s+'State').classList.remove('state-hidden');
            // 每次切換大狀態，預設把臨時額外補單區域藏起來
            hideTempSection();
            window.scrollTo(0, 0);
        }

        function resetToHome() { setAppState('methodSelection'); }
        
        function hideTempSection() {
            const tempSec = document.getElementById('tempRegistrationSection');
            if(tempSec) tempSec.classList.add('state-hidden');
        }

        // 👑 臨時額外報到餐點按鈕動態點擊變色
        function selectTempMeal(el, meal) {
            window.selectedTempMealChoice = meal;
            document.querySelectorAll('#tempMealRadioGroup .meal-opt-temp').forEach(btn => {
                btn.style.borderColor = 'var(--accent-gray)';
                btn.style.background = 'rgba(0,0,0,0.3)';
                btn.style.boxShadow = 'none';
                btn.style.color = '#fff';
            });
            el.style.borderColor = '#ffa500';
            el.style.background = 'rgba(255, 165, 0, 0.2)';
            el.style.boxShadow = '0 0 10px rgba(255, 165, 0, 0.4)';
            el.style.color = '#ffa500';
        }

        // 👑 提交臨時額外補單 API 傳送機制
        async function submitAddRegistration() {
            const data = {
                name: document.getElementById('addName').value.trim(),
                phone: document.getElementById('addPhone').value.trim(),
                company: document.getElementById('addCompany').value.trim(),
                seat: document.getElementById('addSeat').value.trim() || '現場安排',
                meal: window.selectedTempMealChoice,
                admin: currentAdmin,
                sheet: currentSheet
            };
            if(!data.name || !data.phone) return showCustomerDialog('請完整填寫學員姓名與手機核心欄位。', { title: '資料尚未完整', type: 'warning' });
            
            try {
                const res = await fetch('/api/registrations/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if(result.success) {
                    hideTempSection();
                    showCustomerDialog('臨時補單報到成功，歡迎登機。', { title: '報到成功', type: 'success' });
                    resetToHome();
                } else {
                    showCustomerDialog('報到失敗：' + result.message, { title: '作業未完成', type: 'error' });
                }
            } catch(e) { showCustomerDialog('通訊異常，暫時無法外加名單。', { title: '系統忙碌中', type: 'error' }); }
        }

        async function toggleMapModal(show) {
            const modal = document.getElementById('mapModal');
            const img = document.getElementById('mapDisplayImage');
            const frame = document.getElementById('mapDisplayFrame');
            if (show) {
                modal.classList.remove('state-hidden');
                try {
                    const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}&t=` + new Date().getTime());
                    const config = await res.json();
                    let url = config.map_image_url ? config.map_image_url.trim() : '';
                    if (url) {
                        const lowerUrl = url.toLowerCase();
                        const isImage = lowerUrl.endsWith('.png') || lowerUrl.endsWith('.jpg') || lowerUrl.endsWith('.jpeg') || lowerUrl.endsWith('.gif') || lowerUrl.endsWith('.webp') || url.startsWith('data:image/');
                        if (isImage) {
                            frame.style.display = 'none'; frame.removeAttribute('src');
                            img.src = url; img.style.display = 'block';
                        } else {
                            img.style.display = 'none'; img.removeAttribute('src');
                            frame.src = url; frame.style.display = 'block';
                        }
                    } else {
                        showCustomerDialog('目前尚未設定活動地圖，請稍後再試，或洽現場工作人員協助。', { title: '地圖尚未提供', type: 'warning' });
                        modal.classList.add('state-hidden');
                    }
                } catch(e) { modal.classList.add('state-hidden'); }
            } else {
                modal.classList.add('state-hidden'); img.removeAttribute('src'); frame.removeAttribute('src');
            }
        }

        function prepareSearch(method, label) {
            searchMethod = method;
            document.getElementById('actionTitle').textContent = `請 輸 入 旅 客 ${label}`;
            document.getElementById('actionInput').value = '';
            setAppState('action');
        }

        // 👑 核心調度：搜尋處理，查無資料全自動彈出橘色區塊並主動預填資訊
        async function handleAction() {
            const val = document.getElementById('actionInput').value.trim();
            if(!val) return;
            hideTempSection(); // 每次搜尋前先清空狀態
            
            try {
                const res = await fetch(`${API_BASE}/search/${searchMethod}?${searchMethod}=${encodeURIComponent(val)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const json = await res.json();
                if (json.data && json.data.length > 0) {
                    if (searchMethod === 'company') renderCompanyList(json.data);
                    else if (json.data.length === 1) { 
                        const u = json.data[0];
                        if (u.status === 'checked_in' || u.status === '已報到' || u.status === '替代') {
                            renderAlreadyCheckedIn(u); return;
                        }
                        selectedUser = u; 
                        renderMealOptions(); 
                    }
                    else { window.tempData = json.data; renderUserList(json.data, '搜尋結果'); }
                } else {
                    // 👑 1. 第一步：全面洗滌欄位，防止上一個人的資料殘留污染
                    document.getElementById('addName').value = '';
                    document.getElementById('addPhone').value = '';
                    document.getElementById('addCompany').value = '';
                    document.getElementById('addSeat').value = '';
                    
                    // 預設餐點洗回預設的葷食
                    const defaultMealBtn = document.querySelector('#tempMealRadioGroup [data-meal="葷食"]');
                    if(defaultMealBtn) selectTempMeal(defaultMealBtn, '葷食');

                    // 👑 2. 第二步：觸發智慧彈出，讓橘色臨時外加表單區滑現
                    document.getElementById('tempRegistrationSection').classList.remove('state-hidden');
                    
                    // 👑 3. 第三步：精準判斷！根據當前點擊的「搜尋模式」決定把關鍵字填去哪裡
                    if (searchMethod === 'company') {
                        // 🏢 如果是「公司報到」查不到，字串精確填入【公司名稱】欄位！
                        document.getElementById('addCompany').value = val;
                    } 
                    else if (searchMethod === 'phone') {
                        // 📱 如果是「手機報到」查不到，自動代入【行動電話】欄位！
                        document.getElementById('addPhone').value = val;
                    } 
                    else if (searchMethod === 'name') {
                        // 📝 如果是「姓名報到」查不到，自動代入【旅客姓名】欄位！
                        document.getElementById('addName').value = val;
                    }
                }
            } catch(e) { showCustomerDialog('通訊異常，請稍後再試。', { title: '連線提醒', type: 'error' }); }
        }   

        function renderCompanyList(companies) {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            companies.forEach(c => {
                const div = document.createElement('div'); div.className = 'group-item';
                div.innerHTML = `<span>🏢 ${c}</span><span>➔</span>`;
                div.onclick = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/search/company_members?name=${encodeURIComponent(c)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                        const json = await res.json(); renderUserList(json.data, c);
                    } catch(e) { showCustomerDialog('無法讀取公司成員資料，請稍後再試。', { title: '資料讀取失敗', type: 'error' }); }
                };
                list.appendChild(div);
            });
            document.getElementById('groupName').textContent = '請 選 擇 所 屬 公 司';
            setAppState('groupList');
        }

        function renderAlreadyCheckedIn(user) {
            document.getElementById('successTitle').textContent = '已 完 成 報 到';
            document.getElementById('successInfo').innerHTML = `
                <div class="success-detail-row">
                    <span class="success-detail-label">姓 名</span>
                    <span class="success-detail-value">${user.name || ''}</span>
                </div>
                <div class="success-detail-row">
                    <span class="success-detail-label">公 司</span>
                    <span class="success-detail-value">${user.company || '無'}</span>
                </div>
                <div class="success-detail-row">
                    <span class="success-detail-label">桌 次</span>
                    <span class="success-detail-value highlight">${user.seat || '現場安排'}</span>
                </div>
                <div class="success-detail-row">
                    <span class="success-detail-label">原報名餐食</span>
                    <span class="success-detail-value">${user.original_meal || user.meal || '未選擇'}</span>
                </div>
                <div class="success-detail-row">
                    <span class="success-detail-label">目前餐食</span>
                    <span class="success-detail-value">${user.meal || '未選擇'}</span>
                </div>
                <div class="success-instruction">
                    <div class="success-instruction-title">請持此畫面至：</div>
                    <div class="success-instruction-item">① 領識別證</div>
                    <div class="success-instruction-item">② 領禮品</div>
                </div>
            `;
            loadAgendaAndExhibitors();
            setAppState('success');
        }

        function renderUserList(users, title) {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div'); div.className = 'group-item';
                const isRegistered = (u.status === 'checked_in' || u.status === '已報到' || u.status === '替代');
                const statusTag = isRegistered ? '<span style="color:#f87171; font-weight:bold;">[已報到]</span>' : '<span>➔</span>';
                div.innerHTML = `<div><div style="font-weight:bold; font-size:1.2rem;">${u.name}</div><div style="font-size:0.9rem; color:#aaa;">${u.company}</div></div>${statusTag}`;
                div.onclick = () => {
                    if (isRegistered) { renderAlreadyCheckedIn(u); } 
                    else { selectedUser = u; renderMealOptions(); }
                };
                list.appendChild(div);
            });
            document.getElementById('groupName').textContent = title;
            setAppState('groupList');
        }

        // 👑 本人/替代報到偏好渲染：已追加「不需餐食」高階三欄整合按鈕
        async function renderMealOptions() {
            const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
            systemConfig = await res.json();
            if (!systemConfig.show_meal_options) { submitCheckin('不需要'); return; }
            
            const container = document.getElementById('mealOptions');
            container.innerHTML = `
                <div style="margin-bottom:2rem; text-align:left; padding:1rem; background:rgba(0,229,255,0.1); border-radius:0.5rem;">
                    <div style="font-size:0.9rem; color:#00e5ff;">旅 客 姓 名</div>
                    <div style="font-size:1.4rem; font-weight:bold;">${selectedUser.name}</div>
                </div>
                <div class="two-col-grid" style="margin-bottom:2rem;">
                    <div id="btnOrig" class="verify-card cyber-card is-original-selected" onclick="toggleIdentity(true)">本 人 報 到</div>
                    <div id="btnProxy" class="verify-card cyber-card" onclick="toggleIdentity(false)">替 代 報 到</div>
                </div>
                <div id="proxyForm" class="state-hidden" style="margin-bottom:2rem; text-align:left; border:1px solid #ffa500; padding:1.5rem; border-radius:1rem;">
                    <p style="color:#ffa500; margin-bottom:1rem;">請 輸 入 替 代 人 資 訊 ：</p>
                    <input type="text" id="proxyName" class="cyber-input" placeholder="替代人姓名" style="margin-bottom:0.8rem;">
                    <input type="text" id="proxyPhone" class="cyber-input" placeholder="替代人手機">
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;">
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '葷食')" style="padding:1.2rem 0.5rem; font-weight:bold;">🥩 葷食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '素食')" style="padding:1.2rem 0.5rem; font-weight:bold;">🥬 素食</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '不需餐食')" style="padding:1.2rem 0.5rem; font-weight:bold;">❌ 不需餐食</div>
                </div>
            `;
            window.selectedMeal = null; window.isOriginal = true;
            document.getElementById('finalBtn').disabled = true;
            setAppState('meal');
        }

        function toggleIdentity(isOrig) {
            window.isOriginal = isOrig;
            document.getElementById('btnOrig').classList.toggle('is-original-selected', isOrig);
            document.getElementById('btnProxy').classList.toggle('proxy-selected', !isOrig);
            document.getElementById('proxyForm').classList.toggle('state-hidden', isOrig);
            checkMealReady();
        }

        function selectMeal(el, m) {
            document.querySelectorAll('.meal-opt').forEach(x => x.classList.remove('meal-selected'));
            el.classList.add('meal-selected');
            window.selectedMeal = m; checkMealReady();
        }

        function checkMealReady() { document.getElementById('finalBtn').disabled = !window.selectedMeal; }

        async function submitCheckin(autoMeal) {
            const meal = autoMeal || window.selectedMeal;
            const proxyInfo = window.isOriginal ? {} : {
                name: document.getElementById('proxyName').value.trim(),
                phone: document.getElementById('proxyPhone').value.trim()
            };
            if (!window.isOriginal && !proxyInfo.name) { showCustomerDialog('請輸入替代人姓名。', { title: '資料尚未完整', type: 'warning' }); return; }
            
            const btn = document.getElementById('finalBtn');
            btn.disabled = true; btn.innerHTML = '<span>登 機 核 對 中 ...</span>';
            
            try {
                const res = await fetch(`${API_BASE}/checkin/${selectedUser.id}?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ meal, is_original: window.isOriginal, proxy_info: proxyInfo })
                });
                const json = await res.json();
                if (json.success) {
                    const u = json.data;
                    document.getElementById('successTitle').textContent = '報 到 成 功 ！';
                    document.getElementById('successInfo').innerHTML = `
                        <div class="success-detail-row">
                            <span class="success-detail-label">姓 名</span>
                            <span class="success-detail-value">${u.name || selectedUser.name || ''}</span>
                        </div>
                        <div class="success-detail-row">
                            <span class="success-detail-label">公 司</span>
                            <span class="success-detail-value">${u.company || selectedUser.company || '無'}</span>
                        </div>
                        <div class="success-detail-row">
                            <span class="success-detail-label">桌 次</span>
                            <span class="success-detail-value highlight">${u.seat || selectedUser.seat || '現場安排'}</span>
                        </div>
                        <div class="success-detail-row">
                            <span class="success-detail-label">原報名餐食</span>
                            <span class="success-detail-value">${u.original_meal || selectedUser.original_meal || selectedUser.meal || '未選擇'}</span>
                        </div>
                        <div class="success-detail-row">
                            <span class="success-detail-label">目前餐食</span>
                            <span class="success-detail-value">${u.meal || meal}</span>
                        </div>
                        <div class="success-instruction">
                            <div class="success-instruction-title">請持此畫面至：</div>
                            <div class="success-instruction-item">① 領識別證</div>
                            <div class="success-instruction-item">② 領禮品</div>
                        </div>
                    `;
                    loadAgendaAndExhibitors();
                    setAppState('success');
                } else {
                    if (json.error === 'already_done') { renderAlreadyCheckedIn(json.data || selectedUser); } 
                    else { showCustomerDialog('報到失敗，請稍後再試。', { title: '作業未完成', type: 'error' }); }
                    btn.disabled = false; btn.innerHTML = '<span>確 認 並 核 發 登 機 證</span>';
                }
            } catch(e) { 
                showCustomerDialog('網路異常，請稍後再試。', { title: '連線提醒', type: 'error' }); btn.disabled = false; btn.innerHTML = '<span>確 認 並 核 發 登 機 證</span>';
            }
        }

        async function loadAgendaAndExhibitors() {
            try {
                const agendaRes = await fetch(`${API_BASE}/agenda?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const agendaData = await agendaRes.json();
                renderAgenda(agendaData.data || []);

                const exhibitorRes = await fetch(`${API_BASE}/exhibitors?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const exhibitorData = await exhibitorRes.json();
                renderExhibitors(exhibitorData.exhibitors || []);
                updateIndustryPieChart(exhibitorData.industry_stats || {});
            } catch(e) {
                console.error('加載議程/企業失敗', e);
                renderAgenda([]);
                renderExhibitors([]);
                updateIndustryPieChart({});
            }
        }

        function renderAgenda(items) {
            const container = document.getElementById('agendaList');
            if (!container) return;
            if (!items.length) {
                container.innerHTML = '<div style="color:#aaa;">後台尚未設定議程，或目前無資料。</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="agenda-item">
                    <div class="agenda-time">${item.time || ''}</div>
                    <div class="agenda-event">${item.event || ''}</div>
                </div>
            `).join('');
        }

        function renderExhibitors(exhibitors) {
            const container = document.getElementById('exhibitorGrid');
            if (!container) return;
            if (!exhibitors.length) {
                container.innerHTML = '<div style="color:#aaa;">目前尚無企業展示資料。</div>';
                return;
            }
            container.innerHTML = exhibitors.map(ex => `
                <div class="exhibitor-card" onclick="viewExhibitor('${String(ex.id || '').replace(/'/g, "\'")}')">
                    <div class="exhibitor-logo">${ex.logo || '🏢'}</div>
                    <div class="exhibitor-name">${ex.name || '未命名企業'}</div>
                    <div class="exhibitor-industry">${ex.industry || '未分類'}</div>
                    <div class="exhibitor-desc">${ex.description || '暫無介紹'}</div>
                    <button class="exhibitor-btn" onclick="event.stopPropagation(); viewExhibitor('${String(ex.id || '').replace(/'/g, "\'")}')">查看詳情 →</button>
                </div>
            `).join('');
        }

        function updateIndustryPieChart(stats) {
            const canvas = document.getElementById('industryPieChart');
            if (!canvas || typeof Chart === 'undefined') return;
            const ctx = canvas.getContext('2d');
            let labels = Object.keys(stats || {});
            let data = Object.values(stats || {});
            if (!labels.length) {
                labels = ['未分類'];
                data = [1];
            }
            const colors = ['#00e5ff', '#4ade80', '#ffa500', '#f87171', '#a78bfa', '#06b6d4', '#f472b6', '#fde047'];
            if (industryPieChart) industryPieChart.destroy();
            industryPieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: 'rgba(10, 20, 35, 0.9)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#ccc', font: { size: 12 } } } }
                }
            });
        }

        function viewExhibitor(id) {
            showCustomerDialog('企業詳細資訊建置中，請稍後再查看。', { title: '企業資訊', type: 'info' });
        }

        async function showProducts() {
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const config = await res.json();
                window.allProducts = config.products || [];
                const gifts = window.allProducts.filter(p => p.isGift);
                const normals = window.allProducts.filter(p => !p.isGift);
                const giftsSection = document.getElementById('giftsSection');
                if (gifts.length > 0) {
                    giftsSection.classList.remove('state-hidden'); renderGrid('giftsGrid', gifts);
                } else giftsSection.classList.add('state-hidden');
                const categories = ['全 部', ...new Set(normals.map(p => p.category).filter(c => c))];
                const filterContainer = document.getElementById('categoryFilters');
                filterContainer.innerHTML = categories.map(c => `
                    <button class="ck-tag ${window.currentCategory === c ? 'active' : ''}" 
                         onclick="filterCategory('${c}')">${c}</button>
                `).join('');
                filterCategory(window.currentCategory); setAppState('product');
            } catch(e) { showCustomerDialog('無法載入商品資訊，請稍後再試。', { title: '商品載入失敗', type: 'error' }); }
        }

        function filterCategory(cat) {
            window.currentCategory = cat;
            document.querySelectorAll('#categoryFilters .ck-tag').forEach(btn => {
                btn.style.background = btn.textContent === cat ? 'var(--text-dark)' : 'rgba(0,229,255,0.1)';
                btn.style.color = btn.textContent === cat ? '#000' : 'var(--text-dark)';
            });
            const filtered = window.currentCategory === '全 部' ? window.allProducts.filter(p => !p.isGift) : window.allProducts.filter(p => !p.isGift && p.category === cat);
            renderGrid('productsGrid', filtered);
        }

        function renderGrid(id, items) {
            const grid = document.getElementById(id);
            grid.innerHTML = items.map(p => `
                <div class="cyber-card" style="padding:0; overflow:hidden; display:flex; flex-direction:column;">
                    ${p.image ? `<img src="${p.image}" class="product-img">` : '<div class="product-img" style="display:flex; align-items:center; justify-content:center; font-size:3rem;">📦</div>'}
                    <div style="padding:1.5rem; flex-grow:1; display:flex; flex-direction:column;">
                        <div style="color:var(--text-dark); font-size:0.8rem; margin-bottom:0.5rem;"># ${p.category || '一 般'}</div>
                        <h3 style="margin-bottom:0.8rem; font-size:1.3rem;">${p.name}</h3>
                        <p style="font-size:0.9rem; color:#ccc; margin-bottom:1.5rem; flex-grow:1;">${p.description || ''}</p>
                        ${p.link ? `<a href="${p.link}" target="_blank" class="ck-btn" style="text-decoration:none; padding:0.7rem 1rem; font-size:0.9rem; letter-spacing:1px;">立 即 查 看 →</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function loadSystemConfig() {
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                systemConfig = await res.json();
                if(systemConfig && systemConfig.google_sheet_name) {
                    document.getElementById('header-title').textContent = systemConfig.google_sheet_name.split('').join(' ');
                }
                const banner = document.getElementById('event-banner');
                if(systemConfig && systemConfig.banner_image_url) {
                    banner.src = systemConfig.banner_image_url;
                    document.getElementById('banner-container').style.display = 'block';
                } else {
                    document.getElementById('banner-container').style.display = 'none';
                }
            } catch(e) { console.error("加載設定遺失", e); }
        }
    </script>
</body>
</html>
