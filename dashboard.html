<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧方舟 — 大會投影看板</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #020c1b;
  --panel:      rgba(5,15,32,0.75);
  --card:       rgba(8,22,46,0.65);
  --accent:     #00e5ff;
  --adim:       rgba(0,229,255,0.12);
  --green:      #4ade80;
  --orange:     #ffa940;
  --red:        #f87171;
  --purple:     #a78bfa;
  --text:       #e8f4ff;
  --muted:      rgba(200,220,255,0.42);
  --border:     rgba(0,229,255,0.13);
  --glow:       0 0 18px rgba(0,229,255,0.32);
  --r:          16px;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans TC", "PingFang TC", sans-serif;
  overflow: hidden; /* 全螢幕投影不滾動 */
}

/* background mesh */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 15% 8%,  rgba(0,55,110,0.28) 0%, transparent 60%),
    radial-gradient(ellipse 55% 45% at 85% 92%, rgba(0,90,170,0.18) 0%, transparent 55%);
}

/* ═══════════════════════════════════════════
   HEADER
══════════════════════════════════════════ */
.hdr {
  position: relative; z-index: 10;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem;
  background: rgba(2,8,20,0.88);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}

.hdr-brand { display: flex; align-items: center; gap: 10px; }
.hdr-logo {
  width: 32px; height: 32px;
  border: 1.5px solid var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  box-shadow: var(--glow);
}
.hdr-name {
  font-family: "Michroma", sans-serif;
  font-size: 0.95rem; letter-spacing: 4px;
  color: var(--accent); text-shadow: var(--glow);
}
.hdr-sub { font-size: 0.70rem; color: var(--muted); letter-spacing: 2px; margin-top: 1px; }

.hdr-center {
  text-align: center;
}
.hdr-event-title {
  font-size: 1.08rem; font-weight: 900; letter-spacing: 3px;
  color: var(--text); text-shadow: 0 0 12px rgba(255,255,255,0.2);
}
.hdr-event-sub {
  font-size: 0.65rem; letter-spacing: 2.5px; color: var(--muted); margin-top: 1px;
}

.hdr-right { display: flex; align-items: center; gap: 10px; }
.live-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 1px;
  color: var(--green);
  background: rgba(74,222,128,0.09);
  border: 1px solid rgba(74,222,128,0.22);
  padding: 3px 10px; border-radius: 20px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  animation: blink 1.4s infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

.hdr-clock {
  font-family: "Michroma", sans-serif;
  font-size: 0.82rem; color: var(--accent);
  letter-spacing: 2px;
}

/* ═══════════════════════════════════════════
   KPI STRIP
══════════════════════════════════════════ */
.kpi-strip {
  position: relative; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 0; border-bottom: 1px solid var(--border);
  background: rgba(3,10,24,0.70);
}
.kpi-cell {
  padding: 0.7rem 1.5rem;
  display: flex; flex-direction: column; align-items: center;
  border-right: 1px solid var(--border);
  text-align: center;
  position: relative;
}
.kpi-cell:last-child { border-right: none; }
.kpi-cell::after {
  content: '';
  position: absolute; bottom: 0; left: 20%; right: 20%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.25;
}
.kpi-l { font-size: 0.62rem; letter-spacing: 2px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
.kpi-v {
  font-family: "Michroma", sans-serif;
  font-size: 1.9rem; font-weight: 900; line-height: 1.1;
  color: var(--accent); text-shadow: var(--glow);
}
.kpi-v.g { color: var(--green); text-shadow: 0 0 14px rgba(74,222,128,0.4); }
.kpi-v.o { color: var(--orange); text-shadow: 0 0 14px rgba(255,169,64,0.4); }
.kpi-v.r { color: var(--red); text-shadow: 0 0 14px rgba(248,113,113,0.4); }

/* ═══════════════════════════════════════════
   MAIN BODY  — 2-column
══════════════════════════════════════════ */
.body {
  position: relative; z-index: 5;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  padding: 1.1rem 1.5rem 1rem;
  /* fill remaining height after header + kpi + footer */
  height: calc(100vh - 58px - 52px - 40px);
  overflow: hidden;
}

/* ── shared panel ── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem 1.4rem;
  backdrop-filter: blur(10px);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-hdr {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-title {
  font-size: 0.88rem; font-weight: 900;
  letter-spacing: 2px; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.panel-tag { font-family: "Michroma", sans-serif; font-size: 0.62rem; letter-spacing: 1.5px; color: var(--muted); }

/* ═══════════════════════════════════════════
   LEFT — DONUT + LOG LIST
══════════════════════════════════════════ */
.left-col { gap: 1.1rem; display: grid; grid-template-rows: auto 1fr; }

/* donut panel */
.donut-panel { flex-shrink: 0; }

.donut-body {
  display: flex; align-items: center; gap: 1.5rem;
}

.donut-wrap {
  position: relative;
  width: 160px; height: 160px;
  flex-shrink: 0;
}
.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.donut-num {
  font-family: "Michroma", sans-serif;
  font-size: 1.65rem; font-weight: 900;
  color: var(--accent); text-shadow: var(--glow);
}
.donut-txt { font-size: 0.60rem; color: var(--muted); letter-spacing: 1px; margin-top: 1px; }

.legend {
  flex: 1; display: flex; flex-direction: column; gap: 0.48rem;
}
.leg-row { display: flex; align-items: center; gap: 7px; }
.leg-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.leg-name { font-size: 0.78rem; flex: 1; color: var(--text); line-height: 1.3; }
.leg-pct { font-family: "Michroma", sans-serif; font-size: 0.72rem; color: var(--muted); }
.leg-bar-wrap { flex: 1; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
.leg-bar { height: 100%; border-radius: 2px; transition: width 1s ease; }

/* log panel */
.log-panel { flex: 1; min-height: 0; }
.log-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.45rem; }
.log-scroll::-webkit-scrollbar { width: 3px; }
.log-scroll::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.18); border-radius: 3px; }

.log-item {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.022);
  border: 1px solid rgba(255,255,255,0.045);
  border-radius: 9px;
  padding: 0.65rem 0.9rem;
  flex-shrink: 0;
  transition: background 0.15s;
}
.log-item:hover { background: rgba(0,229,255,0.04); border-color: rgba(0,229,255,0.14); }
.log-name { font-weight: 700; font-size: 0.85rem; }
.log-company { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
.log-right { text-align: right; }
.log-time { font-family: "Michroma", sans-serif; font-size: 0.65rem; color: var(--muted); }
.log-badge {
  display: inline-block; margin-top: 3px;
  font-size: 0.62rem; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
}
.b-ok     { background: rgba(74,222,128,0.10); color: var(--green); border: 1px solid rgba(74,222,128,0.22); }
.b-proxy  { background: rgba(255,169,64,0.10); color: var(--orange); border: 1px solid rgba(255,169,64,0.22); }

.empty { text-align: center; padding: 2rem 0; color: var(--muted); font-size: 0.82rem; line-height: 2; }

/* ═══════════════════════════════════════════
   RIGHT — TIMELINE (vertical)
══════════════════════════════════════════ */
.timeline-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0; }
.timeline-scroll::-webkit-scrollbar { width: 3px; }
.timeline-scroll::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.18); border-radius: 3px; }

/* timeline track */
.tl-track { position: relative; padding-left: 2.2rem; display: flex; flex-direction: column; gap: 0; }

/* vertical line through items */
.tl-track::before {
  content: '';
  position: absolute; top: 14px; bottom: 14px; left: calc(2.2rem - 18px - 1px);
  width: 1px;
  background: linear-gradient(to bottom, var(--accent), rgba(0,229,255,0.1));
  opacity: 0.3;
}

.tl-item {
  position: relative;
  padding: 0 0 1.1rem 1rem;
  display: flex; flex-direction: column;
}
.tl-item:last-child { padding-bottom: 0; }

/* dot on the track line */
.tl-item::before {
  content: '';
  position: absolute;
  left: calc(-1rem - 8px);
  top: 5px;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid rgba(0,229,255,0.3);
  background: var(--bg);
  z-index: 1;
  transition: all 0.3s;
}
.tl-item.active::before {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 10px rgba(0,229,255,0.6);
  width: 12px; height: 12px;
  left: calc(-1rem - 9px);
}
.tl-item.done::before {
  border-color: var(--green);
  background: var(--green);
}

.tl-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.85rem 1.1rem;
  transition: border-color 0.2s;
}
.tl-item.active .tl-card {
  border-color: rgba(0,229,255,0.4);
  background: rgba(0,229,255,0.06);
  box-shadow: 0 0 20px rgba(0,229,255,0.08);
}
.tl-item.done .tl-card { opacity: 0.5; }

.tl-time {
  font-family: "Michroma", sans-serif;
  font-size: 0.78rem; color: var(--accent);
  letter-spacing: 1px; font-weight: 700;
  margin-bottom: 0.3rem;
}
.tl-item.done .tl-time { color: var(--green); }

.tl-title { font-size: 0.92rem; font-weight: 900; line-height: 1.45; }
.tl-sub   { font-size: 0.70rem; color: var(--muted); margin-top: 0.2rem; letter-spacing: 0.5px; }

.tl-now-badge {
  display: inline-block;
  margin-top: 0.4rem;
  font-size: 0.60rem; font-weight: 700; letter-spacing: 1px;
  padding: 2px 8px; border-radius: 20px;
  color: var(--accent);
  background: rgba(0,229,255,0.10);
  border: 1px solid rgba(0,229,255,0.25);
}

/* ═══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
.ftr {
  position: relative; z-index: 10;
  height: 40px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem;
  border-top: 1px solid var(--border);
  background: rgba(2,8,20,0.80);
  font-size: 0.65rem;
  color: var(--muted); letter-spacing: 1.5px;
}
.ftr-right { font-family: "Michroma", sans-serif; color: var(--accent); font-size: 0.68rem; }

/* ═══════════════════════════════════════════
   Responsive fallback (scroll if too small)
══════════════════════════════════════════ */
@media (max-width: 900px) {
  html, body { overflow: auto; }
  .body { grid-template-columns: 1fr; height: auto; }
  .kpi-strip { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">⛵</div>
    <div>
      <div class="hdr-name">SMART WISDOM ARK</div>
      <div class="hdr-sub">智慧方舟 · 大會即時投影看板</div>
    </div>
  </div>
  <div class="hdr-center">
    <div id="hdr-event-title" class="hdr-event-title">智慧方舟 2026</div>
    <div id="hdr-event-sub" class="hdr-event-sub">LOADING EVENT CONFIG…</div>
  </div>
  <div class="hdr-right">
    <div class="live-badge"><span class="live-dot"></span> LIVE</div>
    <div id="clock" class="hdr-clock">--:--:--</div>
  </div>
</header>

<!-- KPI STRIP -->
<div class="kpi-strip">
  <div class="kpi-cell">
    <span class="kpi-l">應到 · Total</span>
    <span id="k-total" class="kpi-v">—</span>
  </div>
  <div class="kpi-cell">
    <span class="kpi-l">已到 · Checked In</span>
    <span id="k-checked" class="kpi-v g">—</span>
  </div>
  <div class="kpi-cell">
    <span class="kpi-l">未到 · Pending</span>
    <span id="k-pending" class="kpi-v r">—</span>
  </div>
  <div class="kpi-cell">
    <span class="kpi-l">到場率 · Rate</span>
    <span id="k-rate" class="kpi-v o">—</span>
  </div>
</div>

<!-- MAIN BODY -->
<div class="body">

  <!-- ── LEFT COL ── -->
  <div class="left-col">

    <!-- Donut: industry distribution -->
    <div class="panel donut-panel">
      <div class="panel-hdr">
        <div class="panel-title"><span>🌐</span> 登艦產業生態分佈</div>
        <span class="panel-tag">INDUSTRY BREAKDOWN</span>
      </div>
      <div class="donut-body">
        <div class="donut-wrap">
          <svg id="donut-svg" viewBox="0 0 160 160" width="160" height="160" style="transform:rotate(-90deg)">
            <circle cx="80" cy="80" r="56" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="22"/>
            <!-- segments injected by JS -->
          </svg>
          <div class="donut-center">
            <div class="donut-num" id="donut-num">—</div>
            <div class="donut-txt">共戰領航員</div>
          </div>
        </div>
        <div class="legend" id="legend">
          <!-- injected by JS -->
        </div>
      </div>
    </div>

    <!-- Live check-in log -->
    <div class="panel log-panel">
      <div class="panel-hdr">
        <div class="panel-title"><span>⚡</span> 即時登機紀錄</div>
        <span id="sync-tag" class="panel-tag">● 同步中</span>
      </div>
      <div id="log-list" class="log-scroll">
        <div class="empty">🛰 等待資料同步…</div>
      </div>
    </div>

  </div><!-- /left-col -->

  <!-- ── RIGHT COL — timeline ── -->
  <div class="panel">
    <div class="panel-hdr">
      <div class="panel-title"><span>🗓</span> 大會時空座標 · 議程</div>
      <span id="agenda-date-tag" class="panel-tag">CONFERENCE TIMELINE</span>
    </div>
    <div class="timeline-scroll">
      <div class="tl-track" id="tl-track">
        <div class="empty">📡 載入議程中…</div>
      </div>
    </div>
  </div>

</div><!-- /body -->

<!-- FOOTER -->
<footer class="ftr">
  <span id="ftr-brand">SMART ARK CONTROL · 聯聖集團 © 2026</span>
  <span class="ftr-right" id="ftr-right">LOADING…</span>
</footer>

<script>
/* ══════════════════════════════════════════════
   CONFIG — read URL params (same as admin.html)
══════════════════════════════════════════════ */
const params   = new URLSearchParams(location.search);
const ADMIN    = params.get('admin') || 'admin';
let   SHEET    = params.get('sheet') || '';
const API      = '/api';

/* ══════════════════════════════════════════════
   PALETTE — for donut segments + legend
══════════════════════════════════════════════ */
const PALETTE = [
  '#00b4d8','#f72585','#7209b7','#4cc9f0','#3a0ca3',
  '#06d6a0','#ffd166','#ef476f','#118ab2','#073b4c',
];

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let state = {
  config: null,          // /api/config
  stats:  null,          // /api/dashboard_stats
  industryMap: {},       // company → industry label
  agenda: [],            // [{time, title, subtitle}]
};

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
window.onload = async () => {
  tickClock();
  setInterval(tickClock, 1000);

  if (!SHEET) {
    // try to get current sheet from server if not in URL
    try {
      const r = await fetch(`${API}/current_sheet?admin=${enc(ADMIN)}`);
      const d = await r.json();
      if (d.success && d.current_sheet) SHEET = d.current_sheet;
    } catch { /* ignore */ }
  }

  await syncAll();
  setInterval(syncAll, 15000);
};

async function syncAll() {
  await Promise.all([fetchConfig(), fetchStats()]);
  render();
}

/* ── fetch config (agenda, industry_mappings, event info) ── */
async function fetchConfig() {
  try {
    const qs = SHEET ? `?sheet=${enc(SHEET)}&admin=${enc(ADMIN)}` : `?admin=${enc(ADMIN)}`;
    const r  = await fetch(`${API}/config${qs}`);
    const d  = await r.json();
    if (d) {
      state.config = d;
      // build industry map: {company_keyword → category_label}
      state.industryMap = {};
      const mappings = d.industry_mappings || [];
      for (const m of mappings) {
        if (m.keyword && m.category) state.industryMap[m.keyword.trim()] = m.category.trim();
      }
      // agenda
      state.agenda = Array.isArray(d.agenda) ? d.agenda : [];
    }
  } catch (e) { console.warn('config fetch failed', e); }
}

/* ── fetch dashboard stats ── */
async function fetchStats() {
  try {
    const qs = SHEET ? `?sheet=${enc(SHEET)}&admin=${enc(ADMIN)}` : `?admin=${enc(ADMIN)}`;
    const r  = await fetch(`${API}/dashboard_stats${qs}`);
    const d  = await r.json();
    if (d.success) state.stats = d.stats;
    setSyncTag('● LIVE', '#4ade80');
  } catch {
    setSyncTag('● OFFLINE', '#f87171');
  }
}

/* ══════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function render() {
  renderHeader();
  renderKPIs();
  renderDonut();
  renderLogs();
  renderTimeline();
  renderFooter();
}

/* ── header event info ── */
function renderHeader() {
  const cfg = state.config;
  if (!cfg) return;
  const title = cfg.exp_event_title || cfg.event_title || '智慧方舟 2026';
  const sub   = cfg.exp_event_subtitle || cfg.event_subtitle || '世代共榮的數位聚合';
  const ds    = cfg.exp_event_date_start || cfg.date_start || '';
  const de    = cfg.exp_event_date_end   || cfg.date_end   || '';
  setText('hdr-event-title', title);
  setText('hdr-event-sub',   sub + (ds || de ? `　${ds}${de ? ' — ' + de : ''}` : ''));
  setText('agenda-date-tag', ds ? `${ds}${de ? ' → ' + de : ''}` : 'CONFERENCE TIMELINE');
  const brand = cfg.exp_brand_name || '聯聖集團';
  setText('ftr-brand', `SMART ARK CONTROL · ${brand} © 2026`);
}

/* ── KPIs ── */
function renderKPIs() {
  const s = state.stats;
  if (!s) return;
  const total   = s.total       ?? 0;
  const checked = s.checked_in  ?? 0;
  const pending = s.not_checked_in ?? (total - checked);
  const rate    = total > 0 ? Math.round(checked / total * 100) : 0;
  setText('k-total',   total);
  setText('k-checked', checked);
  setText('k-pending', pending);
  setText('k-rate',    rate + '%');
  setText('donut-num', total);
}

/* ── Donut ── */
function renderDonut() {
  const s = state.stats;
  if (!s) return;
  const logs = s.logs || [];
  const total = s.total ?? 0;

  // count by industry category using industryMap
  const counter = {};
  for (const log of logs) {
    const company = log.company || '';
    let cat = '其他';
    for (const [kw, label] of Object.entries(state.industryMap)) {
      if (company.includes(kw)) { cat = label; break; }
    }
    counter[cat] = (counter[cat] || 0) + 1;
  }

  // If no industry mappings, just show checked_in vs pending
  let segments;
  const hasMap = Object.keys(state.industryMap).length > 0 && Object.keys(counter).length > 0;
  if (hasMap) {
    segments = Object.entries(counter)
      .sort((a, b) => b[1] - a[1])
      .map(([name, count], i) => ({
        name,
        count,
        pct: total > 0 ? Math.round(count / total * 100) : 0,
        color: PALETTE[i % PALETTE.length],
      }));
  } else {
    // fallback: checked vs not checked
    const checked = s.checked_in ?? 0;
    const pending = (s.not_checked_in ?? (total - checked));
    segments = [
      { name: '已報到', count: checked, pct: total > 0 ? Math.round(checked/total*100) : 0, color: '#4ade80' },
      { name: '未報到', count: pending, pct: total > 0 ? Math.round(pending/total*100) : 0, color: '#f87171' },
    ].filter(s => s.count > 0);
  }

  drawDonut(segments, total);
  renderLegend(segments, total);
}

function drawDonut(segs, total) {
  const svg = document.getElementById('donut-svg');
  // remove old segs (keep track circle)
  svg.querySelectorAll('.ds').forEach(el => el.remove());

  const C = 2 * Math.PI * 56; // circumference
  let offset = 0;

  for (const seg of segs) {
    const len = (seg.pct / 100) * C;
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('class', 'ds');
    el.setAttribute('cx', '80'); el.setAttribute('cy', '80'); el.setAttribute('r', '56');
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', seg.color);
    el.setAttribute('stroke-width', '22');
    el.setAttribute('stroke-dasharray', `0 ${C}`);
    el.setAttribute('stroke-dashoffset', -offset);
    svg.appendChild(el);
    // animate after paint
    requestAnimationFrame(() => {
      setTimeout(() => { el.setAttribute('stroke-dasharray', `${len} ${C - len}`); el.style.transition = 'stroke-dasharray 0.9s ease'; }, 60);
    });
    offset += len;
  }
}

function renderLegend(segs, total) {
  const el = document.getElementById('legend');
  if (!segs.length) { el.innerHTML = '<div style="color:var(--muted);font-size:.8rem;">載入行業對照中…</div>'; return; }
  el.innerHTML = segs.map(s => `
    <div class="leg-row">
      <div class="leg-dot" style="background:${s.color};"></div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
          <span class="leg-name">${esc(s.name)}</span>
          <span class="leg-pct">${s.pct}%</span>
        </div>
        <div class="leg-bar-wrap">
          <div class="leg-bar" data-w="${s.pct}" style="width:0%;background:${s.color};"></div>
        </div>
      </div>
    </div>
  `).join('');
  requestAnimationFrame(() => {
    el.querySelectorAll('.leg-bar').forEach(b => {
      setTimeout(() => { b.style.width = b.dataset.w + '%'; b.style.transition = 'width 0.9s ease'; }, 120);
    });
  });
}

/* ── Logs ── */
function renderLogs() {
  const s = state.stats;
  const el = document.getElementById('log-list');
  if (!s || !s.logs || !s.logs.length) {
    el.innerHTML = '<div class="empty">🛰 尚無報到紀錄</div>';
    return;
  }
  el.innerHTML = s.logs.slice(0, 20).map(log => {
    const proxy = (log.name || '').includes('(替代)');
    const name  = esc((log.name || '').replace('(替代)', '').trim());
    const time  = esc(log.time ? log.time.slice(-8) : '—');
    const co    = esc(log.company || '個人旅客');
    return `<div class="log-item">
      <div>
        <div class="log-name">${name}</div>
        <div class="log-company">${co}</div>
      </div>
      <div class="log-right">
        <div class="log-time">${time}</div>
        <span class="log-badge ${proxy ? 'b-proxy' : 'b-ok'}">${proxy ? '替代登機' : '本人登機'}</span>
      </div>
    </div>`;
  }).join('');
}

/* ── Timeline (from agenda config) ── */
function renderTimeline() {
  const track = document.getElementById('tl-track');

  // parse agenda
  const agenda = state.agenda;

  if (!agenda.length) {
    track.innerHTML = '<div class="empty">📡 後台尚未設定議程<br>請至 admin → 議程管理 新增</div>';
    return;
  }

  // detect current session based on clock
  const nowMin = nowMinutes();
  let activeIdx = -1;
  // find the session happening now: last session whose time <= now
  for (let i = 0; i < agenda.length; i++) {
    const m = parseTime(agenda[i].time || agenda[i].start_time || '');
    if (m !== null && m <= nowMin) activeIdx = i;
  }

  track.innerHTML = agenda.map((item, i) => {
    const time  = esc(item.time || item.start_time || '');
    const title = esc(item.title || item.name || '—');
    const sub   = esc(item.subtitle || item.description || '');
    const isDone   = i < activeIdx;
    const isActive = i === activeIdx;
    return `<div class="tl-item${isActive ? ' active' : isDone ? ' done' : ''}">
      <div class="tl-card">
        <div class="tl-time">${time}</div>
        <div class="tl-title">${title}</div>
        ${sub ? `<div class="tl-sub">${sub}</div>` : ''}
        ${isActive ? '<div class="tl-now-badge">▶ 進行中</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

/* ── footer right ── */
function renderFooter() {
  const s = state.stats;
  const rate = s
    ? `到場率 ${s.total > 0 ? Math.round((s.checked_in ?? 0) / s.total * 100) : 0}%`
    : '同步中…';
  setText('ftr-right', rate);
}

/* ══════════════════════════════════════════════
   CLOCK
══════════════════════════════════════════════ */
function tickClock() {
  const now = new Date();
  setText('clock', now.toTimeString().slice(0,8));
}

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function setSyncTag(txt, color) {
  const el = document.getElementById('sync-tag');
  if (el) { el.textContent = txt; el.style.color = color; }
}
function setText(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = v ?? '—';
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function enc(v) { return encodeURIComponent(v); }

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}
function parseTime(str) {
  // accepts "09:30", "9:30", "09:30 AM" etc.
  const m = String(str).match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1]) * 60 + parseInt(m[2]);
}
