<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧方舟 Projection Dashboard</title>
<link rel="stylesheet" href="smart-ark-theme.css?v=projection-stable-stage-4">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#030916;color:#eaffff}
.ark-background{opacity:.28}

.projection-shell{
    width:100vw;
    height:100vh;
    padding:2.2vh 3vw 2.4vh;
    display:grid;
    grid-template-rows:15vh minmax(0,1fr) 15vh;
    gap:1.55vh;
    background:
      radial-gradient(circle at 52% 43%,rgba(0,229,255,.14),transparent 28%),
      linear-gradient(180deg,rgba(2,8,20,.1),rgba(2,8,20,.44));
    position:relative;
}
.projection-shell::before{
    content:"智匯方舟";
    position:absolute;
    inset:15vh 0 auto 0;
    text-align:center;
    font-size:clamp(5rem,15vw,13rem);
    font-weight:900;
    letter-spacing:.04em;
    color:rgba(170,220,230,.045);
    -webkit-text-stroke:1px rgba(0,229,255,.07);
    pointer-events:none;
    z-index:0;
}
.projection-shell>*{position:relative;z-index:1}

.projection-head{
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
}
.projection-kicker{
    font-size:clamp(1rem,1.65vw,1.75rem);
    font-weight:900;
    letter-spacing:.14em;
    color:#eaffff;
    line-height:1.05;
}
.projection-title{
    font-size:clamp(2.25rem,4.6vw,4.7rem);
    line-height:.96;
    margin:.35vh 0 .25vh;
    color:#fff;
    text-shadow:0 0 18px rgba(0,229,255,.65);
    white-space:nowrap;
}
.projection-sub{
    font-size:clamp(.72rem,1.12vw,1.22rem);
    letter-spacing:.24em;
    color:#bcefff;
    line-height:1.1;
}
#eventDate{
    color:#eaffff;
    margin-top:.45vh;
    font-size:clamp(.82rem,1.08vw,1.12rem);
    font-weight:900;
    letter-spacing:.06em;
}

.projection-grid{
    display:grid;
    grid-template-columns:minmax(0,7fr) minmax(0,5fr);
    gap:1.45vw;
    min-height:0;
}
.projection-panel{
    border-radius:1vw;
    padding:1.15vw 1.25vw;
    border:1px solid rgba(0,229,255,.24);
    background:linear-gradient(135deg,rgba(8,18,34,.76),rgba(0,31,54,.46));
    box-shadow:0 0 26px rgba(0,229,255,.11),inset 0 0 26px rgba(0,229,255,.045);
    min-height:0;
    overflow:hidden;
}
.projection-panel h2{
    margin:0 0 .9vh;
    font-size:clamp(.9rem,1.25vw,1.45rem);
    line-height:1.15;
    letter-spacing:.06em;
}

.chart-wrap{
    height:100%;
    max-height:47vh;
    position:relative;
    display:grid;
    grid-template-columns:minmax(230px,.9fr) minmax(240px,1fr);
    gap:1.2vw;
    align-items:center;
}
.chart-box{
    height:min(39vh,340px);
    min-height:250px;
    position:relative;
}
.center-total{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:48%;
    text-align:center;
    color:#fff;
    pointer-events:none;
    font-size:clamp(.7rem,.82vw,.95rem);
    line-height:1.2;
}
.center-total b{
    display:block;
    font-size:clamp(2.1rem,3.4vw,4rem);
    margin-top:.25vh;
}
.legend-grid{
    display:grid;
    gap:.85vh;
    align-content:center;
}
.legend-item{
    display:grid;
    grid-template-columns:1.1rem minmax(0,1fr) 2.8rem;
    gap:.7vw;
    align-items:center;
    color:#d9f8ff;
    font-size:clamp(.82rem,1.02vw,1.15rem);
    line-height:1.1;
}
.legend-item b{
    text-align:right;
    font-size:clamp(.95rem,1.3vw,1.55rem);
    color:#eaffff;
}
.dot{width:.75rem;height:.75rem;border-radius:.22rem;box-shadow:0 0 10px currentColor}

.timeline{
    display:grid;
    gap:.95vh;
    margin-top:.2vh;
}
.timeline-row{
    display:grid;
    grid-template-columns:4.9vw minmax(0,1fr);
    gap:.85vw;
    align-items:center;
}
.timeline-time{
    font-size:clamp(1.15rem,1.75vw,2.1rem);
    color:#00e5ff;
    font-weight:900;
    line-height:1;
    text-align:right;
}
.timeline-card{
    padding:.72vw .95vw;
    min-height:6.1vh;
    border-radius:.65vw;
    background:rgba(0,229,255,.075);
    border:1px solid rgba(0,229,255,.18);
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition:.25s ease;
}
.timeline-card b{
    font-size:clamp(.9rem,1.02vw,1.2rem);
    color:#fff;
    line-height:1.1;
}
.timeline-card span{
    display:block;
    color:#a8bdca;
    margin-top:.25vh;
    font-size:clamp(.62rem,.75vw,.82rem);
    line-height:1.15;
}
.timeline-row.active .timeline-time{color:#fff;text-shadow:0 0 14px rgba(0,229,255,.85)}
.timeline-row.active .timeline-card{
    background:linear-gradient(90deg,rgba(0,229,255,.28),rgba(0,229,255,.08));
    border-color:rgba(0,229,255,.68);
    box-shadow:0 0 24px rgba(0,229,255,.24), inset 0 0 18px rgba(0,229,255,.08);
}
.timeline-row.done .timeline-time{color:#7defff;opacity:.72}
.timeline-row.done .timeline-card{opacity:.62}

.progress-panel{
    border-radius:1vw;
    padding:1vw 1.25vw;
    border:1px solid rgba(0,229,255,.25);
    background:linear-gradient(135deg,rgba(8,18,34,.78),rgba(0,31,54,.42));
    box-shadow:0 0 26px rgba(0,229,255,.10),inset 0 0 24px rgba(0,229,255,.04);
    min-height:0;
}
.progress-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:1vw;
    margin-bottom:1vh;
}
.progress-title{
    color:#00e5ff;
    font-size:clamp(.9rem,1.15vw,1.3rem);
    font-weight:900;
    letter-spacing:.08em;
}
.progress-now{
    color:#fff;
    font-size:clamp(.8rem,1vw,1.1rem);
    font-weight:800;
    text-align:right;
}
.progress-track{
    position:relative;
    height:1.1vh;
    min-height:10px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(0,229,255,.18);
    overflow:hidden;
}
.progress-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:0%;
    background:linear-gradient(90deg,#00e5ff,#4ade80);
    box-shadow:0 0 18px rgba(0,229,255,.72);
    transition:width .5s ease;
}
.progress-marker{
    position:absolute;
    top:50%;
    width:1.2rem;
    height:1.2rem;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    border:3px solid #00e5ff;
    box-shadow:0 0 18px rgba(0,229,255,.9);
    left:0%;
    transition:left .5s ease;
}
.progress-steps{
    margin-top:.9vh;
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:.7vw;
}
.progress-step{
    text-align:center;
    color:#b8c7d1;
    font-size:clamp(.58rem,.72vw,.78rem);
    line-height:1.2;
    min-width:0;
}
.progress-step b{
    display:block;
    color:#00e5ff;
    font-size:clamp(.72rem,.95vw,1.05rem);
    margin-bottom:.1vh;
}
.progress-step.active{
    color:#fff;
    text-shadow:0 0 10px rgba(0,229,255,.7);
}
.progress-step.done{opacity:.58}

@media(max-aspect-ratio: 4/3){
    html,body{overflow:auto;height:auto}
    .projection-shell{
        height:auto;
        min-height:100vh;
        grid-template-rows:auto auto auto;
        padding:1.4rem;
    }
    .projection-title{white-space:normal}
    .projection-grid{grid-template-columns:1fr}
    .chart-wrap{grid-template-columns:1fr;height:auto;max-height:none}
    .chart-box{height:320px}
}

/* ===== 覆蓋版：壓縮上方、保留舞台、避免標題被切 ===== */
.projection-shell{
    padding:0.95vh 3vw 0 !important;
    grid-template-rows:13.8vh minmax(0,45.2vh) 10.2vh 27vh !important;
    gap:1vh !important;
    background:
      radial-gradient(circle at 50% 39%,rgba(0,229,255,.12),transparent 30%),
      radial-gradient(ellipse at 50% 92%,rgba(0,160,255,.30),transparent 38%),
      linear-gradient(180deg,rgba(3,8,20,.95),rgba(2,7,16,1)) !important;
}
.projection-shell::before{
    inset:13.5vh 0 auto 0 !important;
    font-size:clamp(5rem,13vw,11rem) !important;
    color:rgba(170,220,230,.03) !important;
}
.projection-head{padding-top:.2vh !important;}
.projection-kicker{font-size:clamp(.82rem,1.28vw,1.38rem) !important;}
.projection-title{
    font-size:clamp(1.95rem,3.65vw,4.05rem) !important;
    margin:.16vh 0 .06vh !important;
}
.projection-sub{font-size:clamp(.58rem,.88vw,.98rem) !important;}
#eventDate{font-size:clamp(.62rem,.82vw,.9rem) !important;margin-top:.2vh !important;}

.projection-grid{gap:1.25vw !important;}
.projection-panel{padding:.82vw .95vw !important;}
.projection-panel h2{font-size:clamp(.75rem,.98vw,1.08rem) !important;margin-bottom:.62vh !important;}

.chart-wrap{
    height:calc(100% - 2.3vh) !important;
    max-height:37.5vh !important;
    grid-template-columns:minmax(210px,.9fr) minmax(210px,1fr) !important;
}
.chart-box{height:min(32.5vh,292px) !important;min-height:210px !important;}
.center-total{font-size:clamp(.58rem,.68vw,.78rem) !important;}
.center-total b{font-size:clamp(1.8rem,2.55vw,3.15rem) !important;}
.legend-grid{gap:.66vh !important;}
.legend-item{
    grid-template-columns:.95rem minmax(0,1fr) 2.6rem !important;
    font-size:clamp(.68rem,.82vw,.94rem) !important;
}
.legend-item b{font-size:clamp(.78rem,1.05vw,1.2rem) !important;}
.dot{width:.68rem !important;height:.68rem !important;}

.timeline{gap:.52vh !important;}
.timeline-row{grid-template-columns:4.2vw minmax(0,1fr) !important;gap:.74vw !important;}
.timeline-time{font-size:clamp(.9rem,1.3vw,1.52rem) !important;}
.timeline-card{min-height:4.48vh !important;padding:.48vw .72vw !important;}
.timeline-card b{font-size:clamp(.72rem,.86vw,.95rem) !important;}
.timeline-card span{font-size:clamp(.5rem,.6vw,.68rem) !important;}

.progress-panel{
    padding:.62vw 1.05vw !important;
    overflow:hidden !important;
}
.progress-head{margin-bottom:.46vh !important;}
.progress-title{font-size:clamp(.72rem,.9vw,1rem) !important;}
.progress-now{
    font-size:clamp(.62rem,.78vw,.88rem) !important;
    max-width:46% !important;
    white-space:nowrap !important;
    overflow:hidden !important;
    text-overflow:ellipsis !important;
}
.progress-track{height:.76vh !important;min-height:7px !important;}
.progress-marker{width:.88rem !important;height:.88rem !important;}
.progress-steps{height:2.3vh !important;margin-top:.42vh !important;}
.progress-step{
    position:absolute !important;
    transform:translateX(-50%) !important;
    font-size:clamp(.42rem,.52vw,.6rem) !important;
    line-height:1.1 !important;
    min-width:5.2vw !important;
}
.progress-step b{font-size:clamp(.56rem,.68vw,.78rem) !important;}

/* ===== 舞台區 ===== */
.stage-area{
    position:relative;
    min-height:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    margin-top:-.2vh;
    isolation:isolate;
}
.stage-area::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:13vh;
    transform:translateX(-50%);
    width:54vw;
    height:6.2vh;
    background:linear-gradient(90deg,transparent,rgba(0,229,255,.13),transparent);
    filter:blur(5px);
    opacity:.5;
    z-index:0;
    pointer-events:none;
}
.stage-glow{
    position:absolute;
    left:50%;
    bottom:2vh;
    transform:translateX(-50%);
    width:70vw;
    height:9vh;
    border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(125,220,255,.35),rgba(0,130,255,.14) 44%,transparent 72%);
    filter:blur(1.4px);
    z-index:1;
    pointer-events:none;
}
.stage-floor{
    position:absolute;
    bottom:.25vh;
    left:50%;
    transform:translateX(-50%);
    width:62vw;
    height:7.2vh;
    border-radius:50% 50% 0 0;
    background:
      linear-gradient(180deg,rgba(65,150,220,.16),rgba(2,8,18,.9)),
      radial-gradient(ellipse at center,rgba(0,229,255,.22),transparent 64%);
    border-top:1px solid rgba(120,220,255,.32);
    box-shadow:0 -10px 34px rgba(0,160,255,.18), inset 0 8px 24px rgba(0,229,255,.055);
    z-index:2;
    pointer-events:none;
}
.stage-step{
    position:absolute;
    bottom:.8vh;
    width:19vw;
    height:4vh;
    background:linear-gradient(180deg,rgba(40,80,115,.26),rgba(4,10,20,.82));
    border-top:1px solid rgba(120,220,255,.18);
    opacity:.42;
    z-index:2;
    pointer-events:none;
}
.stage-step.left{left:12vw;transform:skewX(-18deg);}
.stage-step.right{right:12vw;transform:skewX(18deg);}
.stage-light{
    position:absolute;
    bottom:5.1vh;
    width:15vw;
    height:15.5vh;
    background:linear-gradient(180deg,rgba(150,230,255,.3),transparent);
    clip-path:polygon(47% 0,56% 0,100% 100%,0 100%);
    filter:blur(1.8px);
    opacity:.46;
    mix-blend-mode:screen;
    z-index:1;
    pointer-events:none;
}
.stage-light.left{left:33vw;transform:rotate(10deg);}
.stage-light.right{right:33vw;transform:rotate(-10deg);}
.podium{
    position:relative;
    width:clamp(108px,7.8vw,142px);
    height:clamp(112px,13.8vh,154px);
    margin-bottom:2.85vh;
    border-radius:.55rem .55rem .18rem .18rem;
    background:
      linear-gradient(180deg,rgba(8,26,46,.98),rgba(2,9,22,1)),
      radial-gradient(circle at 50% 20%,rgba(0,229,255,.22),transparent 62%);
    border:1px solid rgba(0,229,255,.4);
    box-shadow:0 0 30px rgba(0,229,255,.28),0 20px 40px rgba(0,0,0,.45),inset 0 0 24px rgba(0,229,255,.1);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#eaffff;
    text-align:center;
    z-index:10;
}
.podium::before{
    content:"";
    position:absolute;
    top:-.78rem;
    width:88%;
    height:.82rem;
    border-radius:.45rem .45rem .1rem .1rem;
    background:linear-gradient(90deg,rgba(0,229,255,.2),rgba(255,255,255,.32),rgba(0,229,255,.2));
    border:1px solid rgba(0,229,255,.32);
    box-shadow:0 0 16px rgba(0,229,255,.16);
    z-index:11;
}
.podium::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-.95vh;
    transform:translateX(-50%);
    width:118%;
    height:1.4vh;
    border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,229,255,.35),transparent 72%);
    filter:blur(.5px);
    z-index:-1;
}
.podium-logo{font-size:clamp(1.45rem,1.8vw,2rem);filter:drop-shadow(0 0 10px rgba(0,229,255,.72));}
.podium-title{margin-top:.28vh;font-size:clamp(.7rem,.86vw,.96rem);font-weight:900;letter-spacing:.08em;}
.podium-sub{margin-top:.06vh;font-size:clamp(.38rem,.46vw,.52rem);color:#9eefff;letter-spacing:.06em;}

<body class="circuit-background">

<header class="projection-head">
    <div class="projection-kicker" id="eventKicker">2026 全球面對面　智慧方舟</div>
    <h1 class="projection-title" id="projectionTitle">世代共榮的數位聚合</h1>
    <div class="projection-sub" id="projectionSub">DIGITAL CONVERGENCE FOR GENERATIONAL PROSPERITY</div>
    <div id="eventDate">2026/06/01 ~ 2026/08/XX</div>
</header>

<section class="projection-grid">
    <div class="projection-panel">
        <h2 class="neon-text">【 智匯方舟｜實時登艦產業生態分佈 】</h2>
        <div class="chart-wrap">
            <div class="chart-box">
                <canvas id="industryChart"></canvas>
                <div class="center-total">
                    <div>共戰領航員<br>TOTAL NAVIGATORS</div>
                    <b id="totalText">XXX</b>
                </div>
            </div>
            <div class="legend-grid" id="legendGrid"></div>
        </div>
    </div>

    <div class="projection-panel">
        <h2 class="neon-text">【 2026 進化航線｜大會時空座標 】</h2>
        <div class="timeline" id="timeline"></div>
    </div>
</section>

<section class="progress-panel">
    <div class="progress-head">
        <div>
            <div class="progress-title">即時議程進度｜REAL-TIME AGENDA PROGRESS</div>
            <div style="color:#9fb4c2;font-size:clamp(.62rem,.78vw,.9rem);margin-top:.2vh">依目前裝置時間自動判斷進行中議程</div>
        </div>
        <div class="progress-now" id="progressNow">目前時間 --:--｜準備啟航</div>
    </div>
    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-marker" id="progressMarker"></div>
    </div>
    <div class="progress-steps" id="progressSteps"></div>
</section>

<section class="stage-area">
    <div class="stage-light left"></div>
    <div class="stage-light right"></div>
    <div class="stage-glow"></div>
    <div class="stage-step left"></div>
    <div class="stage-step right"></div>
    <div class="stage-floor"></div>

    <div class="podium">
        <div class="podium-logo">⛴</div>
        <div class="podium-title">智匯方舟</div>
        <div class="podium-sub">SMART WISDOM ARK</div>
    </div>
</section>
</main>

<script>
const params=new URLSearchParams(location.search);
const admin=params.get('admin')||'admin';
const sheet=params.get('sheet')||'活動報到名單';
const q=`?admin=${encodeURIComponent(admin)}&sheet=${encodeURIComponent(sheet)}`;
const colors=['#00e5ff','#4ade80','#ffa500','#f87171','#a78bfa','#06b6d4','#f472b6'];

let chart;
let scheduleRows=[];
let lastDashboardSignature='';
let lastIndustrySignature='';
let lastDashboardSnapshot=null;
let lastIndustryPayload=null;

function esc(v){
    return String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]))
}
function timeToMinutes(t){
    const m=String(t||'').match(/(\d{1,2})[:：](\d{2})/);
    if(!m)return null;
    return Number(m[1])*60+Number(m[2]);
}
function nowMinutes(){
    const d=new Date();
    return d.getHours()*60+d.getMinutes();
}
function pad2(n){return String(n).padStart(2,'0')}

async function boot(){
    let cfg={};
    let sch=[];

    try{
        const r=await fetch('/api/event-config'+q);
        cfg=(await r.json()).config||{};
    }catch(e){}

    try{
        const r=await fetch('/api/schedule'+q);
        sch=(await r.json()).schedule||[];
    }catch(e){}

    renderConfig(cfg);
    renderSchedule(sch);

    // 第一次載入才建立圖表。
    await renderIndustry({force:true});

    updateProgress();
    setInterval(updateProgress,30000);

    // 不再一直重刷圓餅圖。
    // 每 15 秒只檢查總人數 / 已報到 / 未報到是否變化；
    // 沒人報到就完全不更新圖表。
    setInterval(pollDashboardChanges,15000);
}

function renderConfig(c){
    document.getElementById('eventKicker').textContent=`${c.event_title||'2026 全球面對面'}　${c.brand_name||'智慧方舟 SMART WISDOM ARK'}`;
    document.getElementById('projectionTitle').textContent=c.projection_title||c.event_subtitle||'世代共榮的數位聚合';
    document.getElementById('projectionSub').textContent=c.projection_subtitle||'DIGITAL CONVERGENCE FOR GENERATIONAL PROSPERITY';
    document.getElementById('eventDate').textContent=`${c.event_date_start||'2026/06/01'} ~ ${c.event_date_end||'2026/08/XX'}`;
}

function renderSchedule(rows){
    if(!rows.length)rows=[
        {time:'09:30',title:'報到啟航',description:'領航員迎賓報到'},
        {time:'10:00',title:'策略羅盤',description:'大師專題演講'},
        {time:'12:00',title:'方舟盛宴',description:'產業能量餐敘'},
        {time:'14:00',title:'引擎啟動',description:'戰略操盤與新品發表'},
        {time:'15:00',title:'跨世會談',description:'世代交鋒論壇'}
    ];

    scheduleRows=rows.slice(0,5).map((r,i)=>({...r,minutes:timeToMinutes(r.time),index:i})).filter(r=>r.minutes!==null);

    document.getElementById('timeline').innerHTML=scheduleRows.map(r=>`
        <div class="timeline-row" data-index="${r.index}">
            <div class="timeline-time">${esc(r.time)}</div>
            <div class="timeline-card"><b>${esc(r.title)}</b><span>${esc(r.description)}</span></div>
        </div>
    `).join('');

    renderProgressSteps();
}

function getAgendaRange(){
    const first=scheduleRows[0]?.minutes??570;
    const last=scheduleRows[scheduleRows.length-1]?.minutes??900;
    const end=last+90;
    return {first,last,end};
}

function getPercentFromMinutes(minutes){
    const {first,end}=getAgendaRange();
    const span=Math.max(1,end-first);
    return Math.max(0,Math.min(100,((minutes-first)/span)*100));
}

function renderProgressSteps(){
    document.getElementById('progressSteps').innerHTML=scheduleRows.map(r=>{
        const pct=getPercentFromMinutes(r.minutes);
        return `
            <div class="progress-step" data-index="${r.index}" style="left:${pct}%">
                <b>${esc(r.time)}</b>${esc(r.title)}
            </div>
        `;
    }).join('');
}

function findCurrentIndex(now){
    if(!scheduleRows.length)return -1;
    if(now<scheduleRows[0].minutes)return -1;
    for(let i=scheduleRows.length-1;i>=0;i--){
        if(now>=scheduleRows[i].minutes)return i;
    }
    return -1;
}

function updateProgress(){
    if(!scheduleRows.length)return;

    const now=nowMinutes();
    const d=new Date();
    const currentIndex=findCurrentIndex(now);
    const {end}=getAgendaRange();
    const pct=getPercentFromMinutes(now);

    document.getElementById('progressFill').style.width=`${pct}%`;
    document.getElementById('progressMarker').style.left=`${pct}%`;

    const current=currentIndex>=0?scheduleRows[currentIndex]:scheduleRows[0];

    let statusText;
    if(currentIndex<0){
        statusText=`目前時間 ${pad2(d.getHours())}:${pad2(d.getMinutes())}｜尚未開始`;
    }else if(now>end){
        statusText=`目前時間 ${pad2(d.getHours())}:${pad2(d.getMinutes())}｜議程已完成`;
    }else{
        statusText=`目前時間 ${pad2(d.getHours())}:${pad2(d.getMinutes())}｜進行中：${current.time} ${current.title}`;
    }

    document.getElementById('progressNow').textContent=statusText;

    document.querySelectorAll('.timeline-row,.progress-step').forEach(el=>{
        const idx=Number(el.dataset.index);
        el.classList.toggle('active',idx===currentIndex);
        el.classList.toggle('done',currentIndex>=0&&idx<currentIndex);
    });
}

function buildDashboardSignature(stats){
    if(!stats)return '';
    return [
        stats.total??0,
        stats.checked_in??0,
        stats.not_checked_in??0
    ].join('|');
}

function buildIndustrySignature(payload,dashboardStats){
    const checked=payload.checked_industry_stats||{};
    const registered=payload.registered_industry_stats||payload.industry_stats||{};
    const selected=Object.keys(checked).length?checked:registered;

    return JSON.stringify({
        total:dashboardStats?.total??null,
        checked:dashboardStats?.checked_in??null,
        data:selected
    });
}

async function getDashboardSnapshot(){
    const r=await fetch('/api/dashboard_stats'+q,{cache:'no-store'});
    const json=await r.json();
    if(!json.success)throw new Error(json.message||'dashboard_stats 讀取失敗');
    return json.stats||{};
}

async function getIndustryPayload(){
    const r=await fetch('/api/exhibitors'+q,{cache:'no-store'});
    const json=await r.json();
    if(!json.success)throw new Error(json.message||'exhibitors / industry_stats 讀取失敗');
    return json;
}

function chooseIndustryData(payload){
    const checkedStats=payload.checked_industry_stats||{};
    const registeredStats=payload.registered_industry_stats||payload.industry_stats||{};

    // 有人報到後，圓餅圖顯示「已報到者的分類比例」。
    // 尚未有人報到時，顯示總名單分類，避免畫面空白。
    if(Object.keys(checkedStats).length){
        return checkedStats;
    }
    return registeredStats;
}

function sumValues(obj){
    return Object.values(obj||{}).reduce((sum,value)=>sum+Number(value||0),0);
}

function updateIndustryChart(data,totalForCenter){
    const safeData=Object.keys(data||{}).length?data:{'未分類':Number(totalForCenter||0)||0};
    const labels=Object.keys(safeData);
    const values=labels.map(k=>Number(safeData[k]||0));

    // 中間總數維持「總名單人數」，不要因為已報到分類變化而變成已報到人數。
    const total=Number(totalForCenter||0)||sumValues(safeData)||'XXX';
    document.getElementById('totalText').textContent=total;

    document.getElementById('legendGrid').innerHTML=labels.map((label,i)=>`
        <div class="legend-item">
            <span class="dot" style="background:${colors[i%colors.length]};color:${colors[i%colors.length]}"></span>
            <span>${esc(label)}</span>
            <b>${values[i]}</b>
        </div>
    `).join('');

    const canvas=document.getElementById('industryChart');

    if(!chart){
        chart=new Chart(canvas,{
            type:'doughnut',
            data:{
                labels,
                datasets:[{
                    data:values,
                    backgroundColor:colors,
                    borderColor:'rgba(3,10,20,.92)',
                    borderWidth:3
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                cutout:'61%',
                animation:{duration:500},
                plugins:{legend:{display:false},tooltip:{enabled:true}}
            }
        });
        return;
    }

    // 不 destroy / recreate，直接更新資料，避免一直閃。
    chart.data.labels=labels;
    chart.data.datasets[0].data=values;
    chart.data.datasets[0].backgroundColor=labels.map((_,i)=>colors[i%colors.length]);
    chart.update('none');
}

async function renderIndustry({force=false}={}){
    try{
        const dashboardStats=await getDashboardSnapshot();
        const payload=await getIndustryPayload();

        const dashboardSignature=buildDashboardSignature(dashboardStats);
        const industrySignature=buildIndustrySignature(payload,dashboardStats);

        if(!force&&dashboardSignature===lastDashboardSignature&&industrySignature===lastIndustrySignature){
            return;
        }

        lastDashboardSnapshot=dashboardStats;
        lastIndustryPayload=payload;
        lastDashboardSignature=dashboardSignature;
        lastIndustrySignature=industrySignature;

        updateIndustryChart(
            chooseIndustryData(payload),
            dashboardStats.total
        );
    }catch(e){
        console.warn('產業圓餅圖更新失敗：',e);
    }
}

async function pollDashboardChanges(){
    try{
        const dashboardStats=await getDashboardSnapshot();
        const nextSignature=buildDashboardSignature(dashboardStats);

        if(!lastDashboardSignature){
            await renderIndustry({force:true});
            return;
        }

        // 沒有人報到 / 總人數沒變：不刷新圖
        if(nextSignature===lastDashboardSignature){
            return;
        }

        // 有人報到、取消報到、或匯入名單造成總人數變化：才更新圓餅圖
        await renderIndustry({force:true});
    }catch(e){
        console.warn('Dashboard 變化檢查失敗：',e);
    }
}

boot();
</script>
</body>
</html>
