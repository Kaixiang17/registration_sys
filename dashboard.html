<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 大會即時中控投影看板</title>
    <link rel="stylesheet" href="smart-ark-theme.css?v=8">
    <style>
        /* ============================================================
           大會中控台看板專屬視覺優化 (Dashboard Layout)
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.5; color: #fff; overflow-x: hidden; background-color: #030a16; }
        
        /* 頂部控制列優化 */
        .dash-header {
            padding: 1rem 2rem;
            background: rgba(6, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--accent-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dash-logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; color: var(--text-dark); }
        .dash-title-text { font-size: 1.3rem; letter-spacing: 3px; font-weight: 900; text-shadow: 0 0 10px var(--text-glow); }
        
        /* 中控台主版面 */
        .dash-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            min-height: calc(100vh - 70px);
        }

        /* 頂部核心關鍵指標數據卡片 (KPI Grid) - 優化對稱性 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }
        .stat-card {
            padding: 2rem 1.5rem;
            text-align: center;
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(10, 24, 48, 0.75), rgba(4, 12, 24, 0.85)) !important;
        }
        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .stat-value {
            font-size: clamp(2rem, 3.5vw, 3.2rem);
            font-weight: 900;
            color: #00e5ff;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            font-family: 'Michroma', sans-serif;
        }
        .stat-value-sub { color: #4ade80; text-shadow: 0 0 15px rgba(74,222,128,0.4); }
        .stat-value-warn { color: #ffa500; text-shadow: 0 0 15px rgba(255,165,0,0.4); }

        /* 中段主視窗：左右對稱排版 */
        .main-dash-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
            align-items: start;
        }

        /* 看板區塊統一毛玻璃包裝 */
        .dash-section {
            border-radius: 1.25rem;
            padding: 2rem;
            background: rgba(8, 20, 38, 0.7) !important;
        }
        .section-title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0,229,255,0.15);
            padding-bottom: 0.75rem;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 輪播與動態滾動清單優化 */
        .scroll-list-container {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        /* 隱藏滾動條但保持功能，或將其美化 */
        .scroll-list-container::-webkit-scrollbar { width: 6px; }
        .scroll-list-container::-webkit-scrollbar-track { background: transparent; }
        .scroll-list-container::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.15); border-radius: 10px; }
        .scroll-list-container::-webkit-scrollbar-thumb:hover { background: rgba(0,229,255,0.3); }

        .log-item {
            padding: 1.1rem 1.25rem;
            border-radius: 0.6rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .log-item:hover {
            background: rgba(0,229,255,0.04);
            border-color: rgba(0,229,255,0.15);
        }
        .log-user { font-weight: bold; font-size: 1.05rem; color: #fff; }
        .log-company { font-size: 0.85rem; color: #8fa0b0; margin-top: 0.15rem; }
        .log-meta { text-align: right; }
        .log-time { font-size: 0.8rem; color: rgba(255,255,255,0.35); font-family: 'Michroma', sans-serif; }
        .log-status { 
            font-size: 0.8rem; font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 20px; 
            display: inline-block; margin-top: 0.25rem;
        }
        .status-ok { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .status-proxy { background: rgba(255,165,0,0.15); color: #ffa500; border: 1px solid rgba(255,165,0,0.2); }

        /* 圖表與分析區塊外觀平衡 */
        .chart-placeholder {
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            border-radius: 0.75rem;
            border: 1px dashed rgba(0,229,255,0.15);
            color: rgba(255,255,255,0.4);
            font-size: 0.95rem;
        }

        /* 底部全寬巨型狀態區 */
        .dash-footer-panel {
            border-top: 1px solid var(--accent-gray);
            background: rgba(4, 12, 24, 0.8);
            padding: 1.2rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            border-radius: 1rem 1rem 0 0;
            margin-top: auto;
        }

        /* ============================================================
           中控台投影/螢幕 RWD 響應式優化
           ============================================================ */
        @media(max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 1.2rem; }
            .main-dash-grid { grid-template-columns: 1fr !important; gap: 2rem; }
        }
        @media(max-width: 768px) {
            .dash-header { padding: 1rem; }
            .dash-title-text { font-size: 1.05rem; letter-spacing: 1px; }
            .dash-container { padding: 1.5rem 1rem; gap: 1.5rem; }
            .stats-grid { grid-template-columns: 1fr !important; gap: 1rem; }
            .stat-card { padding: 1.5rem 1rem; }
            .dash-section { padding: 1.25rem; border-radius: 1rem; }
        }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>

    <header class="dash-header">
        <div class="dash-logo-area">
            <span style="font-size: 1.5rem;">📊</span>
            <span id="dash-board-title" class="dash-title-text">智慧方舟｜即時中控大看板</span>
        </div>
        <div>
            <button class="ck-btn-pill" onclick="refreshDashboardData()" style="border-color: rgba(0,229,255,0.4);">🔄 強制重整</button>
        </div>
    </header>

    <main class="dash-container">
        
        <section class="stats-grid" aria-label="即時統計數據">
            <div class="stat-card cyber-card">
                <div class="stat-label">TOTAL PNEUMATIC / 總旅客數</div>
                <div id="stat-total" class="stat-value">---</div>
            </div>
            <div class="stat-card cyber-card">
                <div class="stat-label">CHECKED IN / 已報到登機</div>
                <div id="stat-checked" class="stat-value stat-value-sub">---</div>
            </div>
            <div class="stat-card cyber-card">
                <div class="stat-label">STANDBY / 現場外加補位</div>
                <div id="stat-temp" class="stat-value stat-value-warn">---</div>
            </div>
            <div class="stat-card cyber-card">
                <div class="stat-label">ATTENDANCE RATE / 當前到場率</div>
                <div id="stat-rate" class="stat-value">---</div>
            </div>
        </section>

        <div class="main-dash-grid">
            
            <section class="dash-section cyber-card" style="border-left-color: #ffa500 !important;">
                <div class="section-title-area">
                    <h2 class="section-title" style="color: #ffa500;"><span style="font-size: 1.2rem;">⚡</span> 即時登機動態動態流</h2>
                    <span id="sync-indicator" style="font-size: 0.8rem; color: #ffa500; background: rgba(255,165,0,0.1); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold;">● LIVE SYNCING</span>
                </div>
                <div id="latest-logs-list" class="scroll-list-container">
                    <div class="chart-placeholder">正在連線方舟核心中樞，載入動態流...</div>
                </div>
            </section>

            <section class="dash-section cyber-card">
                <div class="section-title-area">
                    <h2 class="section-title" style="color: var(--text-dark);"><span style="font-size: 1.2rem;">🍱</span> 艙等餐飲偏好統計分析</h2>
                    <span style="font-size: 0.75rem; color: rgba(255,255,255,0.3); font-family: 'Michroma';">ANALYSIS PANEL</span>
                </div>
                <div id="meal-analysis-container" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="chart-placeholder">
                        <div style="text-align: center;">
                            <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">📊</div>
                            <div>餐食分配與座位數據分配圖表預留區</div>
                        </div>
                    </div>
                </div>
            </section>

        </div>

    </main>

    <footer class="dash-footer-panel">
        <div>SMART ARK CONTROL TERMINAL SYSTEM © 2026 聯聖集團 版權所有</div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentAdmin = urlParams.get('admin') || 'admin';
        let currentSheet = urlParams.get('sheet') || '';
        const API_BASE = '/api';

        window.onload = function() {
            if (!currentSheet) {
                fetchCurrentSheetName();
            } else {
                initDashboard();
            }
            // 每 10 秒自動同步後端核心數據
            setInterval(syncDashboardData, 10000);
        };

        function fetchCurrentSheetName() {
            fetch(`${API_BASE}/current_sheet?admin=${encodeURIComponent(currentAdmin)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.current_sheet) {
                        currentSheet = data.current_sheet;
                        initDashboard();
                    }
                })
                .catch(err => console.error("無法同步目前場次名稱:", err));
        }

        function initDashboard() {
            const titleEl = document.getElementById('dash-board-title');
            if (titleEl && currentSheet) {
                titleEl.textContent = `${currentSheet} ｜ 大會即時中控看板`;
            }
            syncDashboardData();
        }

        function refreshDashboardData() {
            const indicator = document.getElementById('sync-indicator');
            if (indicator) { indicator.textContent = '🔄 REFRESHING'; indicator.style.color = '#00e5ff'; }
            syncDashboardData();
        }

        // 核心調度：同步後台 Google 試算表與即時報到人數狀態
        async function syncDashboardData() {
            if (!currentSheet) return;
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}&t=` + new Date().getTime());
                const config = await res.json();
                
                // 這裡假設後端會回傳對應的統計資訊，若後端未包含，請依 server.py 的實際回傳欄位調整
                // 範例更新 KPI 數字
                if (config.stats) {
                    document.getElementById('stat-total').textContent = config.stats.total || 0;
                    document.getElementById('stat-checked').textContent = config.stats.checked || 0;
                    document.getElementById('stat-temp').textContent = config.stats.temp || 0;
                    document.getElementById('stat-rate').textContent = (config.stats.rate || '0') + '%';
                }

                // 異步渲染即時登機清單
                await fetchLatestLogs();

                const indicator = document.getElementById('sync-indicator');
                if (indicator) { indicator.textContent = '● LIVE SYNCING'; indicator.style.color = '#ffa500'; }
            } catch (e) {
                console.error("看板同步異常:", e);
                const indicator = document.getElementById('sync-indicator');
                if (indicator) { indicator.textContent = '● SYNC FAILED'; indicator.style.color = '#f87171'; }
            }
        }

        // 抓取最新報到名冊紀錄並渲染
        async function fetchLatestLogs() {
            try {
                // 根據真實情況向 search 或特定看板專用即時 API 索取前 20 筆報到名單
                const res = await fetch(`${API_BASE}/search/name?name=&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const json = await res.json();
                
                const container = document.getElementById('latest-logs-list');
                if (!json.data || json.data.length === 0) {
                    container.innerHTML = '<div class="chart-placeholder">目前尚無旅客完成登機報到。</div>';
                    return;
                }

                // 過濾出已報到的名單並按時間或順序排列
                const checkedUsers = json.data.filter(u => u.status === 'checked_in' || u.status === '已報到' || u.status === '替代');
                
                if (checkedUsers.length === 0) {
                    container.innerHTML = '<div class="chart-placeholder">目前尚無旅客完成登機報到。</div>';
                    return;
                }

                container.innerHTML = checkedUsers.map(u => {
                    const isProxy = u.status === '替代';
                    return `
                        <div class="log-item">
                            <div>
                                <div class="log-user">${escapeHtml(u.name)}</div>
                                <div class="log-company">${escapeHtml(u.company || '個人旅客')}</div>
                            </div>
                            <div class="log-meta">
                                <div class="log-time">${escapeHtml(u.seat || '已配位')}</div>
                                <span class="log-status ${isProxy ? 'status-proxy' : 'status-ok'}">
                                    ${isProxy ? '替代登機' : '本人登機'}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error("名單渲染失敗:", e);
            }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(ch) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
            });
        }
    </script>
</body>
</html>
