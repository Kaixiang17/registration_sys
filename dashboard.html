<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 大會即時中控投影看板</title>
    <link rel="stylesheet" href="smart-ark-theme.css?v=9">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        /* ============================================================
           大會中控台看板專屬視覺優化 (Dashboard Layout)
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", "Stick", sans-serif; }
        body { line-height: 1.5; color: #fff; overflow-x: hidden; background-color: #030a16; }
        
        .dash-header {
            padding: 1rem 2rem;
            background: rgba(6, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--accent-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dash-logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; color: var(--text-dark); }
        .dash-title-text { font-size: 1.3rem; letter-spacing: 3px; font-weight: 900; text-shadow: 0 0 10px var(--text-glow); }
        
        .dash-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            min-height: calc(100vh - 70px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }
        .stat-card {
            padding: 2rem 1.5rem;
            text-align: center;
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(10, 24, 48, 0.75), rgba(4, 12, 24, 0.85)) !important;
        }
        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .stat-value {
            font-size: clamp(2rem, 3.5vw, 3.2rem);
            font-weight: 900;
            color: #00e5ff;
            line-height: 1;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            font-family: 'Michroma', sans-serif;
        }
        .stat-value-sub { color: #4ade80; text-shadow: 0 0 15px rgba(74,222,128,0.4); }
        .stat-value-warn { color: #ffa500; text-shadow: 0 0 15px rgba(255,165,0,0.4); }

        .main-dash-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
            align-items: start;
        }

        .dash-section {
            border-radius: 1.25rem;
            padding: 2rem;
            background: rgba(8, 20, 38, 0.7) !important;
        }
        .section-title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0,229,255,0.15);
            padding-bottom: 0.75rem;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scroll-list-container {
            max-height: 580px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .scroll-list-container::-webkit-scrollbar { width: 6px; }
        .scroll-list-container::-webkit-scrollbar-track { background: transparent; }
        .scroll-list-container::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.15); border-radius: 10px; }

        .log-item {
            padding: 1.1rem 1.25rem;
            border-radius: 0.6rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .log-item:hover {
            background: rgba(0,229,255,0.04);
            border-color: rgba(0,229,255,0.15);
        }
        .log-user { font-weight: bold; font-size: 1.05rem; color: #fff; }
        .log-company { font-size: 0.85rem; color: #8fa0b0; margin-top: 0.15rem; }
        .log-meta { text-align: right; }
        .log-time { font-size: 0.8rem; color: rgba(255,255,255,0.35); font-family: 'Michroma', sans-serif; }
        .log-status { 
            font-size: 0.8rem; font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 20px; 
            display: inline-block; margin-top: 0.25rem;
        }
        .status-ok { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .status-proxy { background: rgba(255,165,0,0.15); color: #ffa500; border: 1px solid rgba(255,165,0,0.2); }

        .chart-container-box {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dash-footer-panel {
            border-top: 1px solid var(--accent-gray);
            background: rgba(4, 12, 24, 0.8);
            padding: 1.2rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            border-radius: 1rem 1rem 0 0;
            margin-top: auto;
        }

        @media(max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 1.2rem; }
            .main-dash-grid { grid-template-columns: 1fr !important; gap: 2rem; }
        }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>

    <header class="dash-header">
        <div class="dash-logo-area">
            <span style="font-size: 1.5rem;">📊</span>
            <span id="dash-board-title" class="dash-title-text">智慧方舟｜即時中控大看板</span>
        </div>
        <div>
            <button class="ck-btn-pill" onclick="refreshDashboardData()" style="border-color: rgba(0,229,255,0.4);">🔄 強制重整</button>
        </div>
    </header>

    <main class="dash-container">
        
        <section class="stats-grid" aria-label="即時統計數據">
            <div class="stat-card cyber-card">
                <div class="stat-label">TOTAL PNEUMATIC / 總旅客數</div>
                <div id="stat-total" class="stat-value">---</div>
            </div>
            <div class="stat-card cyber-card">
                <div class="stat-label">CHECKED IN / 已報到登機</div>
                <div id="stat-checked" class="stat-value stat-value-sub">---</div>
            </div>
            <div class="stat-card cyber-card">
                <div class="stat-label">STANDBY / 現場外加補位</div>
                <div id="stat-temp" class="stat-value stat-value-warn">---</div>
            </div>
            <div class="stat-card cyber-card">
                <div class="stat-label">ATTENDANCE RATE / 當前到場率</div>
                <div id="stat-rate" class="stat-value">---</div>
            </div>
        </section>

        <div class="main-dash-grid">
            
            <section class="dash-section cyber-card" style="border-left-color: #ffa500 !important;">
                <div class="section-title-area">
                    <h2 class="section-title" style="color: #ffa500;"><span style="font-size: 1.2rem;">⚡</span> 即時登機動態動態流</h2>
                    <span id="sync-indicator" style="font-size: 0.8rem; color: #ffa500; background: rgba(255,165,0,0.1); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold;">● LIVE SYNCING</span>
                </div>
                <div id="latest-logs-list" class="scroll-list-container">
                    <div style="color: rgba(0, 229, 255, 0.6); text-align:center; padding: 2rem;">📡 方舟通訊矩陣已啟動，即時登機數據鏈結中...</div>
                </div>
            </section>

            <section class="dash-section cyber-card">
                <div class="section-title-area">
                    <h2 class="section-title" style="color: var(--text-dark);"><span style="font-size: 1.2rem;">🍕</span> 已報到旅客 - 產業分類佔比</h2>
                    <span style="font-size: 0.75rem; color: rgba(255,255,255,0.3); font-family: 'Michroma';">PIE ANALYSIS</span>
                </div>
                <div id="meal-analysis-container" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="chart-container-box">
                        <canvas id="companyPieChart"></canvas>
                    </div>
                </div>
            </section>

        </div>

    </main>

    <footer class="dash-footer-panel">
        <div>SMART ARK CONTROL TERMINAL SYSTEM © 2026 聯聖集團 版權所有</div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentAdmin = urlParams.get('admin') || 'admin';
        let currentSheet = urlParams.get('sheet') || '';
        const API_BASE = '/api';
        
        let previousCheckedCount = -1;
        let companyChartInstance = null;

        Chart.register(ChartDataLabels);

        window.onload = function() {
            if (!currentSheet) { fetchCurrentSheetName(); } else { initDashboard(); }
            setInterval(checkAndSyncData, 5000);
        };

        function fetchCurrentSheetName() {
            fetch(`${API_BASE}/current_sheet?admin=${encodeURIComponent(currentAdmin)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.current_sheet) {
                        currentSheet = data.current_sheet;
                        initDashboard();
                    }
                })
                .catch(err => console.error("同步數據流序列失敗"));
        }

        function initDashboard() {
            const titleEl = document.getElementById('dash-board-title');
            if (titleEl && currentSheet) {
                titleEl.textContent = `${currentSheet} ｜ 大會即時中控看板`;
            }
            syncDashboardData(true);
        }

        function refreshDashboardData() {
            const indicator = document.getElementById('sync-indicator');
            if (indicator) { indicator.textContent = '🔄 REFRESHING'; indicator.style.color = '#00e5ff'; }
            syncDashboardData(true);
        }

        async function checkAndSyncData() {
            if (!currentSheet) return;
            try {
                const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}&t=` + new Date().getTime());
                const config = await res.json();
                
                const currentChecked = (config.stats && config.stats.checked) ? parseInt(config.stats.checked) : 0;
                
                if (currentChecked !== previousCheckedCount) {
                    previousCheckedCount = currentChecked;
                    if (config.stats) {
                        document.getElementById('stat-total').textContent = config.stats.total || 0;
                        document.getElementById('stat-checked').textContent = config.stats.checked || 0;
                        document.getElementById('stat-temp').textContent = config.stats.temp || 0;
                        document.getElementById('stat-rate').textContent = (config.stats.rate || '0') + '%';
                    }
                    await syncDashboardData(false);
                }
            } catch (e) { console.error("通道維護中"); }
        }

        async function syncDashboardData(forceRefreshCards) {
            try {
                const res = await fetch(`${API_BASE}/search/name?name=&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}&t=` + new Date().getTime());
                const json = await res.json();
                if (!json.data) return;

                const checkedUsers = json.data.filter(u => u.status === 'checked_in' || u.status === '已報到' || u.status === '替代');

                if (forceRefreshCards && forceRefreshCards === true) {
                    const totalCount = json.data.length;
                    const checkedCount = checkedUsers.length;
                    const tempCount = json.data.filter(u => u.seat === '現場安排' || (u.id && String(u.id).startsWith('temp'))).length; 
                    const rate = totalCount > 0 ? Math.round((checkedCount / totalCount) * 100) : 0;
                    
                    document.getElementById('stat-total').textContent = totalCount;
                    document.getElementById('stat-checked').textContent = checkedCount;
                    document.getElementById('stat-temp').textContent = tempCount;
                    document.getElementById('stat-rate').textContent = rate + '%';
                    previousCheckedCount = checkedCount;
                }

                renderLatestLogs(checkedUsers);
                updateCompanyPieChart(checkedUsers);

                const indicator = document.getElementById('sync-indicator');
                if (indicator) { indicator.textContent = '● LIVE SYNCING'; indicator.style.color = '#ffa500'; }
            } catch (e) {
                const indicator = document.getElementById('sync-indicator');
                if (indicator) { indicator.textContent = '● SYNC FAILED'; indicator.style.color = '#f87171'; }
            }
        }

        function renderLatestLogs(checkedUsers) {
            const container = document.getElementById('latest-logs-list');
            if (checkedUsers.length === 0) {
                /* 👑 修正預設調試文字 */
                container.innerHTML = '<div style="color: rgba(0, 229, 255, 0.5); text-align:center; padding: 4rem;">🛸 靜待第一位領航員啟航登機...</div>';
                return;
            }

            container.innerHTML = checkedUsers.map(u => {
                const isProxy = u.status === '替代';
                return `
                    <div class="log-item">
                        <div>
                            <div class="log-user">${escapeHtml(u.name)}</div>
                            <div class="log-company">${escapeHtml(u.company || '個人旅客')}</div>
                        </div>
                        <div class="log-meta">
                            <div class="log-time">${escapeHtml(u.seat || '已配位')}</div>
                            <span class="log-status ${isProxy ? 'status-proxy' : 'status-ok'}">
                                ${isProxy ? '替代登機' : '本人登機'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateCompanyPieChart(checkedUsers) {
            const ctx = document.getElementById('companyPieChart').getContext('2d');
            
            if (checkedUsers.length === 0) {
                /* 👑 修正預設調試文字 */
                renderPieChartMesh(ctx, ["方舟準備就緒"], [100], ["rgba(0, 229, 255, 0.1)"], ["rgba(0, 229, 255, 0.4)"], false);
                return;
            }

            const companyCounts = {};
            checkedUsers.forEach(u => {
                let comp = u.company ? u.company.trim() : "其他/個人旅客";
                if(!comp) comp = "其他/個人旅客";
                companyCounts[comp] = (companyCounts[comp] || 0) + 1;
            });

            const totalChecked = checkedUsers.length;
            const labels = [];
            const percentages = [];

            Object.keys(companyCounts).forEach(key => {
                labels.push(key);
                const pct = ((companyCounts[key] / totalChecked) * 100).toFixed(1);
                percentages.push(pct);
            });

            const baseColors = [
                'rgba(0, 229, 255, 0.65)', 'rgba(74, 222, 128, 0.65)', 'rgba(255, 165, 0, 0.65)',
                'rgba(168, 85, 247, 0.65)', 'rgba(244, 63, 94, 0.65)', 'rgba(234, 179, 8, 0.65)'
            ];
            const borderColors = ['#00e5ff', '#4ade80', '#ffa500', '#a855f7', '#f43f5e', '#eab308'];

            const backgroundColors = labels.map((_, i) => baseColors[i % baseColors.length]);
            const borders = labels.map((_, i) => borderColors[i % borderColors.length]);

            renderPieChartMesh(ctx, labels, percentages, backgroundColors, borders, true);
        }

        function renderPieChartMesh(ctx, labels, dataValues, bgColors, borderColors, isRealData) {
            if (companyChartInstance) { companyChartInstance.destroy(); }

            companyChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: bgColors,
                        borderColor: borderColors,
                        borderWidth: 1,
                        hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 800, easing: 'easeOutQuart' },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#fff', font: { size: 12, family: 'PingFang TC' }, padding: 15 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.label}: ${context.raw}${isRealData ? '%' : ''}`;
                                }
                            }
                        },
                        datalabels: {
                            color: '#fff',
                            font: { weight: 'bold', size: 13, family: 'Michroma' },
                            formatter: function(value) { return isRealData ? value + '%' : ''; },
                            textShadowColor: '#000',
                            textShadowBlur: 4
                        }
                    }
                }
            });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(ch) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
            });
        }
    </script>
</body>
</html>
