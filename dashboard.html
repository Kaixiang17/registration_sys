<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧方舟 · 大會投影看板</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #020c1b;
  --panel:     rgba(6, 18, 40, 0.80);
  --card:      rgba(10, 25, 50, 0.65);
  --accent:    #00e5ff;
  --adim:      rgba(0,229,255,0.12);
  --green:     #4ade80;
  --orange:    #ffa940;
  --text:      #e8f4ff;
  --muted:     rgba(200, 220, 255, 0.45);
  --border:    rgba(0, 229, 255, 0.14);
  --glow:      0 0 20px rgba(0,229,255,0.30);
  --radius:    18px;
}

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans TC", "PingFang TC", sans-serif;
  min-height: 100vh;
  line-height: 1.6;
}

/* 融合概念新圖的光暈 mesh background */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 85% 60% at 50% 10%,  rgba(0,80,160,0.32) 0%, transparent 70%),
    radial-gradient(ellipse 70% 50% at 90% 90%, rgba(0,110,210,0.22) 0%, transparent 60%);
}

/* ═══════════════════════════════
   HEADER
═══════════════════════════════ */
.hdr {
  position: sticky; top: 0; z-index: 100;
  background: rgba(2, 8, 20, 0.92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
  padding: 0 1.25rem;
}
.hdr-inner {
  max-width: 1440px; margin: 0 auto;
  height: 65px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem;
}

.hdr-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.hdr-logo {
  width: 34px; height: 34px;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  box-shadow: var(--glow);
}
.hdr-name {
  font-family: "Michroma", sans-serif;
  font-size: 0.85rem; letter-spacing: 2px;
  color: var(--accent); text-shadow: var(--glow);
}
.hdr-sub { font-size: 0.65rem; color: var(--muted); letter-spacing: 1.5px; }

.hdr-center { text-align: center; min-width: 0; flex: 1; }
.hdr-event {
  font-size: clamp(0.95rem, 2.5vw, 1.2rem);
  font-weight: 900; letter-spacing: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-dates { font-size: 0.68rem; color: var(--muted); letter-spacing: 1px; margin-top: 1px; }

.hdr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.live-pill {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.70rem; font-weight: 700; letter-spacing: 1px;
  color: var(--green);
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.22);
  padding: 4px 10px; border-radius: 20px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  animation: blink 1.4s infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }
.hdr-clock {
  font-family: "Michroma", sans-serif;
  font-size: 0.85rem; color: var(--accent); letter-spacing: 2px;
  display: none;
}

/* ═══════════════════════════════
   MAIN WRAPPER
═══════════════════════════════ */
.wrap {
  position: relative; z-index: 1;
  max-width: 1440px; margin: 0 auto;
  padding: 1.5rem 1.25rem 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr; /* 電腦版雙欄 */
  gap: 1.5rem;
  min-height: calc(100vh - 65px);
}

/* ── shared panel ── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(12px);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.panel-head {
  padding: 1.2rem 1.4rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.panel-title {
  font-size: 0.95rem; font-weight: 900;
  letter-spacing: 1.5px; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.panel-tag {
  font-family: "Michroma", sans-serif;
  font-size: 0.65rem; letter-spacing: 1px; color: var(--muted);
}

.panel-body {
  flex: 1;
  padding: 1.5rem 1.4rem;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.18); border-radius: 3px; }

/* ═══════════════════════════════
   LEFT — DONUT CHART
═══════════════════════════════ */
.donut-layout {
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}

.donut-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  flex-wrap: wrap;
}

.donut-wrap {
  position: relative;
  width: 200px; height: 200px;
  flex-shrink: 0;
}
.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.donut-num {
  font-family: "Michroma", sans-serif;
  font-size: 2.4rem; font-weight: 900;
  color: var(--accent); text-shadow: var(--glow);
  line-height: 1;
}
.donut-lbl { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; margin-top: 4px; }

/* legend list */
.legend { 
  display: flex; 
  flex-direction: column; 
  gap: 0.75rem; 
  flex: 1;
  min-width: 160px; 
}
.leg { display: flex; align-items: center; gap: 10px; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-name { font-size: 0.85rem; color: var(--text); flex: 1; line-height: 1.35; }
.leg-num  { font-family: "Michroma", sans-serif; font-size: 0.75rem; color: var(--muted); }

/* bar list */
.bars { display: flex; flex-direction: column; gap: 0.75rem; }
.bar-row { display: flex; flex-direction: column; gap: 0.35rem; }
.bar-meta { display: flex; justify-content: space-between; align-items: center; }
.bar-name { font-size: 0.8rem; font-weight: 700; }
.bar-pct  { font-family: "Michroma", sans-serif; font-size: 0.75rem; color: var(--muted); }
.bar-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 3px; width: 0; transition: width 1.1s cubic-bezier(.4,0,.2,1); }

.empty-state { text-align: center; padding: 3rem 0; color: var(--muted); font-size: 0.85rem; line-height: 2; }

/* ═══════════════════════════════
   RIGHT — AGENDA (vertical)
═══════════════════════════════ */
.tl-list { display: flex; flex-direction: column; }

.tl-item {
  display: flex;
  gap: 1.25rem;
  padding: 1rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  position: relative;
}
.tl-item:last-child { border-bottom: none; }

/* vertical line */
.tl-item::before {
  content: '';
  position: absolute;
  left: 50px; top: 0; bottom: 0;
  width: 1px;
  background: var(--border);
}
.tl-item:first-child::before { top: 50%; }
.tl-item:last-child::before  { bottom: 50%; }

/* time column */
.tl-time-col {
  width: 50px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding-top: 4px;
}
.tl-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid rgba(0,229,255,0.25);
  background: var(--bg);
  z-index: 1; flex-shrink: 0;
  transition: all 0.3s;
}
.tl-item.active .tl-dot {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 10px rgba(0,229,255,0.55);
  width: 12px; height: 12px;
}
.tl-item.done .tl-dot { border-color: var(--green); background: var(--green); }

.tl-time {
  font-family: "Michroma", sans-serif;
  font-size: 0.75rem; color: var(--muted);
  letter-spacing: 0.5px; margin-top: 2px;
  text-align: center;
}
.tl-item.active .tl-time { color: var(--accent); font-weight: bold; }
.tl-item.done   .tl-time { color: var(--green); }

/* card */
.tl-card {
  flex: 1; min-width: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  transition: border-color 0.2s;
}
.tl-item.active .tl-card {
  border-color: rgba(0,229,255,0.40);
  background: rgba(0,229,255,0.06);
  box-shadow: 0 0 18px rgba(0,229,255,0.08);
}
.tl-item.done .tl-card { opacity: 0.45; }

.tl-title { font-size: 0.95rem; font-weight: 900; line-height: 1.45; }
.tl-sub   { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
.tl-now {
  display: inline-block; margin-top: 0.5rem;
  font-size: 0.65rem; font-weight: 700; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 20px;
  color: var(--accent);
  background: rgba(0,229,255,0.10);
  border: 1px solid rgba(0,229,255,0.25);
}

/* ═══════════════════════════════
   FOOTER
═══════════════════════════════ */
.ftr {
  position: relative; z-index: 10;
  border-top: 1px solid var(--border);
  background: rgba(2,8,20,0.85);
  padding: 0.8rem 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.68rem; color: var(--muted); letter-spacing: 1px;
}
.ftr-right { font-family: "Michroma", sans-serif; color: var(--accent); font-size: 0.7rem; }

/* ═══════════════════════════════
   手機/平板 RWD 響應式優化設計
═══════════════════════════════ */
@media (min-width: 900px) {
  .hdr-clock { display: block; }
}

@media (max-width: 768px) {
  .hdr-brand { gap: 6px; }
  .hdr-logo { width: 30px; height: 30px; font-size: 0.9rem; }
  .hdr-name { letter-spacing: 1px; font-size: 0.78rem; }
  .hdr-sub  { display: none; }
  .hdr-event { font-size: 0.9rem; letter-spacing: 1px; }

  /* 關鍵：手機版強制轉換成單欄，填滿螢幕 */
  .wrap {
    grid-template-columns: 1fr;
    padding: 1rem 0.75rem 1.5rem;
    gap: 1.25rem;
    min-height: unset;
  }

  .panel-head { padding: 1rem 1.2rem 0.85rem; }
  .panel-body { padding: 1.25rem 1.2rem; }

  .donut-wrap { width: 170px; height: 170px; }
  .donut-num  { font-size: 2rem; }

  .donut-row { gap: 1.5rem; }
  .legend { gap: 0.6rem; width: 100%; }
  
  .tl-item::before { left: 44px; }
  .tl-time-col { width: 44px; }
  .tl-time { font-size: 0.7rem; }
  .tl-card { padding: 0.85rem; }
  .tl-title { font-size: 0.9rem; }
}

@media (max-width: 480px) {
  /* 極小手機螢幕時，將圓餅圖與標籤清單強制轉垂直，避免擠壓跑版 */
  .donut-row { flex-direction: column; align-items: center; gap: 1.25rem; }
  .legend { width: 100%; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-brand">
      <div class="hdr-logo">⛵</div>
      <div>
        <div class="hdr-name">SMART WISDOM ARK</div>
        <div class="hdr-sub">智慧方舟 · 大會投影看板</div>
      </div>
    </div>
    <div class="hdr-center">
      <div id="hdr-event" class="hdr-event">智慧方舟 2026</div>
      <div id="hdr-dates" class="hdr-dates">載入中…</div>
    </div>
    <div class="hdr-right">
      <div class="live-pill"><span class="live-dot"></span>LIVE</div>
      <div id="clock" class="hdr-clock">--:--:--</div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">🌐 登艦產業生態分佈</div>
      <span class="panel-tag" id="donut-tag">INDUSTRY ANALYSIS</span>
    </div>
    <div class="panel-body">
      <div class="donut-layout">

        <div class="donut-row">
          <div class="donut-wrap">
            <svg id="donut-svg" viewBox="0 0 200 200" width="200" height="200"
                 style="transform:rotate(-90deg); display:block;">
              <circle cx="100" cy="100" r="70" fill="none"
                      stroke="rgba(255,255,255,0.05)" stroke-width="28"/>
            </svg>
            <div class="donut-center">
              <div class="donut-num" id="donut-num">—</div>
              <div class="donut-lbl">共戰領航員</div>
            </div>
          </div>
          <div class="legend" id="legend">
            <div class="empty-state" style="padding:1rem 0;">📡 載入中…</div>
          </div>
        </div>

        <div class="bars" id="bars">
          </div>

      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">🗓 大會議程</div>
      <span id="agenda-tag" class="panel-tag">TIMELINE</span>
    </div>
    <div class="panel-body">
      <div class="tl-list" id="tl-list">
        <div class="empty-state">📡 載入議程中…</div>
      </div>
    </div>
  </div>

</div>

<footer class="ftr">
  <span id="ftr-left">SMART ARK CONTROL · 聯聖集團 © 2026</span>
  <span id="ftr-right" class="ftr-right">同步中…</span>
</footer>

<script>
const urlParams  = new URLSearchParams(location.search);
let    currentSheet = urlParams.get('sheet') || '';
const currentAdmin = urlParams.get('admin') || 'admin';
const API_BASE     = '/api';

const PALETTE = [
  '#00e5ff','#f72585','#7209b7','#4cc9f0','#3a0ca3',
  '#06d6a0','#ffd166','#ef476f','#118ab2','#a78bfa',
];

let cfg    = null;
let stats  = null;
let lastCheckinSignature = '';
let lastCheckedCount = -1;
let industryRenderedOnce = false;
let checkinWatcher = null;
let dashboardChannel = null;

window.onload = async () => {
  tickClock();
  setInterval(tickClock, 1000);

  if (!currentSheet) {
    try {
      const r = await fetch(`${API_BASE}/current_sheet?admin=${enc(currentAdmin)}`);
      const d = await r.json();
      if (d.success && d.current_sheet) currentSheet = d.current_sheet;
    } catch {}
  }

  await loadConfig();
  await loadStats();

  renderHeader();
  renderTimeline();
  renderFooter();
  renderDonut({ force: true });

  lastCheckinSignature = buildCheckinSignature(stats);
  lastCheckedCount = getCheckedCount(stats);

  setupCheckinSuccessListeners();
};

async function loadConfig() {
  try {
    const qs = `?admin=${enc(currentAdmin)}&sheet=${enc(currentSheet)}&t=${Date.now()}`;
    const r  = await fetch(`${API_BASE}/config${qs}`);
    cfg = await r.json();
  } catch (e) { console.warn('config error', e); }
}

async function loadStats() {
  try {
    const qs = `?admin=${enc(currentAdmin)}&sheet=${enc(currentSheet)}&t=${Date.now()}`;
    const r  = await fetch(`${API_BASE}/dashboard_stats${qs}`);
    const d  = await r.json();
    if (d.success) stats = d.stats;
    setText('ftr-right', '● LIVE');
    const ftr = document.getElementById('ftr-right');
    if (ftr) ftr.style.color = '#4ade80';
    return true;
  } catch {
    setText('ftr-right', '● OFFLINE');
    const ftr = document.getElementById('ftr-right');
    if (ftr) ftr.style.color = '#f87171';
    return false;
  }
}

function setupCheckinSuccessListeners() {
  // 不再整頁定時刷新；只有收到報到成功事件，或偵測到報到資料變動時才重畫圓餅圖。
  // 若報到頁之後有加入 localStorage / BroadcastChannel 通知，Dashboard 會立即更新。
  window.addEventListener('storage', e => {
    if (e.key === 'smartArkCheckinSuccess' || e.key === 'arkCheckinSuccess') {
      refreshIndustryIfCheckinChanged();
    }
  });

  if ('BroadcastChannel' in window) {
    try {
      dashboardChannel = new BroadcastChannel('smart-ark-dashboard');
      dashboardChannel.onmessage = e => {
        const type = e?.data?.type || e?.data;
        if (type === 'checkin-success' || type === 'checked_in') {
          refreshIndustryIfCheckinChanged();
        }
      };
    } catch {}
  }

  // 跨裝置投影時，沒有瀏覽器事件可接收，所以只做「輕量變動監看」。
  // 這裡只比對報到 signature；沒有新增報到就不重畫圖、不重排版。
  checkinWatcher = setInterval(refreshIndustryIfCheckinChanged, 5000);
}

async function refreshIndustryIfCheckinChanged() {
  const prevSignature = lastCheckinSignature;
  const prevChecked = lastCheckedCount;

  const ok = await loadStats();
  if (!ok) return;

  const nextSignature = buildCheckinSignature(stats);
  const nextChecked = getCheckedCount(stats);

  if (!industryRenderedOnce || nextSignature !== prevSignature || nextChecked !== prevChecked) {
    renderDonut({ force: true });
    renderFooter();
    lastCheckinSignature = nextSignature;
    lastCheckedCount = nextChecked;
    industryRenderedOnce = true;
  }
}

function buildCheckinSignature(s) {
  const logs = Array.isArray(s?.logs) ? s.logs : [];
  const checked = getCheckedCount(s);
  const companySig = logs
    .filter(isCheckedInLog)
    .map(l => [
      l.id || l.row_id || l.name || l.姓名 || '',
      l.company || l.company_name || l['公司'] || l['所屬公司'] || l.organization || '',
      l.status || l.checkin_status || l['報到狀態'] || '',
      l.checkin_time || l.checked_at || l.time || l.created_at || ''
    ].join('::'))
    .join('|');
  return `${checked}__${companySig}`;
}

function getCheckedCount(s) {
  const n = Number(s?.checked_in ?? s?.checkedIn ?? s?.checked ?? NaN);
  if (Number.isFinite(n)) return n;
  const logs = Array.isArray(s?.logs) ? s.logs : [];
  return logs.filter(isCheckedInLog).length;
}

function renderHeader() {
  if (!cfg) return;
  const title = cfg.event_title || cfg.exp_event_title || cfg.google_sheet_name || '智慧方舟 2026';
  const ds    = cfg.event_start_date || cfg.exp_event_date_start || cfg.date_start || '';
  const de    = cfg.event_end_date   || cfg.exp_event_date_end   || cfg.date_end   || '';
  const sub   = cfg.event_subtitle   || cfg.exp_event_subtitle   || '';
  setText('hdr-event', title);
  setText('hdr-dates', [sub, ds && de ? `${ds} — ${de}` : (ds || de)].filter(Boolean).join(' ') || 'SMART WISDOM ARK');
  const brand = cfg.exp_brand_name || cfg.brand_name || '聯聖集團';
  setText('ftr-left', `SMART ARK CONTROL · ${brand} © 2026`);
  if (cfg.agenda && cfg.agenda.length) {
    const first = cfg.agenda[0];
    const last  = cfg.agenda[cfg.agenda.length - 1];
    setText('agenda-tag', `${first.time || ''} — ${last.time || ''}`);
  }
}

function renderDonut(options = {}) {
  const checkedTotal = getCheckedCount(stats);
  setText('donut-num', checkedTotal || '0');
  const lbl = document.querySelector('.donut-lbl');
  if (lbl) lbl.textContent = '已報到領航員';

  const segs = getCheckedIndustrySegments();

  if (!segs.length) {
    drawDonut([{ name: '等待報到', count: 1, pct: 100, displayPct: 0, color: 'rgba(0,229,255,0.18)' }]);
    document.getElementById('legend').innerHTML = '<div class="empty-state" style="padding:1rem 0;">🛰 尚無已報到產業資料</div>';
    document.getElementById('bars').innerHTML = '';
    setText('donut-tag', '已報到產業占比');
    industryRenderedOnce = true;
    return;
  }

  drawDonut(segs);
  drawLegend(segs);
  drawBars(segs);
  setText('donut-tag', `已報到產業占比 · ${checkedTotal} 人`);
  industryRenderedOnce = true;
}

function getCheckedIndustrySegments() {
  const logs = Array.isArray(stats?.logs) ? stats.logs : [];
  const checkedLogs = logs.filter(isCheckedInLog);
  const counter = {};

  for (const log of checkedLogs) {
    const company = getCompanyName(log);
    const cat = classifyCompany(company);
    counter[cat] = (counter[cat] || 0) + 1;
  }

  // 若後端已有整理好的 industry_counts，也可以直接吃，但仍以已報到資料為主。
  if (!Object.keys(counter).length && stats?.industry_counts && typeof stats.industry_counts === 'object') {
    for (const [name, count] of Object.entries(stats.industry_counts)) {
      const n = Number(count || 0);
      if (n > 0) counter[name || '未分類'] = n;
    }
  }

  const denominator = Object.values(counter).reduce((a, b) => a + Number(b || 0), 0);
  if (!denominator) return [];

  return Object.entries(counter)
    .sort((a, b) => b[1] - a[1])
    .map(([name, count], i) => {
      const pct = +(Number(count) / denominator * 100).toFixed(1);
      return {
        name,
        count: Number(count),
        pct,
        displayPct: pct,
        color: PALETTE[i % PALETTE.length],
      };
    });
}

function isCheckedInLog(log) {
  const status = String(log?.status ?? log?.checkin_status ?? log?.['報到狀態'] ?? '').trim();
  if (!status) {
    // dashboard_stats.logs 多數情況本身就是報到紀錄；沒有 status 時視為已報到 log。
    return true;
  }
  return ['checked_in', '已報到', '替代', 'success', 'done', '完成報到'].includes(status);
}

function getCompanyName(log) {
  return String(
    log?.company ||
    log?.company_name ||
    log?.organization ||
    log?.org ||
    log?.['公司'] ||
    log?.['所屬公司'] ||
    log?.['單位'] ||
    ''
  ).trim();
}

function classifyCompany(company) {
  const text = String(company || '').trim();
  const mappings = Array.isArray(cfg?.industry_mappings) ? cfg.industry_mappings : [];

  for (const m of mappings) {
    const keyword = String(m.keyword || m.key || m.company_keyword || '').trim();
    const category = String(m.category || m.industry || m.name || '').trim();
    if (keyword && category && text.includes(keyword)) return category;
  }

  return text ? '未分類' : '未分類';
}

function drawDonut(segs) {
  const svg = document.getElementById('donut-svg');
  svg.querySelectorAll('.ds').forEach(el => el.remove());

  const C = 2 * Math.PI * 70;
  const totalCount = segs.reduce((sum, seg) => sum + Number(seg.count || 0), 0) || 1;
  let offset = 0;

  for (const seg of segs) {
    const len = (Number(seg.count || 0) / totalCount) * C;
    const el  = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('class', 'ds');
    el.setAttribute('cx', '100');
    el.setAttribute('cy', '100');
    el.setAttribute('r', '70');
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', seg.color);
    el.setAttribute('stroke-width', '28');
    el.setAttribute('stroke-linecap', 'butt');
    el.setAttribute('stroke-dasharray', `${len} ${C - len}`);
    el.setAttribute('stroke-dashoffset', String(-offset));
    svg.appendChild(el);
    offset += len;
  }
}

function drawLegend(segs) {
  document.getElementById('legend').innerHTML = segs.map(s => `
    <div class="leg">
      <div class="leg-dot" style="background:${s.color};"></div>
      <div class="leg-name">${esc(s.name)}</div>
      <div class="leg-num">${formatPct(s.displayPct ?? s.pct)}%</div>
    </div>
  `).join('');
}

function drawBars(segs) {
  document.getElementById('bars').innerHTML = segs.map(s => `
    <div class="bar-row">
      <div class="bar-meta">
        <span class="bar-name" style="color:${s.color}">${esc(s.name)}</span>
        <span class="bar-pct">${formatPct(s.displayPct ?? s.pct)}%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Number(s.pct || 0)}%; background:${s.color};"></div>
      </div>
    </div>
  `).join('');
}

function renderTimeline() {
  const tl = document.getElementById('tl-list');
  const agenda = cfg?.agenda || [];
  if (!agenda.length) {
    tl.innerHTML = '<div class="empty-state">📡 後台尚未設定議程<br>請至 admin → 議程 新增</div>';
    return;
  }

  const nowMin = nowMinutes();
  let activeIdx = -1;
  for (let i = 0; i < agenda.length; i++) {
    const m = parseTime(agenda[i].time || agenda[i].start_time || '');
    if (m !== null && m <= nowMin) activeIdx = i;
  }

  tl.innerHTML = agenda.map((item, i) => {
    const time  = esc(item.time || item.start_time || '');
    const title = esc(item.title || item.name || '—');
    const sub   = esc(item.subtitle || item.description || '');
    const cls   = i === activeIdx ? 'active' : i < activeIdx ? 'done' : '';
    return `
      <div class="tl-item ${cls}">
        <div class="tl-time-col">
          <div class="tl-dot"></div>
          <div class="tl-time">${time}</div>
        </div>
        <div class="tl-card">
          <div class="tl-title">${title}</div>
          ${sub ? `<div class="tl-sub">${sub}</div>` : ''}
          ${i === activeIdx ? '<div class="tl-now">▶ 進行中</div>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderFooter() {
  if (!cfg) return;
  const brand = cfg.exp_brand_name || cfg.brand_name || '聯聖集團';
  const checked = getCheckedCount(stats);
  setText('ftr-left', `SMART ARK CONTROL · ${brand} © 2026`);
  setText('ftr-right', `● LIVE · 已報到 ${checked} 人`);
  const ftr = document.getElementById('ftr-right');
  if (ftr) ftr.style.color = '#4ade80';
}

function tickClock() {
  setText('clock', new Date().toTimeString().slice(0,8));
}

function nowMinutes() {
  const n = new Date(); return n.getHours() * 60 + n.getMinutes();
}
function parseTime(s) {
  const m = String(s).match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : null;
}
function setText(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = String(v ?? '');
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function enc(v) { return encodeURIComponent(v); }
function formatPct(v) {
  const n = Number(v || 0);
  return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, '');
}
</script>
