<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧方舟 · 大會投影看板</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #020c1b;
  --panel:     rgba(6, 18, 40, 0.80);
  --card:      rgba(10, 25, 50, 0.65);
  --accent:    #00e5ff;
  --adim:      rgba(0,229,255,0.12);
  --green:     #4ade80;
  --orange:    #ffa940;
  --text:      #e8f4ff;
  --muted:     rgba(200, 220, 255, 0.45);
  --border:    rgba(0, 229, 255, 0.14);
  --glow:      0 0 20px rgba(0,229,255,0.30);
  --radius:    18px;
}

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans TC", "PingFang TC", sans-serif;
  min-height: 100vh;
  line-height: 1.6;
}

/* mesh background */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 75% 55% at 10% 5%,  rgba(0,55,110,0.28) 0%, transparent 60%),
    radial-gradient(ellipse 60% 45% at 90% 90%, rgba(0,90,170,0.18) 0%, transparent 55%);
}

/* ═══════════════════════════════
   HEADER
═══════════════════════════════ */
.hdr {
  position: sticky; top: 0; z-index: 100;
  background: rgba(2, 8, 20, 0.92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
  padding: 0 1.5rem;
}
.hdr-inner {
  max-width: 1440px; margin: 0 auto;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem;
}

.hdr-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.hdr-logo {
  width: 34px; height: 34px;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  box-shadow: var(--glow);
}
.hdr-name {
  font-family: "Michroma", sans-serif;
  font-size: 0.85rem; letter-spacing: 3px;
  color: var(--accent); text-shadow: var(--glow);
}
.hdr-sub { font-size: 0.65rem; color: var(--muted); letter-spacing: 1.5px; }

.hdr-center { text-align: center; min-width: 0; flex: 1; }
.hdr-event {
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  font-weight: 900; letter-spacing: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-dates { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; margin-top: 1px; }

.hdr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.live-pill {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.70rem; font-weight: 700; letter-spacing: 1px;
  color: var(--green);
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.22);
  padding: 3px 10px; border-radius: 20px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  animation: blink 1.4s infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }
.hdr-clock {
  font-family: "Michroma", sans-serif;
  font-size: 0.85rem; color: var(--accent); letter-spacing: 2px;
  display: none; /* shown on wider screens */
}

/* ═══════════════════════════════
   MAIN WRAPPER
═══════════════════════════════ */
.wrap {
  position: relative; z-index: 1;
  max-width: 1440px; margin: 0 auto;
  padding: 1.5rem 1.25rem 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  min-height: calc(100vh - 60px);
}

/* ─── shared panel ─── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(12px);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.panel-head {
  padding: 1.1rem 1.4rem 0.9rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.panel-title {
  font-size: 0.88rem; font-weight: 900;
  letter-spacing: 2px; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.panel-tag {
  font-family: "Michroma", sans-serif;
  font-size: 0.60rem; letter-spacing: 1.5px; color: var(--muted);
}

.panel-body {
  flex: 1;
  padding: 1.25rem 1.4rem;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.18); border-radius: 3px; }

/* ═══════════════════════════════
   LEFT — DONUT CHART
═══════════════════════════════ */
.donut-layout {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* donut + legend row */
.donut-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  flex-wrap: wrap;
}

.donut-wrap {
  position: relative;
  width: 200px; height: 200px;
  flex-shrink: 0;
}
.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.donut-num {
  font-family: "Michroma", sans-serif;
  font-size: 2.2rem; font-weight: 900;
  color: var(--accent); text-shadow: var(--glow);
  line-height: 1;
}
.donut-lbl { font-size: 0.62rem; color: var(--muted); letter-spacing: 1px; margin-top: 3px; }

/* legend list */
.legend { display: flex; flex-direction: column; gap: 0.65rem; min-width: 150px; }
.leg { display: flex; align-items: center; gap: 8px; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-name { font-size: 0.80rem; color: var(--text); flex: 1; line-height: 1.35; }
.leg-num  { font-family: "Michroma", sans-serif; font-size: 0.72rem; color: var(--muted); }

/* bar list */
.bars { display: flex; flex-direction: column; gap: 0.6rem; }
.bar-row { display: flex; flex-direction: column; gap: 0.3rem; }
.bar-meta { display: flex; justify-content: space-between; align-items: center; }
.bar-name { font-size: 0.77rem; }
.bar-pct  { font-family: "Michroma", sans-serif; font-size: 0.72rem; color: var(--muted); }
.bar-track { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 3px; width: 0; transition: width 1.1s cubic-bezier(.4,0,.2,1); }

.empty-state { text-align: center; padding: 3rem 0; color: var(--muted); font-size: 0.85rem; line-height: 2; }

/* ═══════════════════════════════
   RIGHT — AGENDA (vertical)
═══════════════════════════════ */
.tl-list { display: flex; flex-direction: column; }

.tl-item {
  display: flex;
  gap: 1rem;
  padding: 0.9rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  position: relative;
}
.tl-item:last-child { border-bottom: none; }

/* vertical line */
.tl-item::before {
  content: '';
  position: absolute;
  left: 44px; top: 0; bottom: 0;
  width: 1px;
  background: var(--border);
}
.tl-item:first-child::before { top: 50%; }
.tl-item:last-child::before  { bottom: 50%; }

/* time column */
.tl-time-col {
  width: 44px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding-top: 2px;
}
.tl-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid rgba(0,229,255,0.25);
  background: var(--bg);
  z-index: 1; flex-shrink: 0;
  transition: all 0.3s;
}
.tl-item.active .tl-dot {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 10px rgba(0,229,255,0.55);
  width: 12px; height: 12px;
}
.tl-item.done .tl-dot { border-color: var(--green); background: var(--green); }

.tl-time {
  font-family: "Michroma", sans-serif;
  font-size: 0.70rem; color: var(--muted);
  letter-spacing: 1px; margin-top: 3px;
  text-align: center;
}
.tl-item.active .tl-time { color: var(--accent); }
.tl-item.done   .tl-time { color: var(--green); }

/* card */
.tl-card {
  flex: 1; min-width: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.85rem 1rem;
  transition: border-color 0.2s;
}
.tl-item.active .tl-card {
  border-color: rgba(0,229,255,0.40);
  background: rgba(0,229,255,0.055);
  box-shadow: 0 0 18px rgba(0,229,255,0.07);
}
.tl-item.done .tl-card { opacity: 0.45; }

.tl-title { font-size: 0.92rem; font-weight: 900; line-height: 1.45; }
.tl-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
.tl-now {
  display: inline-block; margin-top: 0.35rem;
  font-size: 0.62rem; font-weight: 700; letter-spacing: 1px;
  padding: 2px 9px; border-radius: 20px;
  color: var(--accent);
  background: rgba(0,229,255,0.10);
  border: 1px solid rgba(0,229,255,0.25);
}

/* ═══════════════════════════════
   FOOTER
═══════════════════════════════ */
.ftr {
  position: relative; z-index: 10;
  border-top: 1px solid var(--border);
  background: rgba(2,8,20,0.85);
  padding: 0.7rem 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.65rem; color: var(--muted); letter-spacing: 1.5px;
}
.ftr-right { font-family: "Michroma", sans-serif; color: var(--accent); font-size: 0.68rem; }

/* ═══════════════════════════════
   RESPONSIVE
═══════════════════════════════ */
@media (min-width: 900px) {
  .hdr-clock { display: block; }
}

@media (max-width: 768px) {
  .hdr-name { letter-spacing: 2px; font-size: 0.78rem; }
  .hdr-sub  { display: none; }
  .hdr-event { font-size: 0.85rem; letter-spacing: 1.5px; }

  .wrap {
    grid-template-columns: 1fr;
    padding: 1rem 0.85rem 1.5rem;
    gap: 1rem;
    min-height: unset;
  }

  .panel-head { padding: 0.9rem 1.1rem 0.75rem; }
  .panel-body { padding: 1rem 1.1rem; }

  .donut-wrap { width: 160px; height: 160px; }
  .donut-num  { font-size: 1.8rem; }

  .donut-row { gap: 1.25rem; }
  .legend { gap: 0.5rem; }

  .tl-card { padding: 0.7rem 0.85rem; }
  .tl-title { font-size: 0.88rem; }
}

@media (max-width: 420px) {
  .donut-row { flex-direction: column; align-items: center; }
  .legend { width: 100%; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-brand">
      <div class="hdr-logo">⛵</div>
      <div>
        <div class="hdr-name">SMART WISDOM ARK</div>
        <div class="hdr-sub">智慧方舟 · 大會投影看板</div>
      </div>
    </div>
    <div class="hdr-center">
      <div id="hdr-event" class="hdr-event">智慧方舟 2026</div>
      <div id="hdr-dates" class="hdr-dates">載入中…</div>
    </div>
    <div class="hdr-right">
      <div class="live-pill"><span class="live-dot"></span>LIVE</div>
      <div id="clock" class="hdr-clock">--:--:--</div>
    </div>
  </div>
</header>

<!-- MAIN: 2-col grid -->
<div class="wrap">

  <!-- ── LEFT: Industry Donut ── -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">🌐 登艦產業生態分佈</div>
      <span class="panel-tag" id="donut-tag">INDUSTRY ANALYSIS</span>
    </div>
    <div class="panel-body">
      <div class="donut-layout">

        <!-- donut + legend -->
        <div class="donut-row">
          <div class="donut-wrap">
            <svg id="donut-svg" viewBox="0 0 200 200" width="200" height="200"
                 style="transform:rotate(-90deg); display:block;">
              <!-- track ring -->
              <circle cx="100" cy="100" r="70" fill="none"
                      stroke="rgba(255,255,255,0.05)" stroke-width="28"/>
              <!-- segments injected by JS -->
            </svg>
            <div class="donut-center">
              <div class="donut-num" id="donut-num">—</div>
              <div class="donut-lbl">共戰領航員</div>
            </div>
          </div>
          <div class="legend" id="legend">
            <div class="empty-state" style="padding:1rem 0;">📡 載入中…</div>
          </div>
        </div>

        <!-- bar breakdown -->
        <div class="bars" id="bars">
          <!-- injected by JS -->
        </div>

      </div>
    </div>
  </div>

  <!-- ── RIGHT: Agenda ── -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">🗓 大會議程</div>
      <span id="agenda-tag" class="panel-tag">TIMELINE</span>
    </div>
    <div class="panel-body">
      <div class="tl-list" id="tl-list">
        <div class="empty-state">📡 載入議程中…</div>
      </div>
    </div>
  </div>

</div><!-- /wrap -->

<!-- FOOTER -->
<footer class="ftr">
  <span id="ftr-left">SMART ARK CONTROL · 聯聖集團 © 2026</span>
  <span id="ftr-right" class="ftr-right">同步中…</span>
</footer>

<script>
/* ══════════════════════════════════════
   URL PARAMS (same as 活動報到系統.html)
══════════════════════════════════════ */
const urlParams  = new URLSearchParams(location.search);
let   currentSheet = urlParams.get('sheet') || '';
const currentAdmin = urlParams.get('admin') || 'admin';
const API_BASE     = '/api';

/* ══════════════════════════════════════
   PALETTE
══════════════════════════════════════ */
const PALETTE = [
  '#00e5ff','#f72585','#7209b7','#4cc9f0','#3a0ca3',
  '#06d6a0','#ffd166','#ef476f','#118ab2','#a78bfa',
];

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let cfg    = null;   // from /api/config
let stats  = null;   // from /api/dashboard_stats

/* ══════════════════════════════════════
   BOOT
══════════════════════════════════════ */
window.onload = async () => {
  tickClock();
  setInterval(tickClock, 1000);

  // if no sheet in URL, ask server for current sheet
  if (!currentSheet) {
    try {
      const r = await fetch(`${API_BASE}/current_sheet?admin=${enc(currentAdmin)}`);
      const d = await r.json();
      if (d.success && d.current_sheet) currentSheet = d.current_sheet;
    } catch {}
  }

  await syncAll();
  setInterval(syncAll, 15000);
};

async function syncAll() {
  await Promise.all([loadConfig(), loadStats()]);
  renderAll();
}

/* ── Config ── */
async function loadConfig() {
  try {
    const qs = `?admin=${enc(currentAdmin)}&sheet=${enc(currentSheet)}&t=${Date.now()}`;
    const r  = await fetch(`${API_BASE}/config${qs}`);
    cfg = await r.json();
  } catch (e) { console.warn('config error', e); }
}

/* ── Dashboard stats ── */
async function loadStats() {
  try {
    const qs = `?admin=${enc(currentAdmin)}&sheet=${enc(currentSheet)}`;
    const r  = await fetch(`${API_BASE}/dashboard_stats${qs}`);
    const d  = await r.json();
    if (d.success) stats = d.stats;
    setText('ftr-right', '● LIVE');
    document.getElementById('ftr-right').style.color = '#4ade80';
  } catch {
    setText('ftr-right', '● OFFLINE');
    document.getElementById('ftr-right').style.color = '#f87171';
  }
}

/* ══════════════════════════════════════
   RENDER ALL
══════════════════════════════════════ */
function renderAll() {
  renderHeader();
  renderDonut();
  renderTimeline();
  renderFooter();
}

/* ── Header ── */
function renderHeader() {
  if (!cfg) return;
  const title = cfg.event_title || cfg.exp_event_title || cfg.google_sheet_name || '智慧方舟 2026';
  const ds    = cfg.event_start_date || cfg.exp_event_date_start || cfg.date_start || '';
  const de    = cfg.event_end_date   || cfg.exp_event_date_end   || cfg.date_end   || '';
  const sub   = cfg.event_subtitle   || cfg.exp_event_subtitle   || '';
  setText('hdr-event', title);
  setText('hdr-dates', [sub, ds && de ? `${ds} — ${de}` : (ds || de)].filter(Boolean).join('　') || 'SMART WISDOM ARK');
  const brand = cfg.exp_brand_name || cfg.brand_name || '聯聖集團';
  setText('ftr-left', `SMART ARK CONTROL · ${brand} © 2026`);
  if (cfg.agenda && cfg.agenda.length) {
    const first = cfg.agenda[0];
    const last  = cfg.agenda[cfg.agenda.length - 1];
    setText('agenda-tag', `${first.time || ''} — ${last.time || ''}`);
  }
}

/* ── Donut ── */
function renderDonut() {
  const total = (stats?.total) ?? 0;
  setText('donut-num', total || '—');

  // build industry counter from logs + industry_mappings
  const logs      = stats?.logs || [];
  const mappings  = cfg?.industry_mappings || [];  // [{keyword, category}]
  const counter   = {};

  for (const log of logs) {
    const company = String(log.company || '');
    let   cat     = '其他';
    for (const m of mappings) {
      if (m.keyword && company.includes(m.keyword.trim())) {
        cat = m.category.trim(); break;
      }
    }
    counter[cat] = (counter[cat] || 0) + 1;
  }

  // fallback: checked vs unchecked
  let segs;
  if (Object.keys(counter).length > 0) {
    segs = Object.entries(counter)
      .sort((a, b) => b[1] - a[1])
      .map(([name, count], i) => ({
        name, count,
        pct: total > 0 ? +(count / total * 100).toFixed(1) : 0,
        color: PALETTE[i % PALETTE.length],
      }));
  } else {
    const checked = stats?.checked_in ?? 0;
    const pending = total - checked;
    segs = [
      { name: '已報到', count: checked, pct: total > 0 ? +(checked/total*100).toFixed(1) : 0, color: '#4ade80' },
      { name: '未報到', count: pending, pct: total > 0 ? +(pending/total*100).toFixed(1) : 0, color: '#f87171' },
    ].filter(s => s.count > 0);
  }

  if (!segs.length) {
    document.getElementById('legend').innerHTML = '<div class="empty-state" style="padding:1rem 0;">🛰 尚無報到資料</div>';
    document.getElementById('bars').innerHTML = '';
    return;
  }

  drawDonut(segs);
  drawLegend(segs);
  drawBars(segs);
  setText('donut-tag', `共 ${segs.length} 個行業類別`);
}

function drawDonut(segs) {
  const svg = document.getElementById('donut-svg');
  svg.querySelectorAll('.ds').forEach(el => el.remove());
  const C = 2 * Math.PI * 70; // circumference for r=70
  let offset = 0;
  for (const seg of segs) {
    const len = (seg.pct / 100) * C;
    const el  = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('class', 'ds');
    el.setAttribute('cx', '100'); el.setAttribute('cy', '100'); el.setAttribute('r', '70');
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', seg.color);
    el.setAttribute('stroke-width', '28');
    el.setAttribute('stroke-dasharray', `0 ${C}`);
    el.setAttribute('stroke-dashoffset', String(-offset));
    svg.appendChild(el);
    requestAnimationFrame(() => {
      setTimeout(() => {
        el.style.transition = 'stroke-dasharray 1s cubic-bezier(.4,0,.2,1)';
        el.setAttribute('stroke-dasharray', `${len} ${C - len}`);
      }, 80);
    });
    offset += len;
  }
}

function drawLegend(segs) {
  document.getElementById('legend').innerHTML = segs.map(s => `
    <div class="leg">
      <div class="leg-dot" style="background:${s.color};"></div>
      <div class="leg-name">${esc(s.name)}</div>
      <div class="leg-num">${s.count}人</div>
    </div>
  `).join('');
}

function drawBars(segs) {
  document.getElementById('bars').innerHTML = segs.map(s => `
    <div class="bar-row">
      <div class="bar-meta">
        <span class="bar-name" style="color:${s.color}">${esc(s.name)}</span>
        <span class="bar-pct">${s.pct}%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" data-w="${s.pct}" style="background:${s.color};"></div>
      </div>
    </div>
  `).join('');
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill').forEach(b => {
      setTimeout(() => { b.style.width = b.dataset.w + '%'; }, 100);
    });
  });
}

/* ── Timeline ── */
function renderTimeline() {
  const tl = document.getElementById('tl-list');
  const agenda = cfg?.agenda || [];
  if (!agenda.length) {
    tl.innerHTML = '<div class="empty-state">📡 後台尚未設定議程<br>請至 admin → 議程 新增</div>';
    return;
  }

  const nowMin = nowMinutes();
  let activeIdx = -1;
  for (let i = 0; i < agenda.length; i++) {
    const m = parseTime(agenda[i].time || agenda[i].start_time || '');
    if (m !== null && m <= nowMin) activeIdx = i;
  }

  tl.innerHTML = agenda.map((item, i) => {
    const time  = esc(item.time || item.start_time || '');
    const title = esc(item.title || item.name || '—');
    const sub   = esc(item.subtitle || item.description || '');
    const cls   = i === activeIdx ? 'active' : i < activeIdx ? 'done' : '';
    return `
      <div class="tl-item ${cls}">
        <div class="tl-time-col">
          <div class="tl-dot"></div>
          <div class="tl-time">${time}</div>
        </div>
        <div class="tl-card">
          <div class="tl-title">${title}</div>
          ${sub ? `<div class="tl-sub">${sub}</div>` : ''}
          ${i === activeIdx ? '<div class="tl-now">▶ 進行中</div>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

/* ── Footer ── */
function renderFooter() {
  if (!cfg) return;
  const brand = cfg.exp_brand_name || cfg.brand_name || '聯聖集團';
  setText('ftr-left', `SMART ARK CONTROL · ${brand} © 2026`);
}

/* ══════════════════════════════════════
   CLOCK
══════════════════════════════════════ */
function tickClock() {
  setText('clock', new Date().toTimeString().slice(0,8));
}

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function nowMinutes() {
  const n = new Date(); return n.getHours() * 60 + n.getMinutes();
}
function parseTime(s) {
  const m = String(s).match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : null;
}
function setText(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = String(v ?? '');
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function enc(v) { return encodeURIComponent(v); }
</script>
