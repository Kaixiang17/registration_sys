<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智匯方舟 · 大會看板</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #061A18;
  --panel:   rgba(6, 26, 24, 0.82);
  --card:    rgba(6, 26, 24, 0.60);
  --cyan:    #14B8A6;
  --green:   #5EEAD4;
  --border:  rgba(20, 184, 166, 0.14);
  --text:    #ECFEFF;
  --muted:   rgba(236, 254, 255, 0.45);
  --glow:    0 0 22px rgba(20, 184, 166, 0.32);
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: "Noto Sans TC", sans-serif; min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 80% 60% at 10% 5%,  rgba(20,184,166,0.15) 0%, transparent 60%), radial-gradient(ellipse 65% 50% at 90% 92%, rgba(20,184,166,0.10) 0%, transparent 55%); }
body::after { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(20,184,166,0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(20,184,166,0.022) 1px, transparent 1px); background-size: 55px 55px; mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 0%, transparent 100%); }

.hdr { position: sticky; top: 0; z-index: 100; background: rgba(6,26,24,0.93); border-bottom: 1px solid var(--border); backdrop-filter: blur(16px); }
.hdr-inner { max-width: 1600px; margin: 0 auto; padding: 0 1.75rem; height: 100px; display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; }
.brand-logo { width: 44px; height: 44px; border: 1.5px solid var(--cyan); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; box-shadow: var(--glow); }
.brand-name { font-family: "Michroma", sans-serif; font-size: 0.88rem; letter-spacing: 4px; color: var(--cyan); text-shadow: var(--glow); }
.brand-sub { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }
.hdr-center { flex: 1; text-align: center; min-width: 0; }
.hdr-event { font-size: 1rem; font-weight: 900; letter-spacing: 2px; color: #fff; line-height: 1.1; text-shadow: 0 0 18px rgba(255,255,255,0.20), var(--glow); }
.hdr-en { font-family: "Michroma", sans-serif; font-size: 0.72rem; letter-spacing: 5px; color: var(--cyan); opacity: .65; margin-bottom: 6px; }
.hdr-zh { font-size: clamp(1.6rem, 3.5vw, 2.6rem); font-weight: 900; letter-spacing: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 30px rgba(20,184,166,0.15), 0 2px 4px rgba(0,0,0,0.4); line-height: 1.1; }
.hdr-dates { font-size: 0.6rem; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }
.hdr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.live-pill { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px; color: var(--green); background: rgba(94,234,212,0.08); border: 1px solid rgba(94,234,212,0.22); padding: 5px 13px; border-radius: 20px; }
.clock { font-family: "Michroma", sans-serif; font-size: 1rem; color: var(--cyan); letter-spacing: 2px; }

.banner { position: relative; z-index: 10; background: rgba(20,184,166,0.04); border-bottom: 1px solid var(--border); }
.banner-inner { max-width: 1600px; margin: 0 auto; padding: 0.65rem 1.75rem; display: flex; justify-content: space-between; align-items: center; }
.b-tag   { font-family: "Michroma", sans-serif; font-size: 0.60rem; letter-spacing: 3px; color: var(--muted); }
.b-label { font-size: 0.82rem; letter-spacing: 4px; color: var(--cyan); font-weight: 900; text-shadow: var(--glow); }

.main { position: relative; z-index: 5; max-width: 1600px; margin: 0 auto; padding: 1.5rem 1.75rem 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; min-height: calc(100dvh - 62px - 34px - 38px); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; backdrop-filter: blur(14px); display: flex; flex-direction: column; overflow: hidden; }
.panel-head { padding: 1rem 1.4rem 0.85rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.panel-title { font-size: 0.86rem; font-weight: 900; letter-spacing: 2px; color: var(--text); display: flex; align-items: center; gap: 7px; }
.panel-body { flex: 1; padding: 1.4rem; overflow-y: auto; }
.donut-layout { height: 100%; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2.6rem; flex-wrap: wrap; }
.donut-wrap { position: relative; flex-shrink: 0; width: 260px; height: 260px; }
#donut-svg { display: block; filter: drop-shadow(0 0 20px rgba(20,184,166,0.18)); }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
.donut-num { font-family: "Michroma", sans-serif; font-size: 2.8rem; font-weight: 900; line-height: 1; color: var(--cyan); text-shadow: var(--glow); }
.donut-lbl { font-size: 0.62rem; color: var(--muted); letter-spacing: 2px; margin-top: 5px; }
.legend { display: flex; flex-direction: column; gap: 0.85rem; width: 320px; max-width: 320px; align-self: center; }
.leg { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; column-gap: 12px; }
.leg-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
.leg-name { font-size: 0.92rem; color: var(--text); font-weight: 800; line-height: 1.35; }
.leg-val  { font-family: "Michroma", sans-serif; font-size: 0.9rem; color: var(--muted); white-space: nowrap; text-align: right; min-width: 72px; }

.tl { display: flex; flex-direction: column; gap: 0.9rem; }
.tl-item { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 0.9rem; align-items: stretch; position: relative; }
.tl-lead { display: flex; align-items: center; justify-content: center; min-height: 76px; border-radius: 14px; border: 1px solid rgba(20,184,166,0.18); background: rgba(20,184,166,0.045); }
.tl-time { font-family: "Michroma", sans-serif; font-size: 0.68rem; color: var(--cyan); text-align: center; line-height: 1.45; letter-spacing: 1px; }
.tl-card { background: linear-gradient(135deg, rgba(20,184,166,0.055), rgba(255,255,255,0.025)); border: 1px solid rgba(20,184,166,0.20); border-radius: 14px; padding: 1rem 1.1rem; display: flex; flex-direction: column; justify-content: center; }
.tl-title { font-size: 1.02rem; font-weight: 900; line-height: 1.45; letter-spacing: 1px; color: #f2fbff; overflow-wrap: break-word; }
.tl-sub { font-size: 0.76rem; color: rgba(236,254,255,0.62); margin-top: 0.35rem; line-height: 1.55; overflow-wrap: break-word; }
.tl-item.active .tl-lead { border-color: rgba(20,184,166,0.65); background: rgba(20,184,166,0.10); box-shadow: 0 0 18px rgba(20,184,166,0.12); }
.tl-item.active .tl-card { border-color: rgba(20,184,166,0.55); background: linear-gradient(135deg, rgba(20,184,166,0.13), rgba(255,255,255,0.035)); box-shadow: 0 0 24px rgba(20,184,166,0.10), inset 0 0 18px rgba(20,184,166,0.035); }
.tl-now { flex-shrink: 0; font-size: 0.58rem; font-weight: 900; letter-spacing: 1px; padding: 0.22rem 0.62rem; border-radius: 999px; color: #061A18; background: linear-gradient(135deg, #14B8A6, #5EEAD4); box-shadow: 0 0 14px rgba(20,184,166,0.25); }

.enterprise-panel { grid-column: 1 / -1; min-height: 360px; }
.enterprise-list { display: grid; grid-template-columns: 1fr; gap: 0.9rem; }
.enterprise-card { display: grid; grid-template-columns: 108px 1fr; gap: 1rem; align-items: center; padding: 1rem; border: 1px solid rgba(20,184,166,0.18); border-radius: 14px; background: linear-gradient(135deg, rgba(20,184,166,0.065), rgba(255,255,255,0.025)); }
.enterprise-img { width: 108px; height: 78px; border-radius: 12px; border: 1px solid rgba(20,184,166,0.22); display: flex; align-items: center; justify-content: center; color: var(--cyan); font-size: 1.8rem; font-weight: 900; }
.enterprise-name { font-size: 1.05rem; font-weight: 900; color: #f2fbff; letter-spacing: 1px; margin-bottom: 0.25rem; }
.enterprise-industry { display: inline-flex; color: #061A18; background: linear-gradient(135deg, #14B8A6, #5EEAD4); border-radius: 999px; padding: 0.18rem 0.62rem; font-size: 0.68rem; font-weight: 900; }

.ftr { border-top: 1px solid var(--border); background: rgba(6,26,24,0.88); height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.75rem; }

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; min-height: unset; padding: 1rem 1rem 1.5rem; }
  .donut-layout { flex-direction: column; gap: 1.5rem; }
  .legend { width: 100%; max-width: 340px; }
  .donut-wrap { width: 200px; height: 200px; }
  .donut-num  { font-size: 2.2rem; }
  .brand-sub  { display: none; }
  .hdr-inner  { padding: 0 1rem; }
  .banner-inner { padding: 0.4rem 1rem; }
}
@media (max-width: 480px) {
  .hdr-en, .hdr-dates { display: none; }
  .clock { font-size: 0.78rem; }
  .panel-body { padding: 1rem; }
  .donut-wrap { width: 170px; height: 170px; }
  .donut-num  { font-size: 1.9rem; }
  .tl-item { grid-template-columns: 1fr; gap: 0.45rem; }
  .tl-lead { min-height: 44px; justify-content: flex-start; padding-left: 1rem; }
  .tl-card { min-height: 68px; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="brand">
      <div class="brand-logo">⛵</div>
      <div><div class="brand-name">智匯方舟</div><div class="brand-sub">大會投影看板</div></div>
    </div>
    <div class="hdr-center">
      <div id="hdr-event" class="hdr-event"></div>
      <div id="hdr-en" class="hdr-en"></div>
      <div id="hdr-zh" class="hdr-zh"></div>
      <div id="hdr-dates" class="hdr-dates"></div>
    </div>
    <div class="hdr-right"><div class="live-pill">LIVE</div><div id="clock" class="clock">--:--:--</div></div>
  </div>
</header>
<div class="banner">
  <div class="banner-inner">
    <span class="b-tag">智匯方舟</span><span id="b-mid" class="b-label"></span><span class="b-tag">智匯方舟</span>
  </div>
</div>
<div class="main">
  <div class="panel">
    <div class="panel-head"><div class="panel-title">🌐 實時登艦產業生態分佈</div></div>
    <div class="panel-body">
      <div class="donut-layout">
        <div class="donut-wrap">
          <svg id="donut-svg" viewBox="0 0 240 240" width="240" height="240" style="transform:rotate(-90deg);"><circle cx="120" cy="120" r="85" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="32"/></svg>
          <div class="donut-center"><div class="donut-num" id="donut-num"></div><div class="donut-lbl" id="donut-lbl"></div></div>
        </div>
        <div class="legend" id="legend">連線中…</div>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">🗓 大會時空座標 · 議程</div><span id="agenda-range" class="panel-en">CONFERENCE TIMELINE</span></div>
    <div class="panel-body"><div id="tl" class="tl">連線中…</div></div>
  </div>
  <div class="panel enterprise-panel">
    <div class="panel-head"><div class="panel-title">🏢 今日參與企業</div></div>
    <div class="panel-body"><div id="enterprise-list" class="enterprise-list">連線中…</div></div>
  </div>
</div>
<footer class="ftr"><span id="ftr-l" class="ftr-l"></span></footer>

<script>
const UP = new URLSearchParams(location.search);
let SHEET = UP.get('sheet') || '';
const ADMIN = UP.get('admin') || 'admin';
const API = '/api';
const PALETTE = ['#14B8A6', '#5EEAD4', '#40C4FF', '#7C4DFF', '#FF2D95', '#FFD600', '#FFAB40', '#FF5252'];

let cfg = null;
let lastCheckCount = -1;

window.onload = async () => {
  setInterval(() => { const n=new Date(); document.getElementById('clock').textContent=n.toTimeString().slice(0,8); }, 1000);
  if (!SHEET) {
    try {
      const r = await get(`${API}/current_sheet?admin=${enc(ADMIN)}`);
      if (r.success && r.current_sheet) SHEET = r.current_sheet;
    } catch {}
  }
  await loadCfg();
  await poll();
  setInterval(poll, 12000);
  setInterval(loadCfg, 30000);
};

async function loadCfg() {
  try {
    const baseCfg = await get(`${API}/config?admin=${enc(ADMIN)}&sheet=${enc(SHEET)}`);
    let eventCfg = {};
    try {
      const eventJson = await get(`${API}/event-config?admin=${enc(ADMIN)}&sheet=${enc(SHEET)}`);
      if (eventJson.success && eventJson.config) eventCfg = eventJson.config;
    } catch {}
    try {
      const agendaJson = await get(`${API}/schedule?admin=${enc(ADMIN)}&sheet=${enc(SHEET)}`);
      if (agendaJson.success && agendaJson.schedule) eventCfg.agenda = agendaJson.schedule;
    } catch {}
    
    cfg = Object.assign({}, baseCfg || {}, eventCfg || {});
    const brand = cfg.brand_name || '智匯方舟';
    document.querySelector('.brand-name').textContent = brand;
    document.querySelectorAll('.b-tag').forEach(t => t.textContent = brand);
    
    document.getElementById('hdr-event').textContent = cfg.event_title || SHEET || '活動';
    document.getElementById('hdr-en').textContent = cfg.projection_subtitle || 'GLOBAL FACE TO FACE';
    document.getElementById('hdr-zh').textContent = cfg.projection_title || '世代共榮的數位聚合';
    document.getElementById('ftr-l').textContent = `SMART ARK CONTROL TERMINAL © 2026 ${brand}`;
    
    renderAgenda();
    renderEnterprises();
  } catch (e) {}
}

async function poll() {
  try {
    const d = await get(`${API}/dashboard_stats?admin=${enc(ADMIN)}&sheet=${enc(SHEET)}`);
    if (!d.success) return;
    const s = d.stats;
    const checked = s.checked_in ?? 0;
    document.getElementById('donut-num').textContent = checked > 0 ? '100%' : '—';
    document.getElementById('donut-lbl').textContent = checked > 0 ? '已報到' : '';
    if (s.total * 100000 + checked !== lastCheckCount) {
      lastCheckCount = s.total * 100000 + checked;
      buildDonut(s.logs || [], s.total ?? 0);
    }
  } catch {}
}

function buildDonut(logs, total) {
  const mappings = cfg?.industry_mappings || [];
  const counter = {};
  for (const log of logs) {
    const co = String(log.company || '');
    let cat = '其他';
    for (const m of mappings) if (m.keyword && co.includes(m.keyword.trim())) { cat = m.category.trim(); break; }
    counter[cat] = (counter[cat] || 0) + 1;
  }
  const logTotal = Object.values(counter).reduce((a,b) => a+b, 0) || 1;
  const segs = Object.entries(counter).sort((a,b) => b[1]-a[1]).map(([name, count], i) => ({
      name, count, pct: +(count/logTotal*100).toFixed(1), color: PALETTE[i % PALETTE.length],
  }));
  drawDonut(segs);
  const el = document.getElementById('legend');
  el.innerHTML = segs.length ? segs.map(s => `<div class="leg"><div class="leg-dot" style="background:${s.color}"></div><span class="leg-name">${esc(s.name)}</span><span class="leg-val">${s.pct}%</span></div>`).join('') : '尚無資料';
}

function drawDonut(segs) {
  const svg = document.getElementById('donut-svg');
  svg.querySelectorAll('.ds').forEach(n => n.remove());
  const C = 2 * Math.PI * 85;
  let off = 0;
  for (const s of segs) {
    const len = (s.pct / 100) * C;
    if (len <= 0) continue;
    const el = document.createElementNS('http://www.w3.org/2000/svg','circle');
    el.setAttribute('class','ds'); el.setAttribute('cx','120'); el.setAttribute('cy','120'); el.setAttribute('r','85');
    el.setAttribute('fill','none'); el.setAttribute('stroke', s.color); el.setAttribute('stroke-width','32');
    el.setAttribute('stroke-dasharray', `${len} ${C-len}`); el.setAttribute('stroke-dashoffset', String(-off));
    svg.appendChild(el);
    off += len;
  }
}

function renderAgenda() {
  const agenda = cfg?.agenda || [];
  const tl = document.getElementById('tl');
  if (!agenda.length) {
    tl.innerHTML = '<div style="color:var(--muted); text-align:center; padding:2rem;">後台尚未設定議程</div>';
    return;
  }
  const nm = new Date().getHours()*60 + new Date().getMinutes();
  let act = 0;
  for (let i = 0; i < agenda.length; i++) {
    const m = String(agenda[i].time).match(/(\d{1,2}):(\d{2})/);
    if (m && (+m[1]*60+ +m[2]) <= nm) act = i;
  }
  tl.innerHTML = agenda.map((item,i) => `
    <div class="tl-item ${i===act ? 'active' : ''}">
      <div class="tl-lead"><div class="tl-time">${esc(item.time)}</div></div>
      <div class="tl-card"><div style="display:flex; justify-content:space-between;">
        <div class="tl-title">${esc(item.title)}</div>${i===act ? '<div class="tl-now">▶ NOW</div>' : ''}
      </div><div class="tl-sub">${esc(item.description)}</div></div>
    </div>`).join('');
}

async function renderEnterprises() {
  try {
    const json = await get(`${API}/exhibitors?admin=${enc(ADMIN)}&sheet=${enc(SHEET)}`);
    const items = (json.exhibitors || []).filter(x => (x.name || x.company_name || '').trim()).slice(0, 18);
    document.getElementById('enterprise-list').innerHTML = items.length ? items.map(item => `
        <div class="enterprise-card">
          <div class="enterprise-img">${item.image_url ? `<img src="${esc(item.image_url)}" style="width:100%;height:100%;object-fit:cover;">` : `<span>${esc(item.name || item.company_name).slice(0,1)}</span>`}</div>
          <div><div class="enterprise-name">${esc(item.name || item.company_name)}</div><div class="enterprise-industry">${esc(item.industry || '未分類')}</div></div>
        </div>`).join('') : '<div style="color:var(--muted); text-align:center;">尚無企業資料</div>';
  } catch (e) {}
}

async function get(url) { const r = await fetch(url + (url.includes('?')?'&':'?') + `_t=${Date.now()}`); return r.json(); }
function esc(v) { return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function enc(v) { return encodeURIComponent(v); }
</script>
</body>
</html>
