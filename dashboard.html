<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧方舟 Projection Dashboard</title>
<link rel="stylesheet" href="smart-ark-theme.css?v=projection-stage-1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #020712;
    color: #eaffff;
    font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
}

.ark-background {
    opacity: 0.2;
}

/* ===== 主投影容器 ===== */
.projection-shell {
    width: 100vw;
    height: 100vh;
    padding: 2.1vh 3vw 1.2vh;
    display: grid;
    grid-template-rows: 14vh minmax(0, 51vh) 11vh 18vh;
    gap: 1.25vh;
    position: relative;
    background:
        radial-gradient(circle at 50% 42%, rgba(0, 229, 255, 0.16), transparent 28%),
        radial-gradient(circle at 50% 92%, rgba(0, 130, 255, 0.24), transparent 34%),
        linear-gradient(180deg, rgba(3, 8, 20, 0.92), rgba(2, 7, 16, 0.98));
}

/* 背景大字，壓低透明度，不干擾閱讀 */
.projection-shell::before {
    content: "智匯方舟";
    position: absolute;
    inset: 14vh 0 auto 0;
    text-align: center;
    font-size: clamp(5rem, 14vw, 12rem);
    font-weight: 900;
    letter-spacing: 0.04em;
    color: rgba(170, 220, 230, 0.04);
    -webkit-text-stroke: 1px rgba(0, 229, 255, 0.08);
    pointer-events: none;
    z-index: 0;
}

.projection-shell > * {
    position: relative;
    z-index: 1;
}

/* ===== Header ===== */
.projection-head {
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.projection-kicker {
    font-size: clamp(1rem, 1.55vw, 1.65rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: #eaffff;
    line-height: 1.05;
}

.projection-title {
    font-size: clamp(2.1rem, 4.35vw, 4.55rem);
    line-height: 0.96;
    margin: 0.3vh 0 0.18vh;
    color: #fff;
    text-shadow:
        0 0 12px rgba(0, 229, 255, 0.8),
        0 0 32px rgba(0, 229, 255, 0.35);
    white-space: nowrap;
}

.projection-sub {
    font-size: clamp(0.68rem, 1.05vw, 1.15rem);
    letter-spacing: 0.25em;
    color: #bcefff;
    line-height: 1.1;
}

#eventDate {
    color: #eaffff;
    margin-top: 0.38vh;
    font-size: clamp(0.78rem, 1vw, 1.08rem);
    font-weight: 900;
    letter-spacing: 0.06em;
}

/* ===== 大螢幕區 ===== */
.screen-frame {
    border-radius: 1.05vw;
    padding: 1.2vw 1.25vw;
    border: 1px solid rgba(0, 229, 255, 0.28);
    background:
        linear-gradient(135deg, rgba(7, 18, 35, 0.82), rgba(0, 28, 52, 0.5)),
        radial-gradient(circle at 58% 50%, rgba(0, 229, 255, 0.11), transparent 40%);
    box-shadow:
        0 0 42px rgba(0, 229, 255, 0.14),
        inset 0 0 32px rgba(0, 229, 255, 0.055);
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
    gap: 1.45vw;
    min-height: 0;
    overflow: hidden;
}

.screen-panel {
    min-height: 0;
    overflow: hidden;
    border-radius: 0.9vw;
    padding: 0.75vw 0.95vw;
    background: rgba(2, 12, 26, 0.22);
    border: 1px solid rgba(0, 229, 255, 0.08);
}

.screen-panel h2 {
    margin: 0 0 0.85vh;
    font-size: clamp(0.86rem, 1.14vw, 1.28rem);
    line-height: 1.15;
    letter-spacing: 0.06em;
    color: #00e5ff;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
}

/* ===== 圓餅圖區 ===== */
.chart-wrap {
    height: calc(100% - 3vh);
    max-height: 41vh;
    position: relative;
    display: grid;
    grid-template-columns: minmax(230px, 0.9fr) minmax(230px, 1fr);
    gap: 1.2vw;
    align-items: center;
}

.chart-box {
    height: min(36vh, 315px);
    min-height: 230px;
    position: relative;
}

.center-total {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 48%;
    text-align: center;
    color: #fff;
    pointer-events: none;
    font-size: clamp(0.68rem, 0.78vw, 0.9rem);
    line-height: 1.2;
}

.center-total b {
    display: block;
    font-size: clamp(2rem, 3.1vw, 3.8rem);
    margin-top: 0.2vh;
}

.legend-grid {
    display: grid;
    gap: 0.82vh;
    align-content: center;
}

.legend-item {
    display: grid;
    grid-template-columns: 1.05rem minmax(0, 1fr) 2.8rem;
    gap: 0.7vw;
    align-items: center;
    color: #d9f8ff;
    font-size: clamp(0.78rem, 0.95vw, 1.08rem);
    line-height: 1.1;
}

.legend-item b {
    text-align: right;
    font-size: clamp(0.9rem, 1.22vw, 1.42rem);
    color: #eaffff;
}

.dot {
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 0.22rem;
    box-shadow: 0 0 10px currentColor;
}

/* ===== 右側議程 ===== */
.timeline {
    display: grid;
    gap: 0.76vh;
    margin-top: 0.2vh;
}

.timeline-row {
    display: grid;
    grid-template-columns: 4.7vw minmax(0, 1fr);
    gap: 0.85vw;
    align-items: center;
}

.timeline-time {
    font-size: clamp(1.05rem, 1.55vw, 1.9rem);
    color: #00e5ff;
    font-weight: 900;
    line-height: 1;
    text-align: right;
    font-family: "Orbitron", "Microsoft JhengHei", sans-serif;
}

.timeline-card {
    padding: 0.62vw 0.85vw;
    min-height: 5.45vh;
    border-radius: 0.62vw;
    background: rgba(0, 229, 255, 0.075);
    border: 1px solid rgba(0, 229, 255, 0.18);
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: 0.25s ease;
}

.timeline-card b {
    font-size: clamp(0.82rem, 0.98vw, 1.08rem);
    color: #fff;
    line-height: 1.1;
}

.timeline-card span {
    display: block;
    color: #a8bdca;
    margin-top: 0.22vh;
    font-size: clamp(0.58rem, 0.7vw, 0.78rem);
    line-height: 1.15;
}

.timeline-row.active .timeline-time {
    color: #fff;
    text-shadow: 0 0 14px rgba(0, 229, 255, 0.9);
}

.timeline-row.active .timeline-card {
    background: linear-gradient(90deg, rgba(0, 229, 255, 0.28), rgba(0, 229, 255, 0.08));
    border-color: rgba(0, 229, 255, 0.72);
    box-shadow:
        0 0 24px rgba(0, 229, 255, 0.26),
        inset 0 0 18px rgba(0, 229, 255, 0.08);
}

.timeline-row.done .timeline-time {
    color: #7defff;
    opacity: 0.72;
}

.timeline-row.done .timeline-card {
    opacity: 0.58;
}

/* ===== 即時進度條 ===== */
.progress-panel {
    border-radius: 1vw;
    padding: 0.85vw 1.2vw;
    border: 1px solid rgba(0, 229, 255, 0.25);
    background: linear-gradient(135deg, rgba(8, 18, 34, 0.78), rgba(0, 31, 54, 0.42));
    box-shadow:
        0 0 26px rgba(0, 229, 255, 0.1),
        inset 0 0 24px rgba(0, 229, 255, 0.04);
    min-height: 0;
}

.progress-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1vw;
    margin-bottom: 0.75vh;
}

.progress-title {
    color: #00e5ff;
    font-size: clamp(0.82rem, 1.05vw, 1.18rem);
    font-weight: 900;
    letter-spacing: 0.08em;
}

.progress-desc {
    color: #9fb4c2;
    font-size: clamp(0.58rem, 0.72vw, 0.82rem);
    margin-top: 0.12vh;
}

.progress-now {
    color: #fff;
    font-size: clamp(0.74rem, 0.95vw, 1.02rem);
    font-weight: 800;
    text-align: right;
}

.progress-track {
    position: relative;
    height: 1vh;
    min-height: 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(0, 229, 255, 0.18);
    overflow: hidden;
}

.progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, #00e5ff, #4ade80);
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.72);
    transition: width 0.5s ease;
}

.progress-marker {
    position: absolute;
    top: 50%;
    width: 1.05rem;
    height: 1.05rem;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border: 3px solid #00e5ff;
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.9);
    left: 0%;
    transition: left 0.5s ease;
}

.progress-steps {
    margin-top: 0.68vh;
    position: relative;
    height: 3vh;
}

.progress-step {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    text-align: center;
    color: #b8c7d1;
    font-size: clamp(0.52rem, 0.65vw, 0.72rem);
    line-height: 1.15;
    min-width: 5.6vw;
}

.progress-step b {
    display: block;
    color: #00e5ff;
    font-size: clamp(0.66rem, 0.84vw, 0.95rem);
    margin-bottom: 0.05vh;
}

.progress-step.active {
    color: #fff;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
}

.progress-step.done {
    opacity: 0.55;
}

/* ===== 舞台 / 講台區 ===== */
.stage-area {
    position: relative;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
}

.stage-area::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 1.6vh;
    transform: translateX(-50%);
    width: 74vw;
    height: 8vh;
    border-radius: 50%;
    background:
        radial-gradient(ellipse at center, rgba(120, 210, 255, 0.32), rgba(0, 100, 190, 0.14) 42%, transparent 72%);
    filter: blur(1px);
}

.stage-floor {
    position: absolute;
    bottom: 0.2vh;
    left: 50%;
    transform: translateX(-50%);
    width: 66vw;
    height: 6vh;
    border-radius: 50% 50% 0 0;
    background:
        linear-gradient(180deg, rgba(40, 130, 200, 0.16), rgba(2, 8, 18, 0.88)),
        radial-gradient(ellipse at center, rgba(0, 229, 255, 0.22), transparent 62%);
    border-top: 1px solid rgba(120, 220, 255, 0.34);
    box-shadow: 0 -10px 35px rgba(0, 160, 255, 0.18);
}

.stage-light {
    position: absolute;
    bottom: 4vh;
    width: 14vw;
    height: 14vh;
    background: linear-gradient(180deg, rgba(140, 220, 255, 0.32), transparent);
    clip-path: polygon(48% 0, 56% 0, 100% 100%, 0 100%);
    filter: blur(1.8px);
    opacity: 0.52;
}

.stage-light.left {
    left: 31vw;
    transform: rotate(9deg);
}

.stage-light.right {
    right: 31vw;
    transform: rotate(-9deg);
}

.podium {
    position: relative;
    width: clamp(92px, 7.5vw, 135px);
    height: clamp(95px, 10vh, 132px);
    margin-bottom: 1vh;
    border-radius: 0.5rem 0.5rem 0.15rem 0.15rem;
    background:
        linear-gradient(180deg, rgba(6, 20, 38, 0.96), rgba(2, 9, 22, 0.98)),
        radial-gradient(circle at 50% 18%, rgba(0, 229, 255, 0.2), transparent 62%);
    border: 1px solid rgba(0, 229, 255, 0.35);
    box-shadow:
        0 0 26px rgba(0, 229, 255, 0.24),
        inset 0 0 22px rgba(0, 229, 255, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eaffff;
    text-align: center;
}

.podium::before {
    content: "";
    position: absolute;
    top: -0.75rem;
    width: 82%;
    height: 0.8rem;
    border-radius: 0.4rem 0.4rem 0.1rem 0.1rem;
    background: linear-gradient(90deg, rgba(0, 229, 255, 0.18), rgba(255, 255, 255, 0.28), rgba(0, 229, 255, 0.18));
    border: 1px solid rgba(0, 229, 255, 0.28);
}

.podium-logo {
    font-size: clamp(1.35rem, 1.7vw, 2rem);
    filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.7));
}

.podium-title {
    margin-top: 0.3vh;
    font-size: clamp(0.72rem, 0.9vw, 1rem);
    font-weight: 900;
    letter-spacing: 0.08em;
}

.podium-sub {
    margin-top: 0.05vh;
    font-size: clamp(0.42rem, 0.52vw, 0.6rem);
    color: #9eefff;
    letter-spacing: 0.06em;
}

/* ===== 小螢幕 fallback ===== */
@media (max-aspect-ratio: 4/3) {
    html,
    body {
        overflow: auto;
        height: auto;
    }

    .projection-shell {
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto auto auto auto;
        padding: 1.4rem;
    }

    .projection-title {
        white-space: normal;
    }

    .screen-frame {
        grid-template-columns: 1fr;
    }

    .chart-wrap {
        grid-template-columns: 1fr;
        height: auto;
        max-height: none;
    }

    .chart-box {
        height: 320px;
    }

    .stage-area {
        height: 150px;
    }
}
</style>
</head>

<body class="circuit-background">
<div class="ark-background"></div>

<main class="projection-shell">
    <header class="projection-head">
        <div class="projection-kicker" id="eventKicker">2026 全球面對面　智慧方舟 SMART WISDOM ARK</div>
        <h1 class="projection-title" id="projectionTitle">世代共榮的數位聚合</h1>

                <div class="chart-box">

                    <div class="center-total">
                        <div>共戰領航員<br>TOTAL NAVIGATORS</div>
                        <b id="totalText">XXX</b>
                    </div>

<script>
const params = new URLSearchParams(location.search);
const admin = params.get('admin') || 'admin';
const sheet = params.get('sheet') || '活動報到名單';
const q = `?admin=${encodeURIComponent(admin)}&sheet=${encodeURIComponent(sheet)}`;

const colors = ['#00e5ff', '#4ade80', '#ffa500', '#f87171', '#a78bfa', '#06b6d4', '#f472b6'];

let chart;
let scheduleRows = [];

function esc(v) {
    return String(v ?? '').replace(/[&<>"]/g, s => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
    }[s]));
}

function timeToMinutes(t) {
    const m = String(t || '').match(/(\d{1,2})[:：](\d{2})/);
    if (!m) return null;
    return Number(m[1]) * 60 + Number(m[2]);
}

function nowMinutes() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

async function boot() {
    let cfg = {};
    let sch = [];

    try {
        const r = await fetch('/api/event-config' + q);
        cfg = (await r.json()).config || {};
    } catch (e) {}

    try {
        const r = await fetch('/api/schedule' + q);
        sch = (await r.json()).schedule || [];
    } catch (e) {}

    renderConfig(cfg);
    renderSchedule(sch);
    await renderIndustry();

    updateProgress();
    setInterval(updateProgress, 30000);
    setInterval(renderIndustry, 30000);
}

function renderConfig(c) {
    document.getElementById('eventKicker').textContent =
        `${c.event_title || '2026 全球面對面'}　${c.brand_name || '智慧方舟 SMART WISDOM ARK'}`;

    document.getElementById('projectionTitle').textContent =
        c.projection_title || c.event_subtitle || '世代共榮的數位聚合';

    document.getElementById('projectionSub').textContent =
        c.projection_subtitle || 'DIGITAL CONVERGENCE FOR GENERATIONAL PROSPERITY';

    document.getElementById('eventDate').textContent =
        `${c.event_date_start || '2026/06/01'} ~ ${c.event_date_end || '2026/08/XX'}`;
}

function renderSchedule(rows) {
    if (!rows.length) {
        rows = [
            { time: '09:30', title: '報到啟航', description: '領航員迎賓報到' },
            { time: '10:00', title: '策略羅盤', description: '大師專題演講' },
            { time: '12:00', title: '方舟盛宴', description: '產業能量餐敘' },
            { time: '14:00', title: '引擎啟動', description: '戰略操盤與新品發表' },
            { time: '15:00', title: '跨世會談', description: '世代交鋒論壇' }
        ];
    }

    scheduleRows = rows
        .slice(0, 5)
        .map((r, i) => ({
            ...r,
            minutes: timeToMinutes(r.time),
            index: i
        }))
        .filter(r => r.minutes !== null);

    document.getElementById('timeline').innerHTML = scheduleRows.map(r => `
        <div class="timeline-row" data-index="${r.index}">
            <div class="timeline-time">${esc(r.time)}</div>
            <div class="timeline-card">
                <b>${esc(r.title)}</b>
                <span>${esc(r.description)}</span>
            </div>
        </div>
    `).join('');

    renderProgressSteps();
}

function getAgendaRange() {
    const first = scheduleRows[0]?.minutes ?? 570;
    const last = scheduleRows[scheduleRows.length - 1]?.minutes ?? 900;

    /*
      沒有結束時間欄位時，暫時推估最後一段 90 分鐘。
      例如最後 15:00，進度條結束點暫定 16:30。
    */
    const end = last + 90;

    return { first, last, end };
}

function getPercentFromMinutes(minutes) {
    const { first, end } = getAgendaRange();
    const span = Math.max(1, end - first);
    return Math.max(0, Math.min(100, ((minutes - first) / span) * 100));
}

function renderProgressSteps() {
    const steps = document.getElementById('progressSteps');

    steps.innerHTML = scheduleRows.map(r => {
        const pct = getPercentFromMinutes(r.minutes);
        return `
            <div class="progress-step" data-index="${r.index}" style="left:${pct}%">
                <b>${esc(r.time)}</b>
                ${esc(r.title)}
            </div>
        `;
    }).join('');
}

function findCurrentIndex(now) {
    if (!scheduleRows.length) return -1;

    if (now < scheduleRows[0].minutes) {
        return -1;
    }

    for (let i = scheduleRows.length - 1; i >= 0; i--) {
        if (now >= scheduleRows[i].minutes) {
            return i;
        }
    }

    return -1;
}

function updateProgress() {
    if (!scheduleRows.length) return;

    const now = nowMinutes();
    const d = new Date();
    const currentIndex = findCurrentIndex(now);
    const { end } = getAgendaRange();
    const pct = getPercentFromMinutes(now);

    document.getElementById('progressFill').style.width = `${pct}%`;
    document.getElementById('progressMarker').style.left = `${pct}%`;

    const current = currentIndex >= 0 ? scheduleRows[currentIndex] : scheduleRows[0];

    let statusText;

    if (currentIndex < 0) {
        statusText = `目前時間 ${pad2(d.getHours())}:${pad2(d.getMinutes())}｜尚未開始`;
    } else if (now > end) {
        statusText = `目前時間 ${pad2(d.getHours())}:${pad2(d.getMinutes())}｜議程已完成`;
    } else {
        statusText = `目前時間 ${pad2(d.getHours())}:${pad2(d.getMinutes())}｜進行中：${current.time} ${current.title}`;
    }

    document.getElementById('progressNow').textContent = statusText;

    document.querySelectorAll('.timeline-row, .progress-step').forEach(el => {
        const idx = Number(el.dataset.index);

        el.classList.toggle('active', idx === currentIndex);
        el.classList.toggle('done', currentIndex >= 0 && idx < currentIndex);
    });
}

async function renderIndustry() {
    let data = {
        '實體工業方舟': 28,
        '民生消費方舟': 22,
        '通路物流方舟': 18,
        '數位新方舟': 24,
        '其他產業': 8
    };

    try {
        const r = await fetch('/api/exhibitors' + q);
        const j = await r.json();

        if (j.industry_stats && Object.keys(j.industry_stats).length) {
            data = j.industry_stats;
        }
    } catch (e) {}

    const labels = Object.keys(data);
    const values = labels.map(k => Number(data[k] || 0));
    const total = values.reduce((a, b) => a + b, 0) || 'XXX';

    document.getElementById('totalText').textContent = total;

    document.getElementById('legendGrid').innerHTML = labels.map((l, i) => `
        <div class="legend-item">
            <span class="dot" style="background:${colors[i % colors.length]}; color:${colors[i % colors.length]}"></span>
            <span>${esc(l)}</span>
            <b>${values[i]}</b>
        </div>
    `).join('');

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(document.getElementById('industryChart'), {
        type: 'doughnut',
        data: {
            labels,
            datasets: [{
                data: values,
                backgroundColor: colors,
                borderColor: 'rgba(3, 10, 20, 0.92)',
                borderWidth: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '61%',
            animation: {
                duration: 500
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    enabled: true
                }
            }
        }
    });
}

boot();
</script>
