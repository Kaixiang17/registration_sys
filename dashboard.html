<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>智慧方舟 Projection Dashboard</title><link rel="stylesheet" href="smart-ark-theme.css?v=projection-1"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><style>
body{overflow:hidden}.projection-shell{width:100vw;height:100vh;padding:3.2vh 3vw;display:grid;grid-template-rows:auto 1fr auto;gap:2vh;background:radial-gradient(circle at 52% 50%,rgba(0,229,255,.13),transparent 26%)}.projection-head{text-align:center}.projection-kicker{font-size:1.5vw;font-weight:900;letter-spacing:.08em;color:#eaffff}.projection-title{font-size:4.2vw;line-height:1.05;margin:.3vh 0;color:#fff;text-shadow:0 0 18px rgba(0,229,255,.6)}.projection-sub{font-size:1.15vw;letter-spacing:.2em;color:#bcefff}.projection-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:1.8vw;min-height:0}.projection-panel{border-radius:1.15vw;padding:1.4vw;border:1px solid rgba(0,229,255,.24);background:linear-gradient(135deg,rgba(8,18,34,.82),rgba(0,31,54,.52));box-shadow:0 0 30px rgba(0,229,255,.12),inset 0 0 30px rgba(0,229,255,.04);min-height:0}.chart-wrap{height:52vh;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:1vw;align-items:center}.chart-box{height:44vh;position:relative}.center-total{position:absolute;left:25%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none}.center-total b{font-size:2.3vw}.legend-grid{display:grid;gap:.85vh}.legend-item{display:grid;grid-template-columns:1.7vw 1fr auto;gap:.7vw;align-items:center;color:#d9f8ff;font-size:1vw}.dot{width:1vw;height:1vw;border-radius:.25vw}.timeline{display:grid;gap:1.2vh;margin-top:1vh}.timeline-row{display:grid;grid-template-columns:5vw 1fr;gap:1vw;align-items:center}.timeline-time{font-size:1.35vw;color:#00e5ff;font-weight:900}.timeline-card{padding:.9vw 1vw;border-radius:.7vw;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.18)}.timeline-card b{font-size:1.1vw;color:#fff}.timeline-card span{display:block;color:#a8bdca;margin-top:.25rem;font-size:.8vw}.projection-bottom{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:1vw}.mini-title{font-size:1vw;color:#00e5ff;font-weight:900;margin-bottom:.5vh}.mini-box{min-height:12vh}.mini-box img{height:9vh;max-width:100%;object-fit:contain;border-radius:.5vw}.video-chip{display:flex;align-items:center;gap:.8vw}.play{width:3.4vw;height:3.4vw;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(0,229,255,.5);color:#00e5ff;font-size:1.4vw}.flow-strip{display:flex;justify-content:space-between;gap:.5vw;color:#d9f8ff}.flow-step{text-align:center;font-size:.72vw}.flow-step b{display:block;color:#00e5ff;font-size:.86vw}@media(max-aspect-ratio: 4/3){body{overflow:auto}.projection-shell{height:auto}.projection-grid,.projection-bottom{grid-template-columns:1fr}.chart-wrap{grid-template-columns:1fr;height:auto}.chart-box{height:320px}.center-total{display:none}}
</style></head><body class="circuit-background"><div class="ark-background"></div><main class="projection-shell"><header class="projection-head"><div class="projection-kicker" id="eventKicker">2026 全球面對面　智慧方舟</div><h1 class="projection-title" id="projectionTitle">世代共榮的數位聚合</h1><div class="projection-sub" id="projectionSub">DIGITAL CONVERGENCE FOR GENERATIONAL PROSPERITY</div><div style="color:#eaffff;margin-top:1vh;font-weight:900" id="eventDate">2026/06/01 ~ 2026/08/XX</div></header><section class="projection-grid"><div class="projection-panel"><h2 class="neon-text">【 智匯方舟｜實時登艦產業生態分佈 】</h2><div class="chart-wrap"><div class="chart-box"><canvas id="industryChart"></canvas><div class="center-total"><div>共戰領航員<br>TOTAL NAVIGATORS</div><b id="totalText">XXX</b></div></div><div class="legend-grid" id="legendGrid"></div></div></div><div class="projection-panel"><h2 class="neon-text">【 2026 進化航線｜大會時空座標 】</h2><div class="timeline" id="timeline"></div></div></section><section class="projection-bottom"><div class="projection-panel mini-box"><div class="mini-title">紀念品圖文說明</div><div id="giftPreview">後台可設定紀念品圖片與說明</div></div><div class="projection-panel mini-box"><div class="mini-title">紀念品影片連結</div><div class="video-chip"><div class="play">▶</div><div id="videoPreview">YouTube / Vimeo / 外部連結</div></div></div><div class="projection-panel mini-box"><div class="mini-title">流程希望呈現的圖片</div><div class="flow-strip" id="flowStrip"></div></div></section></main><script>
const params=new URLSearchParams(location.search);const admin=params.get('admin')||'admin';const sheet=params.get('sheet')||'活動報到名單';const q=`?admin=${encodeURIComponent(admin)}&sheet=${encodeURIComponent(sheet)}`;const colors=['#00e5ff','#4ade80','#ffa500','#f87171','#a78bfa','#06b6d4','#f472b6'];let chart;
function esc(v){return String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]))}
async function boot(){let cfg={};let sch=[];try{const r=await fetch('/api/event-config'+q);cfg=(await r.json()).config||{};}catch(e){}try{const r=await fetch('/api/schedule'+q);sch=(await r.json()).schedule||[];}catch(e){}renderConfig(cfg);renderSchedule(sch);await renderIndustry();}
function renderConfig(c){document.getElementById('eventKicker').textContent=`${c.event_title||'2026 全球面對面'}　${c.brand_name||'智慧方舟'}`;document.getElementById('projectionTitle').textContent=c.projection_title||c.event_subtitle||'世代共榮的數位聚合';document.getElementById('projectionSub').textContent=c.projection_subtitle||'DIGITAL CONVERGENCE FOR GENERATIONAL PROSPERITY';document.getElementById('eventDate').textContent=`${c.event_date_start||'2026/06/01'} ~ ${c.event_date_end||'2026/08/XX'}`;document.getElementById('giftPreview').innerHTML=c.gift_image_url?`<img src="${esc(c.gift_image_url)}"><div style="color:#b8c7d1;margin-top:.4vh">${esc(c.gift_title||'方舟物資艙')}</div>`:esc(c.gift_description||'後台可設定紀念品圖片與說明');document.getElementById('videoPreview').textContent=c.video_url?'影片連結已設定':'YouTube / Vimeo / 外部連結';}
function renderSchedule(rows){if(!rows.length)rows=[{time:'09:30',title:'報到啟航',description:'領航員迎賓報到'},{time:'10:00',title:'策略羅盤',description:'大師專題演講'},{time:'12:00',title:'方舟盛宴',description:'產業能量餐敘'},{time:'14:00',title:'引擎啟動',description:'戰略操盤與新品發表'},{time:'15:00',title:'跨世會談',description:'世代交鋒論壇'}];document.getElementById('timeline').innerHTML=rows.map(r=>`<div class="timeline-row"><div class="timeline-time">${esc(r.time)}</div><div class="timeline-card"><b>${esc(r.title)}</b><span>${esc(r.description)}</span></div></div>`).join('');document.getElementById('flowStrip').innerHTML=rows.slice(0,5).map(r=>`<div class="flow-step"><b>${esc(r.time)}</b>${esc(r.title)}</div>`).join('')}
async function renderIndustry(){let data={'實體工業方舟':28,'民生消費方舟':22,'通路物流方舟':18,'數位新方舟':24,'其他產業':8};try{const r=await fetch('/api/exhibitors'+q);const j=await r.json();if(j.industry_stats&&Object.keys(j.industry_stats).length)data=j.industry_stats;}catch(e){}const labels=Object.keys(data), values=labels.map(k=>Number(data[k]||0)), total=values.reduce((a,b)=>a+b,0)||'XXX';document.getElementById('totalText').textContent=total;document.getElementById('legendGrid').innerHTML=labels.map((l,i)=>`<div class="legend-item"><span class="dot" style="background:${colors[i%colors.length]}"></span><span>${esc(l)}</span><b>${values[i]}</b></div>`).join('');chart=new Chart(document.getElementById('industryChart'),{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors,borderColor:'rgba(3,10,20,.92)',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false}}}})}boot();setInterval(()=>renderIndustry(),30000);
</script></body></html>
