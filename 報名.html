<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 航空登機系統</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Michroma", sans-serif; }
        body { line-height: 1.6; color: #fff; }
        header { padding: 1.2rem 0; position: sticky; top: 0; z-index: 100; background: rgba(10,20,35,0.8); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .state-hidden { display: none !important; }
        
        .verify-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 2rem; }
        .verify-card { padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; border-radius: 1rem; }
        .form-card { max-width: 600px; margin: 0 auto; padding: 3rem; text-align: center; border-radius: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2.5rem; }
        .product-img { width: 100%; height: 220px; object-fit: contain; background: rgba(0,0,0,0.4); }
        
        .btn-back-nav { background: none; border: 1px solid var(--accent-gray); color: var(--text-dark); padding: 0.5rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: bold; margin-bottom: 1.5rem; }
        .cyber-input { width: 100%; margin-bottom: 1.5rem; padding: 1.2rem; font-size: 1.2rem; }
        
        .group-item { padding: 1.5rem; border-bottom: 1px solid rgba(0,229,255,0.2); cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .group-item:hover { background: rgba(0,229,255,0.1); }
        
        .meal-selected, .is-original-selected { 
            border-color: #00e5ff !important; background: rgba(0, 229, 255, 0.3) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6); font-weight: bold !important;
        }
        .proxy-selected { border-color: #ffa500 !important; background: rgba(255, 165, 0, 0.25) !important; box-shadow: 0 0 15px rgba(255, 165, 0, 0.5) !important; }
        .info-box { text-align: left; padding: 1.5rem; border-radius: 1rem; margin: 1.5rem 0; background: rgba(0,0,0,0.3); }

        .ck-btn {
            display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 0.95rem 1.5rem;
            font-family: inherit; font-size: 1.05rem; font-weight: 700; letter-spacing: 2px; border-radius: 0.75rem;
            border: 1px solid rgba(0,229,255,0.5); color: #00e5ff; background: rgba(0,229,255,0.08); cursor: pointer;
        }
        .ck-btn:hover:not(:disabled) { background: rgba(0,229,255,0.18); box-shadow: 0 0 16px rgba(0,229,255,0.25); }
        .ck-btn-confirm { border-color: rgba(74,222,128,0.6); color: #4ade80; background: rgba(74,222,128,0.1); font-size: 1.1rem; }
        .ck-btn-confirm:hover:not(:disabled) { background: rgba(74,222,128,0.22); box-shadow: 0 0 20px rgba(74,222,128,0.3); }
        .ck-btn-warn { border-color: rgba(255,165,0,0.55); color: #ffa500; background: rgba(255,165,0,0.08); }
        .ck-btn-ghost { border-color: rgba(255,255,255,0.15); color: #888; background: transparent; }
        .ck-btn-pill { width: auto; padding: 0.4rem 1rem; font-size: 0.82rem; border-radius: 20px; border: 1px solid rgba(0,229,255,0.3); color: #00e5ff; background: rgba(0,229,255,0.06); cursor: pointer; }
        .ck-tag { padding: 0.35rem 1rem; border-radius: 20px; font-size: 0.82rem; border: 1px solid rgba(0,229,255,0.25); color: #aaa; cursor: pointer; }

        @media(max-width: 768px) {
            .verify-grid { grid-template-columns: 1fr !important; }
            .form-card { padding: 1.5rem 1rem !important; }
        }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>

    <div id="splash-screen" onclick="startRegistration()">
        <div class="click-hint">點 擊 畫 面 登 錄 報 到</div>
    </div>

    <div id="banner-container" style="width: 100%; max-width: 1200px; margin: 0 auto; display: none;">
        <img id="event-banner" src="" style="width: 100%; border-radius: 0 0 15px 15px;">
    </div>

    <header class="panel-border" style="border-top:none; border-left:none; border-right:none;">
        <div class="header-container">
            <div onclick="resetToHome()" style="cursor:pointer; font-weight: bold; display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 1.3rem;">✈️</span>
                <span id="header-title" class="header-title-text" style="font-size: 1.15rem; letter-spacing: 2px;">航 班 大 廳</span>
            </div>
            <div style="display:flex; gap:10px;">
                <button id="mapBtn" class="ck-btn-pill" onclick="toggleMapModal(true)">🗺️ 會場導覽</button>
                <button id="shopBtn" class="ck-btn-pill" onclick="goToShop()" style="display:none;">🛒 補給專區</button>
            </div>
        </div>
    </header>

    <main>
        <div id="methodSelectionState" class="state-hidden">
            <div style="text-align:center; max-width:800px; margin: 0 auto;">
                <h2 class="neon-text" style="font-size: 2.2rem; margin-bottom:1rem;">請 選 擇 報 到 驗 證 行 程</h2>
                <div class="verify-grid">
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('name', '姓名')">
                        <div style="font-size:3.5rem;">📝</div><h3 class="neon-text">姓 名 檢 索</h3>
                    </div>
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('phone', '手機')">
                        <div style="font-size:3.5rem;">📱</div><h3 class="neon-text">手 機 檢 索</h3>
                    </div>
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('email', 'Email')">
                        <div style="font-size:3.5rem;">✉️</div><h3 class="neon-text">電子郵件</h3>
                    </div>
                    <div class="verify-card cyber-card cyber-hover" onclick="prepareSearch('company', '公司')">
                        <div style="font-size:3.5rem;">🏢</div><h3 class="neon-text">隸屬單位</h3>
                    </div>
                </div>
            </div>
        </div>

        <div id="actionState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('methodSelection')">← 返回大廳</button>
            <div class="form-card cyber-card">
                <h2 id="actionTitle" class="neon-text" style="margin-bottom: 2.5rem; font-size: 2.5rem;">身 份 核 對</h2>
                <input type="text" id="actionInput" class="cyber-input" placeholder="請填寫資料內容">
                <button class="ck-btn" onclick="handleAction()">🔍 發 動 雲 端 檢 索</button>
            </div>

            <div id="tempRegistrationSection" class="form-card cyber-card state-hidden" style="margin-top: 2rem; border: 2px solid #ffa500 !important; text-align: left;">
                <h3 style="color: #ffa500; font-size: 1.3rem; margin-bottom: 1.5rem; text-align: center;">⚠️ 查無預約名單！是否啟動現場補位報到？</h3>
                <div style="margin-bottom: 1.2rem;"><label style="color:#ffa500;">旅客姓名 *</label><input type="text" id="addName" class="cyber-input" style="margin-bottom:0;"></div>
                <div style="margin-bottom: 1.2rem;"><label style="color:#ffa500;">行動電話 *</label><input type="text" id="addPhone" class="cyber-input" style="margin-bottom:0;"></div>
                <div style="margin-bottom: 1.2rem;"><label style="color:#aaa;">服務單位</label><input type="text" id="addCompany" class="cyber-input" style="margin-bottom:0;"></div>
                <div style="margin-bottom: 1.5rem;"><label style="color:#aaa;">特定桌號需求</label><input type="text" id="addSeat" class="cyber-input" placeholder="留空由大會現場分配" style="margin-bottom:0;"></div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="color:#aaa;">機上膳食偏好</label>
                    <div id="tempMealRadioGroup" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;">
                        <button type="button" class="verify-card cyber-card meal-opt-temp temp-meal-selected" onclick="selectTempMeal(this, '葷食')" style="padding:1rem 0; font-size:0.9rem; background:rgba(0,0,0,0.3); border:1px solid var(--accent-gray); color:#fff;">🥩 葷食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" onclick="selectTempMeal(this, '素食')" style="padding:1rem 0; font-size:0.9rem; background:rgba(0,0,0,0.3); border:1px solid var(--accent-gray); color:#fff;">🥬 素食</button>
                        <button type="button" class="verify-card cyber-card meal-opt-temp" onclick="selectTempMeal(this, '不需餐食')" style="padding:1rem 0; font-size:0.9rem; background:rgba(0,0,0,0.3); border:1px solid var(--accent-gray); color:#fff;">❌ 無需餐食</button>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button class="ck-btn ck-btn-warn" onclick="submitAddRegistration()">✓ 現場補位登機</button>
                    <button class="ck-btn ck-btn-ghost" onclick="hideTempSection()">取消</button>
                </div>
            </div>
        </div>

        <div id="groupListState" class="state-hidden">
            <button class="btn-back-nav" onclick="setAppState('action')">← 重新檢索</button>
            <div class="form-card cyber-card" style="max-width: 700px;">
                <h2 id="groupName" class="neon-text" style="margin-bottom: 1.5rem;">請選擇對應成員</h2>
                <div id="groupList" style="background: rgba(0,0,0,0.3); border-radius: 1rem; overflow: hidden;"></div>
            </div>
        </div>

        <div id="mealState" class="state-hidden">
            <button class="btn-back-nav" onclick="resetToHome()">← 放棄報到</button>
            <div class="form-card cyber-card">
                <h2 class="neon-text" style="margin-bottom:2rem;">🍽️ 餐 點 與 權 限 聲 明</h2>
                <div id="mealOptions"></div>
                <button id="finalBtn" class="ck-btn ck-btn-confirm" disabled onclick="submitCheckin()">✈️ 核 發 雲 端 數 位 登 機 證</button>
            </div>
        </div>

        <div id="successState" class="state-hidden">
            <div class="form-card cyber-card">
                <div style="color:#4ade80; font-size:6rem;">✅</div>
                <h2 class="neon-text">手 續 完 成 ！</h2>
                <div id="successInfo" class="info-box panel-border"></div>
                <button class="ck-btn ck-btn-ghost" onclick="resetToHome()" style="max-width:260px; margin:0 auto;">← 返回大廳</button>
            </div>
        </div>

        <div id="productState" class="state-hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem;">
                <h1 class="neon-text" style="font-size: 2.2rem;">🛍️ 雲端航空商品特展區</h1>
                <button class="ck-btn-pill ck-btn-ghost" onclick="resetToHome()">← 返回大廳</button>
            </div>
            <div id="giftsSection" class="state-hidden">
                <h2 class="neon-text" style="margin-bottom: 1.5rem;">🎁 專屬大會貴賓禮遇</h2>
                <div id="giftsGrid" class="products-grid"></div>
            </div>
            <div id="normalProductsSection" style="margin-top: 3rem;">
                <h2 class="neon-text" style="margin-bottom: 1.5rem;">📚 精選航空補給品</h2>
                <div id="categoryFilters" style="margin-bottom: 2.5rem; display: flex; flex-wrap: wrap; gap: 0.8rem;"></div>
                <div id="productsGrid" class="products-grid"></div>
            </div>
        </div>
    </main>

    <div id="mapModal" class="state-hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center;">
        <div style="position: relative; width: 90%; height: 85vh; max-width: 1200px; display: flex; flex-direction: column;">
            <button onclick="toggleMapModal(false)" style="align-self: flex-end; margin-bottom: 10px; background: #00e5ff; color: #000; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">✕ 關閉會場導覽</button>
            <div style="flex-grow: 1; background: #0a1423; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center;">
                <img id="mapDisplayImage" src="" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentSheet = urlParams.get('event') || urlParams.get('sheet') || '';
        const currentAdmin = urlParams.get('admin') || 'admin';
        const API_BASE = '/api';
        let searchMethod = '', selectedUser = null, systemConfig = null;
        window.allProducts = [];
        window.currentCategory = '全部';
        window.selectedTempMealChoice = '葷食';

        window.onload = function() { if (!currentSheet) { fetchCurrentSheet(); } else { initSystem(); } };

        function fetchCurrentSheet() {
            fetch(`${API_BASE}/current_sheet?admin=${encodeURIComponent(currentAdmin)}`)
                .then(res => res.json())
                .then(data => { if (data.success && data.current_sheet !== currentSheet) { currentSheet = data.current_sheet; initSystem(); } });
        }

        function initSystem() { loadSystemConfig(); document.title = `${currentSheet} - 安全報到系統`; }
        function startRegistration() { document.getElementById('splash-screen').style.display = 'none'; setAppState('methodSelection'); document.getElementById('shopBtn').style.display = 'block'; }
        function goToShop() { showProducts(); }
        function hideTempSection() { document.getElementById('tempRegistrationSection').classList.add('state-hidden'); }
        function setAppState(s) { ['methodSelection', 'action', 'groupList', 'meal', 'success', 'product'].forEach(x => document.getElementById(x+'State').classList.add('state-hidden')); document.getElementById(s+'State').classList.remove('state-hidden'); hideTempSection(); window.scrollTo(0, 0); }
        function resetToHome() { setAppState('methodSelection'); }

        function selectTempMeal(el, m) {
            window.selectedTempMealChoice = m;
            document.querySelectorAll('#tempMealRadioGroup .meal-opt-temp').forEach(b => { b.style.borderColor = 'var(--accent-gray)'; b.style.background = 'rgba(0,0,0,0.3)'; b.style.color = '#fff'; });
            el.style.borderColor = '#ffa500'; el.style.background = 'rgba(255,165,0,0.2)'; el.style.color = '#ffa500';
        }

        async function submitAddRegistration() {
            const data = { name: document.getElementById('addName').value.trim(), phone: document.getElementById('addPhone').value.trim(), company: document.getElementById('addCompany').value.trim(), seat: document.getElementById('addSeat').value.trim() || '現場安排', meal: window.selectedTempMealChoice, admin: currentAdmin, sheet: currentSheet };
            if(!data.name || !data.phone) return alert('❌ 請完整填寫姓名與聯絡電話！');
            const res = await fetch('/api/registrations/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if((await res.json()).success) { alert(`🎉 現場隨選登機補位成功！歡迎會場交流。`); resetToHome(); }
        }

        function prepareSearch(method, label) { searchMethod = method; document.getElementById('actionTitle').textContent = `請輸入您預約的${label}`; document.getElementById('actionInput').value = ''; setAppState('action'); }

        async function handleAction() {
            const val = document.getElementById('actionInput').value.trim();
            if(!val) return;
            hideTempSection();
            
            try {
                const res = await fetch(`${API_BASE}/search/${searchMethod}?${searchMethod}=${encodeURIComponent(val)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                const json = await res.json();
                if (json.data && json.data.length > 0) {
                    if (searchMethod === 'company') renderCompanyList(json.data);
                    else if (json.data.length === 1) {
                        const u = json.data[0];
                        if (u.status === 'checked_in' || u.status === '已報到' || u.status === '替代') { alert('🛬 此身份日前已完成驗證登機！'); return; }
                        selectedUser = u; renderMealOptions();
                    } else { renderUserList(json.data, '搜尋相似結果'); }
                } else {
                    document.getElementById('addName').value = searchMethod === 'name' ? val : '';
                    document.getElementById('addPhone').value = searchMethod === 'phone' ? val : '';
                    document.getElementById('addCompany').value = searchMethod === 'company' ? val : '';
                    document.getElementById('addSeat').value = '';
                    document.getElementById('tempRegistrationSection').classList.remove('state-hidden');
                }
            } catch(e) { alert('雲端通訊阻斷'); }
        }

        function renderCompanyList(companies) {
            const list = document.getElementById('groupList'); list.innerHTML = '';
            companies.forEach(c => {
                const div = document.createElement('div'); div.className = 'group-item'; div.innerHTML = `<span>🏢 ${c}</span><span>➔</span>`;
                div.onclick = async () => {
                    const res = await fetch(`${API_BASE}/search/company_members?name=${encodeURIComponent(c)}&admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
                    renderUserList((await res.json()).data, c);
                };
                list.appendChild(div);
            });
            document.getElementById('groupName').textContent = '請選擇您的所屬單位群組'; setAppState('groupList');
        }

        function renderUserList(users, title) {
            const list = document.getElementById('groupList'); list.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div'); div.className = 'group-item';
                const isReg = (u.status === 'checked_in' || u.status === '已報到' || u.status === '替代');
                div.innerHTML = `<div><div style="font-weight:bold; font-size:1.2rem;">${u.name}</div><div style="font-size:0.9rem; color:#aaa;">${u.company}</div></div>${isReg ? '<span style="color:#f87171">[已完成驗證]</span>' : '<span>➔</span>'}`;
                div.onclick = () => { if (isReg) alert('該員已登機！'); else { selectedUser = u; renderMealOptions(); } };
                list.appendChild(div);
            });
            document.getElementById('groupName').textContent = title; setAppState('groupList');
        }

        async function renderMealOptions() {
            const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
            systemConfig = await res.json();
            if (!systemConfig.show_meal_options) { submitCheckin('不需要'); return; }
            
            document.getElementById('mealOptions').innerHTML = `
                <div style="margin-bottom:2rem; text-align:left; padding:1rem; background:rgba(0,229,255,0.1); border-radius:0.5rem;">
                    <div style="font-size:0.8rem; color:#00e5ff;">報到貴賓姓名</div><div style="font-size:1.4rem; font-weight:bold;">${selectedUser.name}</div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:2rem;">
                    <div id="btnOrig" class="verify-card cyber-card is-original-selected" onclick="toggleIdentity(true)">親自出席報到</div>
                    <div id="btnProxy" class="verify-card cyber-card" onclick="toggleIdentity(false)">代理同仁出席</div>
                </div>
                <div id="proxyForm" class="state-hidden" style="margin-bottom:2rem; border:1px solid #ffa500; padding:1.5rem; border-radius:1rem; text-align:left;">
                    <p style="color:#ffa500; margin-bottom:1rem;">填寫代理同仁基本核對資料：</p>
                    <input type="text" id="proxyName" class="cyber-input" placeholder="代理人姓名" style="margin-bottom:0.8rem;">
                    <input type="text" id="proxyPhone" class="cyber-input" placeholder="代理人聯絡手機">
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;">
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '葷食')" style="padding:1.2rem 0; font-weight:bold;">🥩 葷食偏好</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '素食')" style="padding:1.2rem 0; font-weight:bold;">🥬 全素偏好</div>
                    <div class="verify-card cyber-card meal-opt" onclick="selectMeal(this, '不需餐食')" style="padding:1.2rem 0; font-weight:bold;">❌ 無需用膳</div>
                </div>`;
            window.selectedMeal = null; window.isOriginal = true;
            document.getElementById('finalBtn').disabled = true; setAppState('meal');
        }

        function toggleIdentity(o) { window.isOriginal = o; document.getElementById('btnOrig').classList.toggle('is-original-selected', o); document.getElementById('btnProxy').classList.toggle('proxy-selected', !o); document.getElementById('proxyForm').classList.toggle('state-hidden', o); checkMealReady(); }
        function selectMeal(el, m) { document.querySelectorAll('.meal-opt').forEach(x => x.classList.remove('meal-selected')); el.classList.add('meal-selected'); window.selectedMeal = m; checkMealReady(); }
        function checkMealReady() { document.getElementById('finalBtn').disabled = !window.selectedMeal; }

        async function submitCheckin(autoMeal) {
            const meal = autoMeal || window.selectedMeal;
            const proxyInfo = window.isOriginal ? {} : { name: document.getElementById('proxyName').value.trim(), phone: document.getElementById('proxyPhone').value.trim() };
            if (!window.isOriginal && !proxyInfo.name) return alert('請填寫代理人姓名');
            
            const btn = document.getElementById('finalBtn'); btn.disabled = true; btn.innerHTML = '<span>加密驗證核對中...</span>';
            
            try {
                const res = await fetch(`${API_BASE}/checkin/${selectedUser.id}?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ meal, is_original: window.isOriginal, proxy_info: proxyInfo }) });
                const json = await res.json();
                if (json.success) {
                    const u = json.data;
                    document.getElementById('successInfo').innerHTML = `
                        <div style="margin-bottom:0.5rem;">旅客座艙：<b>${u.name}</b></div>
                        <div style="margin-bottom:0.5rem;">所屬 fleet：${u.company}</div>
                        <div style="margin-bottom:0.5rem;">大會席次：<span style="font-size:1.5rem; color:#00e5ff; font-weight:bold;">${u.seat}</span></div>
                        <div style="margin-bottom:0.5rem;">餐點指派：<span style="color:#4ade80; font-weight:bold;">${u.meal}</span></div>
                        <div>核發時戳：${u.checkedInAt}</div>`;
                    setAppState('success');
                } else { alert('登記手續遭拒'); btn.disabled = false; }
            } catch(e) { alert('大氣通訊異常'); btn.disabled = false; }
        }

        async function showProducts() {
            const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
            const config = await res.json(); window.allProducts = config.products || [];
            const gifts = window.allProducts.filter(p => p.isGift);
            
            if (gifts.length > 0) { document.getElementById('giftsSection').classList.remove('state-hidden'); renderGrid('giftsGrid', gifts); }
            else document.getElementById('giftsSection').classList.add('state-hidden');
            
            const cats = ['全部', ...new Set(window.allProducts.filter(p => !p.isGift).map(p => p.category).filter(c => c))];
            document.getElementById('categoryFilters').innerHTML = cats.map(c => `<button class="ck-tag" onclick="filterCategory('${c}')">${c}</button>`).join('');
            filterCategory('全部'); setAppState('product');
        }

        function filterCategory(cat) {
            const filtered = cat === '全部' ? window.allProducts.filter(p => !p.isGift) : window.allProducts.filter(p => !p.isGift && p.category === cat);
            renderGrid('productsGrid', filtered);
        }

        function renderGrid(id, items) {
            document.getElementById(id).innerHTML = items.map(p => `
                <div class="cyber-card" style="padding:0; overflow:hidden; display:flex; flex-direction:column;">
                    ${p.image ? `<img src="${p.image}" class="product-img">` : '<div class="product-img" style="display:flex; align-items:center; justify-content:center; font-size:3rem;">📦</div>'}
                    <div style="padding:1.5rem; flex-grow:1; display:flex; flex-direction:column;">
                        <div style="color:#00e5ff; font-size:0.8rem; margin-bottom:0.5rem;"># ${p.category || '全域'}</div>
                        <h3 style="margin-bottom:0.8rem;">${p.name}</h3>
                        <p style="font-size:0.9rem; color:#ccc; margin-bottom:1.5rem; flex-grow:1;">${p.description || ''}</p>
                        ${p.link ? `<a href="${p.link}" target="_blank" class="ck-btn" style="text-decoration:none; padding:0.7rem; font-size:0.9rem;">查看專屬資訊 →</a>` : ''}
                    </div>
                </div>`).join('');
        }

        async function loadSystemConfig() {
            const res = await fetch(`${API_BASE}/config?admin=${encodeURIComponent(currentAdmin)}&sheet=${encodeURIComponent(currentSheet)}`);
            systemConfig = await res.json();
            if(systemConfig && systemConfig.google_sheet_name) document.getElementById('header-title').textContent = systemConfig.google_sheet_name;
            if(systemConfig && systemConfig.banner_image_url) { document.getElementById('event-banner').src = systemConfig.banner_image_url; document.getElementById('banner-container').style.display = 'block'; }
        }

        async function toggleMapModal(show) {
            const modal = document.getElementById('mapModal');
            if (show) {
                if(systemConfig && systemConfig.map_image_url) { document.getElementById('mapDisplayImage').src = systemConfig.map_image_url; modal.classList.remove('state-hidden'); }
                else alert('大會後台尚未發布會場平面配置圖。');
            } else modal.classList.add('state-hidden');
        }
    </script>
</body>
</html>
