<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 艦橋管理中心</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Michroma", "Stick", "PingFang TC", sans-serif; }
        body { line-height: 1.6; min-height: 100vh; color: #fff; overflow-x: hidden; }
        
        /* 頂部導覽列優化 */
        header { 
            background: rgba(10, 20, 35, 0.85); 
            border-bottom: 1px solid var(--accent-gray); 
            padding: 1rem 0; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            backdrop-filter: blur(15px);
        }
        .header-container { max-width: 1240px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .btn-link { 
            color: var(--text-dark); 
            text-decoration: none; 
            font-size: 0.85rem; 
            padding: 0.6rem 1.2rem; 
            border-radius: 20px; 
            transition: 0.3s; 
            border: 1px solid var(--text-dark);
            font-weight: bold;
        }
        .btn-link:hover { background: var(--text-dark); color: #000; box-shadow: 0 0 15px var(--text-glow); }

        main { max-width: 1240px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* 標籤頁導覽優化 */
        .tabs { display: flex; gap: 0.8rem; margin-bottom: 2.5rem; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 0.5rem; }
        .tab-btn { 
            padding: 0.8rem 1.8rem; 
            background: none; 
            border: none; 
            font-size: 1rem; 
            font-weight: 600; 
            color: #666; 
            cursor: pointer; 
            transition: 0.3s;
            position: relative;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: var(--text-dark); text-shadow: 0 0 8px var(--text-glow); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -0.6rem; left: 0; width: 100%; height: 3px;
            background: var(--text-dark); box-shadow: 0 0 10px var(--text-glow);
        }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        /* 戰情室數據卡片：能量環風格 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .stat-card { 
            padding: 2.5rem 1.5rem; 
            text-align: center; 
            border-radius: 1.5rem; 
            background: rgba(10, 20, 35, 0.6) !important;
            border: 1px solid var(--accent-gray) !important;
            position: relative;
        }
        .stat-label { font-size: 0.9rem; letter-spacing: 2px; color: rgba(255,255,255,0.6); margin-bottom: 1rem; }
        .stat-value { font-size: 3.5rem; font-weight: bold; color: var(--text-dark); text-shadow: 0 0 20px var(--text-glow); }
        
        /* 桌號統計區塊優化 */
        .table-stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.2rem; }
        .table-mini-card { 
            background: rgba(0, 229, 255, 0.03); 
            border: 1px solid rgba(0, 229, 255, 0.15); 
            padding: 1.2rem; 
            border-radius: 1rem; 
            text-align: center;
            transition: 0.3s;
        }
        .table-mini-card:hover { border-color: var(--text-dark); background: rgba(0, 229, 255, 0.08); }

        /* 紀錄表格優化 */
        .cyber-table-wrapper { border-radius: 1rem; overflow: hidden; border: 1px solid var(--accent-gray); background: rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(0, 229, 255, 0.1); color: var(--text-dark); padding: 1.2rem; text-align: left; font-size: 0.9rem; letter-spacing: 1px; }
        td { padding: 1rem 1.2rem; border-bottom: 1px solid rgba(0, 229, 255, 0.1); font-size: 0.95rem; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* 表單排版優化 */
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-dark); font-size: 0.95rem; font-weight: bold; }

        /* 商品管理項目優化 */
        .product-item { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 1.2rem; 
            margin-bottom: 1rem; 
            border-radius: 1rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: 0.3s;
        }
        .product-item:hover { border-color: var(--text-dark); background: rgba(0, 229, 255, 0.05); }

        /* 彈窗排版優化 */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .modal-content { max-width: 550px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 2.5rem; border-radius: 1.5rem; }

        /* 訊息提示優化 */
        .alert { 
            position: fixed; top: 5rem; right: 2rem; padding: 1rem 2rem; border-radius: 0.5rem; 
            z-index: 1000; animation: slideIn 0.3s ease; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .alert-success { background: #16a34a; border-left: 5px solid #4ade80; }
        .alert-danger { background: #dc2626; border-left: 5px solid #f87171; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>
    <header class="panel-border">
        <div class="header-container">
            <div>
                <span class="neon-text" style="font-size: 1.4rem; letter-spacing: 3px;">BRIDGE CONTROL</span>
                <span style="color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-left: 10px;">艦橋指揮中心 V2.0</span>
            </div>
            <div class="header-actions">
                <a class="btn-link" href="/">📋 系統首頁</a>
                <a class="btn-link" href="/api/logout" style="border-color: #ff4d4d; color: #ff4d4d;">🚪 安全登出</a>
            </div>
        </div>
    </header>

    <main>
        <div id="messageContainer"></div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">📊 實時戰情</button>
            <button class="tab-btn" data-tab="products">🛍️ 補給物資</button>
            <button class="tab-btn" data-tab="system">⚙️ 核心設定</button>
        </div>

        <div id="dashboard" class="tab-content active">
            <div class="dashboard-grid">
                <div class="stat-card cyber-card">
                    <div class="stat-label">TOTAL EXPECTED / 應到人數</div>
                    <div id="stat-total" class="stat-value">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-bottom: 4px solid #4ade80 !important;">
                    <div class="stat-label">CHECKED IN / 已報到</div>
                    <div id="stat-checked" class="stat-value" style="color: #4ade80;">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-bottom: 4px solid #f87171 !important;">
                    <div class="stat-label">PENDING / 待報到</div>
                    <div id="stat-pending" class="stat-value" style="color: #f87171;">0</div>
                </div>
            </div>

            <div class="cyber-card" style="padding: 2.5rem; margin-bottom: 2.5rem;">
                <h2 class="neon-text" style="margin-bottom: 2rem; font-size: 1.3rem;">📊 各桌報到率概況</h2>
                <div id="table-stats-container" class="table-stats-grid"></div>
            </div>

            <div class="cyber-card" style="padding: 2rem;">
                <h2 class="neon-text" style="margin-bottom: 1.5rem; font-size: 1.3rem;">🛰️ 即時通訊紀錄 (LATEST 25)</h2>
                <div class="cyber-table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>TIMESTAMP</th>
                                <th>PASSENGER</th>
                                <th>COMPANY / FLEET</th>
                                <th>PREFERENCE</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="products" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; margin-bottom: 2rem;">
                <div class="card-title neon-text" style="font-size: 1.3rem; margin-bottom: 1.5rem;">🎁 伴手禮管理</div>
                <div id="giftsList"></div>
                <button class="cyber-button" style="width:auto; margin-top:1.5rem;" onclick="openAddGiftModal()"><span>新增伴手禮</span></button>
            </div>
            <div class="cyber-card" style="padding: 2rem;">
                <div class="card-title neon-text" style="font-size: 1.3rem; margin-bottom: 1.5rem;">📦 一般補給品</div>
                <div id="productsList"></div>
                <button class="cyber-button" style="width:auto; margin-top:1.5rem;" onclick="openAddProductModal()"><span>新增補給品</span></button>
            </div>
        </div>

        <div id="system" class="tab-content">
            <div class="cyber-card" style="padding: 2.5rem;">
                <div class="card-title neon-text" style="font-size: 1.3rem; margin-bottom: 2rem;">🔧 核心系統參數</div>
                <div class="form-group">
                    <label>Google Sheet 資料表名稱</label>
                    <input type="text" class="cyber-input" id="googleSheetName">
                </div>
                <div class="form-group">
                    <label>🗺️ 會場導覽地圖 URL</label>
                    <input type="text" class="cyber-input" id="mapImageUrl">
                </div>
                <button class="cyber-button" style="width:auto; margin-top:1rem;" onclick="saveSystemSettings()"><span>💾 儲存並同步設定</span></button>
            </div>
        </div>
    </main>

    <div id="productModal" class="modal">
        <div class="modal-content cyber-card" style="border-top: 4px solid var(--text-dark) !important;">
            <div class="modal-header neon-text" id="modalTitle" style="font-size: 1.4rem; margin-bottom: 1.5rem;">編輯商品</div>
            <div class="form-group"><label>名稱 *</label><input type="text" class="cyber-input" id="productName"></div>
            <div class="form-group"><label>圖片網址</label><input type="url" class="cyber-input" id="productImage"></div>
            <div id="imagePreview" style="margin: 1rem 0; text-align: center;">
                <img id="modalImgPreview" src="" style="max-width: 100%; max-height: 180px; display: none; border-radius: 8px; border: 1px solid var(--text-dark);">
            </div>
            <div class="form-group"><label>簡介</label><textarea id="productDescription" class="cyber-input" rows="3"></textarea></div>
            <div class="form-group"><label>分類 (TAG)</label><input type="text" class="cyber-input" id="productCategory"></div>
            <div class="form-group"><label>產品連結</label><input type="url" class="cyber-input" id="productLink"></div>
            <input type="hidden" id="productIsGift">
            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem;">
                <button class="cyber-button" style="border-color:#888; color:#aaa; width:auto;" onclick="closeProductModal()"><span>取消</span></button>
                <button class="cyber-button" style="width:auto;" onclick="saveProduct()"><span id="saveButtonText">儲存</span></button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content cyber-card" style="border-left-color: #dc2626 !important; max-width: 420px;">
            <div class="modal-header neon-text" style="color: #dc2626; font-size: 1.3rem; margin-bottom: 1rem;">⚠️ 確認刪除物資</div>
            <p style="margin-bottom: 2rem; color: #ccc;">確定要移除「<strong id="deleteProductName" style="color:#fff;"></strong>」嗎？此變更儲存後無法還原。</p>
            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:1rem;">
                <button class="cyber-button" style="border-color:#888; color:#aaa; width:auto;" onclick="closeDeleteModal()"><span>取消變更</span></button>
                <button class="cyber-button" style="border-color:#dc2626; color:#dc2626; width:auto;" onclick="confirmDelete()"><span>確認移除</span></button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentConfig = null;
        let editingIdx = null;
        let deleteIdx = null;

        async function init() {
            await loadConfig();
            setupTabButtons();
            updateDashboard();
            setInterval(updateDashboard, 15000);
            
            // 綁定圖片即時預覽監聽
            document.getElementById('productImage').oninput = (e) => {
                const previewImg = document.getElementById('modalImgPreview');
                if(e.target.value) {
                    previewImg.src = e.target.value;
                    previewImg.style.display = 'block';
                } else {
                    previewImg.style.display = 'none';
                }
            };
        }

        function setupTabButtons() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                    document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
                    btn.classList.add('active');
                });
            });
        }

        async function loadConfig() {
            try {
                const res = await fetch(`${API_BASE}/config`);
                currentConfig = await res.json();
                renderProducts();
                document.getElementById('googleSheetName').value = currentConfig.google_sheet_name || '';
                document.getElementById('mapImageUrl').value = currentConfig.map_image_url || '';
            } catch (e) { showMessage('設定載入失敗', 'danger'); }
        }

        async function updateDashboard() {
            try {
                const res = await fetch(`${API_BASE}/dashboard_stats`);
                const json = await res.json();
                if(json.success) {
                    document.getElementById('stat-total').textContent = json.stats.total;
                    document.getElementById('stat-checked').textContent = json.stats.checked_in;
                    document.getElementById('stat-pending').textContent = json.stats.not_checked_in;
                    
                    document.getElementById('table-stats-container').innerHTML = Object.entries(json.stats.table_stats).sort((a,b)=>a[0]-b[0]).map(([t, r]) => `
                        <div class="table-mini-card">
                            <div style="font-size: 0.75rem; color: #888; margin-bottom: 0.4rem;">TABLE ${t}</div>
                            <div style="font-size: 1.4rem; font-weight: bold; color: var(--text-dark);">${r}%</div>
                        </div>`).join('');
                    
                    document.getElementById('logs-body').innerHTML = json.stats.logs.map(l => `<tr><td>${l.time}</td><td>${l.name}</td><td>${l.company}</td><td>${l.meal}</td></tr>`).join('');
                }
            } catch (e) { console.error("同步失敗", e); }
        }

        function renderProducts() {
            const gifts = (currentConfig.products || []).filter(p => p.isGift);
            const prods = (currentConfig.products || []).filter(p => !p.isGift);
            const giftsContainer = document.getElementById('giftsList');
            const prodsContainer = document.getElementById('productsList');
            
            giftsContainer.innerHTML = gifts.length ? gifts.map(p => renderProductRow(p, currentConfig.products.indexOf(p))).join('') : `<div style="text-align:center; padding:2rem; color:#555;">尚無伴手禮資料</div>`;
            prodsContainer.innerHTML = prods.length ? prods.map(p => renderProductRow(p, currentConfig.products.indexOf(p))).join('') : `<div style="text-align:center; padding:2rem; color:#555;">尚無補給品資料</div>`;
        }

        function renderProductRow(p, idx) {
            const thumb = p.image || 'https://placehold.co/50x50/0a1423/00e5ff?text=?';
            return `<div class="product-item">
                <div style="display: flex; align-items: center; gap: 1.2rem;">
                    <img src="${thumb}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid var(--accent-gray);" onerror="this.src='https://placehold.co/50x50/0a1423/00e5ff?text=Error'">
                    <div>
                        <div class="neon-text" style="font-size: 1.05rem;">${p.name}</div>
                        <div style="font-size: 0.8rem; color: #777;">${p.category || '未分類'}</div>
                    </div>
                </div>
                <div style="display: flex; gap: 0.8rem;">
                    <button class="cyber-button" style="width:auto; padding:0.5rem 1rem;" onclick="editProduct(${idx})"><span>編輯</span></button>
                    <button class="cyber-button" style="width:auto; padding:0.5rem 1rem; border-color:#dc2626; color:#dc2626;" onclick="openDeleteModal(${idx})"><span>刪除</span></button>
                </div>
            </div>`;
        }

        function openAddGiftModal() { openProductModal(null, true); }
        function openAddProductModal() { openProductModal(null, false); }

        function openProductModal(idx, isGift) {
            editingIdx = idx;
            document.getElementById('modalTitle').textContent = idx === null ? (isGift ? '新增精選伴手禮' : '新增物資補給品') : '編輯物資細節';
            document.getElementById('saveButtonText').textContent = idx === null ? '新增物資' : '儲存修改';
            document.getElementById('productIsGift').value = isGift;

            const preview = document.getElementById('modalImgPreview');

            if (idx !== null) {
                const p = currentConfig.products[idx];
                document.getElementById('productName').value = p.name || '';
                document.getElementById('productImage').value = p.image || '';
                document.getElementById('productDescription').value = p.description || '';
                document.getElementById('productCategory').value = p.category || '';
                document.getElementById('productLink').value = p.link || '';
                if(p.image) { preview.src = p.image; preview.style.display = 'block'; } else { preview.style.display = 'none'; }
            } else {
                document.getElementById('productName').value = '';
                document.getElementById('productImage').value = '';
                document.getElementById('productDescription').value = '';
                document.getElementById('productCategory').value = isGift ? '伴手禮' : '補給品';
                document.getElementById('productLink').value = '';
                preview.style.display = 'none';
            }
            document.getElementById('productModal').classList.add('active');
        }

        function editProduct(idx) {
            const p = currentConfig.products[idx];
            openProductModal(idx, p.isGift);
        }

        function closeProductModal() { document.getElementById('productModal').classList.remove('active'); }

        async function saveProduct() {
            const p = {
                name: document.getElementById('productName').value.trim(),
                image: document.getElementById('productImage').value.trim(),
                category: document.getElementById('productCategory').value.trim(),
                description: document.getElementById('productDescription').value.trim(),
                link: document.getElementById('productLink').value.trim(),
                isGift: document.getElementById('productIsGift').value === "true"
            };
            if(!p.name) return alert('商品名稱為必填項目');
            
            if(editingIdx !== null) currentConfig.products[editingIdx] = p; 
            else currentConfig.products.push(p);
            
            if(await postConfig()) { renderProducts(); closeProductModal(); showMessage('物資數據更新成功', 'success'); }
            else { showMessage('連線同步失敗', 'danger'); }
        }

        function openDeleteModal(idx) { 
            deleteIdx = idx; 
            document.getElementById('deleteProductName').textContent = currentConfig.products[idx].name; 
            document.getElementById('deleteModal').classList.add('active'); 
        }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); }
        
        async function confirmDelete() { 
            currentConfig.products.splice(deleteIdx, 1); 
            if(await postConfig()) { renderProducts(); closeDeleteModal(); showMessage('物資已成功移除', 'success'); } 
            else { showMessage('連線同步失敗', 'danger'); }
        }

        async function saveSystemSettings() {
            currentConfig.google_sheet_name = document.getElementById('googleSheetName').value.trim();
            currentConfig.map_image_url = document.getElementById('mapImageUrl').value.trim();
            if(await postConfig()) showMessage('方舟系統設定已成功儲存', 'success');
            else showMessage('設定儲存失敗', 'danger');
        }

        async function postConfig() {
            try {
                const res = await fetch(`${API_BASE}/config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentConfig) });
                return res.ok;
            } catch(e) { return false; }
        }

        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="alert alert-${type}">${text}</div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
