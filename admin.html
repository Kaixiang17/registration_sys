<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 艦橋管理中心</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; min-height: 100vh; color: #fff; }
        header { background: rgba(10, 20, 35, 0.8); border-bottom: 1px solid var(--accent-gray); padding: 1rem 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .btn-link { color: #fff; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 0.5rem; transition: all 0.2s; border: 1px solid transparent; }
        .btn-link:hover { border-color: var(--text-dark); background: rgba(0,229,255,0.1); color: var(--text-dark); }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .tab-btn { padding: 1rem 1.5rem; background: none; border: none; border-bottom: 3px solid transparent; font-size: 1rem; font-weight: 600; color: #888; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: var(--text-dark); border-bottom-color: var(--text-dark); text-shadow: 0 0 8px var(--text-glow); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { padding: 2rem; text-align: center; border-radius: 1rem; position: relative; border: 1px solid var(--accent-gray); overflow: hidden;}
        .stat-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(0,229,255,0.05), transparent); transform: rotate(45deg); animation: statGlow 4s infinite linear; }
        .stat-value { font-size: 3.5rem; font-weight: bold; margin-top: 1rem; }
        @keyframes statGlow { 0% { transform: translate(-50%, -50%) rotate(45deg); } 100% { transform: translate(50%, 50%) rotate(45deg); } }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(0,229,255,0.2); }
        th { color: var(--text-dark); font-weight: bold; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #fff; font-size: 0.95rem; }
        .product-item { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .product-item:hover { border-color: var(--text-dark); background: rgba(0, 229, 255, 0.05); }
        .product-info { display: grid; gap: 0.4rem; }
        .product-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.2rem; }
        .product-field { font-size: 0.9rem; color: #ccc; }
        .product-actions { display: flex; gap: 0.5rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 2rem; border-radius: 1rem; border: 1px solid var(--accent-gray); background: rgba(10, 20, 35, 0.9); }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>
    <header class="panel-border" style="border:none; border-radius: 0;">
        <div class="header-container">
            <div class="header-title neon-text" style="font-size: 1.2rem;">⚙️ 智慧方舟 - 艦橋管理中心</div>
            <div class="header-actions"><a class="btn-link" href="/">📋 報到首頁</a><a class="btn-link" href="/api/logout">🚪 安全登出</a></div>
        </div>
    </header>

    <main>
        <div id="messageContainer"></div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">📊 戰情儀表板</button>
            <button class="tab-btn" data-tab="products">🛍️ 補給品管理</button>
            <button class="tab-btn" data-tab="system">⚙️ 方舟系統設定</button>
        </div>

        <div id="dashboard" class="tab-content active">
            <div class="dashboard-grid">
                <div class="stat-card cyber-card">
                    <div class="neon-text">應到人數</div>
                    <div id="stat-total" class="stat-value" style="color: #aaa;">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-color:#16a34a;">
                    <div class="neon-text" style="color:#4ade80;">已報到人員</div>
                    <div id="stat-checked" class="stat-value" style="color: #4ade80;">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-color:#dc2626;">
                    <div class="neon-text" style="color:#f87171;">未到人員</div>
                    <div id="stat-pending" class="stat-value" style="color: #f87171;">0</div>
                </div>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem; margin-bottom: 2rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem; font-size: 1.4rem;">📊 桌號報到率統計</h2>
                <div id="table-stats-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem;"></div>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem;">🛰️ 即時登機紀錄 (最新 25 筆)</h2>
                <table>
                    <thead><tr><th>時間</th><th>姓名</th><th>公司艦隊</th><th>補給類別</th></tr></thead>
                    <tbody id="logs-body"></tbody>
                </table>
            </div>
        </div>

        <div id="products" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; border-left: 4px solid var(--text-dark);">
                <div class="card-title neon-text">🎁 伴手禮管理</div>
                <div id="giftsList"></div>
                <button class="cyber-button" style="width:auto; margin-top:1rem;" onclick="openAddGiftModal()"><span>🎁 新增伴手禮</span></button>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <div class="card-title neon-text">📦 一般商品列表</div>
                <div id="productsList"></div>
                <button class="cyber-button" style="width:auto; margin-top:1rem;" onclick="openAddProductModal()"><span>➕ 新增補給品</span></button>
            </div>
        </div>

        <div id="system" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <div class="card-title neon-text">🔧 系統基本設定</div>
                <div class="form-group"><label>Google Sheet 名稱</label><input type="text" class="cyber-input" id="googleSheetName" placeholder="例：活動報到名單"></div>
                
                <div class="form-group">
                    <label>🗺️ 地圖導覽圖片網址 或 直接上傳圖片檔</label>
                    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 0.5rem;">
                        <input type="text" class="cyber-input" id="mapImageUrl" style="margin-bottom: 0; flex-grow: 1;" placeholder="地圖 URL 或貼上本機圖片 Base64">
                        <label class="cyber-button" style="width: auto; margin-top: 0; padding: 0.8rem 1.5rem; font-size: 0.95rem; cursor: pointer; white-space: nowrap;">
                            <span>📁 上傳檔案</span>
                            <input type="file" id="mapLocalFile" accept="image/*" style="display: none;" onchange="handleMapFileUpload(this)">
                        </label>
                    </div>
                    <p style="color: #ffa500; font-size: 0.85rem; margin-top: 0.5rem; text-align: left; letter-spacing: 1px;">
                        ⚠️ 航空提示：請盡量上傳高解析度圖片（建議 1920x1080 或 1200x900），寬度小於 800px 的圖片在前台放大時會產生模糊。
                    </p>
                    <div id="systemMapPreviewContainer" style="margin-top: 10px; display: none; text-align: left;">
                        <img id="systemMapPreview" src="" style="max-width: 240px; max-height: 150px; border-radius: 8px; border: 1px solid var(--accent-gray); object-fit: contain; background: rgba(0,0,0,0.3);">
                    </div>
                </div>
                <button class="cyber-button" style="width:auto;" onclick="saveSystemSettings()"><span>💾 儲存設定</span></button>
            </div>
        </div>
    </main>

    <div id="productModal" class="modal">
        <div class="modal-content cyber-card">
            <div class="modal-header neon-text" id="modalTitle">編輯商品</div>
            <div class="form-group"><label>名稱 *</label><input type="text" class="cyber-input" id="productName"></div>
            
            <div class="form-group">
                <label>圖片網址 或 直接上傳圖片檔</label>
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 0.5rem;">
                    <input type="text" class="cyber-input" id="productImage" style="margin-bottom: 0; flex-grow: 1;" placeholder="圖片網址或貼上本機圖片 Base64">
                    <label class="cyber-button" style="width: auto; margin-top: 0; padding: 0.8rem 1.5rem; font-size: 0.95rem; cursor: pointer; white-space: nowrap;">
                        <span>📁 上傳圖片</span>
                        <input type="file" accept="image/*" style="display: none;" onchange="handleProductFileUpload(this)">
                    </label>
                </div>
                <p style="color: #00e5ff; font-size: 0.85rem; margin-top: 0.5rem; text-align: left; letter-spacing: 1px;">
                    💡 建議比例：4:3 或 3:2（例如 800x600 像素），動態 GIF 亦可完美支援。
                </p>
                <div id="imagePreview" style="margin-top: 10px; text-align: center;">
                    <img id="modalImgPreview" src="" style="max-width: 100%; max-height: 150px; display: none; border-radius: 8px; border: 1px solid var(--accent-gray); object-fit: contain;">
                </div>
            </div>

            <div class="form-group"><label>簡介</label><textarea id="productDescription" class="cyber-input"></textarea></div>
            
            <div class="form-group">
                <label>分類選項</label>
                <select class="cyber-input" id="productCategory" style="background: rgba(10, 20, 35, 0.95); color: #fff; border: 1px solid rgba(0, 229, 255, 0.2); padding: 0.8rem 1.2rem; width: 100%; border-radius: 0.5rem; font-size: 1.05rem;">
                    <option value="課程">📚 課程</option>
                    <option value="諮詢">💼 諮詢</option>
                    <option value="聯盟">🤝 聯盟</option>
                    <option value="紀念品">🎁 紀念品</option>
                </select>
            </div>

            <div class="form-group"><label>連結</label><input type="url" class="cyber-input" id="productLink"></div>
            <input type="hidden" id="productIsGift">
            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:1rem; margin-top:1.5rem;">
                <button class="cyber-button" style="border-color:#888; color:#aaa; width:auto;" onclick="closeProductModal()"><span>取消</span></button>
                <button class="cyber-button" style="width:auto;" onclick="saveProduct()"><span id="saveButtonText">儲存</span></button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content cyber-card" style="border-left-color: #dc2626;">
            <div class="modal-header" style="color: #dc2626;">⚠️ 確認刪除</div>
            <p style="margin-bottom:1.5rem;">確定移除「<strong id="deleteProductName" style="color:#fff;"></strong>」？此操作無法復原。</p>
            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:1rem;">
                <button class="cyber-button" style="border-color:#888; color:#aaa; width:auto;" onclick="closeDeleteModal()"><span>取消</span></button>
                <button class="cyber-button" style="border-color:#dc2626; color:#dc2626; width:auto;" onclick="confirmDelete()"><span>刪除</span></button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentConfig = null;
        let editingIdx = null;
        let deleteIdx = null;

        // ==================== 【全新核心：虛擬雲端分類池解析器】 ====================
        function getCategoryList() {
            const dummy = (currentConfig.products || []).find(p => p.name === "__SYSTEM_CATEGORIES__");
            if (dummy && dummy.description) {
                return dummy.description.split(',').map(c => c.trim()).filter(c => c);
            }
            // 若雲端尚未初始化，則預設提供初始四大核心航線分類
            return ['課程', '諮詢', '聯盟', '紀念品']; 
        }

        // 渲染分類管理中心介面（加在系統設定頁籤內）
        function renderCategoryManager() {
            const cats = getCategoryList();
            const container = document.getElementById('categoryPoolListContainer');
            if(!container) return;
            container.innerHTML = cats.map(c => `
                <div style="display: flex; align-items: center; gap: 0.6rem; background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); padding: 0.5rem 1.2rem; border-radius: 20px; font-size: 0.95rem; font-weight: bold; letter-spacing: 1px;">
                    <span style="color: #fff;">${c}</span>
                    <span style="color: #f87171; cursor: pointer; font-weight: bold; margin-left: 5px; font-size: 1.1rem;" onclick="deleteCategoryFromPool('${c}')" title="刪除此分類">✕</span>
                </div>
            `).join('');
        }

        // 全自動按鈕刪除功能（免改程式碼）
        async function deleteCategoryFromPool(catName) {
            if(!confirm(`確定要將「${catName}」從系統下拉選單選單池中移除嗎？`)) return;
            let cats = getCategoryList();
            cats = cats.filter(c => c !== catName);
            
            let dummy = currentConfig.products.find(p => p.name === "__SYSTEM_CATEGORIES__");
            if (!dummy) {
                dummy = { name: "__SYSTEM_CATEGORIES__", isGift: false, image: "", link: "", category: "SYSTEM" };
                currentConfig.products.push(dummy);
            }
            dummy.description = cats.join(',');
            
            if (await postConfig()) {
                renderProducts();
                renderCategoryManager();
                alert(`分類「${catName}」已成功移除！`);
            }
        }

        // 全自動按鈕新增功能
        async function addCategoryToPool() {
            const input = document.getElementById('newCategoryPoolInput');
            const newCat = input.value.trim();
            if (!newCat) return alert('請輸入欲新增的分類名稱');
            
            let cats = getCategoryList();
            if (cats.includes(newCat)) return alert('該分類已存在於選單池中');
            cats.push(newCat);
            
            let dummy = currentConfig.products.find(p => p.name === "__SYSTEM_CATEGORIES__");
            if (!dummy) {
                dummy = { name: "__SYSTEM_CATEGORIES__", isGift: false, image: "", link: "", category: "SYSTEM" };
                currentConfig.products.push(dummy);
            }
            dummy.description = cats.join(',');
            
            if (await postConfig()) {
                input.value = '';
                renderProducts();
                renderCategoryManager();
                alert(`分類「${newCat}」已成功加入選單池！`);
            }
        }

        function processAndCompressImage(file, maxTargetWidth, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxTargetWidth) {
                        height = Math.round((height * maxTargetWidth) / width);
                        width = maxTargetWidth;
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedBase64);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function init() {
            await loadConfig();
            setupTabButtons();
            updateDashboard();
            setInterval(updateDashboard, 15000);

            document.getElementById('productImage').oninput = (e) => {
                const previewImg = document.getElementById('modalImgPreview');
                if(e.target.value) { previewImg.src = e.target.value; previewImg.style.display = 'block'; } 
                else { previewImg.style.display = 'none'; }
            };

            document.getElementById('mapImageUrl').oninput = (e) => {
                const val = e.target.value.trim();
                const previewImg = document.getElementById('systemMapPreview');
                if(val) { previewImg.src = val; document.getElementById('systemMapPreviewContainer').style.display = 'block'; }
                else { document.getElementById('systemMapPreviewContainer').style.display = 'none'; }
            };
        }

        function setupTabButtons() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                    document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
                    btn.classList.add('active');
                });
            });
        }

        async function loadConfig() {
            try {
                const res = await fetch(`${API_BASE}/config`);
                currentConfig = await res.json();
                renderProducts();
                renderCategoryManager(); // 同步加載分類面板

                document.getElementById('googleSheetName').value = currentConfig.google_sheet_name || '';
                const mapUrl = currentConfig.map_image_url ? currentConfig.map_image_url.trim() : '';
                document.getElementById('mapImageUrl').value = mapUrl;
                if(mapUrl) {
                    document.getElementById('systemMapPreview').src = mapUrl;
                    document.getElementById('systemMapPreviewContainer').style.display = 'block';
                } else {
                    document.getElementById('systemMapPreviewContainer').style.display = 'none';
                }
            } catch (e) { showMessage('設定載入失敗', 'danger'); }
        }

        async function updateDashboard() {
            try {
                const res = await fetch(`${API_BASE}/dashboard_stats`);
                const json = await res.json();
                if(json.success) {
                    document.getElementById('stat-total').textContent = json.stats.total;
                    document.getElementById('stat-checked').textContent = json.stats.checked_in;
                    document.getElementById('stat-pending').textContent = json.stats.not_checked_in;
                    
                    document.getElementById('table-stats-container').innerHTML = Object.entries(json.stats.table_stats).sort((a,b)=>a[0]-b[0]).map(([t, r]) => `
                        <div class="cyber-card" style="padding: 1rem; text-align: center; background: rgba(0,229,255,0.05);">
                            <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem;">第 ${t} 桌</div>
                            <div style="font-size: 1.4rem; font-weight: bold; color: var(--text-dark);">${r}%</div>
                        </div>`).join('');
                    
                    document.getElementById('logs-body').innerHTML = json.stats.logs.map(l => `<tr><td>${l.time}</td><td>${l.name}</td><td>${l.company}</td><td>${l.meal}</td></tr>`).join('');
                }
            } catch (e) { console.error("同步失敗", e); }
        }

        function renderProducts() {
            // 核心過濾：排除虛擬分類配置物件項目
            const validItems = (currentConfig.products || []).filter(p => p.name !== "__SYSTEM_CATEGORIES__");
            
            const gifts = validItems.filter(p => p.isGift);
            const prods = validItems.filter(p => !p.isGift);
            
            const giftsContainer = document.getElementById('giftsList');
            const prodsContainer = document.getElementById('productsList');
            
            giftsContainer.innerHTML = gifts.length ? gifts.map(p => {
                const idx = currentConfig.products.indexOf(p);
                return renderProductRow(p, idx);
            }).join('') : `<div style="text-align:center; padding:1.5rem; color:#888;">尚無伴手禮</div>`;
            
            prodsContainer.innerHTML = prods.length ? prods.map(p => {
                const idx = currentConfig.products.indexOf(p);
                return renderProductRow(p, idx);
            }).join('') : `<div style="text-align:center; padding:1.5rem; color:#888;">尚無一般商品</div>`;
        }

        function renderProductRow(p, idx) {
            return `<div class="product-item">
                <div class="product-info">
                    <div class="product-name neon-text">${p.name}</div>
                    <div class="product-field">TAG: ${p.category || '未分類'} | ${p.image ? '<span style="color:#4ade80">✓ 已有圖</span>' : '<span style="color:#f87171">✗ 無圖</span>'}</div>
                </div>
                <div class="product-actions">
                    <button class="cyber-button" style="width:auto; padding:0.5rem 1rem;" onclick="editProduct(${idx})"><span>編輯</span></button>
                    <button class="cyber-button" style="width:auto; padding:0.5rem 1rem; border-color:#dc2626; color:#dc2626;" onclick="openDeleteModal(${idx})"><span>刪除</span></button>
                </div>
            </div>`;
        }

        function openAddGiftModal() { openProductModal(null, true); }
        function openAddProductModal() { openProductModal(null, false); }
        
        function openProductModal(idx, isGift) {
            editingIdx = idx;
            document.getElementById('modalTitle').textContent = idx === null ? (isGift ? '新增伴手禮' : '新增一般商品') : (isGift ? '編輯伴手禮' : '編輯一般商品');
            document.getElementById('saveButtonText').textContent = idx === null ? '新增' : '儲存修改';
            document.getElementById('productIsGift').value = isGift;

            const previewImg = document.getElementById('modalImgPreview');
            document.getElementById('customCategoryContainer').style.display = 'none';

            // 【智慧連動】動態將當前雲端分類池渲染至下拉選單
            const cats = getCategoryList();
            document.getElementById('productCategory').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('') + 
                `<option value="__NEW__">➕ 新增其它自訂分類...</option>`;

            if (idx !== null) {
                const p = currentConfig.products[idx];
                document.getElementById('productName').value = p.name || '';
                document.getElementById('productImage').value = p.image || '';
                document.getElementById('productDescription').value = p.description || '';
                document.getElementById('productLink').value = p.link || '';
                
                if (cats.includes(p.category)) {
                    document.getElementById('productCategory').value = p.category;
                } else if (p.category) {
                    document.getElementById('productCategory').value = '__NEW__';
                    document.getElementById('customCategoryContainer').style.display = 'block';
                    document.getElementById('customCategoryInput').value = p.category;
                } else {
                    document.getElementById('productCategory').value = cats[0] || '課程';
                }

                if(p.image) { previewImg.src = p.image; previewImg.style.display = 'block'; } 
                else { previewImg.style.display = 'none'; }
            } else {
                document.getElementById('productName').value = '';
                document.getElementById('productImage').value = '';
                document.getElementById('productDescription').value = '';
                document.getElementById('productLink').value = '';
                document.getElementById('productCategory').value = cats[0] || '課程';
                previewImg.style.display = 'none';
            }
            document.getElementById('productModal').classList.add('active');
        }

        function editProduct(idx) { const p = currentConfig.products[idx]; openProductModal(idx, p.isGift); }
        function closeProductModal() { document.getElementById('productModal').classList.remove('active'); }
        
        function checkCategorySelection(select) {
            const container = document.getElementById('customCategoryContainer');
            if (select.value === '__NEW__') {
                container.style.display = 'block';
                document.getElementById('customCategoryInput').value = '';
            } else {
                container.style.display = 'none';
            }
        }

        async function saveProduct() {
            let finalCategory = document.getElementById('productCategory').value;
            if (finalCategory === '__NEW__') {
                finalCategory = document.getElementById('customCategoryInput').value.trim();
                if (!finalCategory) return alert('請填寫自訂分類名稱！');
                
                // 全自動同步更新分類公用池
                let cats = getCategoryList();
                if (!cats.includes(finalCategory)) {
                    cats.push(finalCategory);
                    let dummy = currentConfig.products.find(p => p.name === "__SYSTEM_CATEGORIES__");
                    if (!dummy) {
                        dummy = { name: "__SYSTEM_CATEGORIES__", isGift: false, image: "", link: "", category: "SYSTEM" };
                        currentConfig.products.push(dummy);
                    }
                    dummy.description = cats.join(',');
                }
            }

            const p = { name: document.getElementById('productName').value.trim(), image: document.getElementById('productImage').value.trim(), category: finalCategory, description: document.getElementById('productDescription').value.trim(), link: document.getElementById('productLink').value.trim(), isGift: document.getElementById('productIsGift').value === "true" };
            if(!p.name) return alert('商品名稱為必填');
            if(editingIdx !== null) currentConfig.products[editingIdx] = p; else currentConfig.products.push(p);
            if(await postConfig()) { 
                renderProducts(); 
                renderCategoryManager();
                closeProductModal(); 
                alert('儲存成功！'); 
            }
        }

        function openDeleteModal(idx) { deleteIdx = idx; document.getElementById('deleteProductName').textContent = currentConfig.products[idx].name; document.getElementById('deleteModal').classList.add('active'); }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); }
        async function confirmDelete() { 
            currentConfig.products.splice(deleteIdx, 1); 
            if(await postConfig()) { 
                renderProducts(); 
                renderCategoryManager();
                closeDeleteModal(); 
                alert('刪除成功！');
            } 
        }

        async function saveSystemSettings() {
            currentConfig.google_sheet_name = document.getElementById('googleSheetName').value.trim();
            currentConfig.map_image_url = document.getElementById('mapImageUrl').value.trim();
            if(await postConfig()) {
                alert('儲存成功！');
            }
        }

        function handleMapFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            processAndCompressImage(file, 1200, function(compressedBase64) {
                document.getElementById('mapImageUrl').value = compressedBase64;
                const previewImg = document.getElementById('systemMapPreview');
                previewImg.src = compressedBase64;
                document.getElementById('systemMapPreviewContainer').style.display = 'block';
            });
        }

        function handleProductFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            processAndCompressImage(file, 600, function(compressedBase64) {
                document.getElementById('productImage').value = compressedBase64;
                const previewImg = document.getElementById('modalImgPreview');
                previewImg.src = compressedBase64;
                previewImg.style.display = 'block';
            });
        }

        async function postConfig() {
            try {
                const res = await fetch(`${API_BASE}/config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentConfig) });
                if(res.ok) return true;
                showMessage('數據同步失敗', 'danger'); return false;
            } catch(e) { showMessage('網路連線異常', 'danger'); return false; }
        }

        function showMessage(text, type = 'info') {
            document.getElementById('messageContainer').innerHTML = `<div class="alert alert-${type}">${text}</div>`;
            setTimeout(() => document.getElementById('messageContainer').innerHTML = '', 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
