<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 艦橋管理中心</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; min-height: 100vh; color: #fff; }
        header { background: rgba(10, 20, 35, 0.8); border-bottom: 1px solid var(--accent-gray); padding: 1rem 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .btn-link { color: #fff; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 0.5rem; transition: all 0.2s; border: 1px solid transparent; }
        .btn-link:hover { border-color: var(--text-dark); background: rgba(0,229,255,0.1); color: var(--text-dark); }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .tab-btn { padding: 1rem 1.5rem; background: none; border: none; border-bottom: 3px solid transparent; font-size: 1rem; font-weight: 600; color: #888; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: var(--text-dark); border-bottom-color: var(--text-dark); text-shadow: 0 0 8px var(--text-glow); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { padding: 2rem; text-align: center; border-radius: 1rem; }
        .stat-value { font-size: 3.5rem; font-weight: bold; margin-top: 1rem; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(0,229,255,0.2); }
        th { color: var(--text-dark); font-weight: bold; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #fff; font-size: 0.95rem; }
        .form-hint { font-size: 0.85rem; color: #aaa; margin-top: 0.4rem; }
        .product-item { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 2rem; border-radius: 1rem; }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>
    <header class="panel-border" style="border:none; border-radius: 0;">
        <div class="header-container">
            <div class="header-title neon-text" style="font-size: 1.2rem;">⚙️ 智慧方舟 - 系統管理中心</div>
            <div class="header-actions"><a class="btn-link" href="/">📋 報到首頁</a><a class="btn-link" href="/api/logout">🚪 安全登出</a></div>
        </div>
    </header>

    <main>
        <div id="messageContainer"></div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">📊 戰情儀表板</button>
            <button class="tab-btn" data-tab="products">🛍️ 補給品管理</button>
            <button class="tab-btn" data-tab="system">⚙️ 方舟系統設定</button>
        </div>

        <div id="dashboard" class="tab-content active">
            <div class="dashboard-grid">
                <div class="stat-card cyber-card">應到人數<div id="stat-total" class="stat-value" style="color: #aaa;">0</div></div>
                <div class="stat-card cyber-card">已報到人員<div id="stat-checked" class="stat-value" style="color: var(--text-dark);">0</div></div>
                <div class="stat-card cyber-card">未到人員<div id="stat-pending" class="stat-value" style="color: #ff4d4d;">0</div></div>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; border-top: 2px solid var(--text-dark);">
                <h2 class="neon-text" style="margin-bottom:1.5rem; font-size: 1.4rem;">📊 桌號報到率統計</h2>
                <div id="table-stats-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem;"></div>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem;">🛰️ 即時登機紀錄</h2>
                <table><thead><tr><th>時間</th><th>姓名</th><th>公司</th><th>餐點</th></tr></thead><tbody id="logs-body"></tbody></table>
            </div>
        </div>

        <div id="products" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; border-left: 4px solid var(--text-dark);">
                <div class="card-title neon-text">🎁 伴手禮管理</div>
                <div id="giftsList"></div>
                <button class="cyber-button" style="width:auto; margin-top:1rem;" onclick="openAddGiftModal()"><span>🎁 新增伴手禮</span></button>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <div class="card-title neon-text">📦 一般商品列表</div>
                <div id="productsList"></div>
                <button class="cyber-button" style="width:auto; margin-top:1rem;" onclick="openAddProductModal()"><span>➕ 新增補給品</span></button>
            </div>
        </div>

        <div id="system" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <div class="card-title neon-text">🔧 系統基本設定</div>
                <div class="form-group"><label>Google Sheet 名稱</label><input type="text" class="cyber-input" id="googleSheetName"></div>
                <div class="form-group"><label>🗺️ 地圖圖片網址</label><input type="text" class="cyber-input" id="mapImageUrl"></div>
                <button class="cyber-button" style="width:auto;" onclick="saveSystemSettings()"><span>💾 儲存設定</span></button>
            </div>
        </div>
    </main>

    <div id="productModal" class="modal">
        <div class="modal-content cyber-card">
            <div class="modal-header neon-text" id="modalTitle">編輯商品</div>
            <input type="text" class="cyber-input" id="productName" placeholder="名稱">
            <input type="text" class="cyber-input" id="productImage" placeholder="圖片網址">
            <input type="text" class="cyber-input" id="productCategory" placeholder="分類">
            <textarea id="productDescription" class="cyber-input" placeholder="簡介"></textarea>
            <input type="text" class="cyber-input" id="productLink" placeholder="連結網址">
            <input type="hidden" id="productIsGift">
            <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:1rem;">
                <button class="cyber-button" style="width:auto;" onclick="closeProductModal()">取消</button>
                <button class="cyber-button" style="width:auto;" onclick="saveProduct()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentConfig = null;
        let editingIdx = null;

        async function init() {
            await loadConfig();
            setupTabs();
            updateDashboard();
            setInterval(updateDashboard, 15000);
        }

        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
                    document.getElementById(btn.dataset.tab).classList.add('active');
                    btn.classList.add('active');
                });
            });
        }

        async function loadConfig() {
            const res = await fetch(`${API_BASE}/config`);
            currentConfig = await res.json();
            renderProducts();
            document.getElementById('googleSheetName').value = currentConfig.google_sheet_name || '';
            document.getElementById('mapImageUrl').value = currentConfig.map_image_url || '';
        }

        async function updateDashboard() {
            const res = await fetch(`${API_BASE}/dashboard_stats`);
            const json = await res.json();
            if(json.success) {
                document.getElementById('stat-total').textContent = json.stats.total;
                document.getElementById('stat-checked').textContent = json.stats.checked_in;
                document.getElementById('stat-pending').textContent = json.stats.not_checked_in;
                document.getElementById('table-stats-container').innerHTML = Object.entries(json.stats.table_stats).map(([t, r]) => `
                    <div class="cyber-card" style="padding:1rem; text-align:center;">第 ${t} 桌<br><b style="font-size:1.4rem;">${r}%</b></div>`).join('');
                document.getElementById('logs-body').innerHTML = json.stats.logs.map(l => `<tr><td>${l.time}</td><td>${l.name}</td><td>${l.company}</td><td>${l.meal}</td></tr>`).join('');
            }
        }

        function renderProducts() {
            const gifts = (currentConfig.products || []).filter(p => p.isGift);
            const prods = (currentConfig.products || []).filter(p => !p.isGift);
            document.getElementById('giftsList').innerHTML = gifts.map((p, i) => `<div class="product-item"><span>🎁 ${p.name}</span><button onclick="editProduct(${currentConfig.products.indexOf(p)})">編輯</button></div>`).join('');
            document.getElementById('productsList').innerHTML = prods.map((p, i) => `<div class="product-item"><span>📦 ${p.name}</span><button onclick="editProduct(${currentConfig.products.indexOf(p)})">編輯</button></div>`).join('');
        }

        function openAddGiftModal() { editingIdx = null; document.getElementById('productIsGift').value = "true"; document.getElementById('modalTitle').textContent="新增伴手禮"; showModal(); }
        function openAddProductModal() { editingIdx = null; document.getElementById('productIsGift').value = "false"; document.getElementById('modalTitle').textContent="新增補給品"; showModal(); }
        function editProduct(idx) { editingIdx = idx; const p = currentConfig.products[idx]; document.getElementById('productName').value = p.name; document.getElementById('productIsGift').value = p.isGift; showModal(); }
        function showModal() { document.getElementById('productModal').classList.add('active'); }
        function closeProductModal() { document.getElementById('productModal').classList.remove('active'); }
        
        async function saveProduct() {
            const p = { name: document.getElementById('productName').value, image: document.getElementById('productImage').value, category: document.getElementById('productCategory').value, description: document.getElementById('productDescription').value, link: document.getElementById('productLink').value, isGift: document.getElementById('productIsGift').value === "true" };
            if(editingIdx !== null) currentConfig.products[editingIdx] = p; else currentConfig.products.push(p);
            await fetch(`${API_BASE}/config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentConfig) });
            renderProducts(); closeProductModal();
        }
        
        async function saveSystemSettings() {
            currentConfig.google_sheet_name = document.getElementById('googleSheetName').value;
            currentConfig.map_image_url = document.getElementById('mapImageUrl').value;
            await fetch(`${API_BASE}/config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentConfig) });
            alert("儲存成功");
        }

        window.onload = init;
    </script>
</body>
</html>
