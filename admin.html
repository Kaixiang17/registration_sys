<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 艦橋管理中心</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; min-height: 100vh; color: #fff; background: #030914; }
        header { background: rgba(10, 20, 35, 0.8); border-bottom: 1px solid var(--accent-gray); padding: 1rem 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .btn-link { color: #ccc; text-decoration: none; font-size: 0.85rem; padding: 0.45rem 0.9rem; border-radius: 0.5rem; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.15); letter-spacing: 0.5px; }
        .btn-link:hover { border-color: var(--text-dark); background: rgba(0,229,255,0.1); color: var(--text-dark); }

        /* ── 後台統一按鈕規格 ── */
        /* 主要行動按鈕：場次切換、儲存設定、匯入等重要操作 */
        .adm-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            font-family: inherit; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.8px;
            border-radius: 0.5rem; border: 1px solid rgba(0,229,255,0.45);
            color: #00e5ff; background: rgba(0,229,255,0.07);
            cursor: pointer; white-space: nowrap; transition: all 0.18s ease;
            text-decoration: none; line-height: 1;
        }
        .adm-btn:hover { background: rgba(0,229,255,0.16); border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.2); }
        .adm-btn:active { transform: scale(0.97); }
        .adm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 強調按鈕（主要 CTA，如「立即切換場次」）*/
        .adm-btn-primary {
            border-color: rgba(0,229,255,0.7); color: #fff;
            background: linear-gradient(135deg, rgba(0,180,220,0.2), rgba(0,229,255,0.1));
        }
        .adm-btn-primary:hover { background: linear-gradient(135deg, rgba(0,180,220,0.35), rgba(0,229,255,0.2)); }

        /* 危險按鈕（刪除）*/
        .adm-btn-danger { border-color: rgba(220,38,38,0.5); color: #f87171; background: rgba(220,38,38,0.06); }
        .adm-btn-danger:hover { background: rgba(220,38,38,0.15); border-color: #dc2626; }

        /* 次要按鈕（取消）*/
        .adm-btn-ghost { border-color: rgba(255,255,255,0.15); color: #888; background: transparent; }
        .adm-btn-ghost:hover { border-color: rgba(255,255,255,0.35); color: #ccc; background: rgba(255,255,255,0.05); }

        /* 上傳類按鈕（偏橙黃色調）*/
        .adm-btn-upload { border-color: rgba(255,165,0,0.45); color: #ffa500; background: rgba(255,165,0,0.07); }
        .adm-btn-upload:hover { background: rgba(255,165,0,0.15); border-color: #ffa500; }

        /* 成功色按鈕 */
        .adm-btn-success { border-color: rgba(74,222,128,0.45); color: #4ade80; background: rgba(74,222,128,0.07); }
        .adm-btn-success:hover { background: rgba(74,222,128,0.15); border-color: #4ade80; }

        /* 按鈕尺寸修飾 */
        .adm-btn-sm { padding: 0.38rem 0.75rem; font-size: 0.8rem; }
        .adm-btn-lg { padding: 0.7rem 1.5rem; font-size: 0.95rem; letter-spacing: 1.2px; }
        
        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .tabs { display: none; }
        .tab-btn { padding: 1rem 1.5rem; background: none; border: none; border-bottom: 3px solid transparent; font-size: 1rem; font-weight: 600; color: #888; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: var(--text-dark); border-bottom-color: var(--text-dark); text-shadow: 0 0 8px var(--text-glow); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 後台主選單：把原本很多按鈕整理成群組，功能仍使用同一組 tab / API */
        .admin-nav-groups {
            display: grid;
            grid-template-columns: repeat(4, minmax(190px, 1fr));
            gap: 0.9rem;
            margin-bottom: 1.4rem;
        }
        .admin-nav-group {
            border: 1px solid rgba(0,229,255,0.18);
            background: rgba(5, 15, 30, 0.62);
            border-radius: 1rem;
            padding: 0.85rem;
            box-shadow: inset 0 0 22px rgba(0,229,255,0.045);
        }
        .admin-nav-title {
            color: #00e5ff;
            font-size: 0.82rem;
            letter-spacing: 1.4px;
            font-weight: 900;
            margin-bottom: 0.65rem;
            opacity: 0.92;
        }
        .admin-nav-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }
        .admin-nav-actions .tab-btn,
        .admin-nav-actions .nav-link-btn {
            padding: 0.48rem 0.7rem;
            border: 1px solid rgba(0,229,255,0.22);
            border-radius: 999px;
            background: rgba(0,229,255,0.055);
            color: #bfefff;
            font-size: 0.82rem;
            font-weight: 800;
            line-height: 1;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,229,255,0.22);
        }
        .admin-nav-actions .tab-btn:hover,
        .admin-nav-actions .nav-link-btn:hover {
            color: #fff;
            border-color: rgba(0,229,255,0.62);
            background: rgba(0,229,255,0.14);
            box-shadow: 0 0 14px rgba(0,229,255,0.16);
        }
        .admin-nav-actions .tab-btn.active {
            color: #06111f;
            background: linear-gradient(135deg, #00e5ff, #4ade80);
            border-color: transparent;
            text-shadow: none;
            box-shadow: 0 0 18px rgba(0,229,255,0.36);
        }
        .admin-sync-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            margin: -0.2rem 0 1.6rem;
            padding: 0.85rem 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(74,222,128,0.22);
            background: rgba(74,222,128,0.055);
            color: #bfefff;
        }
        .admin-sync-panel strong { color: #4ade80; }
        .admin-sync-panel small { color: #8aa0aa; line-height: 1.55; }
        
        @media(max-width: 900px) {
            .admin-nav-groups { grid-template-columns: 1fr; }
            .admin-sync-panel { flex-direction: column; align-items: flex-start; }
        }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        
        @media(max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; gap: 0.8rem; margin-bottom: 1.5rem; }
            .stat-card { padding: 1.5rem; }
            .stat-value { font-size: 2.5rem; margin-top: 0.75rem; }
        }
        
        .stat-card { padding: 2rem; text-align: center; border-radius: 1rem; position: relative; border: 1px solid var(--accent-gray); overflow: hidden;}
        .stat-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(0,229,255,0.05), transparent); transform: rotate(45deg); animation: statGlow 4s infinite linear; }
        .stat-value { font-size: 3.5rem; font-weight: bold; margin-top: 1rem; }
        @keyframes statGlow { 0% { transform: translate(-50%, -50%) rotate(45deg); } 100% { transform: translate(50%, 50%) rotate(45deg); } }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(0,229,255,0.2); }
        th { color: var(--text-dark); font-weight: bold; }
        
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; color: #00e5ff; }
        .card-subtitle { font-size: 0.85rem; color: #8aa0aa; margin-top: -1rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #bfefff; }

        /* ── 新增：大會議程時間選擇器融合樣式 ── */
        .agenda-list { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
        .agenda-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 229, 255, 0.02);
            padding: 0.5rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(0, 229, 255, 0.15);
            transition: all 0.2s ease;
        }
        .agenda-item:hover { border-color: rgba(0, 229, 255, 0.35); background: rgba(0, 229, 255, 0.04); }
        
        .adm-time-input {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: #00e5ff;
            padding: 0.45rem 0.6rem;
            font-size: 0.9rem;
            font-family: inherit;
            border-radius: 0.4rem;
            outline: none;
            text-align: center;
            transition: all 0.2s;
        }
        .adm-time-input:focus { border-color: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); background: rgba(0, 229, 255, 0.12); }
        .time-separator { color: #8aa0aa; font-size: 0.85rem; padding: 0 0.2rem; }
        
        .adm-text-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            color: #fff;
            padding: 0.45rem 0.5rem;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
