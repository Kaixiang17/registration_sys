<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 艦橋管理中心 v2</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; min-height: 100vh; color: #fff; }
        header { background: rgba(10, 20, 35, 0.8); border-bottom: 1px solid var(--accent-gray); padding: 1rem 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .tab-btn { padding: 1rem 1.5rem; background: none; border: none; border-bottom: 3px solid transparent; font-size: 1rem; font-weight: 600; color: #888; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: var(--text-dark); border-bottom-color: var(--text-dark); text-shadow: 0 0 8px var(--text-glow); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .adm-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            font-family: inherit; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.8px;
            border-radius: 0.5rem; border: 1px solid rgba(0,229,255,0.45);
            color: #00e5ff; background: rgba(0,229,255,0.07);
            cursor: pointer; white-space: nowrap; transition: all 0.18s ease;
            text-decoration: none; line-height: 1;
        }
        .adm-btn:hover { background: rgba(0,229,255,0.16); border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.2); }
        .adm-btn-primary { border-color: rgba(0,229,255,0.7); color: #fff; background: linear-gradient(135deg, rgba(0,180,220,0.2), rgba(0,229,255,0.1)); }
        .adm-btn-primary:hover { background: linear-gradient(135deg, rgba(0,180,220,0.35), rgba(0,229,255,0.2)); }
        .adm-btn-success { border-color: rgba(74,222,128,0.45); color: #4ade80; background: rgba(74,222,128,0.07); }
        .adm-btn-success:hover { background: rgba(74,222,128,0.15); border-color: #4ade80; }
        .adm-btn-danger { border-color: rgba(220,38,38,0.5); color: #f87171; background: rgba(220,38,38,0.06); }
        .adm-btn-danger:hover { background: rgba(220,38,38,0.15); border-color: #dc2626; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #fff; font-size: 0.95rem; }
        .cyber-input { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid var(--accent-gray) !important; color: #00e5ff !important; padding: 0.75rem; border-radius: 0.5rem; font-family: inherit; width: 100%; }
        .cyber-input:focus { outline: none; background: rgba(0, 20, 40, 0.6) !important; box-shadow: 0 5px 15px rgba(0, 229, 255, 0.2); }
        
        /* 👑 議程管理 */
        .agenda-item-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 1rem; margin-bottom: 1rem; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 0.5rem; border: 1px solid rgba(0,229,255,0.2); }
        .agenda-time-select { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0,229,255,0.3); color: #00e5ff; padding: 0.5rem; border-radius: 0.5rem; font-family: inherit; }
        
        /* 👑 行業對照表 */
        .mapping-row { display: grid; grid-template-columns: 1.5fr 1.5fr auto; gap: 1rem; margin-bottom: 1rem; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 0.5rem; border: 1px solid rgba(0,229,255,0.2); }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(0,229,255,0.2); }
        th { color: var(--text-dark); font-weight: bold; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { padding: 2rem; text-align: center; border-radius: 1rem; position: relative; border: 1px solid var(--accent-gray); }
        .stat-value { font-size: 3.5rem; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>

    <header class="panel-border" style="border:none; border-radius: 0;">
        <div class="header-container">
            <div class="header-title neon-text" style="font-size: 1.2rem;">⚙️ 智慧方舟 - 艦橋管理中心 v2</div>
            <div style="display: flex; gap: 1rem;">
                <a class="adm-btn" href="/">📋 報到首頁</a>
                <a class="adm-btn adm-btn-danger" href="/api/logout">🚪 登出</a>
            </div>
        </div>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">📊 戰情儀表板</button>
            <button class="tab-btn" data-tab="agenda">📅 議程管理</button>
            <button class="tab-btn" data-tab="industry">🏭 行業對照表</button>
            <button class="tab-btn" data-tab="exhibitors">🏢 企業展示</button>
        </div>

        <!-- 👑 儀表板 -->
        <div id="dashboard" class="tab-content active">
            <div class="dashboard-grid">
                <div class="stat-card cyber-card">
                    <div class="neon-text">應到人數</div>
                    <div id="stat-total" class="stat-value" style="color: #aaa;">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-color:#16a34a;">
                    <div class="neon-text" style="color:#4ade80;">已報到人員</div>
                    <div id="stat-checked" class="stat-value" style="color: #4ade80;">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-color:#dc2626;">
                    <div class="neon-text" style="color:#f87171;">未到人員</div>
                    <div id="stat-pending" class="stat-value" style="color: #f87171;">0</div>
                </div>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem;">🛰️ 即時登機紀錄</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>時間</th><th>姓名</th><th>公司</th><th>餐食</th></tr></thead>
                        <tbody id="logs-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 👑 議程管理 -->
        <div id="agenda" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem;">📅 大會議程設定</h2>
                <div id="agendaContainer"></div>
                <button class="adm-btn adm-btn-success" onclick="addAgendaItem()">➕ 新增議程</button>
                <button class="adm-btn adm-btn-primary" style="margin-left: 1rem;" onclick="saveAgenda()">💾 儲存議程</button>
            </div>
        </div>

        <!-- 👑 行業對照表 -->
        <div id="industry" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem;">🏭 行業類別手動對照表</h2>
                <p style="color: #aaa; margin-bottom: 1.5rem;">在此手動輸入公司名稱並指定行業別。系統會以此對照組合，於前台統計已報到「不重複公司」的行業占比比例。</p>
                <div id="mappingContainer"></div>
                <button class="adm-btn adm-btn-success" onclick="addMappingItem()">➕ 新增對照</button>
                <button class="adm-btn adm-btn-primary" style="margin-left: 1rem;" onclick="saveMapping()">💾 儲存對照表</button>
            </div>
        </div>

        <!-- 👑 企業展示 -->
        <div id="exhibitors" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem;">🏢 參與企業管理</h2>
                <p style="color: #aaa; margin-bottom: 1.5rem;">管理今日參與活動的企業資訊，包括公司簡介、行業別、官網等。</p>
                <div id="exhibitorContainer"></div>
                <button class="adm-btn adm-btn-success" onclick="addExhibitor()">➕ 新增企業</button>
                <button class="adm-btn adm-btn-primary" style="margin-left: 1rem;" onclick="saveExhibitors()">💾 儲存企業資訊</button>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '/api';
        let agendaItems = [];
        let mappingItems = [];
        let exhibitorItems = [];

        window.onload = function() {
            setupTabs();
            loadDashboard();
            loadAgenda();
            loadMapping();
            loadExhibitors();
        };

        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    const tabId = btn.dataset.tab;
                    document.getElementById(tabId).classList.add('active');
                });
            });
        }

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/dashboard_stats`);
                const json = await res.json();
                if (json.success) {
                    const stats = json.stats;
                    document.getElementById('stat-total').textContent = stats.total;
                    document.getElementById('stat-checked').textContent = stats.checked_in;
                    document.getElementById('stat-pending').textContent = stats.not_checked_in;
                    
                    const tbody = document.getElementById('logs-body');
                    tbody.innerHTML = stats.logs.map(log => `
                        <tr>
                            <td>${log.time}</td>
                            <td>${log.name}</td>
                            <td>${log.company}</td>
                            <td>${log.meal}</td>
                        </tr>
                    `).join('');
                }
            } catch(e) { console.error('加載統計失敗', e); }
        }

        // 👑 議程管理
        async function loadAgenda() {
            try {
                const res = await fetch(`${API_BASE}/agenda`);
                const json = await res.json();
                agendaItems = json.data || [];
                renderAgendaItems();
            } catch(e) { console.error('加載議程失敗', e); }
        }

        function renderAgendaItems() {
            const container = document.getElementById('agendaContainer');
            container.innerHTML = agendaItems.map((item, idx) => `
                <div class="agenda-item-row">
                    <select class="agenda-time-select" onchange="agendaItems[${idx}].time = this.value">
                        <option value="">選擇時間</option>
                        ${generateTimeOptions(item.time)}
                    </select>
                    <input type="text" class="cyber-input" value="${item.event || ''}" onchange="agendaItems[${idx}].event = this.value" placeholder="議程項目">
                    <button class="adm-btn adm-btn-danger" onclick="removeAgendaItem(${idx})">🗑️ 刪除</button>
                </div>
            `).join('');
        }

        function generateTimeOptions(selected) {
            const times = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00'];
            return times.map(t => `<option value="${t}" ${t === selected ? 'selected' : ''}>${t}</option>`).join('');
        }

        function addAgendaItem() {
            agendaItems.push({ time: '', event: '' });
            renderAgendaItems();
        }

        function removeAgendaItem(idx) {
            agendaItems.splice(idx, 1);
            renderAgendaItems();
        }

        async function saveAgenda() {
            try {
                const res = await fetch(`${API_BASE}/agenda`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ agenda: agendaItems })
                });
                const json = await res.json();
                alert(json.success ? '議程已儲存' : '儲存失敗');
            } catch(e) { alert('儲存失敗'); }
        }

        // 👑 行業對照表
        async function loadMapping() {
            try {
                const res = await fetch(`${API_BASE}/industry_mapping`);
                const json = await res.json();
                mappingItems = json.data || [];
                renderMappingItems();
            } catch(e) { console.error('加載對照表失敗', e); }
        }

        function renderMappingItems() {
            const container = document.getElementById('mappingContainer');
            container.innerHTML = mappingItems.map((item, idx) => `
                <div class="mapping-row">
                    <input type="text" class="cyber-input" value="${item.company_name || ''}" onchange="mappingItems[${idx}].company_name = this.value" placeholder="公司完整名稱">
                    <input type="text" class="cyber-input" value="${item.industry || ''}" onchange="mappingItems[${idx}].industry = this.value" placeholder="行業別 (例: 科技業)">
                    <button class="adm-btn adm-btn-danger" onclick="removeMapping(${idx})">🗑️ 刪除</button>
                </div>
            `).join('');
        }

        function addMappingItem() {
            mappingItems.push({ company_name: '', industry: '' });
            renderMappingItems();
        }

        function removeMapping(idx) {
            mappingItems.splice(idx, 1);
            renderMappingItems();
        }

        async function saveMapping() {
            try {
                const res = await fetch(`${API_BASE}/industry_mapping`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mappings: mappingItems })
                });
                const json = await res.json();
                alert(json.success ? '對照表已儲存' : '儲存失敗');
            } catch(e) { alert('儲存失敗'); }
        }

        // 👑 企業展示
        async function loadExhibitors() {
            try {
                const res = await fetch(`${API_BASE}/exhibitors`);
                const json = await res.json();
                exhibitorItems = json.exhibitors || [];
                renderExhibitorItems();
            } catch(e) { console.error('加載企業失敗', e); }
        }

        function renderExhibitorItems() {
            const container = document.getElementById('exhibitorContainer');
            container.innerHTML = exhibitorItems.map((item, idx) => `
                <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(0,229,255,0.2); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                        <input type="text" class="cyber-input" value="${item.company_name || ''}" onchange="exhibitorItems[${idx}].company_name = this.value" placeholder="公司名稱">
                        <input type="text" class="cyber-input" value="${item.industry || ''}" onchange="exhibitorItems[${idx}].industry = this.value" placeholder="行業別">
                    </div>
                    <textarea class="cyber-input" onchange="exhibitorItems[${idx}].description = this.value" placeholder="公司簡介" style="height: 80px; resize: vertical;">${item.description || ''}</textarea>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                        <input type="text" class="cyber-input" value="${item.website || ''}" onchange="exhibitorItems[${idx}].website = this.value" placeholder="官網">
                        <input type="text" class="cyber-input" value="${item.contact || ''}" onchange="exhibitorItems[${idx}].contact = this.value" placeholder="聯絡方式">
                    </div>
                    <button class="adm-btn adm-btn-danger" style="margin-top: 1rem;" onclick="removeExhibitor(${idx})">🗑️ 刪除</button>
                </div>
            `).join('');
        }

        function addExhibitor() {
            exhibitorItems.push({ company_name: '', industry: '', description: '', website: '', contact: '' });
            renderExhibitorItems();
        }

        function removeExhibitor(idx) {
            exhibitorItems.splice(idx, 1);
            renderExhibitorItems();
        }

        async function saveExhibitors() {
            try {
                const res = await fetch(`${API_BASE}/exhibitors`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ exhibitors: exhibitorItems })
                });
                const json = await res.json();
                alert(json.success ? '企業資訊已儲存' : '儲存失敗');
            } catch(e) { alert('儲存失敗'); }
        }
    </script>
</body>
</html>
