<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧方舟 - 艦橋管理中心</title>
    <link rel="stylesheet" href="smart-ark-theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Michroma", "Stick", sans-serif; }
        body { line-height: 1.6; min-height: 100vh; color: #fff; }
        header { background: rgba(10, 20, 35, 0.8); border-bottom: 1px solid var(--accent-gray); padding: 1rem 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        
        .adm-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.55rem 1.1rem; font-family: inherit; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.8px;
            border-radius: 0.5rem; border: 1px solid rgba(0,229,255,0.45); color: #00e5ff; background: rgba(0,229,255,0.07);
            cursor: pointer; white-space: nowrap; transition: all 0.18s ease; text-decoration: none; line-height: 1;
        }
        .adm-btn:hover { background: rgba(0,229,255,0.16); border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.2); }
        .adm-btn:active { transform: scale(0.97); }
        .adm-btn-primary { border-color: rgba(0,229,255,0.7); color: #fff; background: linear-gradient(135deg, rgba(0,180,220,0.2), rgba(0,229,255,0.1)); }
        .adm-btn-primary:hover { background: linear-gradient(135deg, rgba(0,180,220,0.35), rgba(0,229,255,0.2)); }
        .adm-btn-danger { border-color: rgba(220,38,38,0.5); color: #f87171; background: rgba(220,38,38,0.06); }
        .adm-btn-danger:hover { background: rgba(220,38,38,0.15); border-color: #dc2626; }
        .adm-btn-ghost { border-color: rgba(255,255,255,0.15); color: #888; background: transparent; }
        .adm-btn-ghost:hover { border-color: rgba(255,255,255,0.35); color: #ccc; background: rgba(255,255,255,0.05); }
        .adm-btn-upload { border-color: rgba(255,165,0,0.45); color: #ffa500; background: rgba(255,165,0,0.07); }
        .adm-btn-upload:hover { background: rgba(255,165,0,0.15); border-color: #ffa500; }
        .adm-btn-success { border-color: rgba(74,222,128,0.45); color: #4ade80; background: rgba(74,222,128,0.07); }
        .adm-btn-success:hover { background: rgba(74,222,128,0.15); border-color: #4ade80; }
        .adm-btn-sm { padding: 0.38rem 0.75rem; font-size: 0.8rem; }
        .adm-btn-lg { padding: 0.7rem 1.5rem; font-size: 0.95rem; letter-spacing: 1.2px; }

        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .tab-btn { padding: 1rem 1.5rem; background: none; border: none; border-bottom: 3px solid transparent; font-size: 1rem; font-weight: 600; color: #888; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: var(--text-dark); border-bottom-color: var(--text-dark); text-shadow: 0 0 8px var(--text-glow); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { padding: 2rem; text-align: center; border-radius: 1rem; position: relative; border: 1px solid var(--accent-gray); overflow: hidden;}
        .stat-value { font-size: 3.5rem; font-weight: bold; margin-top: 1rem; }
        
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(0,229,255,0.2); }
        th { color: var(--text-dark); font-weight: bold; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #fff; font-size: 0.95rem; }
        
        .product-item { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .product-info { display: grid; gap: 0.4rem; }
        .product-name { font-weight: 700; font-size: 1.1rem; }
        .product-field { font-size: 0.9rem; color: #ccc; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 2rem; border-radius: 1rem; border: 1px solid var(--accent-gray); background: rgba(10, 20, 35, 0.9); }
    </style>
</head>
<body class="circuit-background">
    <div class="ark-background"></div>
    <header class="panel-border" style="border:none;">
        <div class="header-container">
            <div class="header-title neon-text" style="font-size: 1.2rem;">⚙️ 智慧方舟 - 雲端中控後台</div>
            <div class="header-actions">
                <span id="welcome-msg" class="neon-text" style="font-size: 0.9rem; margin-right: 1rem; color: #4ade80;">歡迎...</span>
                <a class="adm-btn adm-btn-sm" href="/">📋 報到首頁</a>
                <a class="adm-btn adm-btn-ghost adm-btn-sm" href="/api/logout">🚪 登出</a>
            </div>
        </div>
    </header>

    <main>
        <div id="messageContainer"></div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">📊 戰情儀表板</button>
            <button class="tab-btn" data-tab="products">🛍️ 補給品管理</button>
            <button class="tab-btn" data-tab="system">⚙️ 方舟系統設定</button>
        </div>

        <div id="dashboard" class="tab-content active">
            <div class="dashboard-grid">
                <div class="stat-card cyber-card">
                    <div class="neon-text">應到人數</div>
                    <div id="stat-total" class="stat-value" style="color: #aaa;">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-color:#16a34a;">
                    <div class="neon-text" style="color:#4ade80;">已報到人員</div>
                    <div id="stat-checked" class="stat-value" style="color: #4ade80;">0</div>
                </div>
                <div class="stat-card cyber-card" style="border-color:#dc2626;">
                    <div class="neon-text" style="color:#f87171;">未到人員</div>
                    <div id="stat-pending" class="stat-value" style="color: #f87171;">0</div>
                </div>
            </div>
            
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem; margin-bottom: 2rem;">
                <h2 class="neon-text" style="margin-bottom:1.5rem; font-size: 1.4rem;">📊 各桌即時報到率統計</h2>
                <div id="table-stats-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem;"></div>
            </div>

            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 class="neon-text" style="margin: 0;">🛰️ 即時登機紀錄 (最新 25 筆)</h2>
                    <div style="display: flex; gap: 10px;">
                        <button class="adm-btn adm-btn-upload" onclick="showAddModal()">➕ 臨時報到</button>
                        <button class="adm-btn" onclick="exportCsv()">📥 匯出名單</button>
                    </div>
                </div>
                <table>
                    <thead><tr><th>時間</th><th>姓名</th><th>公司艦隊</th><th>餐點</th></tr></thead>
                    <tbody id="logs-body"></tbody>
                </table>
            </div>
        </div>

        <div id="products" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; border-left: 4px solid var(--text-dark);">
                <div class="card-title neon-text">🎁 伴手禮管理</div>
                <div id="giftsList"></div>
                <button class="adm-btn adm-btn-success" style="margin-top:1rem;" onclick="openAddGiftModal()">🎁 新增伴手禮</button>
            </div>
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <div class="card-title neon-text">📦 一般商品列表</div>
                <div id="productsList"></div>
                <button class="adm-btn" style="margin-top:1rem;" onclick="openAddProductModal()">➕ 新增補給品</button>
            </div>
        </div>

        <div id="system" class="tab-content">
            <div class="cyber-card" style="padding: 2rem; border-radius: 1rem;">
                <div class="card-title neon-text">🔧 系統全域活動場次調度</div>
                
                <div class="form-group">
                    <label>當前作用中資料庫活動場次（即時切換無需重啟）</label>
                    <div style="display:flex; gap:0.6rem; align-items:center;">
                        <select class="cyber-input" id="eventSessionSelect" onchange="updateEventLink()" style="background: rgba(10,20,35,0.9); color:#fff; border:1px solid rgba(0,229,255,0.25); padding:0.52rem 1rem; flex-grow:1; border-radius:0.5rem; font-size:0.9rem; font-family:inherit; cursor:pointer;">
                            <option value="">⏳ 正在加載活動場次資源池...</option>
                        </select>
                        <button class="adm-btn adm-btn-primary" onclick="saveSystemSettings()">🚀 切換作用場次</button>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label>🔗 專屬報到大廳前台網址</label>
                    <div style="display:flex; gap:0.6rem;">
                        <input type="text" id="event_link" class="cyber-input" readonly style="flex-grow:1; margin-bottom:0;">
                        <button class="adm-btn adm-btn-success" onclick="copyEventLink()">📋 複製網址</button>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label>🖼️ 主視覺橫幅看板 (Banner) 網址</label>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <input type="text" class="cyber-input" id="bannerImageUrl" style="flex-grow: 1; margin-bottom:0;" placeholder="貼上橫幅圖片網址或由下方按鈕上傳">
                        <label class="adm-btn adm-btn-upload" style="cursor:pointer;">
                            📁 上傳橫幅
                            <input type="file" id="bannerLocalFile" accept="image/*" style="display: none;" onchange="handleBannerFileUpload(this)">
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>🗺️ 地圖導覽圖片網址</label>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <input type="text" class="cyber-input" id="mapImageUrl" style="flex-grow: 1; margin-bottom:0;" placeholder="地圖 URL 或本機上傳">
                        <label class="adm-btn adm-btn-upload" style="cursor:pointer;">
                            📁 上傳地圖
                            <input type="file" id="mapLocalFile" accept="image/*" style="display: none;" onchange="handleMapFileUpload(this)">
                        </label>
                    </div>
                    <div id="systemMapPreviewContainer" style="margin-top: 10px; display: none;">
                        <img id="systemMapPreview" src="" style="max-width: 240px; max-height: 150px; border-radius: 8px; border: 1px solid var(--accent-gray); object-fit: contain;">
                    </div>
                </div>

                <button class="adm-btn adm-btn-primary adm-btn-lg" style="margin-bottom:2rem;" onclick="saveSystemSettings()">💾 儲存主視覺設定</button>

                <div class="form-group" style="border-top: 1px solid rgba(0,229,255,0.2); padding-top: 2rem;">
                    <div class="card-title neon-text" style="margin-bottom:0.5rem;">📥 快速匯入新活動 CSV 名單 (覆寫)</div>
                    <label style="color:#aaa; margin-bottom:1.5rem;">選擇本機 CSV 檔案，系統自動採用前向智慧填補（Forward Fill），免除合併儲存格解析困擾。</label>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <label class="adm-btn adm-btn-lg adm-btn-primary" style="cursor:pointer;">
                            📊 選擇名單 CSV 並上傳
                            <input type="file" id="csvLocalFile" accept=".csv" style="display: none;" onchange="handleCsvUpload(this)">
                        </label>
                        <span id="csvUploadStatus" style="color: #00e5ff; font-size: 0.95rem;">未選擇任何檔案</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="productModal" class="modal">
        <div class="modal-content cyber-card">
            <div class="modal-header neon-text" id="modalTitle">編輯商品</div>
            <div class="form-group"><label>名稱 *</label><input type="text" class="cyber-input" id="productName"></div>
            <div class="form-group">
                <label>圖片</label>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <input type="text" class="cyber-input" id="productImage" style="flex-grow: 1; margin-bottom:0;">
                    <label class="adm-btn adm-btn-upload" style="cursor:pointer;">
                        📁 上傳
                        <input type="file" accept="image/*" style="display: none;" onchange="handleProductFileUpload(this)">
                    </label>
                </div>
                <div style="margin-top: 10px; text-align: center;">
                    <img id="modalImgPreview" src="" style="max-width: 100%; max-height: 150px; display: none; border-radius: 8px;">
                </div>
            </div>
            <div class="form-group"><label>簡介</label><textarea id="productDescription" class="cyber-input"></textarea></div>
            <div class="form-group">
                <label>分類選項</label>
                <select class="cyber-input" id="productCategory" onchange="checkCategorySelection(this)" style="background: rgba(10,20,35,0.9); color:#fff; border:1px solid rgba(0,229,255,0.25); padding:0.52rem 1rem; width:100%; border-radius:0.5rem;">
                </select>
            </div>
            <div class="form-group" id="customCategoryContainer" style="display: none;">
                <label>✍️ 請輸入新分類名稱</label>
                <input type="text" class="cyber-input" id="customCategoryInput">
            </div>
            <div class="form-group"><label>外部購買連結</label><input type="url" class="cyber-input" id="productLink"></div>
            <input type="hidden" id="productIsGift">
            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:1rem;">
                <button class="adm-btn adm-btn-ghost" onclick="closeProductModal()">取消</button>
                <button class="adm-btn adm-btn-primary" onclick="saveProduct()"><span id="saveButtonText">儲存</span></button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content cyber-card" style="border-left-color: #dc2626;">
            <div class="modal-header" style="color: #dc2626; font-size:1.2rem; font-weight:bold; margin-bottom:1rem;">⚠️ 確認刪除</div>
            <p>確定移除「<strong id="deleteProductName"></strong>」？此操作將會由 MySQL 資料庫中永久移除。</p>
            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:1rem; margin-top:1.5rem;">
                <button class="adm-btn adm-btn-ghost" onclick="closeDeleteModal()">取消</button>
                <button class="adm-btn adm-btn-danger" onclick="confirmDelete()">確認刪除</button>
            </div>
        </div>
    </div>

    <div id="addModal" class="modal">
        <div class="cyber-card" style="width: 90%; max-width: 500px; padding: 2rem; background: rgba(10,20,35,0.95);">
            <h2 class="neon-text" style="margin-bottom: 1.5rem;">➕ 現場臨時補位報到</h2>
            <div class="form-group"><label>旅客姓名</label><input type="text" id="addName" class="cyber-input"></div>
            <div class="form-group"><label>手機號碼</label><input type="text" id="addPhone" class="cyber-input"></div>
            <div class="form-group"><label>公司/單位</label><input type="text" id="addCompany" class="cyber-input"></div>
            <div class="form-group"><label>桌號/座位 (選填)</label><input type="text" id="addSeat" class="cyber-input"></div>
            <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                <button class="adm-btn adm-btn-ghost" onclick="hideAddModal()">取消</button>
                <button class="adm-btn adm-btn-success" onclick="submitAddRegistration()">✓ 確認現場報到</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentConfig = null;
        let currentUser = 'admin';
        let editingIdx = null;
        let deleteIdx = null;

        function getCategoryList() {
            const dummy = (currentConfig.products || []).find(p => p.name === "__SYSTEM_CATEGORIES__");
            return (dummy && dummy.description) ? dummy.description.split(',').map(c => c.trim()).filter(c => c) : ['課程', '諮詢', '聯盟', '紀念品']; 
        }

        function renderProducts() {
            const validItems = (currentConfig.products || []).filter(p => p.name !== "__SYSTEM_CATEGORIES__");
            const gifts = validItems.filter(p => p.isGift);
            const prods = validItems.filter(p => !p.isGift);
            
            document.getElementById('giftsList').innerHTML = gifts.length ? gifts.map(p => renderProductRow(p, currentConfig.products.indexOf(p))).join('') : '<div style="padding:1rem;color:#666;">無隨行伴手禮設定</div>';
            document.getElementById('productsList').innerHTML = prods.length ? prods.map(p => renderProductRow(p, currentConfig.products.indexOf(p))).join('') : '<div style="padding:1rem;color:#666;">無一般展售商品</div>';
        }

        function renderProductRow(p, idx) {
            return `<div class="product-item">
                <div class="product-info">
                    <div class="product-name neon-text">${p.name}</div>
                    <div class="product-field">分類: ${p.category || '全域'} | 狀態: ${p.image ? '🟢 已配圖' : '⚪ 無圖示'}</div>
                </div>
                <div class="product-actions">
                    <button class="adm-btn adm-btn-sm" onclick="editProduct(${idx})">✏️ 編輯</button>
                    <button class="adm-btn adm-btn-danger adm-btn-sm" onclick="openDeleteModal(${idx})">🗑 刪除</button>
                </div>
            </div>`;
        }

        async function loadAvailableSheets() {
            try {
                const res = await fetch(`${API_BASE}/sheets/list`);
                const json = await res.json();
                if (json.success && json.sheets.length > 0) {
                    const select = document.getElementById('eventSessionSelect');
                    const currentValue = currentConfig.google_sheet_name || '';
                    select.innerHTML = json.sheets.map(name => `<option value="${name}" ${name === currentValue ? 'selected' : ''}>🎯 場次：${name}</option>`).join('');
                }
            } catch(e) { console.error("加載活動清單失敗", e); }
        }

        async function handleCsvUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const statusText = document.getElementById('csvUploadStatus');
            statusText.innerHTML = `<span style="color:#00e5ff">⏳ 正在上傳解析名單...</span>`;
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch(`${API_BASE}/sheets/upload_csv`, { method: 'POST', body: formData });
                const json = await res.json();
                if (json.success) {
                    statusText.innerHTML = `<span style="color:#4ade80">✓ ${json.message}</span>`;
                    alert(json.message);
                    await loadAvailableSheets();
                    updateDashboard();
                } else {
                    statusText.innerHTML = `<span style="color:#f87171">✕ 失敗: ${json.message}</span>`;
                }
            } catch(e) { statusText.innerHTML = `<span style="color:#f87171">✕ 雲端同步異常</span>`; }
        }

        async function updateDashboard() {
            try {
                const res = await fetch(`${API_BASE}/dashboard_stats`);
                const json = await res.json();
                if(json.success) {
                    document.getElementById('stat-total').textContent = json.stats.total;
                    document.getElementById('stat-checked').textContent = json.stats.checked_in;
                    document.getElementById('stat-pending').textContent = json.stats.not_checked_in;
                    
                    document.getElementById('table-stats-container').innerHTML = Object.entries(json.stats.table_stats).sort((a,b)=>a[0].localeCompare(b[0])).map(([t, r]) => `
                        <div class="cyber-card" style="padding: 1rem; text-align: center; background: rgba(0,229,255,0.05);">
                            <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem;">${t}</div>
                            <div style="font-size: 1.4rem; font-weight: bold; color: var(--text-dark);">${r}%</div>
                        </div>`).join('');
                    
                    document.getElementById('logs-body').innerHTML = json.stats.logs.map(l => `<tr><td>${l.time}</td><td>${l.name}</td><td>${l.company}</td><td><span style="color:#00e5ff">${l.meal}</span></td></tr>`).join('');
                }
            } catch (e) { console.error("戰情同步失敗", e); }
        }

        function openAddGiftModal() { openProductModal(null, true); }
        function openAddProductModal() { openProductModal(null, false); }
        
        function openProductModal(idx, isGift) {
            editingIdx = idx;
            document.getElementById('modalTitle').textContent = idx === null ? '全新上架補給' : '維護補給參數';
            document.getElementById('productIsGift').value = isGift;
            const cats = getCategoryList();
            document.getElementById('productCategory').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="__NEW__">➕ 自訂全新分類...</option>`;

            if (idx !== null) {
                const p = currentConfig.products[idx];
                document.getElementById('productName').value = p.name || '';
                document.getElementById('productImage').value = p.image || '';
                document.getElementById('productDescription').value = p.description || '';
                document.getElementById('productLink').value = p.link || '';
                document.getElementById('productCategory').value = cats.includes(p.category) ? p.category : '__NEW__';
            } else {
                document.getElementById('productName').value = '';
                document.getElementById('productImage').value = '';
                document.getElementById('productDescription').value = '';
                document.getElementById('productLink').value = '';
            }
            document.getElementById('productModal').classList.add('active');
        }

        function closeProductModal() { document.getElementById('productModal').classList.remove('active'); }
        function checkCategorySelection(sel) { document.getElementById('customCategoryContainer').style.display = sel.value === '__NEW__' ? 'block' : 'none'; }

        async function saveProduct() {
            let cat = document.getElementById('productCategory').value;
            if (cat === '__NEW__') {
                cat = document.getElementById('customCategoryInput').value.trim();
                if(!cat) return alert('請填寫自訂分類');
            }
            const p = { name: document.getElementById('productName').value.trim(), image: document.getElementById('productImage').value.trim(), category: cat, description: document.getElementById('productDescription').value.trim(), link: document.getElementById('productLink').value.trim(), isGift: document.getElementById('productIsGift').value === "true" };
            if(!p.name) return alert('名稱必填');
            if(editingIdx !== null) currentConfig.products[editingIdx] = p; else currentConfig.products.push(p);
            if(await postConfig()) { renderProducts(); closeProductModal(); }
        }

        function openDeleteModal(idx) { deleteIdx = idx; document.getElementById('deleteProductName').textContent = currentConfig.products[idx].name; document.getElementById('deleteModal').classList.add('active'); }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); }
        async function confirmDelete() { currentConfig.products.splice(deleteIdx, 1); if(await postConfig()) { renderProducts(); closeDeleteModal(); } }

        async function saveSystemSettings() {
            currentConfig.google_sheet_name = document.getElementById('eventSessionSelect').value;
            currentConfig.map_image_url = document.getElementById('mapImageUrl').value.trim();
            currentConfig.banner_image_url = document.getElementById('bannerImageUrl').value.trim();
            if(await postConfig()) { alert('雲端中控台設定儲存成功！'); location.reload(); }
        }

        async function postConfig() {
            const res = await fetch(`${API_BASE}/config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentConfig) });
            return res.ok;
        }

        function updateEventLink() {
            const s = document.getElementById('eventSessionSelect').value;
            document.getElementById('event_link').value = `${window.location.origin}/活動報到系統.html?admin=${currentUser}&event=${encodeURIComponent(s)}`;
        }
        function copyEventLink() { const c = document.getElementById("event_link"); c.select(); document.execCommand("copy"); alert('大廳網址已成功複製！'); }
        function showAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function hideAddModal() { document.getElementById('addModal').style.display = 'none'; }
        
        async function submitAddRegistration() {
            const data = { name: document.getElementById('addName').value, phone: document.getElementById('addPhone').value, company: document.getElementById('addCompany').value, seat: document.getElementById('addSeat').value };
            if(!data.name) return alert('姓名必填');
            const res = await fetch('/api/registrations/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if((await res.json()).success) { hideAddModal(); updateDashboard(); alert('臨時報到成功'); }
        }

        function processAndCompressImage(file, maxTargetWidth, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxTargetWidth) { h = Math.round((h * maxTargetWidth) / w); w = maxTargetWidth; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleMapFileUpload(input) { if(input.files[0]) processAndCompressImage(input.files[0], 1200, b64 => { document.getElementById('mapImageUrl').value = b64; }); }
        function handleBannerFileUpload(input) { if(input.files[0]) processAndCompressImage(input.files[0], 1200, b64 => { document.getElementById('bannerImageUrl').value = b64; }); }
        function handleProductFileUpload(input) { if(input.files[0]) processAndCompressImage(input.files[0], 600, b64 => { document.getElementById('productImage').value = b64; }); }
        function exportCsv() { window.location.href = '/api/sheets/export_csv'; }

        function setupTabButtons() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                    document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
                    btn.classList.add('active');
                });
            });
        }

        window.onload = async () => {
            setupTabButtons();
            const uRes = await fetch('/api/user/info');
            if (uRes.status === 401) { window.location.href = '/login.html'; return; }
            const uJson = await uRes.json();
            currentUser = uJson.username;
            document.getElementById('welcome-msg').textContent = `🛰️ 帳戶：${currentUser}`;

            const res = await fetch(`${API_BASE}/config`);
            currentConfig = await res.json();
            renderProducts();
            document.getElementById('mapImageUrl').value = currentConfig.map_image_url || '';
            document.getElementById('bannerImageUrl').value = currentConfig.banner_image_url || '';
            await loadAvailableSheets();
            updateEventLink();
            updateDashboard();
            setInterval(updateDashboard, 15000);
        };
    </script>
</body>
</html>
